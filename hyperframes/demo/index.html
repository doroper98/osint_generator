<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #f5f1ea;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .brand { position: absolute; top: 56px; left: 80px; display: flex; align-items: center; gap: 12px; z-index: 10; }
      .brand-mark { width: 14px; height: 14px; border-radius: 3px; background: #e84a2d; }
      .brand-name { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #1a1a1a; }
      .source { position: absolute; top: 60px; left: 460px; right: 460px; text-align: center;
        font-size: 16px; color: rgba(26,26,26,0.42); font-weight: 500; }
      .stage { position: absolute; top: 160px; left: 0; right: 0; bottom: 300px;
        display: flex; align-items: center; justify-content: center; transform-origin: center; }
      .card { width: 1520px; background: #ffffff; border-radius: 22px;
        box-shadow: 0 2px 16px rgba(26,26,26,0.06), 0 1px 3px rgba(26,26,26,0.04);
        padding: 56px; }
      .takeaway { font-size: 56px; font-weight: 900; line-height: 1.15;
        letter-spacing: -0.3px; color: #1a1a1a; margin-bottom: 24px; }
      svg.chart { display: block; width: 1408px; height: 500px; overflow: visible; }

      /* v0.34.2 — 자막 박스: position:relative 명시, 박스 하나 안에 텍스트 swap. */
      .subtitle-bar { position: absolute; bottom: 72px; left: 0; right: 0;
        display: flex; justify-content: center; padding: 0 140px; z-index: 20; }
      .subtitle { background: #4a1e10; padding: 24px 48px; border-radius: 12px;
        max-width: 1520px; box-shadow: 0 6px 32px rgba(74,30,16,0.4);
        min-height: 96px; min-width: 720px;
        display: flex; align-items: center; justify-content: center; }
      .subtitle .text { font-size: 40px; line-height: 1.3; font-weight: 800;
        color: #ffffff; letter-spacing: -0.4px; text-align: center;
        word-break: keep-all; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="brent"
      data-start="0"
      data-duration="30"
      data-track-index="0"
      data-width="1920"
      data-height="1080"
    >
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">OSINT 브리핑</span>
      </div>
      <div class="source">출처 · Bloomberg (가상 데이터)</div>

      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="takeaway" id="takeaway">브렌트 유가 — 봉쇄에서 협상까지</div>
          <svg class="chart" viewBox="0 0 1408 500" id="chart">
            <rect x="96" y="0" width="1212" height="416" fill="#fdfbf7" opacity="0.35" rx="8"/>
            <g id="grid">
              <line x1="96" y1="20" x2="1308" y2="20" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="100" x2="1308" y2="100" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="180" x2="1308" y2="180" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="260" x2="1308" y2="260" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="340" x2="1308" y2="340" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="416" x2="1308" y2="416" stroke="rgba(26,26,26,0.2)" stroke-width="1.5"/>
              <text x="80" y="24"  fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">130 $</text>
              <text x="80" y="104" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">110 $</text>
              <text x="80" y="184" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">90 $</text>
              <text x="80" y="264" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">70 $</text>
              <text x="80" y="344" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">50 $</text>
              <text x="160"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">02-22</text>
              <text x="370"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-04</text>
              <text x="580"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-18</text>
              <text x="790"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-07</text>
              <text x="1000" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-21</text>
              <text x="1210" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">05-05</text>
            </g>

            <path id="line"
                  d="M 160 260 L 370 100 L 475 108 L 580 164 L 790 220 L 895 188 L 1000 200 L 1100 152 L 1210 128 L 1308 184"
                  fill="none" stroke="#e84a2d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
                  pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>

            <!-- v0.34.2 — 데이터 점 마커: 명시 opacity 1, GSAP from() 으로 등장. -->
            <g id="points">
              <circle class="pt" cx="160"  cy="260" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="370"  cy="100" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="475"  cy="108" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="580"  cy="164" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="790"  cy="220" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="895"  cy="188" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="1000" cy="200" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="1100" cy="152" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
              <circle class="pt" cx="1210" cy="128" r="6" fill="#ffffff" stroke="#e84a2d" stroke-width="3"/>
            </g>

            <g id="callout1" style="opacity:0">
              <circle cx="370" cy="100" r="8" fill="#e84a2d" stroke="#ffffff" stroke-width="2.5"/>
              <path id="conn1" d="M 376 100 Q 460 70 540 50" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text x="552" y="44" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5">호르무즈 봉쇄</text>
              <text x="552" y="70" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600">유가 피크 $120</text>
            </g>

            <g id="callout2" style="opacity:0">
              <circle cx="790" cy="220" r="8" fill="#e84a2d" stroke="#ffffff" stroke-width="2.5"/>
              <path id="conn2" d="M 790 226 Q 760 280 720 320" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text x="715" y="345" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5" text-anchor="end">1차 휴전</text>
              <text x="715" y="371" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600" text-anchor="end">2주 유효</text>
            </g>

            <g id="callout3" style="opacity:0">
              <circle cx="1100" cy="152" r="8" fill="#e84a2d" stroke="#ffffff" stroke-width="2.5"/>
              <path id="conn3" d="M 1100 146 Q 1080 110 1040 80" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text x="1032" y="72" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5" text-anchor="end">UAE 표적 공격</text>
              <text x="1032" y="98" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600" text-anchor="end">$114 재반등</text>
            </g>

            <g id="endpoint" style="opacity:0">
              <circle cx="1308" cy="184" r="9" fill="#e84a2d" stroke="#f5f1ea" stroke-width="3"/>
              <text x="1326" y="178" fill="#e84a2d" font-size="22" font-weight="800">브렌트</text>
              <text x="1326" y="208" fill="#1a1a1a" font-size="30" font-weight="900">102 $</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- v0.34.2 — 자막: 박스 하나 + 안에 텍스트 한 줄 textContent swap. -->
      <div class="subtitle-bar">
        <div class="subtitle">
          <span class="text" id="subtitleText"></span>
        </div>
      </div>

      <audio
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="100"
        src="assets/audio/brent.mp3"
        preload="auto"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // 진입.
      tl.from(".brand",        { opacity: 0, y: -8, duration: 0.4 }, 0);
      tl.from(".source",       { opacity: 0, duration: 0.5 }, 0.1);
      tl.from("#takeaway",     { opacity: 0, y: 24, duration: 0.6 }, 0.2);
      tl.from("#grid",         { opacity: 0, duration: 0.4 }, 0.4);

      // v0.34.2 — 라인/connector path 길이 측정 후 dash 명시. pathLength="1" 의존
      // 회피 (GSAP 트윈 시 시작점 인식 실패 사고).
      const setDash = (sel) => {
        document.querySelectorAll(sel).forEach((p) => {
          const len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        });
      };
      setDash("#line");
      setDash("#conn1, #conn2, #conn3");

      // 라인 draw-on (3초 — 좀 더 느긋하게).
      tl.to("#line", { strokeDashoffset: 0, duration: 3.0, ease: "power1.inOut" }, 0.7);

      // 데이터 점 마커 stagger 등장 (라인에 맞춰).
      tl.from(".pt", { opacity: 0, scale: 0,
                       transformOrigin: "center center",
                       duration: 0.35, stagger: 0.28 }, 1.0);

      // 콜아웃 1: 호르무즈 봉쇄 (2.0 - 3.0s).
      tl.to("#callout1", { opacity: 1, duration: 0.001 }, 2.0);
      tl.from("#callout1 circle", { scale: 0, transformOrigin: "370px 100px", duration: 0.3 }, 2.0);
      tl.to("#conn1", { strokeDashoffset: 0, duration: 0.4 }, 2.3);
      tl.from("#callout1 text", { opacity: 0, x: -8, duration: 0.3, stagger: 0.08 }, 2.5);

      // 콜아웃 2: 1차 휴전 (4.5 - 5.5s).
      tl.to("#callout2", { opacity: 1, duration: 0.001 }, 4.5);
      tl.from("#callout2 circle", { scale: 0, transformOrigin: "790px 220px", duration: 0.3 }, 4.5);
      tl.to("#conn2", { strokeDashoffset: 0, duration: 0.4 }, 4.8);
      tl.from("#callout2 text", { opacity: 0, x: 8, duration: 0.3, stagger: 0.08 }, 5.0);

      // 콜아웃 3: UAE 표적 공격 (6.5 - 7.5s).
      tl.to("#callout3", { opacity: 1, duration: 0.001 }, 6.5);
      tl.from("#callout3 circle", { scale: 0, transformOrigin: "1100px 152px", duration: 0.3 }, 6.5);
      tl.to("#conn3", { strokeDashoffset: 0, duration: 0.4 }, 6.8);
      tl.from("#callout3 text", { opacity: 0, x: 8, duration: 0.3, stagger: 0.08 }, 7.0);

      // 끝점 마커 + 직접 라벨.
      tl.to("#endpoint", { opacity: 1, duration: 0.001 }, 4.0);
      tl.from("#endpoint circle", { scale: 0, transformOrigin: "1308px 184px", duration: 0.3 }, 4.0);
      tl.from("#endpoint text", { opacity: 0, x: -8, duration: 0.4, stagger: 0.08 }, 4.2);

      // Ken Burns 전체 (30초).
      tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.04, duration: 30, ease: "none" }, 0);

      // v0.34.2 — 자막 textContent swap (8 cue, 30초 자연 분포).
      // 자막 박스는 항상 보이고, 텍스트만 시간에 맞춰 swap. 짧은 페이드.
      const cues = [
        { t: 0.6,  text: "2026년 3월 4일, 호르무즈 해협 봉쇄 사태가 발생했습니다." },
        { t: 4.5,  text: "전 세계 원유 공급의 약 20%가 차단되며 충격이 전파됐습니다." },
        { t: 9.0,  text: "봉쇄 직후 브렌트유는 배럴당 80달러에서 120달러로 급등했습니다." },
        { t: 13.5, text: "한 달 만에 약 50% 가까이 오른 셈입니다." },
        { t: 17.0, text: "4월 7일 1차 휴전 합의로 유가는 잠시 안정세를 보였지만," },
        { t: 21.0, text: "5월 5일 UAE 표적 공격으로 다시 약 114달러까지 반등했습니다." },
        { t: 25.0, text: "5월 19일 현재 102달러 수준에서 협상이 이어지고 있습니다." },
        { t: 28.5, text: "유가는 지정학적 리스크에 가장 민감한 지표입니다." },
      ];
      const $sub = document.getElementById("subtitleText");
      const $box = document.querySelector(".subtitle");
      // 초기 텍스트: 첫 큐.
      $sub.textContent = cues[0].text;

      cues.forEach((c, i) => {
        // 페이드아웃 직전 큐 → swap → 페이드인.
        if (i === 0) {
          tl.fromTo($box, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, c.t);
        } else {
          tl.to($box, { opacity: 0, duration: 0.2 }, c.t - 0.25);
          tl.call(() => { $sub.textContent = c.text; }, [], c.t - 0.05);
          tl.to($box, { opacity: 1, duration: 0.25 }, c.t);
        }
      });

      window.__timelines["brent"] = tl;
    </script>
  </body>
</html>
