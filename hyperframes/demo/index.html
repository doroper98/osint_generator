<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #f5f1ea;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .brand { position: absolute; top: 56px; left: 80px; display: flex; align-items: center; gap: 12px; z-index: 10; }
      .brand-mark { width: 14px; height: 14px; border-radius: 3px; background: #e84a2d; }
      .brand-name { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #1a1a1a; }
      .source { position: absolute; top: 60px; left: 460px; right: 460px; text-align: center;
        font-size: 16px; color: rgba(26,26,26,0.42); font-weight: 500; }
      .stage { position: absolute; top: 160px; left: 0; right: 0; bottom: 280px;
        display: flex; align-items: center; justify-content: center; transform-origin: center; }
      .card { width: 1520px; background: #ffffff; border-radius: 22px;
        box-shadow: 0 2px 16px rgba(26,26,26,0.06), 0 1px 3px rgba(26,26,26,0.04);
        padding: 56px; }
      .takeaway { font-size: 56px; font-weight: 900; line-height: 1.15;
        letter-spacing: -0.3px; color: #1a1a1a; margin-bottom: 24px; }
      svg.chart { display: block; width: 1408px; height: 500px; overflow: visible; }
      .subtitle-bar { position: absolute; bottom: 56px; left: 0; right: 0;
        display: flex; justify-content: center; padding: 0 140px; z-index: 20; }
      .subtitle { background: rgba(26,26,26,0.82); padding: 20px 40px; border-radius: 10px;
        max-width: 1520px; }
      .subtitle span { font-size: 36px; line-height: 1.35; font-weight: 700;
        color: #ffffff; letter-spacing: -0.3px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="brent"
      data-start="0"
      data-duration="10"
      data-track-index="0"
      data-width="1920"
      data-height="1080"
    >
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">OSINT 브리핑</span>
      </div>
      <div class="source">출처 · Bloomberg (가상 데이터)</div>

      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="takeaway" id="takeaway">브렌트 유가 — 봉쇄에서 협상까지</div>
          <svg class="chart" viewBox="0 0 1408 500" id="chart">
            <rect x="96" y="0" width="1212" height="416" fill="#fdfbf7" opacity="0.35" rx="8"/>
            <g id="grid">
              <line x1="96" y1="20" x2="1308" y2="20" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="100" x2="1308" y2="100" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="180" x2="1308" y2="180" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="260" x2="1308" y2="260" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="340" x2="1308" y2="340" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="416" x2="1308" y2="416" stroke="rgba(26,26,26,0.2)" stroke-width="1.5"/>
              <text x="80" y="24" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">130 $</text>
              <text x="80" y="104" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">110 $</text>
              <text x="80" y="184" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">90 $</text>
              <text x="80" y="264" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">70 $</text>
              <text x="80" y="344" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">50 $</text>
              <text x="160" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">02-22</text>
              <text x="370" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-04</text>
              <text x="580" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-18</text>
              <text x="790" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-07</text>
              <text x="1000" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-21</text>
              <text x="1210" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">05-05</text>
            </g>

            <path id="line"
                  d="M 160 260 L 370 100 L 475 108 L 580 164 L 790 220 L 895 188 L 1000 200 L 1100 152 L 1210 128 L 1308 184"
                  fill="none" stroke="#e84a2d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
                  pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>

            <g id="callout1" opacity="0">
              <circle cx="370" cy="100" r="6" fill="#e84a2d"/>
              <path id="conn1" d="M 376 100 Q 460 70 540 50" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text x="552" y="44" fill="#e84a2d" font-size="20" font-weight="800" letter-spacing="1.5">호르무즈 봉쇄</text>
              <text x="552" y="68" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500">유가 피크 $120</text>
            </g>

            <g id="callout2" opacity="0">
              <circle cx="790" cy="220" r="6" fill="#e84a2d"/>
              <path id="conn2" d="M 790 226 Q 760 280 720 320" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <text x="715" y="345" fill="#e84a2d" font-size="20" font-weight="800" letter-spacing="1.5" text-anchor="end">1차 휴전</text>
              <text x="715" y="370" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end">2주 유효</text>
            </g>

            <g id="endpoint" opacity="0">
              <circle cx="1308" cy="184" r="7" fill="#e84a2d" stroke="#f5f1ea" stroke-width="2"/>
              <text x="1326" y="178" fill="#e84a2d" font-size="20" font-weight="800">브렌트</text>
              <text x="1326" y="206" fill="#1a1a1a" font-size="28" font-weight="900">102 $</text>
            </g>
          </svg>
        </div>
      </div>

      <div class="subtitle-bar">
        <div class="subtitle" id="subtitle">
          <span>봉쇄 직후 브렌트유가 배럴당 80달러에서 120달러로 급등했습니다.</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      tl.from(".brand", { opacity: 0, y: -8, duration: 0.4 }, 0);
      tl.from(".source", { opacity: 0, duration: 0.5 }, 0.1);
      tl.from("#takeaway", { opacity: 0, y: 24, duration: 0.6 }, 0.2);
      tl.from("#grid", { opacity: 0, duration: 0.4 }, 0.4);

      tl.to("#line", { strokeDashoffset: 0, duration: 2.0, ease: "power1.inOut" }, 0.7);

      tl.to("#callout1", { opacity: 1, duration: 0.001 }, 1.2);
      tl.from("#callout1 circle", { scale: 0, transformOrigin: "370px 100px", duration: 0.3 }, 1.2);
      tl.to("#conn1", { strokeDashoffset: 0, duration: 0.4 }, 1.5);
      tl.from("#callout1 text", { opacity: 0, x: -8, duration: 0.3, stagger: 0.05 }, 1.7);

      tl.to("#callout2", { opacity: 1, duration: 0.001 }, 2.4);
      tl.from("#callout2 circle", { scale: 0, transformOrigin: "790px 220px", duration: 0.3 }, 2.4);
      tl.to("#conn2", { strokeDashoffset: 0, duration: 0.4 }, 2.7);
      tl.from("#callout2 text", { opacity: 0, x: 8, duration: 0.3, stagger: 0.05 }, 2.9);

      tl.to("#endpoint", { opacity: 1, duration: 0.001 }, 2.7);
      tl.from("#endpoint circle", { scale: 0, transformOrigin: "1308px 184px", duration: 0.3 }, 2.7);
      tl.from("#endpoint text", { opacity: 0, x: -8, duration: 0.4, stagger: 0.08 }, 2.9);

      tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.03, duration: 10, ease: "none" }, 0);
      tl.from(".subtitle-bar", { opacity: 0, y: 12, duration: 0.5 }, 0.6);

      window.__timelines["brent"] = tl;
    </script>
  </body>
</html>
