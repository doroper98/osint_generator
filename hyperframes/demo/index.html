<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- v0.34.3 — 로컬 GSAP (jsdelivr CDN 의존 제거, 차단 시 모든 트윈 정지 사고 회피). -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #f5f1ea;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .brand { position: absolute; top: 56px; left: 80px; display: flex; align-items: center; gap: 12px; z-index: 10; }
      .brand-mark { width: 14px; height: 14px; border-radius: 3px; background: #e84a2d; }
      .brand-name { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #1a1a1a; }
      .source { position: absolute; top: 60px; left: 460px; right: 460px; text-align: center;
        font-size: 16px; color: rgba(26,26,26,0.42); font-weight: 500; }
      .stage { position: absolute; top: 160px; left: 0; right: 0; bottom: 300px;
        display: flex; align-items: center; justify-content: center; transform-origin: center; }
      .card { width: 1520px; background: #ffffff; border-radius: 22px;
        box-shadow: 0 2px 16px rgba(26,26,26,0.06), 0 1px 3px rgba(26,26,26,0.04);
        padding: 56px; }
      .takeaway { font-size: 56px; font-weight: 900; line-height: 1.15;
        letter-spacing: -0.3px; color: #1a1a1a; margin-bottom: 24px; }
      svg.chart { display: block; width: 1408px; height: 500px; overflow: visible; }

      /* v0.34.2 — 자막 박스: position:relative 명시, 박스 하나 안에 텍스트 swap. */
      .subtitle-bar { position: absolute; bottom: 72px; left: 0; right: 0;
        display: flex; justify-content: center; padding: 0 140px; z-index: 20; }
      .subtitle { background: #4a1e10; padding: 24px 48px; border-radius: 12px;
        max-width: 1520px; box-shadow: 0 6px 32px rgba(74,30,16,0.4);
        min-height: 96px; min-width: 720px;
        display: flex; align-items: center; justify-content: center; }
      .subtitle .text { font-size: 40px; line-height: 1.3; font-weight: 800;
        color: #ffffff; letter-spacing: -0.4px; text-align: center;
        word-break: keep-all; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="brent"
      data-start="0"
      data-duration="30"
      data-track-index="0"
      data-width="1920"
      data-height="1080"
    >
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">OSINT 브리핑</span>
      </div>
      <div class="source">출처 · Bloomberg (가상 데이터)</div>

      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="takeaway" id="takeaway">브렌트 유가 — 봉쇄에서 협상까지</div>
          <svg class="chart" viewBox="0 0 1408 500" id="chart">
            <rect x="96" y="0" width="1212" height="416" fill="#fdfbf7" opacity="0.35" rx="8"/>
            <g id="grid">
              <line x1="96" y1="20" x2="1308" y2="20" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="100" x2="1308" y2="100" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="180" x2="1308" y2="180" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="260" x2="1308" y2="260" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="340" x2="1308" y2="340" stroke="rgba(26,26,26,0.06)" stroke-width="1"/>
              <line x1="96" y1="416" x2="1308" y2="416" stroke="rgba(26,26,26,0.2)" stroke-width="1.5"/>
              <text x="80" y="24"  fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">130 $</text>
              <text x="80" y="104" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">110 $</text>
              <text x="80" y="184" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">90 $</text>
              <text x="80" y="264" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">70 $</text>
              <text x="80" y="344" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="end" dominant-baseline="middle">50 $</text>
              <text x="160"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">02-22</text>
              <text x="370"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-04</text>
              <text x="580"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">03-18</text>
              <text x="790"  y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-07</text>
              <text x="1000" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">04-21</text>
              <text x="1210" y="446" fill="rgba(26,26,26,0.6)" font-size="20" font-weight="500" text-anchor="middle">05-05</text>
            </g>

            <!-- v0.34.4 — 캔들 12 주봉. 양봉(close>=open) = 채워진 오렌지, 음봉 = 흰 fill +
                 오렌지 stroke (NYT/Bloomberg 캔들 컨벤션). cx 분포 = 207 + i*90.
                 y 매핑: y = 416 - (price - 50) * 5.2 (50$ → y=416, 130$ → y=0). -->
            <g id="candles">
              <!-- i=0 02-22 OHLC 80/82/78/81 up -->
              <g class="candle">
                <line x1="207" y1="249.6" x2="207" y2="270.4" stroke="#e84a2d" stroke-width="2"/>
                <rect x="183" y="254.8" width="48" height="5.2" fill="#e84a2d"/>
              </g>
              <!-- i=1 03-01 OHLC 81/96/80/95 up — 봉쇄 시작 큰 양봉 -->
              <g class="candle">
                <line x1="297" y1="176.8" x2="297" y2="260" stroke="#e84a2d" stroke-width="2"/>
                <rect x="273" y="182" width="48" height="72.8" fill="#e84a2d"/>
              </g>
              <!-- i=2 03-08 OHLC 95/123/93/120 up — 피크 -->
              <g class="candle">
                <line x1="387" y1="36.4" x2="387" y2="192.4" stroke="#e84a2d" stroke-width="2"/>
                <rect x="363" y="52" width="48" height="130" fill="#e84a2d"/>
              </g>
              <!-- i=3 03-15 OHLC 120/122/113/116 down — 고점 음봉 -->
              <g class="candle">
                <line x1="477" y1="41.6" x2="477" y2="88.4" stroke="#e84a2d" stroke-width="2"/>
                <rect x="453" y="52" width="48" height="21.2" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=4 03-22 OHLC 116/119/108/110 down -->
              <g class="candle">
                <line x1="567" y1="57.2" x2="567" y2="114.4" stroke="#e84a2d" stroke-width="2"/>
                <rect x="543" y="73.2" width="48" height="31.2" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=5 03-29 OHLC 110/113/104/106 down -->
              <g class="candle">
                <line x1="657" y1="88.4" x2="657" y2="135.2" stroke="#e84a2d" stroke-width="2"/>
                <rect x="633" y="104" width="48" height="20.8" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=6 04-05 OHLC 106/110/100/105 down — 휴전 직전 저점 -->
              <g class="candle">
                <line x1="747" y1="104" x2="747" y2="156" stroke="#e84a2d" stroke-width="2"/>
                <rect x="723" y="124.8" width="48" height="5.2" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=7 04-12 OHLC 105/109/102/108 up — 휴전 안정 -->
              <g class="candle">
                <line x1="837" y1="109.2" x2="837" y2="145.6" stroke="#e84a2d" stroke-width="2"/>
                <rect x="813" y="114.4" width="48" height="15.6" fill="#e84a2d"/>
              </g>
              <!-- i=8 04-19 OHLC 108/112/104/107 down -->
              <g class="candle">
                <line x1="927" y1="93.6" x2="927" y2="135.2" stroke="#e84a2d" stroke-width="2"/>
                <rect x="903" y="114.4" width="48" height="5.2" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=9 04-26 OHLC 107/116/106/114 up — UAE 공격 큰 양봉 -->
              <g class="candle">
                <line x1="1017" y1="78.8" x2="1017" y2="124.8" stroke="#e84a2d" stroke-width="2"/>
                <rect x="993" y="83.2" width="48" height="36.4" fill="#e84a2d"/>
              </g>
              <!-- i=10 05-03 OHLC 114/117/109/112 down -->
              <g class="candle">
                <line x1="1107" y1="67.6" x2="1107" y2="109.2" stroke="#e84a2d" stroke-width="2"/>
                <rect x="1083" y="83.2" width="48" height="10.4" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
              <!-- i=11 05-10 OHLC 112/114/99/102 down — 큰 음봉, 현재 $102 -->
              <g class="candle">
                <line x1="1197" y1="83.2" x2="1197" y2="161.2" stroke="#e84a2d" stroke-width="2"/>
                <rect x="1173" y="93.6" width="48" height="52" fill="#ffffff" stroke="#e84a2d" stroke-width="2.5"/>
              </g>
            </g>

            <!-- 봉쇄(i=2 high 36.4) → 라벨 우상단 -->
            <g id="callout1" style="opacity:0">
              <circle cx="387" cy="36.4" r="6" fill="#e84a2d" stroke="#ffffff" stroke-width="2"/>
              <path id="conn1" d="M 393 36.4 Q 480 16 560 4" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    style="stroke-dasharray: 600; stroke-dashoffset: 600;"/>
              <text x="572" y="-2" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5">호르무즈 봉쇄</text>
              <text x="572" y="24" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600">유가 피크 $120</text>
            </g>

            <!-- 휴전(i=6 low 156) → 라벨 좌하단 -->
            <g id="callout2" style="opacity:0">
              <circle cx="747" cy="156" r="6" fill="#e84a2d" stroke="#ffffff" stroke-width="2"/>
              <path id="conn2" d="M 747 162 Q 720 220 690 270" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    style="stroke-dasharray: 600; stroke-dashoffset: 600;"/>
              <text x="685" y="295" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5" text-anchor="end">1차 휴전</text>
              <text x="685" y="321" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600" text-anchor="end">바닥 $100</text>
            </g>

            <!-- UAE 공격(i=9 high 78.8) → 라벨 우상단 -->
            <g id="callout3" style="opacity:0">
              <circle cx="1017" cy="78.8" r="6" fill="#e84a2d" stroke="#ffffff" stroke-width="2"/>
              <path id="conn3" d="M 1017 72.8 Q 990 40 950 12" stroke="#e84a2d" stroke-width="1.5" fill="none"
                    style="stroke-dasharray: 600; stroke-dashoffset: 600;"/>
              <text x="942" y="4" fill="#e84a2d" font-size="22" font-weight="800" letter-spacing="1.5" text-anchor="end">UAE 표적 공격</text>
              <text x="942" y="30" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600" text-anchor="end">$114 재반등</text>
            </g>

            <!-- 끝점: 마지막 캔들 (i=11) close = 102, y=145.6, cx=1197. 우측 라벨 -->
            <g id="endpoint" style="opacity:0">
              <circle cx="1197" cy="145.6" r="9" fill="#e84a2d" stroke="#f5f1ea" stroke-width="3"/>
              <text x="1238" y="138" fill="#e84a2d" font-size="22" font-weight="800">현재가</text>
              <text x="1238" y="168" fill="#1a1a1a" font-size="30" font-weight="900">102 $</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- v0.34.2 — 자막: 박스 하나 + 안에 텍스트 한 줄 textContent swap. -->
      <div class="subtitle-bar">
        <div class="subtitle">
          <span class="text" id="subtitleText">2026년 3월 4일, 호르무즈 해협 봉쇄 사태가 발생했습니다.</span>
        </div>
      </div>

      <audio
        id="narration-brent"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="100"
        src="assets/audio/brent.mp3"
        preload="auto"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // 진입.
      tl.from(".brand",        { opacity: 0, y: -8, duration: 0.4 }, 0);
      tl.from(".source",       { opacity: 0, duration: 0.5 }, 0.1);
      tl.from("#takeaway",     { opacity: 0, y: 24, duration: 0.6 }, 0.2);
      tl.from("#grid",         { opacity: 0, duration: 0.4 }, 0.4);

      // v0.34.3 — path 의 dasharray/offset 은 HTML 의 inline style 로 명시(4000/600).
      // getTotalLength() 의존 제거 (script error 가능성 회피).

      // v0.34.4 — 캔들 12 주봉 stagger 등장 (0.7s 시작, 0.20s 간격 → 0.7~3.1s).
      // baseline 에서 grow up 대신 fade + scale 로 (단순함).
      tl.from(".candle", { opacity: 0, scale: 0.7,
                           transformOrigin: "center center",
                           duration: 0.35, stagger: 0.20 }, 0.7);

      // 콜아웃 1: 호르무즈 봉쇄 (캔들 i=2 = 0.7+2*0.20+0.35=1.45s 후) — 자막 cue1 sync 3.0s.
      tl.to("#callout1", { opacity: 1, duration: 0.001 }, 3.0);
      tl.from("#callout1 circle", { scale: 0, transformOrigin: "387px 36.4px", duration: 0.3 }, 3.0);
      tl.to("#conn1", { strokeDashoffset: 0, duration: 0.4 }, 3.3);
      tl.from("#callout1 text", { opacity: 0, x: -8, duration: 0.3, stagger: 0.08 }, 3.5);

      // 콜아웃 2: 1차 휴전 — 자막 cue5 sync 17s.
      tl.to("#callout2", { opacity: 1, duration: 0.001 }, 17.0);
      tl.from("#callout2 circle", { scale: 0, transformOrigin: "747px 156px", duration: 0.3 }, 17.0);
      tl.to("#conn2", { strokeDashoffset: 0, duration: 0.4 }, 17.3);
      tl.from("#callout2 text", { opacity: 0, x: 8, duration: 0.3, stagger: 0.08 }, 17.5);

      // 콜아웃 3: UAE 표적 공격 — 자막 cue6 sync 21s.
      tl.to("#callout3", { opacity: 1, duration: 0.001 }, 21.0);
      tl.from("#callout3 circle", { scale: 0, transformOrigin: "1017px 78.8px", duration: 0.3 }, 21.0);
      tl.to("#conn3", { strokeDashoffset: 0, duration: 0.4 }, 21.3);
      tl.from("#callout3 text", { opacity: 0, x: 8, duration: 0.3, stagger: 0.08 }, 21.5);

      // 끝점 마커 + "현재가 102$" 라벨 — 자막 cue7 sync 25s.
      tl.to("#endpoint", { opacity: 1, duration: 0.001 }, 25.0);
      tl.from("#endpoint circle", { scale: 0, transformOrigin: "1197px 145.6px", duration: 0.3 }, 25.0);
      tl.from("#endpoint text", { opacity: 0, x: -8, duration: 0.4, stagger: 0.08 }, 25.2);

      // Ken Burns 전체 (30초).
      tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.04, duration: 30, ease: "none" }, 0);

      // v0.34.2 — 자막 textContent swap (8 cue, 30초 자연 분포).
      // 자막 박스는 항상 보이고, 텍스트만 시간에 맞춰 swap. 짧은 페이드.
      const cues = [
        { t: 0.6,  text: "2026년 3월 4일, 호르무즈 해협 봉쇄 사태가 발생했습니다." },
        { t: 4.5,  text: "전 세계 원유 공급의 약 20%가 차단되며 충격이 전파됐습니다." },
        { t: 9.0,  text: "봉쇄 직후 브렌트유는 배럴당 80달러에서 120달러로 급등했습니다." },
        { t: 13.5, text: "한 달 만에 약 50% 가까이 오른 셈입니다." },
        { t: 17.0, text: "4월 7일 1차 휴전 합의로 유가는 잠시 안정세를 보였지만," },
        { t: 21.0, text: "5월 5일 UAE 표적 공격으로 다시 약 114달러까지 반등했습니다." },
        { t: 25.0, text: "5월 19일 현재 102달러 수준에서 협상이 이어지고 있습니다." },
        { t: 28.5, text: "유가는 지정학적 리스크에 가장 민감한 지표입니다." },
      ];
      const $sub = document.getElementById("subtitleText");
      const $box = document.querySelector(".subtitle");
      // 초기 텍스트: 첫 큐.
      $sub.textContent = cues[0].text;

      // v0.34.3 — overwrite:"auto" 로 트윈 겹침 자동 해소 (lint overlap 경고 해결).
      cues.forEach((c, i) => {
        if (i === 0) {
          tl.fromTo($box,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, overwrite: "auto" }, c.t);
        } else {
          tl.to($box, { opacity: 0, duration: 0.2, overwrite: "auto" }, c.t - 0.25);
          tl.call(() => { $sub.textContent = c.text; }, [], c.t - 0.05);
          tl.to($box, { opacity: 1, duration: 0.25, overwrite: "auto" }, c.t);
        }
      });

      window.__timelines["brent"] = tl;
    </script>
  </body>
</html>
