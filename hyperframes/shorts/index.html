<!DOCTYPE html>
<!-- 쇼츠 콜라주 데모 — build_demo.py 자동 생성. 수정 금지: 빌더를 고치고 재실행할 것.
     seed=938543205 / paper_tone=paper_aged / bg=stage_curtain -->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>누가 더 빨리 짓느냐, 그 물음이 민주주의를 흔든다</title>
<link rel="stylesheet" href="../briefing/assets/noto_serif_kr.css">
<link rel="stylesheet" href="assets/collage_kit.css">
<script src="../briefing/assets/gsap.min.js"></script>
<script src="assets/collage_kit.js"></script>
<style>
  @font-face { font-family:"Pretendard Variable";
    src:url("../briefing/assets/fonts/PretendardVariable.woff2") format("woff2-variations");
    font-weight:45 920; font-display:block; }
  :root {
      --bg-sunburst-a: #E4B33C;
      --bg-sunburst-b: #3E6E8E;
      --ink-base: #1C1A17;
      --ink-soft: #4A443B;
      --mark-highlighter: #F2D24B;
      --mark-pen: #B03A2E;
      --motion-breath-period-ms: 8000;
      --motion-breath-scale: 3;
      --motion-draw-on-ms: 400;
      --motion-grain-count: 4;
      --motion-grain-fps: 12;
      --motion-jitter-deg: 0.3;
      --motion-place-from-scale: 1.06;
      --motion-place-ms: 220;
      --motion-push-in-from-scale: 1;
      --motion-push-in-to-scale: 1.08;
      --motion-stagger-ms: 120;
      --motion-step-fps: 10;
      --paper-aged: #D9CBAA;
      --paper-base: #E8DFC9;
      --paper-card: #F4EFE3;
      --paper-crumpled: #D9CBAA;
      --paper-file: #C9BC9C;
      --prop-date-chip: #B03A2E;
      --prop-string: #B03A2E;
      --prop-tape: #D8D2BFcc;
      --safe-bottom: 350px;
      --safe-left: 60px;
      --safe-right: 140px;
      --safe-top: 220px;
      --space-card-edge-offset-px: 24;
      --space-card-padding-px: 56;
      --space-gutter-px: 40;
      --space-stack-gap-px: 54;
      --space-subtitle-side-px: 72;
      --stamp-confirm: #1C1A17;
      --stamp-inferred: #C9A227;
      --stamp-refuted: #6E6A61;
      --stamp-unverified: #A63428;
      --type-credit: 400 26px/1.35 "Pretendard Variable", Pretendard, sans-serif;
      --type-kicker: 600 36px/1.3 "Pretendard Variable", Pretendard, sans-serif;
      --type-name-tag: 700 44px/1.2 "Noto Serif KR", serif;
      --type-ransom-headline: 900 116px/1.06 "Pretendard Variable", Pretendard, sans-serif;
      --type-subtitle: 800 68px/1.28 "Pretendard Variable", Pretendard, sans-serif;
  }
</style></head>
<body>
<div id="root" class="clip" data-composition-id="shorts-demo"
     data-start="0" data-duration="38.67" data-track-index="0"
     data-width="1080" data-height="1920">

  <img class="paper-bg" src="assets/paper_crumpled_1080x1920.png" alt="">
  <div class="paper-tone"></div>
  <div class="stage" id="stage"></div>
  <svg class="strings" id="strings" viewBox="0 0 1080 1920"></svg>
  <div class="grain"></div>
  <div class="guides"></div>
  <div class="credit"></div>
</div>

<script>
(function () {
  const K = CollageKit;
  const stage = document.getElementById("stage");
  const strings = document.getElementById("strings");
  const SEED = "938543205";
  const TOTAL = 38.67;
  const STARTS = [0.6, 5.388, 8.879, 22.335];
  const CAST = [{"id": "curtis_yarvin", "name": "커티스 야빈", "role": "반민주주의 이론가", "tilt": 1.5}, {"id": "peter_thiel", "name": "피터 틸", "role": "테크노 우파 투자자", "tilt": 3.5}, {"id": "dario_amodei", "name": "다리오 아모데이", "role": "민주주의 승리 + 감시국가 금지", "tilt": -2.5}, {"id": "daron_acemoglu", "name": "대런 애쓰모글루", "role": "기술 방향은 선택", "tilt": -0.5}];
  const CHART = {"chart_id": "ch-1", "type": "bar", "title": "데이터센터 전력 연결 기간 (100MW급, 개월)", "data": [{"label": "아랍에미리트", "value": 22}, {"label": "미국", "value": 30, "note": "권역별 편차 큼"}, {"label": "독일", "value": 42}]};

  if (new URLSearchParams(location.search).has("guides")) {
    document.body.classList.add("show-guides");
  }

  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

  // ============================================================ S01 HOOK
  const rh = K.RansomHeadline(stage, "누가 더 빨리 짓느냐, 그 물음이 민주주의를 흔든다", {
    seed: 1025282960, start: 0, duration: TOTAL, track: 6,
  });
  rh.root.style.left = "var(--safe-left)";
  rh.root.style.top = "300px";
  rh.root.style.width = "820px";
  K.ransomIn(tl, rh, STARTS[0]);

  const stamp = K.StampLabel(stage, "confirm", {
    x: 620, y: 700, rot: -7, start: 0, duration: TOTAL, track: 7,
  });
  K.stampIn(tl, stamp, STARTS[0] + 1.1);
  // 헤드라인은 CONTEXT 시작 전에 위로 물린다 — 안 그러면 다음 씬을 덮는다
  K.sceneOut(tl, [rh.root, stamp], STARTS[1] - 0.4);

  // ============================================================ S02 CONTEXT
  const panel = K.PaperPanel(stage, {
    x: 90, y: 560, w: 800, rot: -1.2, tone: "paper_card",
    start: 0, duration: TOTAL, track: 3,
  });
  panel.innerHTML = '<div class="deck">'
    + "권위주의가 인공지능 경쟁에서 앞선다는 명제가 정책의 기본값으로 굳어지는 중이다. 그러나 학계는 이 전제를 다시 뜯어보고 있다."
    + "</div>";
  const tape1 = K.TapeStrip(stage, { x: 150, y: 538, w: 190, rot: -5 });
  const tape2 = K.TapeStrip(stage, { x: 700, y: 546, w: 160, rot: 4 });
  K.panelIn(tl, panel, STARTS[1]);
  tl.from([tape1, tape2], { opacity: 0, duration: 0.2 }, STARTS[1] + 0.12);
  K.sceneOut(tl, [panel, tape1, tape2], STARTS[2] - 0.4);

  // ============================================================ S03 ACTORS
  const nodes = [], pts = [];
  // 2×2 배치 — safe area(상220/하350/좌60/우140) 안에 가둔다.
  // 아랫줄 bottom 은 자막 상단(하단 안전선 + 자막 높이)보다 위여야 이름표가 안 겹친다.
  const COLS = [70, 530], ROWS = [1030, 620];
  CAST.forEach(function (c, i) {
    const w = 400;
    const x = COLS[i % 2];
    const bottom = ROWS[Math.floor(i / 2)];
    const n = K.CutoutActor(stage, {
      src: "assets/cast/" + c.id + ".png",
      x: x, bottom: bottom, w: w, tilt: c.tilt,
      tag: c.name, role: c.role,
      start: 0, duration: TOTAL, track: 5 + i,
    });
    nodes.push(n);
    pts.push({ x: x + w / 2, y: 1920 - bottom - 120 });
  });
  K.actorsIn(tl, nodes, STARTS[3], SEED, 7);

  // 붉은 실 — 번들 stakeholder_map 의 edge 가 근거 (G4)
  const paths = [];
  for (let i = 0; i + 1 < pts.length; i++) {
    paths.push(K.StringConnector(strings, pts[i], pts[i + 1], { seed: SEED }));
  }
  K.drawOn(tl, paths, STARTS[3] + 0.9, 0.12);
  

  // ============================================================ S04 EVIDENCE (bar)
  if (CHART) {
    const cp = K.PaperPanel(stage, {
      x: 80, y: 1180, w: 800, rot: 0.8, tone: "paper_card",
      start: 0, duration: TOTAL, track: 4,
    });
    let rows = '<div class="chart-title">' + CHART.title + "</div>";
    const max = Math.max.apply(null, CHART.data.map(function (d) { return d.value; }));
    CHART.data.forEach(function (d, i) {
      rows += '<div class="bar-row"><span class="bl">' + d.label + "</span>"
        + '<span class="bw"><span class="bt" style="width:'
        + (d.value / max * 100) + '%"></span></span>'
        + '<span class="bv">' + d.value + "</span></div>";
    });
    cp.innerHTML = rows;
    K.panelIn(tl, cp, STARTS[2]);
    // 정보 요소 = Material decelerate (물성과 섞지 않는다 §1.4)
    tl.from(cp.querySelectorAll(".bt"),
      { scaleX: 0, transformOrigin: "0% 50%", duration: 0.55,
         stagger: 0.11, ease: "power2.out" }, STARTS[2] + 0.3);
    K.sceneOut(tl, [cp], STARTS[3] - 0.4);
  }



  // ============================================================ 자막 · 카메라
  const sub = K.SubtitleBar(document.getElementById("root"));
  K.subtitleCues(tl, sub, [{"t": 0.6, "text": "인공지능 경쟁에서 민주주의는 정말 권위주의에 지고 있을까요."}, {"t": 5.388, "text": "학계가 이 물음을 다시 뜯어보고 있습니다."}, {"t": 8.879, "text": "아랍에미리트에서는 데이터센터 전력 연결에 스물두 개월이 걸립니다."}, {"t": 14.057, "text": "독일에서는 같은 일에 마흔두 개월이 걸립니다."}, {"t": 17.807, "text": "이 스무 개월의 격차가 지금 민주주의를 흔들고 있습니다."}, {"t": 22.335, "text": "논쟁의 무대에는 세 진영이 앉아 있습니다."}, {"t": 25.826, "text": "왼쪽은 속도가 이긴다는 실리콘밸리 기술권력, 가운데는 지형도를 그리는 연구기관들입니다."}, {"t": 32.561, "text": "오른쪽에는 새로운 참여 제도를 실제로 설계하려는 학자들이 있습니다."}]);
  K.pushIn(tl, stage, 0, 38.67);

  window.__timelines["shorts-demo"] = tl;
})();
</script>
<style>
  .deck { font-family:"Noto Serif KR",serif; font-size:44px; font-weight:500;
    line-height:1.5; color:var(--ink-base); word-break:keep-all; }
  .chart-title { font:var(--type-kicker); color:var(--ink-soft);
    margin-bottom:8px; line-height:1.3; }
  .bar-row { display:flex; align-items:center; gap:16px; margin-top:24px; }
  .bl { width:190px; flex:0 0 190px; font-size:30px; font-weight:700; }
  .bw { flex:1 1 auto; display:block; }
  .bt { height:36px; background:var(--mark-pen); display:block; }
  .bv { flex:0 0 auto; font-size:32px; font-weight:900;
    font-variant-numeric:tabular-nums; }
</style>
</body></html>
