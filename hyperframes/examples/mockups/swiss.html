<!doctype html>
<!-- 톤 mockup C — 스위스/브루탈리스트. 비교 검수용 정지 프레임. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../../assets/gsap.min.js"></script>
    <script src="examples/mockups/_candle.js"></script>
    <style>
      @font-face { font-family:"Pretendard Variable"; src:url("../../assets/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight:100 900; font-display:block; }
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#f4f4f2;color:#0a0a0a;
        font-family:"Pretendard Variable",sans-serif;word-break:keep-all;}
      .frame{position:absolute;inset:60px;border:3px solid #0a0a0a;}
      .row1{position:absolute;top:0;left:0;right:0;height:70px;border-bottom:3px solid #0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 30px;}
      .row1 .k{font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;}
      .row1 .d{font-size:20px;font-weight:700;font-family:"IBM Plex Mono",monospace;}
      .mid{position:absolute;top:70px;left:0;right:0;bottom:230px;display:grid;grid-template-columns:1.15fr 3px 1fr;}
      .head{padding:44px;}
      .head h1{font-size:122px;font-weight:900;line-height:0.96;letter-spacing:-4px;text-transform:none;}
      .head .em{background:#ff2b00;color:#fff;padding:0 8px;}
      .head .sub{margin-top:28px;font-size:34px;font-weight:700;line-height:1.35;max-width:720px;}
      .vline{background:#0a0a0a;}
      .chart{padding:40px 36px;display:flex;flex-direction:column;}
      .chart .t{font-size:30px;font-weight:900;letter-spacing:-0.5px;}
      .chart .src{font-size:18px;font-weight:700;font-family:"IBM Plex Mono",monospace;color:#555;margin-top:4px;}
      .mc-grid{stroke:rgba(10,10,10,0.12);stroke-width:1;}
      .mc-axis{fill:#555;font-size:18px;font-weight:700;font-family:"IBM Plex Mono",monospace;}
      .row3{position:absolute;left:0;right:0;bottom:0;height:230px;border-top:3px solid #0a0a0a;display:grid;grid-template-columns:1fr 3px 1.4fr;}
      .big{display:flex;align-items:center;padding:0 44px;}
      .big .n{font-size:200px;font-weight:900;letter-spacing:-8px;line-height:0.8;}
      .big .u{font-size:48px;font-weight:900;margin-left:14px;align-self:flex-start;margin-top:30px;}
      .note{padding:36px 44px;font-size:26px;font-weight:700;line-height:1.4;display:flex;align-items:center;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="2" data-track-index="0">
      <div class="frame">
        <div class="row1"><div class="k">■ OSINT / 컴퓨팅 임대업</div><div class="d">2026-06-05 · SEC FWP</div></div>
        <div class="mid">
          <div class="head">
            <h1>구글, SpaceX에<br><span class="em">월 9.2억</span> 달러</h1>
            <div class="sub">IPO 엿새 전, 두 번째 메가 임대. 한 달 새 런레이트로 자리 잡았다.</div>
          </div>
          <div class="vline"></div>
          <div class="chart">
            <div class="t">엔비디아 / NVDA</div>
            <div class="src">YAHOO · 03-05~06-05 · 일봉</div>
            <div id="mc" style="margin-top:14px;flex:1;"></div>
          </div>
        </div>
        <div class="row3">
          <div class="big"><span class="n">21.7</span><span class="u">억<br>달러</span></div>
          <div class="vline"></div>
          <div class="note">월 임대 런레이트 (앤스로픽 12.5 + 구글 9.2). 90일 해지권 → 확정 매출 아님.</div>
        </div>
      </div>
    </div>
    <script>
      window.__mockCandle("#mc", { up:"#ff2b00", down:"#f4f4f2", stroke:"#0a0a0a" });
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused:true }); tl.to("#root",{opacity:1,duration:0.1},0);
      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
