<!doctype html>
<!-- 톤 mockup B — 다크 브로드캐스트 (날리지식/Vox). 비교 검수용 정지 프레임. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../../assets/gsap.min.js"></script>
    <script src="examples/mockups/_candle.js"></script>
    <style>
      @font-face { font-family:"Pretendard Variable"; src:url("../../assets/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight:100 900; font-display:block; }
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#0e1116;color:#f2f4f7;
        font-family:"Pretendard Variable",sans-serif;word-break:keep-all;}
      .kick{position:absolute;top:90px;left:120px;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#ff5a36;}
      .date{position:absolute;top:94px;right:120px;font-size:20px;font-weight:600;color:rgba(242,244,247,0.5);letter-spacing:1px;}
      .head{position:absolute;top:190px;left:120px;font-size:118px;font-weight:900;line-height:1.02;letter-spacing:-3px;max-width:1100px;color:#ffffff;}
      .head .em{color:#ff5a36;}
      .accent{position:absolute;top:520px;left:124px;width:300px;height:8px;background:#ff5a36;}
      .card{position:absolute;top:560px;left:120px;width:1000px;background:#171b22;border:1px solid #252b34;border-radius:14px;padding:34px 40px;}
      .card .t{font-size:30px;font-weight:800;color:#f2f4f7;}
      .card .src{font-size:20px;color:rgba(242,244,247,0.45);font-weight:600;margin-top:4px;}
      .mc-grid{stroke:rgba(242,244,247,0.08);stroke-width:1;}
      .mc-axis{fill:rgba(242,244,247,0.45);font-size:18px;font-weight:600;}
      .metric{position:absolute;top:600px;right:140px;text-align:right;}
      .metric .l{font-size:26px;font-weight:700;color:#aeb6c0;letter-spacing:2px;}
      .metric .n{font-size:200px;font-weight:900;color:#ff5a36;letter-spacing:-6px;line-height:0.9;}
      .metric .u{font-size:56px;font-weight:800;color:#ffffff;}
      .lower{position:absolute;left:0;right:0;bottom:0;height:120px;background:#171b22;border-top:3px solid #ff5a36;
        display:flex;align-items:center;padding:0 120px;justify-content:space-between;}
      .lower .b{font-size:38px;font-weight:800;}
      .lower .s{font-size:22px;font-weight:600;color:rgba(242,244,247,0.5);}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="2" data-track-index="0">
      <div style="position:absolute;inset:0;background:#0e1116;z-index:0;"></div>
      <div class="kick">■ OSINT 브리핑 · 컴퓨팅 임대업</div>
      <div class="date">2026.06.05 · SEC FWP</div>
      <div class="head">구글, SpaceX에<br><span class="em">월 9.2억 달러</span> 임대</div>
      <div class="accent"></div>
      <div class="card">
        <div class="t">엔비디아 · NVDA</div>
        <div class="src">출처 · YAHOO · 2026-03-05 ~ 06-05 · 일봉</div>
        <div id="mc" style="margin-top:16px;height:380px;"></div>
      </div>
      <div class="metric"><div class="l">월 임대 런레이트</div><div class="n">21.7<span class="u"> 억 달러</span></div></div>
      <div class="lower"><div class="b">IPO 엿새 전, 두 번째 메가 임대</div><div class="s">출처 · SEC FWP / TechCrunch</div></div>
    </div>
    <script>
      window.__mockCandle("#mc", { up:"#ff5a36", down:"#0e1116", stroke:"#ff5a36" });
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused:true }); tl.to("#root",{opacity:1,duration:0.1},0);
      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
