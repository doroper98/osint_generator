<!doctype html>
<!--
  lib/charts/candle.html — 캔들(OHLC) 차트 HyperFrames 컴포넌트 (v0.34.13).

  data-composition-src 로 import 되는 sub-composition (template wrapper 필수).
  모든 데이터는 data-* 변수(data-composition-variables / data-variable-values)로 주입.
  SVG 를 스크립트가 데이터에서 생성 → GSAP fromTo 타임라인으로 등장 애니메이션.

  좌표계: viewBox 0 0 1408 500. 플롯 x [207..1197], baseline y=416(=yMin), top y=0(=yMax).
  가격→y: y = 416 - (price - yMin) * (416 / (yMax - yMin)).

  주의(SKILL motion-principles): sub-comp 에서는 tl.from() 대신 tl.fromTo() (immediateRender
  사고 회피). 한 요소에 transform 트윈 2개 금지. 결정론(랜덤/시계 금지).
-->
<html lang="ko" data-composition-variables='[
  {"id":"takeaway","type":"string","label":"헤드라인","default":"브렌트 유가 — 봉쇄에서 협상까지"},
  {"id":"accent","type":"color","label":"강조색","default":"#e84a2d"},
  {"id":"yMin","type":"number","label":"y축 최소","default":50},
  {"id":"yMax","type":"number","label":"y축 최대","default":130},
  {"id":"yStep","type":"number","label":"y축 격자 간격","default":20},
  {"id":"yUnit","type":"string","label":"y축 단위","default":"$"},
  {"id":"candles","type":"string","label":"OHLC 데이터(JSON)","default":"[{\"d\":\"02-22\",\"o\":80,\"h\":82,\"l\":78,\"c\":81},{\"d\":\"03-01\",\"o\":81,\"h\":96,\"l\":80,\"c\":95},{\"d\":\"03-08\",\"o\":95,\"h\":123,\"l\":93,\"c\":120},{\"d\":\"03-15\",\"o\":120,\"h\":122,\"l\":113,\"c\":116},{\"d\":\"03-22\",\"o\":116,\"h\":119,\"l\":108,\"c\":110},{\"d\":\"03-29\",\"o\":110,\"h\":113,\"l\":104,\"c\":106},{\"d\":\"04-05\",\"o\":106,\"h\":110,\"l\":100,\"c\":105},{\"d\":\"04-12\",\"o\":105,\"h\":109,\"l\":102,\"c\":108},{\"d\":\"04-19\",\"o\":108,\"h\":112,\"l\":104,\"c\":107},{\"d\":\"04-26\",\"o\":107,\"h\":116,\"l\":106,\"c\":114},{\"d\":\"05-03\",\"o\":114,\"h\":117,\"l\":109,\"c\":112},{\"d\":\"05-10\",\"o\":112,\"h\":114,\"l\":99,\"c\":102}]"},
  {"id":"callouts","type":"string","label":"콜아웃(JSON)","default":"[{\"ci\":2,\"at\":\"high\",\"t\":3.0,\"title\":\"호르무즈 봉쇄\",\"sub\":\"유가 피크 $120\",\"dir\":\"ur\"},{\"ci\":6,\"at\":\"low\",\"t\":17.0,\"title\":\"1차 휴전\",\"sub\":\"바닥 $100\",\"dir\":\"dl\"},{\"ci\":9,\"at\":\"high\",\"t\":21.0,\"title\":\"UAE 표적 공격\",\"sub\":\"$114 재반등\",\"dir\":\"ul\"}]"},
  {"id":"endpoint","type":"string","label":"끝점 라벨(JSON)","default":"{\"ci\":11,\"at\":\"close\",\"t\":25.0,\"title\":\"현재가\",\"value\":\"102 $\"}"},
  {"id":"candleStart","type":"number","label":"캔들 등장 시작(초)","default":0.7},
  {"id":"candleStagger","type":"number","label":"캔들 stagger(초)","default":0.2}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="assets/gsap.min.js"></script>
  </head>
  <body>
    <template id="candle-template">
      <div data-composition-id="candle" data-width="1920" data-height="1080">
        <style>
          [data-composition-id="candle"] {
            position: absolute; inset: 0; width: 1920px; height: 1080px;
            background: transparent;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1a1a1a; word-break: keep-all; overflow-wrap: anywhere;
          }
          [data-composition-id="candle"] .hf-stage {
            position: absolute; top: 160px; left: 0; right: 0; bottom: 300px;
            display: flex; align-items: center; justify-content: center;
          }
          [data-composition-id="candle"] .hf-card {
            width: 1520px; background: #ffffff; border-radius: 22px;
            box-shadow: 0 2px 16px rgba(26,26,26,0.06), 0 1px 3px rgba(26,26,26,0.04);
            padding: 56px;
          }
          [data-composition-id="candle"] .hf-takeaway {
            font-size: 56px; font-weight: 900; line-height: 1.15;
            letter-spacing: -0.3px; color: #1a1a1a; margin-bottom: 24px;
          }
          [data-composition-id="candle"] svg.hf-chart {
            display: block; width: 1408px; height: 500px; overflow: visible;
          }
        </style>

        <div class="hf-stage">
          <div class="hf-card">
            <div class="hf-takeaway" data-role="takeaway"></div>
            <svg class="hf-chart" viewBox="0 0 1408 500" data-role="chart" aria-hidden="true"></svg>
          </div>
        </div>

        <script>
          (function () {
            // ---- 0. 인스턴스 루트 스코프 (멀티 임베드 대비; currentScript 폴백) ----
            var thisScript = document.currentScript;
            var root = (thisScript && thisScript.closest('[data-composition-id="candle"]'))
              || document.querySelector('[data-composition-id="candle"]');

            // ---- 1. 변수 읽기 (한 번만) ----
            // data-composition-variables 의 default 는 Studio UI/문서용. 컴포넌트는
            // getVariables() 가 비어도 항상 렌더되도록 JS 폴백(브렌트 canonical)을 함께 둔다.
            var D = {
              takeaway: "브렌트 유가 — 봉쇄에서 협상까지",
              accent: "#e84a2d", yMin: 50, yMax: 130, yStep: 20, yUnit: "$",
              candles: [
                { d: "02-22", o: 80, h: 82, l: 78, c: 81 },
                { d: "03-01", o: 81, h: 96, l: 80, c: 95 },
                { d: "03-08", o: 95, h: 123, l: 93, c: 120 },
                { d: "03-15", o: 120, h: 122, l: 113, c: 116 },
                { d: "03-22", o: 116, h: 119, l: 108, c: 110 },
                { d: "03-29", o: 110, h: 113, l: 104, c: 106 },
                { d: "04-05", o: 106, h: 110, l: 100, c: 105 },
                { d: "04-12", o: 105, h: 109, l: 102, c: 108 },
                { d: "04-19", o: 108, h: 112, l: 104, c: 107 },
                { d: "04-26", o: 107, h: 116, l: 106, c: 114 },
                { d: "05-03", o: 114, h: 117, l: 109, c: 112 },
                { d: "05-10", o: 112, h: 114, l: 99, c: 102 }
              ],
              callouts: [
                { ci: 2, at: "high", t: 3.0, title: "호르무즈 봉쇄", sub: "유가 피크 $120", dir: "ur" },
                { ci: 6, at: "low", t: 17.0, title: "1차 휴전", sub: "바닥 $100", dir: "dl" },
                { ci: 9, at: "high", t: 21.0, title: "UAE 표적 공격", sub: "$114 재반등", dir: "ul" }
              ],
              endpoint: { ci: 11, at: "close", t: 25.0, title: "현재가", value: "102 $" },
              candleStart: 0.7, candleStagger: 0.2
            };
            // 변수 병합: JS 폴백(D) < getVariables() < host 의 data-variable-values(DOM 직독).
            // v0.6.76 에서 sub-comp host override 가 getVariables() 까지 전파되지 않는 사고가 있어
            // (콘솔: __hfVariablesByComp=null), 인스턴스 host(=data-variable-values 를 가진 조상)를
            // DOM 에서 직접 찾아 읽는다 — 이게 12 씬 파이프라인의 실 주입 경로다.
            var gv = (window.__hyperframes && window.__hyperframes.getVariables)
              ? (window.__hyperframes.getVariables() || {}) : {};
            var hostVV = root && root.closest('[data-variable-values]');
            var hostVals = {};
            if (hostVV) { try { hostVals = JSON.parse(hostVV.getAttribute("data-variable-values")) || {}; } catch (e) { hostVals = {}; } }
            var V = Object.assign({}, gv, hostVals);
            var takeaway = V.takeaway != null ? V.takeaway : D.takeaway;
            var accent = V.accent || D.accent;
            var yMin = V.yMin != null ? +V.yMin : D.yMin;
            var yMax = V.yMax != null ? +V.yMax : D.yMax;
            var yStep = V.yStep != null ? +V.yStep : D.yStep;
            var yUnit = V.yUnit != null ? V.yUnit : D.yUnit;
            var candles = parseJSON(V.candles, D.candles);
            var callouts = parseJSON(V.callouts, D.callouts);
            var endpoint = V.endpoint != null ? parseJSON(V.endpoint, D.endpoint) : D.endpoint;
            var candleStart = V.candleStart != null ? +V.candleStart : D.candleStart;
            var candleStagger = V.candleStagger != null ? +V.candleStagger : D.candleStagger;

            root.querySelector('[data-role="takeaway"]').textContent = takeaway;

            // ---- 2. 지오메트리 ----
            var BASE = 416, TOP = 0, X0 = 207, X1 = 1197, GW = 96, GRID_R = 1308;
            var N = candles.length;
            var xGap = N > 1 ? (X1 - X0) / (N - 1) : 0;
            var bodyW = Math.min(48, xGap > 0 ? xGap * 0.55 : 48);
            var span = (yMax - yMin) || 1;
            var scaleY = BASE / span;
            function yOf(p) { return BASE - (p - yMin) * scaleY; }
            function cxOf(i) { return X0 + i * xGap; }
            function anchorY(c, kind) {
              return kind === "high" ? yOf(c.h) : kind === "low" ? yOf(c.l) : yOf(c.c);
            }

            // ---- 3. SVG 조립 ----
            var svg = root.querySelector('[data-role="chart"]');
            var parts = [];

            // 플롯 배경 + 격자
            parts.push('<rect x="' + GW + '" y="' + TOP + '" width="' + (GRID_R - GW) +
              '" height="' + BASE + '" fill="#fdfbf7" opacity="0.35" rx="8"/>');
            parts.push('<g data-role="grid">');
            for (var p = yMin; p <= yMax + 0.001; p += yStep) {
              var gy = yOf(p);
              var isBase = Math.abs(p - yMin) < 0.001;
              parts.push('<line x1="' + GW + '" y1="' + r1(gy) + '" x2="' + GRID_R + '" y2="' + r1(gy) +
                '" stroke="rgba(26,26,26,' + (isBase ? 0.2 : 0.06) + ')" stroke-width="' + (isBase ? 1.5 : 1) + '"/>');
              parts.push('<text x="' + (GW - 16) + '" y="' + r1(gy) + '" fill="rgba(26,26,26,0.6)" font-size="20" ' +
                'font-weight="500" text-anchor="end" dominant-baseline="middle">' + fmtNum(p) + ' ' + esc(yUnit) + '</text>');
            }
            // x 라벨 (혼잡 회피: 최대 ~6개로 subsample)
            var stepLbl = Math.max(1, Math.round(N / 6));
            for (var i = 0; i < N; i++) {
              if (i % stepLbl !== 0 && i !== N - 1) continue;
              parts.push('<text x="' + r1(cxOf(i)) + '" y="' + (BASE + 30) + '" fill="rgba(26,26,26,0.6)" ' +
                'font-size="20" font-weight="500" text-anchor="middle">' + esc(candles[i].d) + '</text>');
            }
            parts.push('</g>');

            // 캔들 (양봉=채운 accent, 음봉=흰 fill + accent stroke)
            parts.push('<g data-role="candles">');
            for (var j = 0; j < N; j++) {
              var c = candles[j], cx = cxOf(j);
              var up = c.c >= c.o;
              var yH = yOf(c.h), yL = yOf(c.l);
              var yTop = yOf(Math.max(c.o, c.c)), yBot = yOf(Math.min(c.o, c.c));
              var bh = Math.max(2, yBot - yTop);
              parts.push('<g class="hf-candle">');
              parts.push('<line x1="' + r1(cx) + '" y1="' + r1(yH) + '" x2="' + r1(cx) + '" y2="' + r1(yL) +
                '" stroke="' + accent + '" stroke-width="2"/>');
              parts.push('<rect x="' + r1(cx - bodyW / 2) + '" y="' + r1(yTop) + '" width="' + r1(bodyW) +
                '" height="' + r1(bh) + '" ' + (up
                  ? 'fill="' + accent + '"'
                  : 'fill="#ffffff" stroke="' + accent + '" stroke-width="2.5"') + '/>');
              parts.push('</g>');
            }
            parts.push('</g>');

            // 콜아웃
            var coMeta = [];
            callouts.forEach(function (co, k) {
              var c = candles[co.ci]; if (!c) return;
              var ax = cxOf(co.ci), ay = anchorY(c, co.at || "high");
              var place = labelPlace(co.dir || "ur", ax, ay);
              coMeta.push({ k: k, t: co.t, ax: ax, ay: ay });
              parts.push('<g data-role="callout" data-i="' + k + '" style="opacity:0">');
              parts.push('<path data-role="conn" d="' + leaderPath(ax, ay, place) +
                '" stroke="' + accent + '" stroke-width="1.5" fill="none" ' +
                'style="stroke-dasharray:600;stroke-dashoffset:600;"/>');
              parts.push('<circle cx="' + r1(ax) + '" cy="' + r1(ay) + '" r="6" fill="' + accent +
                '" stroke="#ffffff" stroke-width="2"/>');
              parts.push('<text data-role="co-t" x="' + r1(place.lx) + '" y="' + r1(place.ly) + '" fill="' + accent +
                '" font-size="22" font-weight="800" letter-spacing="1.5" text-anchor="' + place.anchor + '">' +
                esc(co.title || "") + '</text>');
              parts.push('<text data-role="co-t" x="' + r1(place.lx) + '" y="' + r1(place.ly + 26) +
                '" fill="rgba(26,26,26,0.7)" font-size="20" font-weight="600" text-anchor="' + place.anchor + '">' +
                esc(co.sub || "") + '</text>');
              parts.push('</g>');
            });

            // 끝점
            if (endpoint && candles[endpoint.ci]) {
              var ec = candles[endpoint.ci];
              var ex = cxOf(endpoint.ci), ey = anchorY(ec, endpoint.at || "close");
              var elx = ex + 41, eAnchor = "start";
              if (ex > GRID_R - 180) { elx = ex - 41; eAnchor = "end"; }
              parts.push('<g data-role="endpoint" style="opacity:0">');
              parts.push('<circle cx="' + r1(ex) + '" cy="' + r1(ey) + '" r="9" fill="' + accent +
                '" stroke="#f5f1ea" stroke-width="3"/>');
              parts.push('<text data-role="ep-t" x="' + r1(elx) + '" y="' + r1(ey - 8) + '" fill="' + accent +
                '" font-size="22" font-weight="800" text-anchor="' + eAnchor + '">' + esc(endpoint.title || "") + '</text>');
              parts.push('<text data-role="ep-t" x="' + r1(elx) + '" y="' + r1(ey + 22) + '" fill="#1a1a1a" ' +
                'font-size="30" font-weight="900" text-anchor="' + eAnchor + '">' + esc(endpoint.value || "") + '</text>');
            }
            if (endpoint) parts.push('</g>');
            svg.innerHTML = parts.join("");

            // ---- 4. GSAP 타임라인 (fromTo, 등록 키 = 내부 composition-id) ----
            if (typeof gsap === "undefined") return;
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });

            tl.fromTo(svg.querySelector('[data-role="grid"]'),
              { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.4);

            // 캔들 stagger 등장 (scale+opacity 한 트윈에 묶음 — transform 단일)
            tl.fromTo(svg.querySelectorAll(".hf-candle"),
              { opacity: 0, scale: 0.7, transformOrigin: "center center" },
              { opacity: 1, scale: 1, duration: 0.35, stagger: candleStagger, ease: "back.out(1.4)" },
              candleStart);

            // 콜아웃: circle pop → connector draw → text 등장
            coMeta.forEach(function (m) {
              var g = svg.querySelector('[data-role="callout"][data-i="' + m.k + '"]');
              if (!g) return;
              tl.to(g, { opacity: 1, duration: 0.001 }, m.t);
              tl.fromTo(g.querySelector("circle"),
                { scale: 0, transformOrigin: r1(m.ax) + "px " + r1(m.ay) + "px" },
                { scale: 1, duration: 0.3, ease: "back.out(2)" }, m.t);
              tl.fromTo(g.querySelector('[data-role="conn"]'),
                { strokeDashoffset: 600 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, m.t + 0.3);
              tl.fromTo(g.querySelectorAll('[data-role="co-t"]'),
                { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.08, ease: "power2.out" }, m.t + 0.5);
            });

            // 끝점
            if (endpoint) {
              var ep = svg.querySelector('[data-role="endpoint"]');
              var et = endpoint.t != null ? +endpoint.t : 25.0;
              tl.to(ep, { opacity: 1, duration: 0.001 }, et);
              tl.fromTo(ep.querySelector("circle"),
                { scale: 0, transformOrigin: "center center" },
                { scale: 1, duration: 0.3, ease: "back.out(2)" }, et);
              tl.fromTo(ep.querySelectorAll('[data-role="ep-t"]'),
                { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, et + 0.2);
            }

            // 타임라인 등록 — 런타임은 authored id("candle")와 runtime 인스턴스 id(host id) 둘 다로
            // 폴링하므로 두 키 모두 등록한다(v0.6.76 실측: 한쪽만 등록하면 나머지를 45s 기다리다 실패).
            window.__timelines["candle"] = tl;
            var cid = (typeof __hfTimelineCompId !== "undefined" && __hfTimelineCompId)
              || (typeof __hfCompId !== "undefined" && __hfCompId)
              || (root && root.getAttribute("data-composition-id")) || "candle";
            if (cid && cid !== "candle") window.__timelines[cid] = tl;

            // ---- helpers ----
            function parseJSON(s, fb) { try { return typeof s === "string" ? JSON.parse(s) : (s || fb); } catch (e) { return fb; } }
            function r1(n) { return Math.round(n * 10) / 10; }
            function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
            function fmtNum(n) { return (Math.round(n * 100) / 100).toString(); }
            function labelPlace(dir, ax, ay) {
              var lx, ly, anchor;
              if (dir === "ur") { lx = ax + 150; ly = clampY(ay - 6); anchor = "start"; }
              else if (dir === "ul") { lx = ax - 150; ly = clampY(ay - 6); anchor = "end"; }
              else if (dir === "dr") { lx = ax + 50; ly = clampY(ay + 96); anchor = "start"; }
              else { lx = ax - 50; ly = clampY(ay + 96); anchor = "end"; } // dl
              return { lx: lx, ly: ly, anchor: anchor };
            }
            function clampY(y) { return Math.max(30, Math.min(BASE - 8, y)); }
            function leaderPath(ax, ay, place) {
              var midx = (ax + place.lx) / 2;
              return "M " + r1(ax) + " " + r1(ay) + " Q " + r1(midx) + " " + r1(place.ly - 10) +
                " " + r1(place.lx + (place.anchor === "end" ? 8 : -8)) + " " + r1(place.ly - 6);
            }
          })();
        </script>
      </div>
    </template>
  </body>
</html>
