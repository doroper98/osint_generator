<!doctype html>
<!--
  lib/charts/donut.html — 도넛(부분-전체) 차트 HyperFrames 컴포넌트 (v0.34.13).
  컨트랙트는 candle/line/bar 와 동일. 도넛은 arc path 를 stroke-dasharray draw-on 으로 그리고
  우측에 직접 라벨 리스트(색/라벨/값/비율). 범례 의존 최소(데이터→직접 라벨).
  ※ 카테고리 ≤ 5 일 때만 사용(PROFESSIONAL_REBUILD_PLAN 1.3). 일반 skill 의 'no pie' 보다
    프로젝트 디자인 규칙(C0/플랜)이 우선.
-->
<html lang="ko" data-composition-variables='[
  {"id":"takeaway","type":"string","label":"헤드라인","default":"호르무즈 해협 원유 — 목적지 비중"},
  {"id":"unit","type":"string","label":"값 단위","default":"%"},
  {"id":"centerLabel","type":"string","label":"중앙 라벨","default":"아시아 4개국"},
  {"id":"centerValue","type":"string","label":"중앙 값","default":"91%"},
  {"id":"slices","type":"string","label":"슬라이스(JSON)","default":"[{\"label\":\"중국\",\"value\":48,\"color\":\"#b5482e\"},{\"label\":\"인도\",\"value\":19,\"color\":\"#f0883e\"},{\"label\":\"한국\",\"value\":13,\"color\":\"#5aa9e6\"},{\"label\":\"일본\",\"value\":11,\"color\":\"#7d8597\"},{\"label\":\"기타\",\"value\":9,\"color\":\"#c9cdd4\"}]"},
  {"id":"drawStart","type":"number","label":"arc draw 시작(초)","default":0.6}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="assets/gsap.min.js"></script>
    <script src="lib/motion/hf-motion.js"></script>
  </head>
  <body>
    <template id="donut-template">
      <div data-composition-id="donut" data-width="1920" data-height="1080">
        <style>
          [data-composition-id="donut"] {
            position: absolute; inset: 0; width: 1920px; height: 1080px; background: transparent;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #16130f; word-break: keep-all; overflow-wrap: anywhere;
          }
          [data-composition-id="donut"] .hf-stage {
            position: absolute; top: 150px; left: 0; right: 0; bottom: 110px;
            display: flex; align-items: flex-start; justify-content: center;
          }
          [data-composition-id="donut"] .hf-card {
            width: 1520px; background: #fbf9f4; border-radius: 18px; border: 1px solid #e2dccf;
            box-shadow: 0 1px 2px rgba(22,19,15,0.05); padding: 56px;
          }
          [data-composition-id="donut"] .hf-takeaway {
            font-size: 56px; font-weight: 900; line-height: 1.15; letter-spacing: -0.3px;
            color: #16130f; margin-bottom: 24px;
          }
          [data-composition-id="donut"] svg.hf-chart { display: block; width: 1408px; height: 500px; overflow: visible; }
          [data-composition-id="donut"] .hf-source { margin-top: 20px; font-size: 22px; font-weight: 600; color: #9b9082; letter-spacing: -0.2px; }
        </style>

        <div class="hf-stage">
          <div class="hf-card">
            <div class="hf-takeaway" data-role="takeaway"></div>
            <svg class="hf-chart" viewBox="0 0 1408 500" data-role="chart" aria-hidden="true"></svg>
            <div class="hf-source" data-role="source"></div>
          </div>
        </div>

        <script>
          (function () {
            // 루트 해소: HyperFrames 래퍼가 노출하는 __hfFindRoot()(런타임 인스턴스 id 로
            // 해소된 루트)를 1차로 — authored-id querySelector 는 런타임 id 재작성과 충돌해
            // 멀티 씬 컴포지션에서 null 이 되는 사고가 있었다(v0.34.14). currentScript/authored
            // 셀렉터는 standalone 폴백.
            var thisScript = document.currentScript;
            var root = (typeof __hfFindRoot === "function" ? __hfFindRoot() : null)
              || (thisScript && thisScript.closest('[data-composition-id="donut"]'))
              || document.querySelector('[data-composition-id="donut"]');

            var D = {
              takeaway: "호르무즈 해협 원유 — 목적지 비중", unit: "%",
              centerLabel: "아시아 4개국", centerValue: "91%",
              slices: [
                { label: "중국", value: 48, color: "#b5482e" },
                { label: "인도", value: 19, color: "#f0883e" },
                { label: "한국", value: 13, color: "#5aa9e6" },
                { label: "일본", value: 11, color: "#7d8597" },
                { label: "기타", value: 9, color: "#c9cdd4" }
              ],
              drawStart: 0.6
            };
            var gv = (window.__hyperframes && window.__hyperframes.getVariables)
              ? (window.__hyperframes.getVariables() || {}) : {};
            var hostVV = root && root.closest('[data-variable-values]');
            var hostVals = {};
            if (hostVV) { try { hostVals = JSON.parse(hostVV.getAttribute("data-variable-values")) || {}; } catch (e) { hostVals = {}; } }
            var V = Object.assign({}, gv, hostVals);

            var unit = V.unit != null ? V.unit : D.unit;
            var centerLabel = V.centerLabel != null ? V.centerLabel : D.centerLabel;
            var centerValue = V.centerValue != null ? V.centerValue : D.centerValue;
            var slices = parseJSON(V.slices, D.slices);
            var drawStart = V.drawStart != null ? +V.drawStart : D.drawStart;
            root.querySelector('[data-role="takeaway"]').textContent = V.takeaway != null ? V.takeaway : D.takeaway;
            setSourceFooter(root, V);

            var PALETTE = ["#b5482e", "#f0883e", "#5aa9e6", "#7d8597", "#c9cdd4"];
            var total = 0; slices.forEach(function (s) { total += +s.value; });
            if (total <= 0) total = 1;

            var CX = 366, CY = 250, R = 168, TH = 62, C = 2 * Math.PI * R, GAP = 2.0; // deg gap
            var svg = root.querySelector('[data-role="chart"]');
            var parts = [];

            // 트랙(배경 링)
            parts.push('<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="rgba(26,26,26,0.06)" stroke-width="' + TH + '"/>');

            // arc 슬라이스
            var acc = 0, arcMeta = [];
            slices.forEach(function (s, i) {
              var frac = (+s.value) / total;
              var a0 = acc * 360 + GAP / 2, a1 = (acc + frac) * 360 - GAP / 2;
              acc += frac;
              if (a1 <= a0) a1 = a0 + 0.1;
              var col = s.color || PALETTE[i % PALETTE.length];
              var p0 = polar(CX, CY, R, a0), p1 = polar(CX, CY, R, a1);
              var large = (a1 - a0) > 180 ? 1 : 0;
              var arcLen = ((a1 - a0) / 360) * C;
              parts.push('<path data-role="arc" data-i="' + i + '" d="M ' + r1(p0.x) + ' ' + r1(p0.y) +
                ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + r1(p1.x) + ' ' + r1(p1.y) + '" fill="none" stroke="' + col +
                '" stroke-width="' + TH + '" stroke-linecap="butt" ' +
                'style="stroke-dasharray:' + r1(arcLen) + ' ' + r1(C) + ';stroke-dashoffset:' + r1(arcLen) + ';"/>');
              arcMeta.push({ i: i });
            });

            // 중앙 텍스트
            parts.push('<text data-role="center" x="' + CX + '" y="' + (CY - 8) + '" fill="rgba(26,26,26,0.55)" font-size="24" ' +
              'font-weight="700" text-anchor="middle" style="opacity:0">' + esc(centerLabel) + '</text>');
            parts.push('<text data-role="center" x="' + CX + '" y="' + (CY + 40) + '" fill="#16130f" font-size="58" ' +
              'font-weight="900" text-anchor="middle" style="opacity:0">' + esc(centerValue) + '</text>');

            // 우측 직접 라벨 리스트
            var LX = 740, rowH = 76, startY = CY - (slices.length - 1) * rowH / 2;
            slices.forEach(function (s, i) {
              var col = s.color || PALETTE[i % PALETTE.length];
              var ry = startY + i * rowH, pct = Math.round((+s.value) / total * 1000) / 10;
              parts.push('<g data-role="legend" data-i="' + i + '" style="opacity:0">');
              parts.push('<rect x="' + LX + '" y="' + r1(ry - 22) + '" width="30" height="30" rx="7" fill="' + col + '"/>');
              parts.push('<text x="' + (LX + 48) + '" y="' + r1(ry) + '" fill="#16130f" font-size="30" font-weight="800" dominant-baseline="middle">' +
                esc(s.label) + '</text>');
              // 값이 이미 % 면 비중 sub-line 은 중복이라 생략. 절대값이면 계산된 % 를 보조 표기.
              var pctRedundant = (unit === "%");
              parts.push('<text x="' + (LX + 600) + '" y="' + r1(pctRedundant ? ry : ry - 10) + '" fill="#16130f" font-size="30" font-weight="900" text-anchor="end" dominant-baseline="middle">' +
                fmtNum(+s.value) + esc(unit) + '</text>');
              if (!pctRedundant) {
                parts.push('<text x="' + (LX + 600) + '" y="' + r1(ry + 18) + '" fill="rgba(26,26,26,0.45)" font-size="18" font-weight="600" text-anchor="end" dominant-baseline="middle">' +
                  pct + '% 비중</text>');
              }
              parts.push('</g>');
            });
            svg.innerHTML = parts.join("");

            if (typeof gsap === "undefined") return;
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });

            // arc draw-on (stagger)
            svg.querySelectorAll('[data-role="arc"]').forEach(function (a, i) {
              tl.fromTo(a, { strokeDashoffset: parseFloat(a.style.strokeDashoffset) || 0 },
                { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, drawStart + i * 0.18);
            });
            // 중앙 텍스트
            tl.fromTo(svg.querySelectorAll('[data-role="center"]'), { opacity: 0, scale: 0.9, transformOrigin: CX + "px " + CY + "px" },
              { opacity: 1, scale: 1, duration: 0.5, stagger: 0.1, ease: "back.out(1.6)" }, drawStart + 0.5);
            // 중앙 큰 값 카운트업 — "91%"/"3.2조" 처럼 숫자+접미 문자열에서 숫자만 0→값으로
            // 굴리고 접미(%, 조 등)는 보존. 숫자가 없으면(텍스트 라벨) 정적 유지.
            (function () {
              var cvBig = svg.querySelectorAll('[data-role="center"]')[1];
              var raw = String(centerValue);
              var cvNum = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
              var cvSuffix = raw.replace(/^[\s\-0-9.,]+/, "");
              if (window.__hf && window.__hf.countUp && cvBig && isFinite(cvNum)) {
                window.__hf.countUp(tl, cvBig, 0, cvNum,
                  { at: drawStart + 0.6, duration: 0.9, ease: "power2.out", format: fmtNum, suffix: cvSuffix });
              }
            })();
            // 라벨 리스트
            svg.querySelectorAll('[data-role="legend"]').forEach(function (g, i) {
              tl.fromTo(g, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, drawStart + 0.8 + i * 0.12);
            });

            // 헤드라인 SplitText reveal (모션 내재화 hf-motion, 있으면).
            var __twk = root.querySelector('[data-role="takeaway"]');
            if (window.__hf && window.__hf.revealWords && __twk) window.__hf.revealWords(tl, __twk, 0.15, { stagger: 0.05 });
            window.__timelines["donut"] = tl;
            var cid = (typeof __hfTimelineCompId !== "undefined" && __hfTimelineCompId)
              || (typeof __hfCompId !== "undefined" && __hfCompId)
              || (root && root.getAttribute("data-composition-id")) || "donut";
            if (cid && cid !== "donut") window.__timelines[cid] = tl;

            function parseJSON(s, fb) { try { return typeof s === "string" ? JSON.parse(s) : (s || fb); } catch (e) { return fb; } }
            function r1(n) { return Math.round(n * 10) / 10; }
            function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
            function fmtNum(n) { return (Math.round(n * 100) / 100).toString(); }
            function setSourceFooter(rt, vars) {
              var el = rt && rt.querySelector('[data-role="source"]'); if (!el) return;
              var p = [];
              if (vars.source) p.push("출처 · " + vars.source);
              if (vars.periodStart && vars.periodEnd)
                p.push(vars.periodStart + " ~ " + vars.periodEnd + (vars.interval ? " · " + vars.interval : ""));
              el.textContent = p.join("      ");
            }
            function polar(cx, cy, r, deg) {
              var a = (deg - 90) * Math.PI / 180; // 12시 기준 시계방향
              return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
            }
          })();
        </script>
      </div>
    </template>
  </body>
</html>
