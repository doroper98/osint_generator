<!doctype html>
<!--
  lib/charts/line.html — 라인(시계열) 차트 HyperFrames 컴포넌트 (v0.34.13).
  candle.html 과 동일한 컨트랙트: <template> wrapper, data-* 주입(host data-variable-values
  DOM 직독), JS 폴백, GSAP fromTo, __timelines 이중 키 등록.
  좌표계: viewBox 0 0 1408 500. plot x [130..1290], y: BASE=416(yMin)→TOP=0(yMax).
  라인 draw-on 은 stroke-dasharray 고정값(3000) + dashoffset 트윈(getTotalLength 의존 회피).
-->
<html lang="ko" data-composition-variables='[
  {"id":"takeaway","type":"string","label":"헤드라인","default":"브렌트 vs WTI — 호르무즈 충격"},
  {"id":"accent","type":"color","label":"강조색","default":"#b5482e"},
  {"id":"yMin","type":"number","label":"y축 최소","default":60},
  {"id":"yMax","type":"number","label":"y축 최대","default":130},
  {"id":"yStep","type":"number","label":"y축 격자 간격","default":20},
  {"id":"yUnit","type":"string","label":"y축 단위","default":"$"},
  {"id":"xLabels","type":"string","label":"x축 라벨(JSON)","default":"[\"1월\",\"2월\",\"3월\",\"4월\",\"5월\",\"6월\"]"},
  {"id":"series","type":"string","label":"시리즈(JSON)","default":"[{\"name\":\"브렌트\",\"color\":\"#b5482e\",\"points\":[78,82,120,110,106,102]},{\"name\":\"WTI\",\"color\":\"#9aa0a6\",\"points\":[74,78,114,104,100,97]}]"},
  {"id":"callouts","type":"string","label":"콜아웃(JSON)","default":"[{\"xi\":2,\"si\":0,\"t\":3.0,\"title\":\"호르무즈 봉쇄\",\"sub\":\"브렌트 $120 피크\",\"dir\":\"ur\"}]"},
  {"id":"drawStart","type":"number","label":"라인 draw 시작(초)","default":0.6}
]'>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700;6..72,800&family=Noto+Serif+KR:wght@400;700;900&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="assets/gsap.min.js"></script>
    <script src="lib/motion/hf-motion.js"></script>
  </head>
  <body>
    <template id="line-template">
      <div data-composition-id="line" data-width="1920" data-height="1080">
        <style>
          [data-theme="editorial_cream"]{--bg:#F2EBDB;--card:#ECE3D0;--border:#D4C8B0;--text:#1F1814;--muted:#6B5C4A;--accent:#B05A38;--up:#4A6B3E;--down:#8B2A2A;}
          [data-theme="burgundy_mono"]{--bg:#2A0F18;--card:#371721;--border:#5A2832;--text:#EFE5D1;--muted:#A88E7A;--accent:#D4A858;--up:#A8B582;--down:#C9837A;}
          [data-theme="midnight_indigo"]{--bg:#161A2E;--card:#1F2440;--border:#3A4060;--text:#E8ECEF;--muted:#8A92A8;--accent:#6FB3FF;--up:#88B888;--down:#DC7A7A;}
          [data-theme="pine_forest"]{--bg:#132019;--card:#1B2C22;--border:#32503E;--text:#E7EEE8;--muted:#8AA294;--accent:#7CC6A4;--up:#88B888;--down:#DC7A7A;}
          [data-theme="graphite_slate"]{--bg:#191B1E;--card:#23262B;--border:#3D424A;--text:#E9EBED;--muted:#969BA3;--accent:#D69A5E;--up:#88B888;--down:#DC7A7A;}
          [data-composition-id="line"] {
            position: absolute; inset: 0; width: 1920px; height: 1080px; background: transparent;
            font-family: 'IBM Plex Sans KR', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text); word-break: keep-all; overflow-wrap: anywhere;
          }
          [data-composition-id="line"] .hf-stage {
            position: absolute; top: 150px; left: 0; right: 0; bottom: 110px;
            display: flex; align-items: flex-start; justify-content: center;
          }
          [data-composition-id="line"] .hf-card {
            width: 1520px; background: var(--card); border-radius: 18px; border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.18); padding: 56px;
          }
          [data-composition-id="line"] .hf-takeaway {
            font-family: 'Newsreader', 'Noto Serif KR', Pretendard, Georgia, serif;
            font-size: 56px; font-weight: 700; line-height: 1.15; letter-spacing: -0.3px;
            color: var(--text); margin-bottom: 24px;
          }
          [data-composition-id="line"] svg.hf-chart { display: block; width: 1408px; height: 500px; overflow: visible; }
          [data-composition-id="line"] .hf-source { margin-top: 20px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 500; color: var(--muted); letter-spacing: -0.2px; }
        </style>

        <div class="hf-stage">
          <div class="hf-card">
            <div class="hf-takeaway" data-role="takeaway"></div>
            <svg class="hf-chart" viewBox="0 0 1408 500" data-role="chart" aria-hidden="true"></svg>
            <div class="hf-source" data-role="source"></div>
          </div>
        </div>

        <script>
          (function () {
            // 루트 해소: HyperFrames 래퍼가 노출하는 __hfFindRoot()(런타임 인스턴스 id 로
            // 해소된 루트)를 1차로 — authored-id querySelector 는 런타임 id 재작성과 충돌해
            // 멀티 씬 컴포지션에서 null 이 되는 사고가 있었다(v0.34.14). currentScript/authored
            // 셀렉터는 standalone 폴백.
            var thisScript = document.currentScript;
            var root = (typeof __hfFindRoot === "function" ? __hfFindRoot() : null)
              || (thisScript && thisScript.closest('[data-composition-id="line"]'))
              || document.querySelector('[data-composition-id="line"]');

            var D = {
              takeaway: "브렌트 vs WTI — 호르무즈 충격", accent: "#b5482e",
              yMin: 60, yMax: 130, yStep: 20, yUnit: "$",
              xLabels: ["1월", "2월", "3월", "4월", "5월", "6월"],
              series: [
                { name: "브렌트", color: "#b5482e", points: [78, 82, 120, 110, 106, 102] },
                { name: "WTI", color: "#9aa0a6", points: [74, 78, 114, 104, 100, 97] }
              ],
              callouts: [{ xi: 2, si: 0, t: 3.0, title: "호르무즈 봉쇄", sub: "브렌트 $120 피크", dir: "ur" }],
              drawStart: 0.6
            };
            var gv = (window.__hyperframes && window.__hyperframes.getVariables)
              ? (window.__hyperframes.getVariables() || {}) : {};
            var hostVV = root && root.closest('[data-variable-values]');
            var hostVals = {};
            if (hostVV) { try { hostVals = JSON.parse(hostVV.getAttribute("data-variable-values")) || {}; } catch (e) { hostVals = {}; } }
            var V = Object.assign({}, gv, hostVals);

            var accent = V.accent || D.accent;
            var yMin = V.yMin != null ? +V.yMin : D.yMin;
            var yMax = V.yMax != null ? +V.yMax : D.yMax;
            var yStep = V.yStep != null ? +V.yStep : D.yStep;
            var yUnit = V.yUnit != null ? V.yUnit : D.yUnit;
            var xLabels = parseJSON(V.xLabels, D.xLabels);
            var series = parseJSON(V.series, D.series);
            var callouts = parseJSON(V.callouts, D.callouts);
            var drawStart = V.drawStart != null ? +V.drawStart : D.drawStart;
            root.querySelector('[data-role="takeaway"]').textContent = V.takeaway != null ? V.takeaway : D.takeaway;
            setSourceFooter(root, V);
            if (V.theme) root.setAttribute("data-theme", V.theme);  // 테마 토큰 해소(영상단위)
            var MONO = "'IBM Plex Mono', ui-monospace, Menlo, monospace";  // SVG 숫자/라벨 폰트

            var BASE = 416, TOP = 0, X0 = 130, X1 = 1290, GW = 96, GRID_R = 1308;
            var NX = xLabels.length;
            var xGap = NX > 1 ? (X1 - X0) / (NX - 1) : 0;
            var span = (yMax - yMin) || 1, scaleY = BASE / span;
            function yOf(p) { return BASE - (p - yMin) * scaleY; }
            function xOf(i) { return X0 + i * xGap; }

            var svg = root.querySelector('[data-role="chart"]');
            var parts = [];

            // 격자 + 축 라벨
            parts.push('<g data-role="grid">');
            for (var p = yMin; p <= yMax + 0.001; p += yStep) {
              var gy = yOf(p), isBase = Math.abs(p - yMin) < 0.001;
              parts.push('<line x1="' + GW + '" y1="' + r1(gy) + '" x2="' + GRID_R + '" y2="' + r1(gy) +
                '" stroke="var(--border)" stroke-opacity="' + (isBase ? 0.7 : 0.3) + '" stroke-width="' + (isBase ? 1.5 : 1) + '"/>');
              parts.push('<text x="' + (GW - 16) + '" y="' + r1(gy) + '" fill="var(--muted)" font-size="20" font-weight="500" font-family="' + MONO + '" ' +
                'text-anchor="end" dominant-baseline="middle">' + fmtNum(p) + ' ' + esc(yUnit) + '</text>');
            }
            for (var i = 0; i < NX; i++) {
              parts.push('<text x="' + r1(xOf(i)) + '" y="' + (BASE + 30) + '" fill="var(--muted)" font-size="20" font-family="' + MONO + '" ' +
                'font-weight="500" text-anchor="middle">' + esc(xLabels[i]) + '</text>');
            }
            parts.push('</g>');

            // 시리즈: 면적(첫 시리즈만) + 라인 + 끝점 라벨
            var endLabels = [];
            series.forEach(function (s, si) {
              var col = s.color || (si === 0 ? "var(--accent)" : "var(--muted)");
              var pts = s.points || [];
              var d = "", area = "M " + r1(xOf(0)) + " " + r1(BASE);
              pts.forEach(function (val, i) {
                var x = r1(xOf(i)), y = r1(yOf(val));
                d += (i === 0 ? "M " : "L ") + x + " " + y + " ";
                area += " L " + x + " " + y;
              });
              area += " L " + r1(xOf(pts.length - 1)) + " " + r1(BASE) + " Z";
              if (si === 0) {
                parts.push('<path data-role="area" d="' + area + '" fill="' + col + '" style="opacity:0"/>');
              }
              parts.push('<path data-role="linepath" data-si="' + si + '" d="' + d.trim() + '" fill="none" stroke="' + col +
                '" stroke-width="' + (si === 0 ? 4 : 3) + '" stroke-linecap="round" stroke-linejoin="round" ' +
                'style="stroke-dasharray:3000;stroke-dashoffset:3000;"/>');
              var lx = xOf(pts.length - 1), ly = yOf(pts[pts.length - 1]);
              endLabels.push({ si: si, x: lx, y: ly, col: col, name: s.name, val: pts[pts.length - 1] });
            });
            // 끝점 라벨 1D 충돌 회피(간단 nudge)
            endLabels.sort(function (a, b) { return a.y - b.y; });
            for (var e = 1; e < endLabels.length; e++) {
              if (endLabels[e].y - endLabels[e - 1].y < 58) endLabels[e].y = endLabels[e - 1].y + 58;
            }
            endLabels.forEach(function (el) {
              var nm = String(el.name == null ? "" : el.name), hasName = nm.length > 0;
              var valStr = fmtNum(el.val) + (yUnit ? " " + esc(yUnit) : "");
              var fsN = 22, fsV = 24, padX = 10;
              var tw = Math.max(hasName ? estTextW(nm, fsN) : 0, estTextW(valStr, fsV));
              // 오른쪽에 두되, 박스가 viewBox(1408) 밖으로 나가면 점 왼쪽으로 뒤집는다.
              var onRight = (el.x + 18 + tw + padX * 2) <= (1408 - 6);
              var anchor = onRight ? "start" : "end";
              var tx = onRight ? el.x + 18 : el.x - 18;
              var rectX = onRight ? tx - padX : tx - tw - padX;
              var rectH = hasName ? 56 : 34;
              var rectY = Math.max(4, Math.min(BASE - rectH - 2, el.y - (hasName ? 26 : 20)));
              parts.push('<g data-role="endlabel" data-si="' + el.si + '" style="opacity:0">');
              parts.push('<circle cx="' + r1(el.x) + '" cy="' + r1(yOf2(el)) + '" r="7" fill="' + el.col +
                '" stroke="var(--bg)" stroke-width="2.5"/>');
              parts.push('<rect x="' + r1(rectX) + '" y="' + r1(rectY) + '" width="' + r1(tw + padX * 2) +
                '" height="' + rectH + '" rx="8" fill="var(--card)" fill-opacity="0.92" stroke="var(--border)" stroke-width="1"/>');
              if (hasName)
                parts.push('<text x="' + r1(tx) + '" y="' + r1(rectY + 24) + '" fill="' + el.col +
                  '" font-size="' + fsN + '" font-weight="800" text-anchor="' + anchor + '">' + esc(nm) + '</text>');
              parts.push('<text data-role="endval" x="' + r1(tx) + '" y="' + r1(rectY + (hasName ? 46 : 24)) +
                '" fill="var(--text)" font-family="' + MONO + '" font-size="' + fsV + '" font-weight="700" text-anchor="' + anchor + '">' + valStr + '</text>');
              parts.push('</g>');
            });
            function yOf2(el) { return yOf(el.val); } // 점은 실제 값 위치, 텍스트만 nudge

            // 콜아웃
            var coMeta = [];
            callouts.forEach(function (co, k) {
              var s = series[co.si || 0]; if (!s) return;
              var ax = xOf(co.xi), ay = yOf(s.points[co.xi]);
              var place = labelPlace(co.dir || "ur", ax, ay, co.title, co.sub);
              coMeta.push({ k: k, t: co.t, ax: ax, ay: ay });
              var rectX = place.anchor === "end" ? place.lx - place.tw - place.padX : place.lx - place.padX;
              var rectH = place.hasSub ? 58 : 36, rectY = place.ly - 25;
              parts.push('<g data-role="callout" data-i="' + k + '" style="opacity:0">');
              parts.push('<path data-role="conn" d="' + leaderPath(ax, ay, place) + '" stroke="var(--accent)' +
                '" stroke-width="1.5" fill="none" style="stroke-dasharray:600;stroke-dashoffset:600;"/>');
              parts.push('<circle cx="' + r1(ax) + '" cy="' + r1(ay) + '" r="6" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>');
              parts.push('<rect x="' + r1(rectX) + '" y="' + r1(rectY) + '" width="' + r1(place.tw + place.padX * 2) +
                '" height="' + rectH + '" rx="9" fill="var(--card)" fill-opacity="0.92" stroke="var(--border)" stroke-width="1"/>');
              parts.push('<text data-role="co-t" x="' + r1(place.lx) + '" y="' + r1(place.ly) + '" fill="var(--accent)' +
                '" font-size="22" font-weight="800" text-anchor="' + place.anchor + '">' + esc(co.title || "") + '</text>');
              if (place.hasSub)
                parts.push('<text data-role="co-t" x="' + r1(place.lx) + '" y="' + r1(place.ly + 26) +
                  '" fill="var(--muted)" font-size="20" font-weight="600" text-anchor="' + place.anchor + '">' + esc(co.sub || "") + '</text>');
              parts.push('</g>');
            });
            svg.innerHTML = parts.join("");

            if (typeof gsap === "undefined") return;
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });

            tl.fromTo(svg.querySelector('[data-role="grid"]'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.3);
            var areaEl = svg.querySelector('[data-role="area"]');
            if (areaEl) tl.fromTo(areaEl, { opacity: 0 }, { opacity: 0.12, duration: 0.8, ease: "power1.out" }, drawStart + 0.4);
            // 라인 draw (시리즈 stagger)
            svg.querySelectorAll('[data-role="linepath"]').forEach(function (lp, si) {
              tl.fromTo(lp, { strokeDashoffset: 3000 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, drawStart + si * 0.25);
            });
            // 끝점 라벨
            svg.querySelectorAll('[data-role="endlabel"]').forEach(function (g, si) {
              var at = drawStart + 1.3 + si * 0.12;
              tl.to(g, { opacity: 1, duration: 0.001 }, at);
              tl.fromTo(g.querySelector("circle"), { scale: 0, transformOrigin: "center center" },
                { scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
              tl.fromTo(g.querySelectorAll("text"), { opacity: 0, x: -8 },
                { opacity: 1, x: 0, duration: 0.3, stagger: 0.06, ease: "power2.out" }, at + 0.1);
              // 끝점 값 카운트업(gsap-utils 내재화 countUp). 라인이 끝점에 도달하는 순간 숫자가
              // 0→실제값으로 굴러오는 데이터-영상 모션.
              var ev = g.querySelector('[data-role="endval"]');
              if (window.__hf && window.__hf.countUp && ev && endLabels[si]) {
                window.__hf.countUp(tl, ev, 0, +endLabels[si].val, {
                  at: at, duration: 0.7, ease: "power2.out", format: fmtNum,
                  suffix: (yUnit ? " " + yUnit : "")
                });
              }
            });
            // 콜아웃
            coMeta.forEach(function (m) {
              var g = svg.querySelector('[data-role="callout"][data-i="' + m.k + '"]'); if (!g) return;
              tl.to(g, { opacity: 1, duration: 0.001 }, m.t);
              tl.fromTo(g.querySelector("circle"), { scale: 0, transformOrigin: r1(m.ax) + "px " + r1(m.ay) + "px" },
                { scale: 1, duration: 0.3, ease: "back.out(2)" }, m.t);
              tl.fromTo(g.querySelector('[data-role="conn"]'), { strokeDashoffset: 600 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, m.t + 0.3);
              tl.fromTo(g.querySelectorAll('[data-role="co-t"]'), { opacity: 0, x: -8 },
                { opacity: 1, x: 0, duration: 0.3, stagger: 0.08, ease: "power2.out" }, m.t + 0.5);
            });

            // 헤드라인 SplitText reveal (모션 내재화 hf-motion, 있으면).
            var __twk = root.querySelector('[data-role="takeaway"]');
            if (window.__hf && window.__hf.revealWords && __twk) window.__hf.revealWords(tl, __twk, 0.15, { stagger: 0.05 });
            window.__timelines["line"] = tl;
            var cid = (typeof __hfTimelineCompId !== "undefined" && __hfTimelineCompId)
              || (typeof __hfCompId !== "undefined" && __hfCompId)
              || (root && root.getAttribute("data-composition-id")) || "line";
            if (cid && cid !== "line") window.__timelines[cid] = tl;

            function parseJSON(s, fb) { try { return typeof s === "string" ? JSON.parse(s) : (s || fb); } catch (e) { return fb; } }
            function r1(n) { return Math.round(n * 10) / 10; }
            function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
            function fmtNum(n) { return (Math.round(n * 100) / 100).toString(); }
            function setSourceFooter(rt, vars) {
              var el = rt && rt.querySelector('[data-role="source"]'); if (!el) return;
              var p = [];
              if (vars.source) p.push("출처 · " + vars.source);
              if (vars.periodStart && vars.periodEnd)
                p.push(vars.periodStart + " ~ " + vars.periodEnd + (vars.interval ? " · " + vars.interval : ""));
              el.textContent = p.join("      ");
            }
            // 전각(한글/CJK)≈1em, ASCII≈0.55em, 공백≈0.3em 로 텍스트 폭을 추정(배경판 크기/
            // 가장자리 클램프용 — SVG 는 렌더 전 폭 측정이 어려워 보수적 추정).
            function estTextW(str, fs) {
              str = String(str == null ? "" : str); var w = 0;
              for (var i = 0; i < str.length; i++) {
                var c = str.charCodeAt(i);
                if (c === 32) w += fs * 0.3;
                else if (c < 0x2E80) w += fs * 0.58;
                else w += fs * 1.0;
              }
              return w;
            }
            function labelPlace(dir, ax, ay, title, sub) {
              var hasSub = !!(sub && String(sub).length), padX = 12;
              var tw = Math.max(estTextW(title, 22), hasSub ? estTextW(sub, 20) : 0);
              // dir 은 힌트. 실제 방향은 위치로 결정 — 오른쪽 절반의 점은 왼쪽으로 띄운다.
              var goLeft = ax > 1408 * 0.56 || dir === "ul" || dir === "dl";
              if (ax + 40 + tw + padX * 2 > 1408 - 8) goLeft = true;   // 오른쪽 공간 부족
              if (ax - 40 - tw - padX * 2 < 8) goLeft = false;          // 왼쪽 공간 부족
              var anchor = goLeft ? "end" : "start";
              var lx = goLeft ? ax - 40 : ax + 40;
              if (anchor === "start") lx = Math.min(lx, 1408 - 8 - padX - tw);
              else lx = Math.max(lx, 8 + padX + tw);
              var ly = clampY(ay - 52, hasSub);
              return { lx: lx, ly: ly, anchor: anchor, tw: tw, hasSub: hasSub, padX: padX };
            }
            function clampY(y, hasSub) {
              return Math.max(30, Math.min(BASE - (hasSub ? 40 : 16), y));
            }
            function leaderPath(ax, ay, place) {
              var tx = place.lx + (place.anchor === "end" ? 8 : -8);
              var midx = (ax + tx) / 2;
              return "M " + r1(ax) + " " + r1(ay) + " Q " + r1(midx) + " " + r1(place.ly - 18) + " " +
                r1(tx) + " " + r1(place.ly - 6);
            }
          })();
        </script>
      </div>
    </template>
  </body>
</html>
