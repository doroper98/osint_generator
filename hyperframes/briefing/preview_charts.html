<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- 자동 생성: bundle_to_video.py — preview_charts (synthetic)
         report_id: preview
         수정 금지. 변환기를 고치고 재실행할 것. -->
    <link rel="stylesheet" href="assets/noto_serif_kr.css" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/scene_kit.js"></script>
    <script src="assets/themes.js"></script>
<style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      :root {
        /* ink & brass — 에디토리얼 다큐 팔레트 (v0.35.2, AI-dashboard 미감 폐기) */
        --bg0: #121214;
        --bg1: #18181b;
        --surface: #1d1d21;
        --surface2: #222227;
        --hairline: rgba(236, 233, 226, 0.16);
        --hairline-soft: rgba(236, 233, 226, 0.08);
        --text: #ece9e2;
        --muted: #a39e92;
        --faint: #6e6a60;
        --accent: #c4a265;  /* brass */
        --oxide: #b25450;   /* muted oxblood — 대립/현재 */
        --sage: #7d9b76;    /* 동맹/상승 */
        --slate: #8d99ae;   /* 중립/전망 */
        --sienna: #b07a4a;  /* 대리세력/변동 */
        /* SceneKit SVG 토큰 */
        --sk-ink: #141416;
        --sk-node-fill: rgba(29, 29, 33, 0.94);
        --sk-hairline: rgba(236, 233, 226, 0.14);
        --sk-grid: #232328;
        --sk-region: rgba(163, 158, 146, 0.26);
        --sk-text: #ece9e2;
        --sk-muted: #a39e92;
        --sk-dim: #8b877d;
        /* 테마 시스템 토큰 (themes.js 프리셋이 오버라이드) */
        --bg-radial: #1c1c20;
        --bg-top: #141416;
        --bg-bottom: #111113;
        --plate-fill: rgba(18, 18, 20, 0.92);
        --plate-stroke: rgba(236, 233, 226, 0.13);
        --watermark-color: rgba(196, 162, 101, 0.05);
        --sceneno-color: rgba(236, 233, 226, 0.07);
        --cap-color: #f2efe8;
        --cap-shadow: 0 2px 20px rgba(0, 0, 0, 0.55);
        --scrim-rgb: 13, 13, 14;
        --vignette-color: rgba(8, 8, 9, 0.75);
        --grain-opacity: 0.045;
        --legend-fill: rgba(18, 18, 20, 0.6);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--bg0);
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        word-break: keep-all;
        overflow-wrap: anywhere;
        -webkit-font-smoothing: antialiased;
      }
      svg text { font-family: "Pretendard Variable", Pretendard, sans-serif; }
      .serif { font-family: "Noto Serif KR", "Pretendard Variable", serif; }

      /* ── SceneKit 공용 ── */
      .sk-plate-bg { fill: var(--plate-fill); stroke: var(--plate-stroke); stroke-width: 1; }
      .sk-leader { stroke: rgba(163, 158, 146, 0.5); stroke-width: 1.2; }
      .sk-halo { paint-order: stroke; stroke: #121214; stroke-width: 5px; stroke-linejoin: round; }

      /* ── 베이스맵 (실측 지형, ink 톤) ── */
      .bm-land { fill: #1a1a1f; stroke: rgba(236, 233, 226, 0.10); stroke-width: 1; }
      .bm-hi { fill: #232329; stroke: rgba(196, 162, 101, 0.28); stroke-width: 1.2; }
      .bm-label { fill: rgba(163, 158, 146, 0.42); font-size: 23px; font-weight: 700;
                  letter-spacing: 5px; }
      .net-anchor-leader { stroke: rgba(163, 158, 146, 0.55); stroke-width: 1.2;
                           stroke-dasharray: 3 5; }
      .net-mono { font-family: "Noto Serif KR", serif; }

      /* ── 배경 (무광 잉크 차콜 — 글로우/블롭/그리드 없음) ── */
      #bg { position: absolute; inset: 0; z-index: 0; overflow: hidden;
            background:
              radial-gradient(1700px 850px at 50% -12%, var(--bg-radial) 0%, transparent 62%),
              linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%); }
      #grain { position: absolute; inset: 0; opacity: var(--grain-opacity); mix-blend-mode: overlay; pointer-events: none; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
                  box-shadow: inset 0 0 300px 70px var(--vignette-color); }
      /* 자막 가독용 하단 스크림 — 스테이지(z10) 위, 자막(z35) 아래 */
      #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; z-index: 20;
               pointer-events: none;
               background: linear-gradient(180deg, rgba(var(--scrim-rgb), 0) 0%, rgba(var(--scrim-rgb), 0.5) 55%, rgba(var(--scrim-rgb), 0.72) 100%); }

      /* ── 상단 크롬 ── */
      #prog { position: absolute; top: 0; left: 0; width: 100%; height: 2px; z-index: 40;
              background: var(--accent); transform-origin: left center; }
      .topbar { position: absolute; top: 50px; left: 96px; right: 96px; height: 40px;
                display: flex; align-items: center; justify-content: space-between; z-index: 30; }
      .toprule { position: absolute; top: 112px; left: 96px; right: 96px; height: 1px;
                 background: var(--hairline-soft); z-index: 30; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand-mark { width: 10px; height: 10px; background: var(--accent);
                    transform: rotate(45deg); }
      .brand-name { font-size: 19px; font-weight: 700; letter-spacing: 6px; }
      .brand-sub { font-size: 14px; font-weight: 500; letter-spacing: 2.5px; color: var(--muted);
                   padding-left: 16px; border-left: 1px solid var(--hairline); }
      .topright { display: flex; align-items: center; gap: 22px;
                  font-size: 14px; font-weight: 500; letter-spacing: 2px; color: var(--muted); }
      .chip { display: inline-flex; align-items: center; gap: 9px; padding: 7px 16px;
              border: 1px solid var(--hairline); border-radius: 2px; background: transparent; }
      .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      #scene-chip { color: var(--text); }
      #scene-chip .dot { background: var(--accent); }

      /* ── 하단 자막 (lower-third) ── */
      .subwrap { position: absolute; left: 96px; bottom: 96px; right: 600px; z-index: 35;
                 display: flex; gap: 22px; align-items: flex-start; }
      .subbar { width: 3px; align-self: stretch; min-height: 56px;
                background: var(--accent); }
      #cap { font-size: 37px; line-height: 1.38; font-weight: 600; letter-spacing: -0.2px;
             color: var(--cap-color); max-width: 1160px;
             text-shadow: var(--cap-shadow); }
      .source { position: absolute; right: 96px; bottom: 100px; z-index: 35; text-align: right;
                font-size: 14px; line-height: 1.75; font-weight: 500; color: var(--faint);
                letter-spacing: 0.5px; }
      .source b { color: var(--muted); font-weight: 600; }

      /* ── 씬 공통 ── */
      #stage { position: absolute; inset: 0; z-index: 10; }
      .scene { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
      .scene-head { position: absolute; top: 150px; left: 96px; right: 320px; z-index: 6; }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
                color: var(--accent); margin-bottom: 18px; display: flex; align-items: center; gap: 14px; }
      .kicker::before { content: ""; width: 30px; height: 1px; background: var(--accent); opacity: 0.7; }
      .scene-title { font-family: "Noto Serif KR", "Pretendard Variable", serif;
                     font-size: 54px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); }
      /* 씬 번호: SceneKit.LAYOUT.sceneNo 영역과 일치 (충돌장이 보호) */
      .scene-no { position: absolute; top: 158px; right: 96px; font-size: 112px; font-weight: 250; z-index: 6;
                  font-family: "Noto Serif KR", serif; line-height: 1;
                  color: var(--sceneno-color); letter-spacing: 2px; }

      /* ── S1 타이틀 ── */
      .s1-kicker { font-size: 19px; font-weight: 600; letter-spacing: 7px; text-transform: uppercase;
                   color: var(--accent); }
      .s1-rule { width: 76px; height: 3px; background: var(--accent);
                 transform-origin: left center; margin: 32px 0 40px; }
      .headline { font-family: "Noto Serif KR", "Pretendard Variable", serif;
                  font-size: 94px; font-weight: 650; line-height: 1.22; letter-spacing: -1px; }
      .headline .em { color: var(--accent); }
      .deck { margin-top: 42px; font-size: 29px; line-height: 1.66; font-weight: 400;
              color: var(--muted); max-width: 1300px; letter-spacing: -0.2px; }
      .watermark { position: absolute; right: -10px; bottom: 48px; font-size: 196px; font-weight: 200;
                   font-family: "Noto Serif KR", serif;
                   color: var(--watermark-color); letter-spacing: -2px; line-height: 1.04;
                   text-align: right; pointer-events: none; }
      .line { display: block; overflow: hidden; }
      .word { display: inline-block; white-space: nowrap; }
      .ch { display: inline-block; will-change: transform, opacity; }

      /* ── 범례 (수평, 우상단 씬번호 아래 — 충돌장에 등록됨) ── */
      .legend-row { position: absolute; top: 300px; right: 96px; display: flex; gap: 14px;
                    align-items: center; z-index: 12; }
      .legend-row .item { display: flex; align-items: center; gap: 10px; font-size: 15px;
                          font-weight: 500; color: var(--muted); padding: 6px 13px;
                          border: 1px solid var(--hairline-soft); border-radius: 2px;
                          background: var(--legend-fill); letter-spacing: 1px; }
      .legend-row .swatch { width: 24px; height: 0; border-top-width: 2px; border-top-style: solid; }

      /* ── S4 프로필 카드 (키 플레이어) ── */
      .pcard { position: absolute; top: 326px; overflow: hidden;
               background: var(--surface);
               border: 1px solid var(--hairline-soft); border-radius: 8px; padding: 34px;
               box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38); }
      .pcard .ptop { position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0.9; }
      .pcard .phead { display: flex; align-items: center; gap: 22px; }
      .pcard .pmono { position: relative; width: 92px; height: 92px; flex: none;
                      display: flex; align-items: center; justify-content: center; }
      .pcard .pmono span { font-size: 28px; font-weight: 800; letter-spacing: 1px;
                           font-family: "Noto Serif KR", serif; }
      .pcard .pmono img { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; }
      .pcard .pring-svg { position: absolute; inset: 0; }
      .pcard .pname { font-size: 29px; font-weight: 700; letter-spacing: -0.5px; }
      .pcard .porg { margin-top: 7px; font-size: 15px; font-weight: 500; color: var(--muted);
                     letter-spacing: 1px; }
      .pcard .pline { margin-top: 30px; font-size: 20px; line-height: 1.58; font-weight: 500;
                      color: #cdc9bf; min-height: 94px; }
      .pcard .pgauge { position: absolute; left: 34px; right: 34px; bottom: 30px; }
      .pcard .glabels { display: flex; justify-content: space-between; font-size: 13px;
                        font-weight: 600; color: var(--faint); letter-spacing: 1.5px; }
      .pcard .gtag { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--faint);
                     border: 1px solid var(--hairline-soft); border-radius: 2px; padding: 2px 9px; }
      .pcard .gtrack { position: relative; margin-top: 12px; height: 6px; border-radius: 3px;
                       background: linear-gradient(90deg, rgba(141,153,174,0.35), rgba(196,162,101,0.3), rgba(178,84,80,0.4)); }
      .pcard .gdot { position: absolute; top: -5px; left: -8px; width: 16px; height: 16px;
                     border-radius: 50%; border: 2.5px solid var(--sk-ink); }
      .pcard .gstance { margin-top: 14px; font-size: 16px; font-weight: 700; letter-spacing: 1px; }

      /* ── S6 마켓 카드 ── */
      .mcard { position: absolute; top: 318px; width: 360px; height: 430px; overflow: hidden;
               background: var(--surface);
               border: 1px solid var(--hairline-soft); border-radius: 8px; padding: 34px;
               box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38); }
      .mcard .mtop { position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0.9; }
      .mcard .mhead { display: flex; align-items: center; justify-content: space-between; }
      .mcard .mname { font-size: 21px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
      .mcard .mtag { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; padding: 4px 10px;
                     border: 1px solid; border-radius: 2px; }
      .mcard .mpct { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; margin-top: 16px;
                     font-variant-numeric: tabular-nums; white-space: nowrap; }
      .mcard .msub { position: absolute; bottom: 30px; left: 34px; font-size: 16px; font-weight: 500;
                     color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
      .mcard svg { position: absolute; left: 34px; right: 34px; bottom: 78px; width: 292px; height: 150px; }

      /* ── 바 패널 (전망/목표가 비교 — auto 컴포지션) ── */
      .barpanel { position: absolute; top: 330px; background: var(--surface);
                  border: 1px solid var(--hairline-soft); border-radius: 8px; padding: 36px 40px;
                  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38); }
      .barpanel .bp-title { font-size: 23px; font-weight: 700; margin-bottom: 28px;
                            display: flex; align-items: baseline; justify-content: space-between; }
      .barpanel .bp-unit { font-size: 14px; font-weight: 500; color: var(--faint); letter-spacing: 1px; }
      .barpanel .bp-row { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
      .barpanel .bp-label { width: 175px; flex: none; font-size: 17px; font-weight: 600;
                            color: var(--muted); letter-spacing: 0.3px; }
      .barpanel .bp-track { flex: 1; height: 16px; border-radius: 3px;
                            background: rgba(236, 233, 226, 0.05); overflow: hidden; }
      .barpanel .bp-fill { height: 100%; border-radius: 3px; transform-origin: left center; }
      .barpanel .bp-val { width: 120px; flex: none; text-align: right; font-size: 21px; font-weight: 800;
                          font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
      .barpanel .bp-note { margin: 4px 0 0 193px; font-size: 13px; color: var(--faint); }

      /* ── 시그널 카드 (전방 관측 신호 — auto 컴포지션) ── */
      .sigcard { position: absolute; top: 340px; width: 318px; height: 360px; overflow: hidden;
                 background: var(--surface); border: 1px solid var(--hairline-soft);
                 border-radius: 8px; padding: 26px; }
      .sigcard .sg-when { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
                          color: var(--accent); border: 1px solid var(--hairline);
                          border-radius: 2px; padding: 4px 10px; }
      .sigcard .sg-name { margin-top: 18px; font-size: 20px; font-weight: 700; line-height: 1.4; }
      .sigcard .sg-desc { margin-top: 14px; font-size: 15px; line-height: 1.6; color: var(--muted); }
      .sigcard .sg-tag { position: absolute; left: 26px; bottom: 22px; font-size: 13px;
                         font-weight: 700; color: var(--oxide); letter-spacing: 1px; }

      /* ── 인용 인터스티셜 (auto 컴포지션) ── */
      .iquote { position: absolute; inset: 0; }
      .iquote .iq-rule { position: absolute; top: 358px; left: 200px; width: 76px; height: 3px;
                         background: var(--accent); transform-origin: left center; }
      .iquote .iq-text { position: absolute; top: 408px; left: 200px; right: 240px;
                         font-family: "Noto Serif KR", "Pretendard Variable", serif;
                         font-size: 66px; font-weight: 550; line-height: 1.52;
                         letter-spacing: -0.5px; color: var(--text); }
      .iquote .iq-text .em { color: var(--accent); }
      .iquote .iq-src { position: absolute; top: 770px; left: 200px; font-size: 18px;
                        font-weight: 600; color: var(--faint); letter-spacing: 1.5px; }

      /* ── S7 클로징 ── */
      .quote { position: absolute; top: 322px; left: 96px; right: 580px;
               font-family: "Noto Serif KR", "Pretendard Variable", serif;
               font-size: 54px; font-weight: 500; line-height: 1.5; letter-spacing: -0.5px; color: var(--text); }
      .quote .em { color: var(--accent); }
      .closing { position: absolute; left: 96px; top: 672px; right: 660px; font-size: 24px;
                 line-height: 1.7; font-weight: 400; color: var(--muted); }
      .confbox { position: absolute; right: 96px; top: 330px; width: 400px;
                 background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: 8px;
                 padding: 32px; }
      .confbox .clabel { font-size: 14px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
                         color: var(--muted); }
      .confbox .cscore { font-size: 70px; font-weight: 800; color: var(--accent); letter-spacing: -1px;
                         font-variant-numeric: tabular-nums; margin: 8px 0 18px; }
      .confbox .ctrack { height: 6px; border-radius: 3px; background: rgba(236, 233, 226, 0.07); overflow: hidden; }
      .confbox .cfill { height: 100%; width: 32%; border-radius: 3px;
                        background: linear-gradient(90deg, var(--oxide), var(--accent)); transform-origin: left; }
      .confbox .cdesc { margin-top: 18px; font-size: 15px; line-height: 1.65; color: var(--faint); }
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-composition-id="autobrief" data-start="0"
         data-duration="45.0" data-track-index="0" data-width="1920" data-height="1080">
      <div id="bg">
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/></filter>
          <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
        </svg>
        <div id="vignette"></div>
      </div>
      <div id="prog"></div>
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name" id="brand-name"></span>
          <span class="brand-sub" id="brand-sub"></span>
        </div>
        <div class="topright">
          <span class="chip" id="scene-chip"><span class="dot"></span><span id="scene-label"></span></span>
          <span id="top-date"></span>
        </div>
      </div>
      <div class="toprule"></div>
      <div id="stage"></div>
      <div id="scrim"></div>
      <div class="subwrap"><div class="subbar"></div><div id="cap"></div></div>
      <div class="source"><span id="source-line1"></span><br/><span id="source-line2"></span></div>
    </div>

    <script>
/* auto_builder — 번들 주도 제네릭 브리핑 컴포지션 빌더 (v0.36.0, 옵션 C 1차)
 *
 * window.BRIEFING_DATA(변환기 bundle_to_video.py 가 생성)를 읽어 씬을 조건부로
 * 조립한다. 데이터에 있는 씬만 만들어진다 — 지도가 없으면 지도 씬이 없다.
 *
 * DATA 스키마:
 *   meta:   { brand, sub, date, sourceLine1, sourceLine2 }
 *   themeVars: { "--accent": "#..", ... }   // 번들 테마 토큰 → CSS 변수 오버라이드
 *   colors: { phase:{past,crack,present,future}, gradStops:[[off,color]..],
 *             market:{up,down,vol,flat}, marketTag:{...} }
 *   total:  영상 총 길이(초) — root data-duration 에 주입
 *   scenes: [{ type:"title"|"ladder"|"versus"|"markets"|"closing",
 *              t0, t1, no, chip, head?{kicker,title}, data:{...} }]
 *   cues:   [{ t, text }]
 *
 * 계약: window.__timelines[<root data-composition-id>] 등록, 결정론.
 */
(function () {
  "use strict";
  const SK = window.SceneKit;
  const D = window.BRIEFING_DATA;
  const root = document.getElementById("root");

  // ── 총 길이/테마 주입 (hyperframes 가 attribute 를 읽기 전, 빌드 시점) ──
  root.setAttribute("data-duration", String(D.total));
  // 테마: 프리셋(themes.js) 우선, 그 위에 개별 변수 오버라이드
  if (window.SK_THEMES && D.themeId && window.SK_THEMES[D.themeId])
    for (const k in window.SK_THEMES[D.themeId].vars)
      document.documentElement.style.setProperty(k, window.SK_THEMES[D.themeId].vars[k]);
  if (D.themeVars)
    for (const k in D.themeVars) document.documentElement.style.setProperty(k, D.themeVars[k]);

  // 의미색 — 적용된 테마 변수에서 파생 (D.colors 로 강제 오버라이드 가능)
  const cssv = getComputedStyle(document.documentElement);
  const cv = (n, fb) => (cssv.getPropertyValue(n) || "").trim() || fb;
  const ACCENT = cv("--accent", "#c4a265");
  const OXIDE = cv("--oxide", "#b25450");
  const SAGE = cv("--sage", "#7d9b76");
  const SLATE = cv("--slate", "#8d99ae");
  const FAINT = cv("--faint", "#6e6a60");
  const COLORS = D.colors || {
    phase: { past: FAINT, crack: ACCENT, present: OXIDE, future: SLATE },
    gradStops: [["0", FAINT], ["0.62", OXIDE], ["1", SLATE]],
    market: { up: SAGE, down: OXIDE, vol: ACCENT, flat: SLATE },
    marketTag: { up: "상승", down: "하락", vol: "변동", flat: "보합" },
  };

  // ── 크롬 텍스트 ──
  const put = (id, text) => {
    const n = document.getElementById(id);
    if (n && text) n.textContent = text;
  };
  put("brand-name", D.meta.brand);
  put("brand-sub", D.meta.sub);
  put("top-date", D.meta.date);
  put("source-line1", D.meta.sourceLine1);
  const src2 = document.getElementById("source-line2");
  if (src2) src2.innerHTML = D.meta.sourceLine2 || "";

  const stage = document.getElementById("stage");

  // ── 씬 골격 생성 ──
  function sceneShell(sc, idx) {
    const sec = document.createElement("section");
    sec.className = "scene";
    sec.id = "sc" + idx;
    if (sc.head) {
      const head = document.createElement("div");
      head.className = "scene-head";
      head.innerHTML =
        `<div class="kicker">${sc.head.kicker}</div>` +
        `<div class="scene-title">${sc.head.title}</div>`;
      sec.appendChild(head);
    }
    if (sc.no) {
      const no = document.createElement("div");
      no.className = "scene-no";
      no.textContent = sc.no;
      sec.appendChild(no);
    }
    stage.appendChild(sec);
    return sec;
  }

  // ── 마스터 타임라인 ──
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  const TOTAL = D.total;

  tl.fromTo("#prog", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
  tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.025, duration: TOTAL, ease: "none" }, 0);

  const sceneIn = (sel, t) =>
    tl.fromTo(sel, { autoAlpha: 0, y: 26, scale: 0.992 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" }, t);
  const sceneOut = (sel, t) =>
    tl.to(sel, { autoAlpha: 0, y: -18, duration: 0.6, ease: "power2.in" }, t);
  const chip = (t, label) =>
    tl.call(() => { document.getElementById("scene-label").textContent = label; }, [], t);
  const draw = (el, at, dur, ease) =>
    tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
  const headIn = (sec, t) => {
    const h = sec.querySelector(".scene-head");
    if (h) tl.from(h, { opacity: 0, y: 18, duration: 0.7 }, t + 0.1);
  };

  // 타임라인 변형 공용 연출
  function pulsePresent(built, steps, at) {
    const pi = steps.findIndex((s) => s.phase === "present");
    if (pi >= 0)
      tl.fromTo(built.items[pi].marker, { scale: 1 },
        { scale: 1.35, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, at);
  }
  function animateTimeline(built, sc, riserDur) {
    const t0 = sc.t0;
    sceneIn("#" + sc._secId, t0);
    headIn(document.getElementById(sc._secId), t0);
    if (built.riser) draw(built.riser, t0 + 0.4, riserDur, "power2.inOut");
    built.items.forEach((it, i) => {
      const at = t0 + 0.7 + i * 0.36;
      tl.to(it.marker, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
      tl.fromTo(it.marker, { scale: 0.4, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.5, ease: "back.out(2)" }, at);
      if (it.leader) draw(it.leader, at + 0.12, 0.3, "power1.out");
      tl.fromTo(it.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.45 }, at + 0.22);
    });
    pulsePresent(built, sc.data.steps, t0 + 4.4);
    sceneOut("#" + sc._secId, sc.t1 - 0.5);
  }

  // ── 씬 타입별 빌더 + 연출 ──
  const BUILDERS = {
    title(sc, sec) {
      const d = sc.data;
      sec.innerHTML +=
        `<div class="watermark">${(d.watermark || "").replace(/\n/g, "<br/>")}</div>` +
        `<div style="position:absolute; top:300px; left:96px; right:96px;">` +
        `<div class="s1-kicker"></div><div class="s1-rule"></div>` +
        `<div class="headline"></div><div class="deck"></div></div>`;
      sec.querySelector(".s1-kicker").textContent = d.kicker;
      sec.querySelector(".deck").textContent = d.deck;
      const chs = SK.splitChars(sec.querySelector(".headline"), d.lines);
      const t0 = sc.t0;
      sceneIn(sec, t0);
      tl.from(sec.querySelector(".s1-kicker"), { opacity: 0, y: 16, duration: 0.7 }, t0 + 0.3);
      tl.fromTo(sec.querySelector(".s1-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power4.out" }, t0 + 0.6);
      tl.from(chs, { yPercent: 115, opacity: 0, duration: 0.9, stagger: 0.02, ease: "power4.out" }, t0 + 0.8);
      tl.from(sec.querySelector(".deck"), { opacity: 0, y: 20, duration: 0.9 }, t0 + 1.9);
      sceneOut(sec, sc.t1 - 0.5);
    },

    ladder(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const lad = SK.buildStepTimeline(svg, sc.data.steps, {
        x0: 250, x1: 1640, yBottom: 778, yTop: 360,
        colors: COLORS.phase,
        gradId: "ladgrad-auto",
        gradStops: COLORS.gradStops,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      draw(lad.riser, t0 + 0.5, 3.0, "power2.inOut");
      lad.items.forEach((it, i) => {
        const at = t0 + 0.8 + i * 0.42;
        tl.to(it.marker, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
        tl.fromTo(it.marker, { scale: 0.4, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.5, ease: "back.out(2)" }, at);
        if (it.leader) draw(it.leader, at + 0.12, 0.3, "power1.out");
        tl.fromTo(it.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.45 }, at + 0.22);
      });
      const pi = sc.data.steps.findIndex((s) => s.phase === "present");
      if (pi >= 0)
        tl.fromTo(lad.items[pi].marker, { scale: 1 },
          { scale: 1.35, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
          t0 + 4.6);
      sceneOut(sec, sc.t1 - 0.5);
    },

    axis(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const ax = SK.buildAxisTimeline(svg, sc.data.steps, {
        x0: 240, x1: 1660, y: 586, colors: COLORS.phase,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      draw(ax.riser, t0 + 0.4, 1.6, "power2.inOut");
      ax.items.forEach((it, i) => {
        const at = t0 + 0.7 + i * 0.4;
        tl.to(it.marker, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
        tl.fromTo(it.marker, { scale: 0.4, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.5, ease: "back.out(2)" }, at);
        if (it.leader) draw(it.leader, at + 0.12, 0.3, "power1.out");
        tl.fromTo(it.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.45 }, at + 0.22);
      });
      const pi = sc.data.steps.findIndex((s) => s.phase === "present");
      if (pi >= 0)
        tl.fromTo(ax.items[pi].marker, { scale: 1 },
          { scale: 1.35, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
          t0 + 4.4);
      sceneOut(sec, sc.t1 - 0.5);
    },

    serpentine(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const sp = SK.buildSerpentineTimeline(svg, sc.data.steps, { colors: COLORS.phase });
      animateTimeline(sp, sc, 2.4);
    },

    vertical(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const vt = SK.buildVerticalTimeline(svg, sc.data.steps, { colors: COLORS.phase });
      animateTimeline(vt, sc, 2.0);
      vt.items.forEach((it, i) => {
        tl.to(it.dateEl, { opacity: 1, duration: 0.4 }, sc.t0 + 0.7 + i * 0.4);
      });
    },

    metro(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const mt = SK.buildMetroTimeline(svg, sc.data.steps, { colors: COLORS.phase });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      mt.segs.forEach((sg, i) => draw(sg, t0 + 0.5 + i * 0.28, 0.5, "power1.inOut"));
      mt.items.forEach((it, i) => {
        const at = t0 + 0.6 + i * 0.32;
        tl.to(it.marker, { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
        tl.fromTo(it.marker, { scale: 0.4, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.5, ease: "back.out(2)" }, at);
        if (it.leader) draw(it.leader, at + 0.12, 0.3, "power1.out");
        tl.fromTo(it.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.45 }, at + 0.22);
      });
      pulsePresent(mt, sc.data.steps, t0 + 4.4);
      sceneOut(sec, sc.t1 - 0.5);
    },

    slope(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const sl = SK.buildSlopeChart(svg, sc.data, { accent: ACCENT });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      sl.items.forEach((it, i) => {
        const at = t0 + 0.6 + i * 0.3;
        tl.fromTo(it.plates[0].g, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at);
        tl.to(it.dots[0], { opacity: 1, duration: 0.25 }, at + 0.1);
        tl.to(it.line, { opacity: it.hi ? 1 : 0.7, duration: 0.2 }, at + 0.2);
        draw(it.line, at + 0.25, 0.8, "power2.inOut");
        tl.to(it.dots[1], { opacity: 1, duration: 0.25 }, at + 1.0);
        tl.fromTo(it.plates[1].g, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at + 1.05);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    donut(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const dn = SK.buildDonut(svg, sc.data.items, {
        colors: [ACCENT, SLATE, SAGE, OXIDE, FAINT],
        centerLabel: sc.data.centerLabel,
        centerValue: sc.data.centerValue,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      dn.segs.forEach((sg, i) => {
        const at = t0 + 0.5 + i * 0.3;
        tl.to(sg.path, { opacity: 0.95, duration: 0.2 }, at);
        draw(sg.path, at, 0.9, "power2.inOut");
        if (sg.leader) draw(sg.leader, at + 0.7, 0.3, "power1.out");
        tl.fromTo(sg.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at + 0.8);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    stacked(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const st = SK.buildStackedBars(svg, sc.data, {
        palette: [ACCENT, SLATE, SAGE, cv("--sienna", "#b07a4a"), OXIDE],
      });
      const lg = document.createElement("div");
      lg.className = "legend-row";
      st.segNames.forEach((n) => {
        const item = document.createElement("div");
        item.className = "item";
        const sw = document.createElement("div");
        sw.className = "swatch";
        sw.style.borderTopColor = st.colorOf(n);
        sw.style.borderTopStyle = "solid";

        const sp = document.createElement("span");
        sp.textContent = n;
        item.appendChild(sp);
        lg.appendChild(item);

        tl.to(row.totalEl, { opacity: 1, duration: 0.4 }, at + row.segRects.length * 0.32 + 0.25);

      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    scatter(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const sct = SK.buildScatter(svg, sc.data, {
        accent: ACCENT, hiColor: OXIDE, diagonal: !!sc.data.diagonal,

      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      tl.from(sec.querySelector(".sct-axis"), { opacity: 0, duration: 0.6 }, t0 + 0.3);
      if (sct.diag) {
        tl.to(sct.diag, { opacity: 0.7, duration: 0.2 }, t0 + 0.7);
        draw(sct.diag, t0 + 0.75, 1.0, "power2.inOut");
      }
      sct.items.forEach((it, i) => {
        const at = t0 + 1.1 + i * 0.2;
        tl.to(it.g, { opacity: 1, duration: 0.3 }, at);
        tl.fromTo(it.g, { scale: 0.2, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.55, ease: "back.out(2.4)" }, at);
        if (it.plate) tl.fromTo(it.plate.g, { opacity: 0 }, { opacity: 1, duration: 0.35 }, at + 0.18);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    heatmap(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const hasNeg = sc.data.values.some((row) => row.some((v) => v < 0));
      const hm = SK.buildHeatmap(svg, sc.data, { pos: hasNeg ? SAGE : ACCENT, neg: OXIDE });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      // 대각 웨이브 리빌
      hm.cells.forEach((cell) => {
        tl.to(cell.g, { opacity: 1, duration: 0.45, ease: "power1.out" },
          t0 + 0.55 + (cell.ri + cell.ci) * 0.09);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    gantt(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const gn = SK.buildGantt(svg, sc.data, { colors: COLORS.phase, accent: ACCENT });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      gn.bars.forEach((bar, i) => {
        const at = t0 + 0.6 + i * 0.4;
        tl.to(bar.lab, { opacity: 1, duration: 0.4 }, at);
        tl.to(bar.g, { opacity: 1, duration: 0.2 }, at + 0.1);
        tl.fromTo(bar.g, { scaleX: 0, svgOrigin: bar.g.dataset.ox + " 540" },
          { scaleX: 1, duration: 0.7, ease: "power2.out" }, at + 0.1);
        tl.to(bar.dt, { opacity: 1, duration: 0.35 }, at + 0.7);
      });
      if (gn.todayG) tl.to(gn.todayG, { opacity: 1, duration: 0.5 }, t0 + 0.5);
      sceneOut(sec, sc.t1 - 0.5);
    },

    quote(sc, sec) {
      const d = sc.data;
      sec.innerHTML +=
        `<div class="iquote">` +
        `<div class="iq-rule"></div>` +
        `<div class="iq-text"></div>` +
        `<div class="iq-src">${d.source || ""}</div>` +
        `</div>`;
      const chs = SK.splitChars(sec.querySelector(".iq-text"), d.segments);
      const t0 = sc.t0;
      sceneIn(sec, t0);
      tl.fromTo(sec.querySelector(".iq-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power4.out" }, t0 + 0.3);
      tl.from(chs, { opacity: 0, y: 16, duration: 0.7, stagger: 0.014, ease: "power3.out" }, t0 + 0.5);
      tl.from(sec.querySelector(".iq-src"), { opacity: 0, duration: 0.6 }, t0 + 1.8);
      sceneOut(sec, sc.t1 - 0.5);
    },

    bars(sc, sec) {
      const wrap = document.createElement("div");
      sec.appendChild(wrap);
      const panels = SK.buildBarPanels(wrap, sc.data.panels, { accent: ACCENT });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      panels.forEach((pn, pi) => {
        tl.from(pn.card, { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, t0 + 0.5 + pi * 0.3);
        pn.rows.forEach((row, ri) => {
          const at = t0 + 0.9 + pi * 0.3 + ri * 0.22;
          tl.fromTo(row.fill, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, at);
          SK.counter(tl, row.valEl, row.value,
            (v) => (Number.isInteger(row.value) ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(1)) + row.unit,
            at, 0.9);
        });
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    candle(sc, sec) {
      const svg = SK.svgEl("svg", { viewBox: "0 0 1920 1080", style: "position:absolute; inset:0;" });
      sec.appendChild(svg);
      const ch = SK.buildCandleChart(svg, sc.data.ohlc, {
        x0: 180, x1: 1640, y0: 320, y1: 820,
        up: SAGE,
        down: OXIDE,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      tl.to(ch.candles, { opacity: 1, duration: 0.25, stagger: 0.022, ease: "power1.out" }, t0 + 0.5);
      tl.fromTo(ch.candles, { y: 14 }, { y: 0, duration: 0.4, stagger: 0.022, ease: "power2.out" }, t0 + 0.5);
      tl.to(ch.lastLine, { opacity: 0.85, duration: 0.5 }, t0 + 2.4);
      tl.fromTo(ch.lastPlate.g, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0 + 2.5);
      sceneOut(sec, sc.t1 - 0.5);
    },

    signals(sc, sec) {
      const items = sc.data.items;
      const cw = 318;
      const gap = 26;
      const total = items.length * cw + (items.length - 1) * gap;
      const startX = (1920 - total) / 2;
      const cards = items.map((it, i) => {
        const card = document.createElement("div");
        card.className = "sigcard";
        card.style.left = (startX + i * (cw + gap)) + "px";
        card.innerHTML =
          `<span class="sg-when">${it.when}</span>` +
          `<div class="sg-name">${it.name}</div>` +
          `<div class="sg-desc">${it.desc}</div>` +
          (it.unverified ? `<div class="sg-tag">&lt;미검증&gt; 관측 대기</div>` : "");
        sec.appendChild(card);
        return card;
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      cards.forEach((c, i) => {
        tl.from(c, { opacity: 0, y: 44, duration: 0.65, ease: "power3.out" }, t0 + 0.5 + i * 0.18);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    versus(sc, sec) {
      const wrap = document.createElement("div");
      sec.appendChild(wrap);
      const cards = SK.buildProfileCards(wrap, sc.data.cards, {
        cardW: sc.data.cards.length <= 2 ? 560 : 390,
        gap: 64,
        gauge: sc.data.axis,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      cards.forEach((p, i) => {
        const at = t0 + 0.6 + i * 0.4;
        tl.from(p.card, { opacity: 0, y: 44, duration: 0.7, ease: "power3.out" }, at);
        draw(p.ring, at + 0.25, 1.0, "power2.inOut");
        tl.from(p.lineEl, { opacity: 0, y: 12, duration: 0.5 }, at + 0.45);
        tl.fromTo(p.dot, { x: 0.5 * (560 - 68), opacity: 0 },
          { x: p.dotX, opacity: 1, duration: 0.9, ease: "power3.inOut" }, at + 1.0);
        tl.from(p.stanceEl, { opacity: 0, duration: 0.45 }, at + 1.6);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    markets(sc, sec) {
      const wrap = document.createElement("div");
      sec.appendChild(wrap);
      const cards = SK.buildMarketCards(wrap, sc.data.markets, {
        colorByKind: COLORS.market,
        tagByKind: COLORS.marketTag,
      });
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      cards.forEach((m, i) => {
        const at = t0 + 0.6 + i * 0.35;
        tl.from(m.card, { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, at);
        tl.to(m.area, { opacity: 1, duration: 0.8 }, at + 0.3);
        draw(m.line, at + 0.2, 1.3);
        tl.to(m.end, { opacity: 1, duration: 0.3 }, at + 1.3);
        SK.counter(tl, m.pctEl, m.data.pct,
          (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%", at + 0.3, 1.2);
      });
      sceneOut(sec, sc.t1 - 0.5);
    },

    closing(sc, sec) {
      const d = sc.data;
      sec.innerHTML +=
        `<div class="quote"></div><div class="closing"></div>` +
        `<div class="confbox"><div class="clabel">신뢰도</div>` +
        `<div class="cscore">0.00</div>` +
        `<div class="ctrack"><div class="cfill"></div></div>` +
        `<div class="cdesc"></div></div>`;
      const quoteChs = SK.splitChars(sec.querySelector(".quote"), d.quote);
      sec.querySelector(".closing").textContent = d.closing;
      sec.querySelector(".cdesc").textContent = d.confidence.desc;
      const fill = sec.querySelector(".cfill");
      fill.style.width = Math.round(d.confidence.score * 100) + "%";
      const t0 = sc.t0;
      sceneIn(sec, t0);
      headIn(sec, t0);
      tl.from(quoteChs, { opacity: 0, y: 18, duration: 0.7, stagger: 0.012, ease: "power3.out" }, t0 + 0.4);
      tl.from(sec.querySelector(".closing"), { opacity: 0, y: 20, duration: 0.8 }, t0 + 1.6);
      tl.from(sec.querySelector(".confbox"), { opacity: 0, x: 30, duration: 0.7 }, t0 + 1.2);
      SK.counter(tl, sec.querySelector(".cscore"), d.confidence.score,
        (v) => v.toFixed(2), t0 + 1.6, 1.2, "power2.out");
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, t0 + 1.6);
    },
  };

  // ── 씬 조립 ──
  const sections = [];
  D.scenes.forEach((sc, i) => {
    const sec = sceneShell(sc, i);
    sc._secId = sec.id;
    sections.push(sec);
    gsap.set(sec, { autoAlpha: 0 });
    chip(sc.t0, sc.chip);
    BUILDERS[sc.type](sc, sec);
  });

  // pulse-ring (씬 빌드 후 존재 확정) — 시킹 안전 반복
  if (document.querySelector(".pulse-ring"))
    tl.to(".pulse-ring", { scale: 2.2, opacity: 0, duration: 1.5,
      repeat: Math.max(1, Math.floor(TOTAL / 1.5) - 2), ease: "sine.out",
      transformOrigin: "50% 50%" }, 0);

  // ── 자막 ──
  const cap = document.getElementById("cap");
  const subwrap = document.querySelector(".subwrap");
  gsap.set(subwrap, { autoAlpha: 0 });
  D.cues.forEach((c, i) => {
    if (i === 0) {
      tl.call(() => { cap.textContent = c.text; }, [], c.t - 0.1);
      tl.fromTo(subwrap, { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.55, overwrite: "auto" }, c.t);
    } else {
      tl.to(subwrap, { autoAlpha: 0, x: -16, duration: 0.25, overwrite: "auto" }, c.t - 0.3);
      tl.call(() => { cap.textContent = c.text; }, [], c.t - 0.05);
      tl.fromTo(subwrap, { x: 16 }, { autoAlpha: 1, x: 0, duration: 0.3, overwrite: "auto" }, c.t);
    }
  });

  window.__timelines[root.dataset.compositionId] = tl;
})();

    </script>
  </body>
