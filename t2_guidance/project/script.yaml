schema_version: 1
title: 가이던스 스케치
subtitle: 인텔 분기 매출 · 4분기 회사 전망과 시장 예상
date: 2026.10.30
scenes:
- id: guide
  sentences:
  - date: '2026.09'
    role: intro
    text: 인텔은 3분기 실적과 함께 다음 분기 전망도 내놓았습니다.
    tts: 인텔은 삼분기 실적과 함께 다음 분기 전망도 내놓았습니다.
    emphasis:
    - 다음 분기 전망
    sources:
    - series:INTC_REV_Q
  - date: '2026.10'
    role: intro
    text: 그래서 4분기 자리에 회사가 제시한 매출 범위를 빈 막대로 띄워 보겠습니다.
    tts: 그래서 사분기 자리에 회사가 제시한 매출 범위를 빈 막대로 띄워 보겠습니다.
    emphasis:
    - 매출 범위
    sources:
    - series:INTC_GUIDE_REV_LO
  - date: '2026.10'
    text: 회사 전망은 150억 달러에서 160억 달러 사이입니다.
    tts: 회사 전망은 백오십억 달러에서 백육십억 달러 사이입니다.
    emphasis:
    - 회사 전망
    sources:
    - series:INTC_GUIDE_REV_LO
    - series:INTC_GUIDE_REV_HI
  - date: '2026.10'
    role: outro
    text: 반면 시장 예상은 171억 달러로, 회사 범위보다 위에 있습니다.
    tts: 반면 시장 예상은 백칠십일억 달러로, 회사 범위보다 위에 있습니다.
    emphasis:
    - 시장 예상
    sources:
    - series:INTC_REV_Q_EST
