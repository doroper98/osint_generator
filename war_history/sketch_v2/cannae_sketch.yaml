# 전쟁사 화면 스케치 spec — 칸나이 전투(기원전 216, 제2차 포에니 전쟁). v7.4.0 전쟁사 W4(back_and_forth D-0600 §6)
# 사실·연출 값만. 화면 수치는 rules/video_rules.yaml sketch.war. 실행: python -m sketch.war projects/cannae_sketch
# 부대 배치·이동 = 폴리비오스 『역사』 III.113~117(Paton 영역 1922, archive.org polybiushistorie0000wrpa_v3i1) 서술을 옮긴 개략.
#   로마군: 남쪽을 보고 섬, 오른쪽 날개 = 강가의 로마 기병, 가운데 보병(대열을 좁고 깊게), 왼쪽 날개 = 동맹 기병, 앞에 경보병(III.113)
#   카르타고군: 북쪽을 보고 섬, 왼쪽 = 강가의 히스파니아·켈트 기병, 아프리카 중보병 절반, 히스파니아·켈트 보병(가운데를 앞으로 내민 초승달),
#   아프리카 중보병 나머지 절반, 오른쪽 = 누미디아 기병(III.113). 기병 충돌 → 로마 기병 패주(III.115) → 로마 보병이 초승달을 밀어 오목해짐 →
#   아프리카 보병이 양쪽에서 안으로 돌아섬 → 하스드루발 기병이 뒤를 침(III.115~116)
# 전장 위치 = 강 북안(Smith 1856 'CANNAE' — 스윈번이 본 강 굽이 안쪽). 위치는 학설이 갈린다 → 화면에 '개략'. 크기·간격은 축척이 아니다
