    text: "칸나이에서 로마와 카르타고가 벌인 싸움은 이렇게 끝났다. 이긴 쪽도 진 쪽도 뚜렷한 용기를 보였다."
    original: "Such was the outcome of the battle at Cannae between the Romans and Carthaginians, a battle in which both the victors and the vanquished displayed conspicuous bravery."
