<!DOCTYPE html>
<!-- v7.4.0 전쟁사 구상 컷 B — 높이맵 메시(텍스처 = 릴리프 음영) + 부대 박스(v2 입체·대열 기둥·병종 빌보드)·강 띠·지명 빌보드. 수치는 /scene/scene.json(rules sketch.war.terrain3d) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#ov{position:absolute;left:0;top:0}</style></head>
<body><canvas id="ov"></canvas>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const S = await (await fetch('/scene/scene.json')).json();
const H = await (await fetch('/scene/height.json')).json();
const W = S.width, Ht = S.height;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
// v7.4.0 D-0630 §1(UF-260) — 마감(finish): 2배 이상으로 그려 줄여 쓴다(가장자리 계단 없앰). 줄이기는 엔진(LANCZOS, engine.stage_terrain3d.downsample_frames)
const F = S.finish || { supersample: 1 };
renderer.setSize(W, Ht); renderer.setPixelRatio(F.supersample);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('ov'));
const scene = new THREE.Scene();
scene.background = new THREE.Color(S.sky);
scene.fog = new THREE.Fog(S.sky, S.fog[0], S.fog[1]);
const cam = new THREE.PerspectiveCamera(S.camera.fov, W / Ht, 1, 1e6);

// 지형 — 격자 H.nx × H.ny, 가로 S.size_m[0] m · 세로 S.size_m[1] m, 높이(m) × 과장
const geo = new THREE.PlaneGeometry(S.size_m[0], S.size_m[1], H.nx - 1, H.ny - 1);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
for (let j = 0; j < H.ny; j++) for (let i = 0; i < H.nx; i++) pos.setY(j * H.nx + i, H.h[j * H.nx + i] * S.exaggeration);
geo.computeVertexNormals();
const tex = await new THREE.TextureLoader().loadAsync('/scene/texture.png');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
// 지면: texture = mercator relief 텍스처 색 그대로(음영은 텍스처에 이미 있음 — 본편 구간 경계 색조 일치, D-0619 ①), 없으면 조명(스케치)
scene.add(new THREE.Mesh(geo, S.ground === 'texture' ? new THREE.MeshBasicMaterial({ map: tex }) : new THREE.MeshLambertMaterial({ map: tex })));
scene.add(new THREE.AmbientLight(0xffffff, S.light.ambient));
const sun = new THREE.DirectionalLight(0xffffff, S.light.sun);
const az = S.light.az * Math.PI / 180, el = S.light.el * Math.PI / 180;
sun.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).multiplyScalar(1e5);
scene.add(sun);

// 지형 높이(쌍선형) — 부대 면·강 띠를 지표 위에 얹는다
function hAt(x, z) {
  const u = (x / S.size_m[0] + 0.5) * (H.nx - 1), v = (z / S.size_m[1] + 0.5) * (H.ny - 1);
  const i = Math.max(0, Math.min(H.nx - 2, Math.floor(u))), j = Math.max(0, Math.min(H.ny - 2, Math.floor(v)));
  const fu = Math.min(1, Math.max(0, u - i)), fv = Math.min(1, Math.max(0, v - j));
  const a = H.h[j * H.nx + i], b = H.h[j * H.nx + i + 1], c = H.h[(j + 1) * H.nx + i], d = H.h[(j + 1) * H.nx + i + 1];
  return ((a * (1 - fu) + b * fu) * (1 - fv) + (c * (1 - fu) + d * fu) * fv) * S.exaggeration;
}
for (const r of S.rivers) {
  const pts = r.pts.map(([x, z]) => new THREE.Vector3(x, hAt(x, z) + S.lift_m, z));
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), pts.length * 8, S.river.w_m, 6, false);
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: S.river.color })));
}
// v2(D-0605 ①③) — 부대 = 높이 있는 박스(2D 와 같은 윤곽) · 윗면 밝게(진영색)·옆면 어둡게(진영색 × side_dark) · 바닥 그림자(해 반대쪽)
// · 윗면 대열 기둥(InstancedMesh, 고정 간격 — 병력 비례 아님) · 점열 = 낮은 기둥들. 무작위 없음
const sunDir = new THREE.Vector3(Math.sin(az), 0, -Math.cos(az)).normalize();
const shadowOff = sunDir.clone().multiplyScalar(-S.shadow_offset_m);
const postGeo = new THREE.BoxGeometry(S.rank.post_w_m, S.rank.post_h_m, S.rank.post_w_m);
function groundShape(poly, dx, dz) {
  const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x + dx, -(z + dz))));
  const g = new THREE.ShapeGeometry(shape); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let k = 0; k < p.count; k++) p.setY(k, hAt(p.getX(k), p.getZ(k)) + S.lift_m);
  return g;
}
// 진영색 마감 — relief 바탕과 어울리게 채도·명도를 조금 낮춘다(붉음·푸름 구분은 그대로, 값 = finish.color_sat·color_value)
function tone(hex) {
  if (!S.finish) return hex;
  const c = new THREE.Color(hex), hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h, hsl.s * F.color_sat, hsl.l * F.color_value); return c;
}
function box(poly, base, h, top, side) {
  const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
  // 모서리 경사(bevel) — 윗변이 빛을 받아 은은한 모서리 빛이 된다. bevelOffset = −bevelSize 로 바닥 윤곽(2D 와 같은 부호 모양)은 그대로
  const bv = S.finish ? F.bevel_m : 0;
  const g = new THREE.ExtrudeGeometry(shape, bv > 0 ? { depth: Math.max(1, h - bv), bevelEnabled: true, bevelThickness: bv, bevelSize: bv,
    bevelOffset: -bv, bevelSegments: F.bevel_segments } : { depth: h, bevelEnabled: false });
  g.rotateX(-Math.PI / 2); g.translate(0, base, 0);
  return new THREE.Mesh(g, [new THREE.MeshLambertMaterial({ color: tone(top) }), new THREE.MeshLambertMaterial({ color: tone(side) })]);
}
function buildUnits(list) {   // 부대 묶음 — 본편은 프레임마다 키프레임 위치로 다시 만든다(fr.units, 결정적)
  const grp = new THREE.Group(), tops = [];
  for (const u of list) {
  const hs = u.poly.map(([x, z]) => hAt(x, z));
  const base = Math.min(...hs) - S.lift_m, rise = Math.max(...hs) - base;   // 바닥은 지표 아래에서 — 비탈에서도 뜨지 않는다
  // 접지 그림자 — 해 반대쪽(relief 음영과 같은 빛 방향). finish 가 있으면 둥글게 퍼진 여러 겹(부드러운 가장자리), 없으면 한 겹(옛 모양)
  const layers = S.finish ? F.shadow_layers : 1;
  for (let k = 0; k < layers; k++) {
    const th = 2 * Math.PI * k / layers, sp = S.finish ? F.shadow_spread_m : 0;
    const sh = new THREE.Mesh(groundShape(u.poly, shadowOff.x + Math.cos(th) * sp, shadowOff.z + Math.sin(th) * sp),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: (S.finish ? F.shadow_alpha : S.shadow_alpha) / layers, depthWrite: false }));
    sh.renderOrder = 1; grp.add(sh);
  }
  let topY;
  if (u.dots) {
    const h = S.unit_height_m * 0.5;
    for (const [x, z] of u.dots) {
      const g = new THREE.CylinderGeometry(u.dot_r, u.dot_r, h + rise, 16);
      const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: tone(u.color) }));
      m.position.set(x, base + (h + rise) / 2, z); grp.add(m);
    }
    topY = base + rise + h;
  } else {
    const h = S.unit_height_m + rise;
    grp.add(box(u.poly, base, h, u.color, u.side));
    topY = base + h;
    if (S.finish) {   // 모서리 빛 — 해를 보는 변만(빛 방향 = relief 음영과 같은 쪽), 은은하게
      const pts = [];
      for (let k = 0; k < u.poly.length; k++) {
        const [x0, z0] = u.poly[k], [x1, z1] = u.poly[(k + 1) % u.poly.length];
        const cx = u.poly.reduce((a, p) => a + p[0], 0) / u.poly.length, cz = u.poly.reduce((a, p) => a + p[1], 0) / u.poly.length;
        let nx = z1 - z0, nz = -(x1 - x0);   // 변의 바깥 법선(중심 반대쪽으로 맞춘다)
        if (nx * ((x0 + x1) / 2 - cx) + nz * ((z0 + z1) / 2 - cz) < 0) { nx = -nx; nz = -nz; }
        if (nx * sunDir.x + nz * sunDir.z > 0) pts.push(new THREE.Vector3(x0, topY + 0.5, z0), new THREE.Vector3(x1, topY + 0.5, z1));
      }
      if (pts.length) grp.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: F.rim_alpha })));
    } else {
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(u.poly.map(([x, z]) => new THREE.Vector3(x, topY + 0.5, z))),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: S.rim_alpha }));
      grp.add(edge);
    }
    if (u.posts && u.posts.length) {
      const im = new THREE.InstancedMesh(postGeo, new THREE.MeshLambertMaterial({ color: tone(u.side) }), u.posts.length);
      const mt = new THREE.Matrix4();
      u.posts.forEach(([x, z], i) => { mt.makeTranslation(x, topY + S.rank.post_h_m / 2, z); im.setMatrixAt(i, mt); });
      grp.add(im);
    }
  }
  tops.push({ u, y: topY });
  }
  return { grp, tops };
}
let units = buildUnits(S.units); scene.add(units.grp);
function setUnits(list) {   // 옛 묶음의 기하·재질을 놓고 새 묶음으로
  scene.remove(units.grp);
  units.grp.traverse(o => { if (o.geometry && o.geometry !== postGeo) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => m.dispose()); });
  units = buildUnits(list); scene.add(units.grp);
}
const glyphImg = {};
for (const u of S.units) if (u.glyph && !S.text_in_engine && !glyphImg[u.glyph]) {
  const im = new Image(); im.src = '/scene/' + u.glyph; await im.decode(); glyphImg[u.glyph] = im;
}
const ov = document.getElementById('ov'); ov.width = W * F.supersample; ov.height = Ht * F.supersample;
ov.style.width = W + 'px'; ov.style.height = Ht + 'px';
const ctx = ov.getContext('2d'); ctx.scale(F.supersample, F.supersample);   // 글자·병종 그림도 같은 배율로 그린다(스케치)
function label(txt, x, y, size, color, weight) {
  ctx.font = `${weight} ${size}px "IBM Plex Sans KR","Noto Sans CJK KR",sans-serif`;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.28; ctx.strokeStyle = S.halo; ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
}
// 프레임 카메라 — fr.az 필수, fr.elev·fr.radius·fr.target 은 있으면 그 프레임 값(본편 이어 찍기: 90° → 규칙 고도각, D-0614 ③), 없으면 scene 값
// S.text_in_engine(본편, D-0614 ①) — 글자·병종 그림을 그리지 않고 화면 좌표만 돌려준다(엔진이 engine.typography·engine.glyphs 로 그린다)
window.__draw = (fr) => {
  if (fr.units) setUnits(fr.units);
  const a = fr.az * Math.PI / 180, e = (fr.elev ?? S.camera.elev_deg) * Math.PI / 180;
  const R = fr.radius ?? S.camera.radius_m, c = fr.target ?? S.camera.target;
  const ce = Math.cos(e) < 1e-6 ? 1e-6 : Math.cos(e);   // 90°(내려다보기)에서도 방위가 살아 있게
  cam.position.set(c[0] + Math.sin(a) * ce * R, hAt(c[0], c[1]) + Math.sin(e) * R, c[1] - Math.cos(a) * ce * R);
  cam.lookAt(c[0], hAt(c[0], c[1]), c[1]);
  renderer.render(scene, cam);
  ctx.clearRect(0, 0, W, Ht);
  const out = [];
  units.tops.forEach(({ u, y }, i) => {   // 병종 빌보드(윗면 위) + 부대 이름(그 아래)
    const v = new THREE.Vector3(u.c[0], y + S.label_lift_m * 0.5, u.c[1]).project(cam);
    const sx = (v.x + 1) / 2 * W, sy = (1 - v.y) / 2 * Ht;
    const bx = [Infinity, Infinity, -Infinity, -Infinity];   // 블록 윗면 화면 상자 — 라벨 겹침·라벨 자리(D-0627, UF-257)
    for (const [px, pz] of u.poly) { const q = new THREE.Vector3(px, y, pz).project(cam);
      const qx = (q.x + 1) / 2 * W, qy = (1 - q.y) / 2 * Ht; bx[0] = Math.min(bx[0], qx); bx[1] = Math.min(bx[1], qy); bx[2] = Math.max(bx[2], qx); bx[3] = Math.max(bx[3], qy); }
    out.push({ k: 'unit', i, name: u.name || '', glyph: u.glyph_name || null, faction: u.faction || null,
               x: +sx.toFixed(2), y: +sy.toFixed(2), behind: v.z > 1, block: bx.map(n => +n.toFixed(2)) });   // 화면 좌표는 늘 돌려준다 — 진형 가운데 검사(D-0625, 스케치 3D 도)
    if (S.text_in_engine || v.z > 1) return;
    if (u.glyph) { const im = glyphImg[u.glyph], gh = S.glyph_px, gw = gh * im.width / im.height; ctx.drawImage(im, sx - gw / 2, sy - gh, gw, gh); }
    if (u.name) label(u.name, sx, sy + S.text.unit, S.text.unit, '#ffffff', 600);
  });
  for (const p of S.places) {
    const v = new THREE.Vector3(p.c[0], hAt(p.c[0], p.c[1]) + S.label_lift_m, p.c[1]).project(cam);
    const sx = (v.x + 1) / 2 * W, sy = (1 - v.y) / 2 * Ht;
    out.push({ k: 'place', name: p.name, x: +sx.toFixed(2), y: +sy.toFixed(2), behind: v.z > 1 });
    if (S.text_in_engine || v.z > 1) continue;
    label(p.name, sx, sy, S.text.place, '#ffffff', 500);
  }
  return out;
};
window.__ready = true;
</script></body></html>
