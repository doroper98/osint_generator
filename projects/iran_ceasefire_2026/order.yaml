# 『휴전안 — 미국과 이란, 무엇이 먼저 풀려야 하나』 주문 (v7.4.0, back_and_forth D-0450 — 사용자 위임 D-0334, 게이트 ①·② 감독 위임).
schema_version: 1
tempo: breath
attribution_mode: credits   # D243 — 보도 귀속은 엔딩 크레딧 장면별, 당사자 발언·논쟁 해석은 본문 귀속
topic: 2026년 미국·이란 전쟁의 휴전안 정리(9월 25일 이란 7일안 ~ 10월 31일 도하)와 휴전 가능성의 조건부 시나리오·신호, 그리고 한국 접점
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다   # D-0450 §4 목표 5~7분 ≈ 문장 55~80
instructions:
  - "사용자 원문(D-0334, UF-205): '새로운 감독 세션을 띄워서 휴전안에 대해 정리하는, 그리고 휴전가능성이 있는지 타진해보는 영상 제작을 시작해 완성본으로 바로 받을 수 있도록 하고'"
  - "막 구성(D-0450 §4): cold(10/31 도하·루비오·11/3) → act1 '여덟 달'(2/28 개전 → 4/8 휴전 → 6/17 양해각서 → 7/7 붕괴·7/14 봉쇄 재개 → 8/17 만료, 지도 + 날짜 카드) → act2 '휴전안의 한 달'(9/25 7일안 → 10/31 도하, 보조 무대 시간축) → act3 '조건 대조'(versus 같은 무게) → act4 '호르무즈 지금'(양측 귀속) → act5 '가능성 — 신호'(조건부 시나리오·신호 다섯) → act6 '한국'(카타르 자금의 출처·최고가격제·중동 비중) → ending(확인된 것/확인되지 않은 것)."
  - "귀속(G4): 양해각서 붕괴 책임(미국: 6/25 상선 공격·7/7 '끝났다' ↔ 이란: 미 공습의 1조 위반·레바논) · 호르무즈 기뢰(혁명수비대 ↔ 미 중부사령부) · 동결 자산 액수(알자지라 9월 약 120억 / 10월 말 약 60억 달러) — 양측 같은 무게, 본문 라벨 없음(D85)."
  - "가능성 = 예언 금지(D-0450 §3): 조건부 시나리오 두 개(봉쇄 해제 먼저 / 핵 문제 먼저)와 신호 다섯(봉쇄·카타르 자금·도하 직접 협상·해협 통항·11/3 뒤 발언). 전망 수치 없음."
  - "인물(D-0450 §3): 현 최고지도자는 모즈타바 하메네이. 공용 초상 khamenei_mono_v01(알리 하메네이)은 act1_1 의 알리 하메네이 문장에만 — 모즈타바 문장(act5_6)에는 쓰지 않는다(직함 quote)."
  - 발음 텍스트 숫자·기호·라틴 약어 금지(CENTCOM → 미 중부사령부, MoU → 양해각서, CFR → 미국외교협회). 문장 끝 '~니다'. banned_phrases 0.
  - "연출 메모 — 무대(D550·R-0289 선례 B): 주 무대 mercator 하나, stage_config.mercator.theme light, theme_reason '지정학 — 장르 기본 D154, 감독 결정 D550'. mercator 주 무대 + timeline 보조 무대 아일랜드는 엔진이 아직 못 그린다 → 시간축은 panel timeline 두 번: act2 (title '휴전안의 한 달', start 2026-09-15, end 2026-11-15, 핀 9개 — 9/24 7일안(act2_1) · 9/26 트럼프 거부(act2_3) · 9/30 미 역제안(act2_4) · '10/6~8' 밴스 요구·트럼프 선거 전 공격 없음(act2_5~7, 한 핀) · 10/11 레자이 '불충분'(act2_8) · 10/25 카타르 초안(act2_9) · '10/28~30' 밴스 서한·테헤란 12시간(act2_11~12, 한 핀) · 10/31 도하 · 11/3 중간선거 — 핀은 문장 t 로 차례로) · act5 (같은 start·end·자리, 9개 핀을 처음부터 다 보이고 11/3 핀만 강조, act5_3~5 구간). 두 패널 축 범위 같게(한 세계, UF-135·138). 2~8월 전쟁 경과는 축에 올리지 않고 지도 marker sub 의 날짜로."
  - "연출 메모 — 지점(출처 있는 도시만, W1.1 M5): doha [51.53, 25.29] · tehran [51.39, 35.69] · islamabad [73.05, 33.68] · hormuz [56.25, 26.57] · bandar_abbas [56.27, 27.18] · muscat [58.41, 23.59] · beirut [35.50, 33.89] · ulsan [129.31, 35.54] · seoul [126.98, 37.57] · yanbu [38.06, 24.09] · fujairah [56.33, 25.12] · sohar [56.75, 24.36]. 워싱턴·뉴욕은 지도 W 티어(28~140E) 밖 → marker 대신 인물 뱃지·자막. 오만 연안 상선 공격·기뢰 피격 지점·남쪽 항로는 좌표 출처 없음 → 점·선 그리지 않는다(해협 전경 카메라만). route·paths 없음. 문장마다 요소 2~3개, 한꺼번에 튀어나오는 관계선 금지, 카메라 이동은 문장 사유가 있을 때만(cold 걸프 → act1 테헤란·해협·이슬라마바드 → act3·act5 걸프 정지 → act4 해협 확대 → act6 한반도·울산 → ending 걸프)."
  - "연출 메모 — 실사(등재 13, rules media_beats.min_density_per_min 1.5 × 8.05분 = 13 hard): cold_0 photo iran_doha_skyline · act1_1 clip iran_epic_fury_video(2/28 작전 공개 영상 3/1 공개, segment 0.5~8.0, broll 구석) · act1_3 photo iran_hormuz_modis · act1_5 photo iran_islamabad_talks(문장 앞 '이슬라마바드 회담') → clip iran_blockade_apr_video(단어 '4월 13일'부터, broll 구석 D-0332) · act1_7 photo iran_uss_new_orleans_blockade(6/18 봉쇄 해제 문장 — 1차 봉쇄 중 사진이므로 '봉쇄를 풀었고' 앞부분까지만, 캡션 날짜 2026.04.28) · act1_8 clip iran_strikes_jul_video(7/7 미 공습, segment 1.5~6.5, broll 구석) · act1_10 photo iran_marines_boarding(두 번째 봉쇄, 7/16) · act2_12 photo iran_tehran_2026(테헤란 12시간 협의) · act3_1 photo iran_araghchi_moscow(아라그치 조건 문장, 자료사진 2026.04) · act4_0 photo iran_hormuz_night_iss · act4_4 photo iran_uss_dextrous_mcm(중부사령부 기뢰 제거 문장, 자료사진 2003) · ending_1 photo iran_doha_skyline_09. 사진은 가운데 액자(x 227 · y 72 · w 400 — 자막 영역 침범 금지). act4_5(부착식 기뢰)는 사진 없음(Kokuka 기각 D-0453). 영상 클립은 지도 위 marker 를 덮지 않는 구석 자리."
  - "연출 메모 — 패널(수치는 claims 출처 있는 것만, 축척 다른 독립 차트 번갈아 띄우기 금지): act3 panel versus(같은 폭·같은 행 수 5 대 5) — 이란(아라그치 10/31): 봉쇄 해제 · 원유 제재 면제 복원 · 양해각서 뒤 제재 해제 · 카타르분 포함 동결 자금 전액 · 역내 미군 축소 / 미국: 핵 문제 없는 합의는 없다(미 관리) · 농축 능력 의미 있는 감축(밴스 10/6) · 해협 이란·오만 공동 관리 거부(레자이 전언 10/11) · 봉쇄는 선거 전까지 유지(트럼프 10/8) · 제재 완화는 핵 진전의 대가(보도, 트럼프 부인) — src 줄에 귀속 그대로. act4_2 panel dots 또는 카드 '전쟁 전 대비 약 70% 감소 — 영국 해사무역기구 주간 집계, 미국 제공 수치 독립 검증 불가'. act6_2~3 울산 선적지 비중 — panel versus(1월 ↔ 9월: 해협 안쪽 79.5% → 0%, 해협 밖 중동 항 8.4% → 70.6%, 출처 '울산세관 · 해협 밖 선적에도 걸프 원유 환적분 가능'). act5_5~7 신호 다섯 — panel checklist 또는 dots(통항 · 보험료 · 카타르 자금 · 중재 일정 · 레바논)."
  - "연출 메모 — 인물·인용(공용 라이브러리 뱃지만): trump · araghchi · rubio · vance · pezeshkian · sharif · rezaei. khamenei(알리)는 act1_2 '알리 하메네이가 숨졌고' 앞부분에만 — 모즈타바 문장(act5_4)에는 뱃지 없이 quote(직함 '이란 최고지도자', flag ir). quote 후보: 아라그치 '긍정적 조치'(cold_1) · 트럼프 '휴전은 끝났다'(act1_9) ↔ 이란 '미국의 공습은 양해각서 1조 위반'(act1_11, 같은 무게) · 트럼프 '그 합의는 받아들일 수 없다'(act2_3) · 혁명수비대 ↔ 미 중부사령부(act4_3·act4_4, 같은 폭 두 줄) · 모즈타바 하메네이 '지리적 제한 없는 대응'(act5_4). 카드는 쓰지 않거나 최소(UF-148 자막 되풀이 금지) — 날짜는 marker sub·timeline 핀으로. 국기 ir · us · qa · pk · il · lb · kr · om."
  - "UF-170(D-0454): 화면 글자 어디에도(카드·패널 제목·quote·마커 sub·타이틀·엔딩) <논쟁>·<미검증>·<미확인> 같은 괄호 라벨과 '논쟁 사안'·'미검증' 같은 상태 꼬리표 단어를 쓰지 않는다. 양측 병기 자체로 보인다."
  - "엔딩 카드 맨 아래 가장 작은 글씨: 미검증 표기(D85) — '호르무즈 통항·기뢰 주장은 양측 발표로 독립 확인되지 않음 · 카타르 초안 세부·공격 준비 보도는 익명 관리 인용'."
