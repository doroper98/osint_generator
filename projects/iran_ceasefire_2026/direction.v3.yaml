media_note: 'v2(구현 세션 손질, AI 초안 v1 바탕): 출처 없는 좌표(오만 연안·이란 남부·기뢰 남쪽 항로·이란 중심점)와 그 위 boom·경로, 봉쇄선 barrier(좌표 출처 없음), 밴스 서한 경로(출발점 무의미) 삭제(W1.1 M5·D-0450 §8). 실사 13(사진 10·영상 3 — media_beats 하한 13): 도하·에픽 퓨리
  영상·MODIS·이슬라마바드 회담장·4월 봉쇄 영상·뉴올리언스·7월 공습 영상·7/16 검문·테헤란·아라그치·해협 야간·덱스트러스·도하 2. versus 5행 대 5행(D-0453 §3, 미국 5행째 ''보도, 트럼프 부인''). 시간축 panel timeline 두 번(act2 도입·act5 재진입, 축 2026-09-15→11-15 같게, 핀 9 — 10/6~8·10/28~30
  묶음). 유튜브 공식 클립은 봇 검사로 실패(우회 안 함, D551). 휘장 0(중부사령부 휘장 Commons Restrictions). UF-170 — 화면 라벨 0. · v3(콘티 판 사전 검사 hard 46 정리): 국기 뱃지 정리(한국만), 사진↔마커 시간 분리, 경로 grow ≥ 속도 상한, act2_11·act4·act6 구도 넓힘, 사진 for
  = 레지스트리 main_subject, 테헤란→도하 경로(cold_0 도착), 빈 지도 구간 마커·기사.'
