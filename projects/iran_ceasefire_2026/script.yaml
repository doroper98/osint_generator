    - clm_0044
  - date: 2026.10.30
    text: 그사이 브렌트유 12월물은 10월 30일 배럴당 117.64달러로, 전쟁 직전의 약 72달러보다 크게 올랐습니다.
    tts: 그사이 브렌트유 십이월물은 시월 삼십일 배럴당 백십칠 점 육사 달러로, 전쟁 직전의 약 칠십이 달러보다 크게 올랐습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0045
- id: act5
  kind: act
  stage: 걸프
  sentences:
  - date: 2026.10.31
    text: 휴전이 다시 성사될지는 예측 대신, 양측이 이미 밝힌 조건으로 나눠 보겠습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0056
  - date: 2026.10.31
    text: 먼저 봉쇄 해제와 동결 자금, 제재 면제가 움직이면, 이란은 이틀 안에 해협을 여는 안에 이르렀다고 밝혔습니다.
    role: intro
    emphasis:
    - 이틀
    sources:
    - clm_0035
    - clm_0034
  - date: 2026.10.31
    text: 한편 핵 문제가 빠지면 합의는 없다고 미국 관리들은 말했습니다.
    emphasis:
    - 핵 문제
    sources:
    - clm_0036
  - date: 2026.10.28
    text: 다만 미국이 걸프 국가들에 중간선거 뒤 짧고 강한 작전에 대비하라고 알렸다고 미국 언론이 전했습니다.
    emphasis: []
    sources:
    - clm_0038
  - date: 2026.10.31
    text: 이에 모즈타바 하메네이 최고지도자는 공격받으면 지리적 제한 없는 대응을 하겠다고 경고했습니다.
    emphasis: []
    sources:
    - clm_0039
  - date: 2026.10.31
    text: 그래서 지켜볼 신호는 다섯 가지입니다.
    emphasis:
    - 다섯 가지
    sources:
    - clm_0056
  - date: 2026.10.31
    text: 첫째는 해협을 지나는 배의 수, 둘째는 전쟁 위험 보험료입니다.
    emphasis: []
    sources:
    - clm_0057
  - date: 2026.10.14
    text: 보험 중개사들에 따르면 이 보험료는 전쟁 전 선가의 0.25%에서 10월에는 6~10%로 올랐습니다.
    tts: 보험 중개사들에 따르면 이 보험료는 전쟁 전 선가의 영 점 이오 퍼센트에서 시월에는 육에서 십 퍼센트로 올랐습니다.
    emphasis: []
    sources:
    - clm_0046
  - date: 2026.10.31
    text: 셋째는 카타르에 묶인 자금, 넷째는 카타르와 파키스탄, 오만의 중재 일정, 다섯째는 레바논 전선입니다.
    emphasis: []
    sources:
    - clm_0052
    - clm_0033
    - clm_0021
  - date: 2026.04.02
    text: 다만 해협이 다시 열려도 해운 시장이 정상으로 돌아오는 데는 최장 2년이 걸릴 수 있다고 한국해양진흥공사는 밝혔습니다.
    tts: 다만 해협이 다시 열려도 해운 시장이 정상으로 돌아오는 데는 최장 이 년이 걸릴 수 있다고 한국해양진흥공사는 밝혔습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0047
- id: act6
  kind: act
  stage: 한국
  sentences:
  - date: 2026.10.31
    text: 이 신호들은 한국과도 바로 이어집니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0052
    - clm_0049
  - date: 2026.03.04
    text: 한국해양진흥공사에 따르면, 지난해 한국 원유 수입의 69.6%가 호르무즈 해협을 지났습니다.
    tts: 한국해양진흥공사에 따르면, 지난해 한국 원유 수입의 육십구 점 육 퍼센트가 호르무즈 해협을 지났습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0048
  - date: 2026.10.13
    text: 그런데 울산세관 집계로는 울산에 들어온 원유 가운데 해협 안쪽에서 실은 비중이 1월 79.5%에서 9월 0%가 됐습니다.
    tts: 그런데 울산세관 집계로는 울산에 들어온 원유 가운데 해협 안쪽에서 실은 비중이 일월 칠십구 점 오 퍼센트에서 구월 영 퍼센트가 됐습니다.
    emphasis:
    - 울산
    sources:
    - clm_0049
  - date: 2026.10.13
    text: 대신 해협 밖 얀부, 푸자이라, 소하르 같은 중동 항구에서 실은 비중이 70.6%로 늘었습니다.
    tts: 대신 해협 밖 얀부, 푸자이라, 소하르 같은 중동 항구에서 실은 비중이 칠십 점 육 퍼센트로 늘었습니다.
    emphasis: []
    sources:
    - clm_0049
  - date: 2026.10.13
    text: 다만 해협 밖에서 실은 원유에도 걸프 원유를 옮겨 실은 물량이 섞였을 수 있습니다.
    emphasis: []
    sources:
    - clm_0049
  - date: 2026.10.31
    text: 한편 휘발유 전국 평균 가격은 전쟁 전 리터당 1,691.3원에서 10월 넷째 주 1,855.7원이 됐습니다.
    tts: 한편 휘발유 전국 평균 가격은 전쟁 전 리터당 천육백구십일 점 삼 원에서 시월 넷째 주 천팔백오십오 점 칠 원이 됐습니다.
    emphasis: []
    sources:
    - clm_0050
  - date: 2026.10.31
    text: 또한 카타르에 묶인 이란 자금 약 60억 달러는 2023년 한국에서 옮겨 간 원유 대금입니다.
    tts: 또한 카타르에 묶인 이란 자금 약 육십억 달러는 이천이십삼 년 한국에서 옮겨 간 원유 대금입니다.
    emphasis:
    - 원유 대금
    sources:
    - clm_0052
  - date: 2026.10.27
    text: 그리고 10월 27일, 이란은 한국 해운사 장금상선의 배들에 11월 1일부터 법적 조치를 하겠다고 밝혔습니다.
    tts: 그리고 시월 이십칠일, 이란은 한국 해운사 장금상선의 배들에 십일월 일일부터 법적 조치를 하겠다고 밝혔습니다.
    emphasis:
    - 장금상선
    sources:
    - clm_0053
  - date: 2026.10.28
    text: 이에 대해 한국해운협회는 지목된 배가 외국 석유사가 빌려 쓰는 배라고 반박했습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0054
- id: ending
  kind: ending
  sentences:
  - date: 2026.11.01
    text: 다시 11월 1일 지금으로 돌아오면, 이란은 7일안에 이어 이틀안을 밝혔고 미국은 서한을 보냈지만, 양측은 아직 만나지 않았습니다.
    tts: 다시 십일월 일일 지금으로 돌아오면, 이란은 칠 일안에 이어 이틀안을 밝혔고 미국은 서한을 보냈지만, 양측은 아직 만나지 않았습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0021
    - clm_0035
    - clm_0031
    - clm_0056
  - date: 2026.11.01
    text: 확인된 것은 이란 대표단의 도하 방문과 양측이 밝힌 조건입니다.
    emphasis: []
    sources:
    - clm_0001
    - clm_0056
  - date: 2026.11.01
    text: 반면 해협의 기뢰 피격은 양측이 서로 다르게 발표했고, 카타르 초안의 세부는 익명 관리가 전한 내용입니다.
    emphasis: []
    sources:
    - clm_0042
    - clm_0029
  - date: 2026.11.01
    text: 그리고 무엇을 먼저 풀지에 대한 답은 아직 어느 쪽도 내놓지 않았습니다.
    emphasis: []
    sources:
    - clm_0056
