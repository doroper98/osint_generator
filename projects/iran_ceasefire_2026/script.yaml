# 『휴전안의 한 달 — 미국과 이란, 무엇이 먼저 풀려야 하나』 원고 v1.2 (v7.4.0, back_and_forth D-0450 · 감독 조사표 D-0451 · 선검토 D-0452 · 게이트 ① 검토 D-0453 반영 — 사용자 위임 D-0334).
# 사실 교정(D-0451 §0): 1차 봉쇄 4/13(7월은 두 번째) · 붕괴 7/6~7 상선 공격 → 7/8 "휴전은 끝났다" → 7/18 이란 이행 중단 → 8/17 만료 · 파기 책임 양측 귀속 ·
#   동결 자산 = "카타르 보관분 포함 전액"(아라그치 10/31) · 10/7 미 요구 = 밴스 농축 감축(10/6 인터뷰) · 이틀안 = 아라그치 10/31 발언.
# 쓰지 않는 것(D-0451): 사망자 수 · 미국 7일안 수용설 · 10/26 재거부 · 240억 달러 · 최고가격 1,784원 · 5~7월 중동 48.5% · 모건스탠리·골드만 전망 · 통항 '하루 130회'.
