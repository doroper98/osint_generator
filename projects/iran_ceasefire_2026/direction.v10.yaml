media_note: 'v2(구현 세션 손질, AI 초안 v1 바탕): 출처 없는 좌표(오만 연안·이란 남부·기뢰 남쪽 항로·이란 중심점)와 그 위 boom·경로, 봉쇄선 barrier(좌표 출처 없음), 밴스 서한 경로(출발점 무의미) 삭제(W1.1 M5·D-0450 §8). 실사 13(사진 10·영상 3 — media_beats 하한 13): 도하·에픽 퓨리 영상·MODIS·이슬라마바드 회담장·4월 봉쇄 영상·뉴올리언스·7월 공습 영상·7/16 검문·테헤란·아라그치·해협 야간·덱스트러스·도하 2. versus 5행 대 5행(D-0453 §3, 미국 5행째 ''보도, 트럼프 부인''). 시간축 panel timeline 두 번(act2 도입·act5 재진입, 축 2026-09-15→11-15 같게, 핀 9 — 10/6~8·10/28~30 묶음). 유튜브 공식 클립은 봇 검사로 실패(우회 안 함, D551). 휘장 0(중부사령부 휘장 Commons Restrictions). UF-170 — 화면 라벨 0. · v3(콘티 판 사전 검사 hard 46 정리): 국기 뱃지 정리(한국만), 사진↔마커 시간 분리, 경로 grow ≥ 속도 상한, act2_11·act4·act6 구도 넓힘, 사진 for = 레지스트리 main_subject, 테헤란→도하 경로(cold_0 도착), 빈 지도 구간 마커·기사. · v4: 오프닝 첫 폭 60, ''선박 위협'' 경계선·소하르 마커 삭제(라벨 겹침), 기사 2(8/17 만료·해운협회 반박). · v5: 기사 이웃 연속 정리(8/17·해운협회 기사 대신 테헤란 마커 부제·도하 마커), act5_1 아라그치 뱃지, 도하 마커 왼쪽, 오프닝 중심 60E. · v6(D-0457): 시간축 패널 act2 전체(act2_0→act2_12, 핀 9 문장마다)·act5 재진입(act5_0→act5_3, 11/3 강조 — act5_4 하메네이 인용은 패널 뒤 지도에서), act2 의 뱃지·인용·기사·사진은 패널을 덮어 걷어냄(테헤란 사진 → ending_0). 데이터 패널: dots 70%·dual_line 2점(브렌트·보험료·울산 선적지·휘발유 — 레지스트리에 bars 패널 없음)·checklist 4+꼬리 줄(레바논). · v6.1: versus 4행 대 4행(5행이 상자 밖으로 넘침 — 합친 행), 10/11 핀 아래쪽. · v7(D-0458): 덱스트러스 2003 사진 삭제(23년 전 자료, photo-age) → act4_3·act4_4 양측 quote 두 줄(같은 무게). 실사 13 유지: act1_9 앙카라 나토 도착 사진(2026-07-07, CC BY 4.0). 한국 국기 뱃지 → country KR 강조. 초상 뱃지 루비오(cold_2)·샤리프(act1_4) 추가. 밴스·레자이 뱃지는 act2 시간축 패널 위라 넣지 않음(badge-over-panel). 푸자이라 지명 사전 등재(data/gazetteer.yaml manual). · v9(D-0462, UF-171·172): 요소 완전 노출 ≥ 6초(qa_checks.element_hold) — 사진·영상·카드 순차 배치. 뺀 것 = 루비오·샤리프 뱃지, 트럼프 quote(act1_9, 자막과 같은 문장), 기사 0043(act1_11)·0047(act4_4, 양측 quote 로 대칭) — 자리 없음. act1_7 사진(뉴올리언스)은 act1_10~11 로 옮겨 기사 카드와 겹침 해소(UF-172). · v9 콘티 판 사전 검사 정리: 오프닝 기사 0005 를 타이틀 끝까지(title_backdrop), 에픽 퓨리 클립은 act1_1 부터(clip_date), 마커 도하·호르무즈·이슬라마바드는 사진 뒤로, act1_12 테헤란 마커 삭제(사진 아래 깔림), act1_8 숏 w 16→24·lat 27.5(frame_missing ''이란'').'
