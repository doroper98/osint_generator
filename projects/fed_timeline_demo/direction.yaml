# 『금리와 물가, 두 줄의 기록』 연출 (v4.3.0, back_and_forth D-0084 작업 6) — 사람 작성(Opus). 시간축 무대 문법(20 §6):
# 왼쪽 → 오른쪽 시간 순, 장면당 이동 1회, 축 스케일(w) 고정 — 확대·물러나기 없음(v7.4.0 D-0261·UF-138).
# v5.1.0(back_and_forth D-0121 §A): 축 스케일 변화 3회(피크 확대·복귀·끝 조망) — 둘째 숏은 w 유지(pan), [timeline-rescale] 0.
# 값은 연출에 없다 — series 이벤트가 레코드(data/series)에서 그린다. 핀 문구의 수치는 레코드 값 그대로.
version: 1
project_id: fed_timeline_demo   # v7.4.0 D-0311 — 회귀 기준 판정 키(qa_checks.regression_refs), 합성 사본도 이 id 로
genre: macro_monetary
stage: timeline
stage_reason: "순수 차트(시간축) 검증용 데모 — backdrop 기본 무대 대신 시간축 무대(v5.1.0 D-0123 §4)"
stage_config:
  timeline:
    start: "2019-01-01"
    end: "2026-12-01"   # v7.1.0 D-0220 — 옛 2026-10-01. 끝 조망을 경계 안 키로 고르니 도착 뒤 드리프트(3%)가 보여 2026년 8월 핀이 오른쪽 끝 밖 → 두 달 여유
    lanes:   # 장르 프로필 기본 레인을 덮는다 — 레코드가 기준금리(목표 범위)가 아니라 실효금리이므로 이름을 정확히(C0 정확성)
      - {id: policy_rate, label: 연방기금 실효금리, kind: step, unit: "%"}
      - {id: inflation, label: 소비자물가 상승률 · 1년 전 대비, kind: line, unit: "%"}
    compress:
      - {from: "2019-01-01", to: "2020-01-01", factor: 0.35}   # 2019년은 압축(화면에 물결 + "압축" 라벨)
shots:
  - {at: 0, mode: cut, dur: 0, camera: {date: "2021-06-10", w: 1300}}   # v7.1.0 D-0220 UF-99 — 옛 2020-08-01(중심이 시간축 시작 0 보다 w/2 안쪽 → 화면이 경계에 잘려 있었음, camera_bounds). 화면에 실제로 보이던 자리로. 옛 low 장면 이동(2021-06-01)은 화면에서 0~5일 이동이라(경계에 잘림) 삭제
  - {at: {scene_start: peak, off: -0.3}, mode: move, dur: 5.2, camera: {date: "2022-06-15", w: 1300}}      # v7.4.0 D-0261(UF-138) 핀 확대 폐지 — w 고정, 날짜 이동만. 옛 w 40(핀 확대) — 일 단위 눈금(LOD). v5.21.9 2.2 → 4.0초: 32배 줌을 2.2초에 하면 |Δ ln w| 0.12 > 0.07(camera_continuity hard) · v7.0.1 D-0218 4.0 → 5.2초(zoom 1.64 > 1.3, camera_speed)
  - {at: {sid: high_0, off: 0.0}, mode: move, dur: 5.2, camera: {date: "2024-11-01", w: 1300}}   # v5.21.9 3.0 → 4.0초(같은 32배 줌 아웃, camera_continuity) · v7.0.1 D-0218 4.0 → 5.2초(camera_speed zoom), 시작 +1.2 → +0.0초(도착 시각 유지 — 5.33% 마커 화면 안)         # 2023년 8월 ~ 2025년 10월(빈 달)을 한 화면에
  - {at: {scene_start: now, off: -0.3}, mode: move, dur: 3.4, camera: {date: "2023-04-14", w: 1300},   # v7.4.0 D-0261(UF-138) 끝 물러나기 폐지 — 옛 w 2653.4   # v7.1.0 D-0220 — 옛 2022-11-15·w 2830 > 무대 폭(잘림, camera_bounds) → 무대 전체 폭·가운데(경계 안)
     reason: "마지막 장면 — 같은 축 스케일로 가운데로 이동(D-0261)"}
events:
  - {type: series, start: 0.3, end: {card: end, edge: start, off: 0.4}, lane: policy_rate, series_id: FEDFUNDS, style: step, col: amber}
  - {type: series, start: 0.3, end: {card: end, edge: start, off: 0.4}, lane: inflation, series_id: CPIAUCSL, style: line, col: teal}
  - {type: marker, start: {sid: low_0, off: -0.2}, end: {sid: low_1, edge: end, off: 0.6}, date: "2020-04-15", lane: policy_rate,
     label: 금리 월평균 0.05%, sub: 2020년 4월, side: right}
  - {type: marker, start: {sid: low_1, off: -0.2}, end: {sid: low_1, edge: end, off: 0.6}, date: "2022-03-15", lane: policy_rate,
     label: 금리 월평균 0.2%, sub: 2022년 3월, side: left}
  - {type: marker, start: {sid: peak_0, off: -0.2}, end: {sid: peak_0, edge: end, off: 1.0}, date: "2022-06-15", lane: inflation,
     label: 물가 상승률 8.98%, sub: 2022년 6월 · 1년 전 대비, side: left, hl: true}
  - {type: marker, start: {sid: high_0, off: -0.2}, end: {sid: high_0, edge: end, off: 0.6}, date: "2023-08-15", lane: policy_rate,
     label: 금리 월평균 5.33%, sub: 2023년 8월, side: right}
  - {type: marker, start: {sid: gap_0, off: -0.2}, end: {sid: gap_0, edge: end, off: 0.6}, date: "2025-10-15", lane: inflation,
     label: 10월 소비자물가 미발표, sub: 미 노동통계국(BLS), side: right}
  - {type: marker, start: {sid: now_0, off: 3.4}, end: {sid: now_2, edge: end, off: 0.8}, date: "2026-08-15", lane: policy_rate,
     label: 2026년 8월 기준, sub: 금리 3.63% · 물가 3.35%, side: left, hl: true}
sound:
  bgm: null
  no_music_decision: D-0084   # v5.22.2 — 데모(v4.3.0 D-0084 시간축 무대 시험)는 음악 없이 만든 고정물. 사용자 영상 아님
  intensity: [[0, 0.55], [{total: true}, 0.55]]   # 음악 없음(bgm null) — 효과음 세기만
