instructions:
  - "사용자 원문(2026-11-17): 'main 브랜치 기준으로, 아래의 내용과 그래서 미국이 어떻게 통제하게 될건지에 대한 내용을 영상으로 만들어 … 반복 되거나 가치가 낮은 작업은 Opus 띄워서 하던가 알아서 해.' 입력 = 사용자 문서 『르포 초안 — 젠슨 황 사임과 엔비디아 GPU의 중국 유입 경로』(intake/user_brief.md 전사)."
  - "사실 정정(조사 A~D, intake/research/): ① 사과문은 외도와 국가안보 우려의 연결을 인정하지 않았다(이사회 조사를 지지한다고만 썼다) ② 11월 11~12일 추가 보도의 상대는 엔비디아 직원 — 메가스피드 전 임원이 아니다 ③ 감시 화면 속 인물의 성별·창고 소재국은 출처에 없다 ④ 5억 1,000만 달러는 2025년 4월 말~5월 중순(법무부) ⑤ 대만 사건 경로에는 홍콩이 들어간다 ⑥ 60만 개 보도는 11월 5일 로이터(익명) ⑦ 엔비디아의 49% 상한·구매자 명단 축소는 스캔들 이전(FT 7월·11월 초) ⑧ 와이든·닐은 스스로 조사에 착수하고 상무부에 기록 보존을 요구했다."
  - "실명(G4·C9): 외도 상대로 보도된 인물의 이름은 화면·내레이션에 쓰지 않는다 — '메가스피드의 전 임원'. 초상·사진도 쓰지 않는다. 첩보 의혹은 보도 귀속으로만, 법무장관 발언('내려진 결론이 없다')·중국 외교부 반박·싱가포르 당국 결론·회사 부인을 같은 무게로 붙인다."
  - "확정과 의혹: 외도 인정·사임·기소 사실·유죄 인정은 평서. 공소장 내용은 '검찰은 … 주장했습니다', 추정치(Epoch AI·IFP)는 기관 귀속, 익명 보도(NYT·로이터·FT·CNBC)는 매체 귀속."
  - "막 구성: cold(사임·사과문·이사회 조사·메가스피드) → act1 확인된 것과 의혹(스튜디오) → act2 밀수 — 칩을 옮기는 길(지도) → act3 임차 — 칩을 옮기지 않는 길(지도) → act4 미국의 통제(스튜디오: 연혁·허점·11월 16일 규칙·의회·반론) → ending."
  - 발음 텍스트 숫자·기호·라틴 약어 금지(H200 → 에이치 이백, GPU → 쓰지 않고 '칩', AI → 인공지능). 문장 끝 '~니다'. banned_phrases 0. 첫머리 접속어 15% 이하.
  - "연출 메모 — 무대: 주 무대 studio(사람·성명·규칙 장면) + 지도(mercator porcelain) 한 번 들어갔다 나오기(rules stage.continuity.max_switches). 미국 본토는 지도에 넣지 않는다(태평양 횡단 경로를 그리지 않는다). 지도 좌표는 지명 사전 이름만. 창고·데이터센터처럼 위치가 공개되지 않은 곳은 나라 단위로만 표시한다."
  - "엔딩 카드 맨 아래 가장 작은 글씨(D85): 기소·수사 중인 혐의는 법정에서 확정되지 않았음 · 밀수·원격 연산 규모는 연구기관 추정 · 경로 선은 나라 단위 개략."
