# 『엔비디아 칩은 어떻게 중국에 닿았나』 주문 (v7.4.0) — 사용자 지시 2026-11-17, 단일 구현 모드(WORKFLOWS W0a), 게이트 ①·② 세션 기록(UF-914·UF-915).
