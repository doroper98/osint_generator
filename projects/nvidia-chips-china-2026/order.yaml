topic: 젠슨 황 사임(2026-11-12)과 엔비디아 GPU의 중국 유입 경로(밀수·해외 데이터센터 임차), 그리고 미국의 통제 수단(2026-11-16 상무부 원격 접속 규칙·의회 법안·집행)
genre: geopolitics
