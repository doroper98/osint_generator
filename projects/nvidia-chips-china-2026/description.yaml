# 『엔비디아 칩은 어떻게 중국에 닿았나』 영상 설명문 (v7.4.0). chapters.at = 장면 id 또는 TITLE.
schema_version: 1
headline: 엔비디아 칩은 어떻게 중국에 닿았나 · 젠슨 황 사임, 그리고 미국의 새 통제
summary: 2026년 11월 12일 젠슨 황이 엔비디아 최고경영자 자리에서 물러났습니다. 그는 나흘 전 사내 서한에서 외도를 인정했고, 상대로 보도된 인물은 싱가포르 기업 메가스피드의 전 임원입니다. 이 인물이 중국 정보기관에 포섭됐다는 의혹은 뉴욕타임스의 익명 당국자 인용 보도이며, 미 법무장관은 내려진 결론이 없다고 밝혔고 중국 외교부와 메가스피드는 부인했습니다. 영상은 확인된 사실과 의혹을 나눈 뒤, 엔비디아 칩이 중국에 닿은 두 경로를 지도로 정리합니다. 첫째는 밀수입니다. 미 법무부의 슈퍼마이크로 관련 기소(2026년 3월), 대만 검찰의 기소(8월), 말레이시아와 중국의 어긋난 세관 기록, 그리고 Epoch AI의 추정(H100 환산 중앙값 66만 개)을 다룹니다. 둘째는 해외 데이터센터 임차입니다. 칩을 옮기지 않고 연산 능력만 빌려 쓰는 방식으로, IFP는 2026년 말 100만 개 분량으로 추정했습니다. 마지막으로 미국의 대응을 봅니다. 상무부가 11월 16일 공개한 원격 접속 규칙(11월 19일 관보 게재와 함께 시행 예정, 기존 고객을 둔 데이터센터에 90일), 인도네시아·말레이시아·싱가포르·태국·브라질행 첨단 칩의 허가제, 의회의 관련 법안, 그리고 중국과 연구자의 반론입니다. 기소와 수사 중인 혐의는 법정에서 확정되지 않았고, 밀수와 원격 연산 규모는 연구기관의 추정입니다.
