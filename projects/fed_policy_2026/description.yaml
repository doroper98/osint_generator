headline: 연준, 다시 금리를 올리다 — 2023년 이후 첫 인상과 점도표가 남긴 질문
summary: 2026년 9월 16일 미국 연방공개시장위원회(FOMC)가 연방기금금리 목표 범위를 3.75~4%로 올렸습니다. 2025년 가을의 인하, 2026년의 동결과 7월 소수의견, 9월 인상과 참가자 전망(점도표)을 연준 공식 발표·공개 데이터·보도로 따라갑니다. 수치는 공개 데이터의 기준 시점 값이며 이후 수정될 수 있습니다. 투자 권유가 아닌 정보 제공 목적의 영상입니다.
