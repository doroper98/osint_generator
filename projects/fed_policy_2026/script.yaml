    text: 트럼프 대통령은 소셜미디어에서 금리를 1% 이하로 빨리 내려야 한다고 요구했습니다.
    tts: 트럼프 대통령은 소셜미디어에서 금리를 일 퍼센트 이하로 빨리 내려야 한다고 요구했습니다.
