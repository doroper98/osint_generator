  - date: 2026.09.16
    text: 점도표는 FOMC 참가자들이 각자 예상하는 금리를 점으로 찍은 표입니다.
    tts: 점도표는 연방공개시장위원회 참가자들이 각자 예상하는 금리를 점으로 찍은 표입니다.
