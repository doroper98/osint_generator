    emphasis:
    - 가격 안정
    sources:
    - clm_0030
  - date: 2026.09.16
    text: CNN과 NBC뉴스는 워시 의장이 대통령의 금리 압박에 대한 언급을 거부했다고 보도했습니다.
    tts: 씨엔엔과 엔비씨뉴스는 워시 의장이 대통령의 금리 압박에 대한 언급을 거부했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0029
