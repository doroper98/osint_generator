    emphasis: []
    sources:
    - clm_0025
    - clm_0026
  - date: 2026.09.16
    text: 올해 실질 GDP 성장률 전망 중앙값은 2.3%입니다.
    tts: 올해 실질 국내총생산 성장률 전망 중앙값은 이점삼 퍼센트입니다.
