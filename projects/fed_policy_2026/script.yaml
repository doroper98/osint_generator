    - series:CPIAUCSL
  - date: 2026.09.16
    text: 워시 의장은 실업률이 약 4.1%로 낮은 수준이라고 밝혔습니다.
    tts: 워시 의장은 실업률이 약 사점일 퍼센트로 낮은 수준이라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0023
  - date: '2026.08'
    text: ABC뉴스는 8월 고용이 16만 2천 명 늘었다고 보도했습니다.
    tts: 에이비씨뉴스는 팔월 고용이 십육만이천 명 늘었다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0024
  - date: 2026.09.16
    text: ABC뉴스는 인상 당일 국제 유가가 배럴당 105달러를 웃돌았다고 보도했습니다.
    tts: 에이비씨뉴스는 인상 당일 국제 유가가 배럴당 백오 달러를 웃돌았다고 보도했습니다.
    emphasis:
    - 105달러
    sources:
    - clm_0038
  - date: 2026.09.16
    text: ABC뉴스는 AAA 자료를 인용해 휘발유 평균 가격이 갤런당 4.36달러라고 전했습니다.
    tts: 에이비씨뉴스는 미국자동차협회 자료를 인용해 휘발유 평균 가격이 갤런당 사점삼육 달러라고 전했습니다.
    emphasis: []
    sources:
    - clm_0039
