schema_version: 1
title: 연준, 다시 금리를 올리다
subtitle: 2023년 이후 첫 인상, 그리고 아직 남은 질문
date: 2026.09.29
scenes:
- id: open
  sentences:
  - date: 2026.09.16
    text: 9월 16일, 미국 연준이 금리를 올렸습니다.
    tts: 구월 십육일, 미국 연준이 금리를 올렸습니다.
    emphasis:
    - 올렸습니다
    sources:
    - clm_0001
  - date: 2026.09.16
    text: CNN과 NBC 등은 2023년 이후 첫 금리 인상이라고 보도했습니다.
    tts: 씨엔엔과 엔비씨 등은 이천이십삼년 이후 첫 금리 인상이라고 보도했습니다.
    emphasis:
    - 첫 금리 인상
    sources:
    - clm_0003
  - date: '2025'
    text: 1년 전만 해도 연준은 금리를 내리고 있었습니다.
    tts: 일 년 전만 해도 연준은 금리를 내리고 있었습니다.
    emphasis: []
    sources:
    - clm_0014
    - clm_0015
- id: decision
  sentences:
  - date: 2026.09.16
    text: 연방기금금리는 은행끼리 하루짜리 자금을 빌려줄 때 적용되는 미국의 기준금리입니다.
    emphasis:
    - 연방기금금리
    sources:
    - clm_0001
  - date: 2026.09.16
    text: 연방공개시장위원회, FOMC는 목표 범위를 0.25%p 올렸다고 발표했습니다.
    tts: 연방공개시장위원회는 목표 범위를 영점이오 퍼센트포인트 올렸다고 발표했습니다.
    emphasis:
    - 0.25%p
    sources:
    - clm_0001
  - date: 2026.09.16
    text: 새 목표 범위는 3.75~4%입니다.
    tts: 새 목표 범위는 삼점칠오에서 사 퍼센트입니다.
    emphasis:
    - 3.75~4%
    sources:
    - clm_0001
  - date: '2026.09'
    text: 연준 이사회 자료로 9월 목표 범위 하단은 3.75%입니다.
    tts: 연준 이사회 자료로 구월 목표 범위 하단은 삼점칠오 퍼센트입니다.
    emphasis: []
    sources:
    - series:DFEDTARL
  - date: 2026.09.16
    text: 결정은 12대 0, 만장일치였습니다.
    tts: 결정은 십이 대 영, 만장일치였습니다.
    emphasis:
    - 만장일치
    sources:
    - clm_0002
  - date: 2026.09.16
    text: FOMC 성명은 인플레이션이 여전히 높다고 밝혔습니다.
    tts: 연방공개시장위원회 성명은 인플레이션이 여전히 높다고 밝혔습니다.
    emphasis:
    - 여전히 높다
    sources:
    - clm_0004
- id: cuts_2025
  sentences:
  - date: '2025.09'
    text: 폭스비즈니스는 연준이 2025년 9월에도 금리를 내렸다고 보도했습니다.
    tts: 폭스비즈니스는 연준이 이천이십오년 구월에도 금리를 내렸다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0016
  - date: 2025.10.29
    text: 2025년 10월 29일, FOMC는 목표 범위를 0.25%p 내렸다고 발표했습니다.
    tts: 이천이십오년 시월 이십구일, 연방공개시장위원회는 목표 범위를 영점이오 퍼센트포인트 내렸다고 발표했습니다.
    emphasis: []
    sources:
    - clm_0014
  - date: 2025.10.29
    text: 이때 범위는 3.75~4%로, 지금과 같은 수준이었습니다.
    tts: 이때 범위는 삼점칠오에서 사 퍼센트로, 지금과 같은 수준이었습니다.
    emphasis:
    - 지금과 같은 수준
    sources:
    - clm_0014
    - clm_0001
  - date: 2025.12.10
    text: 12월 10일에는 다시 내려 3.5~3.75%가 됐습니다.
    tts: 십이월 십일에는 다시 내려 삼점오에서 삼점칠오 퍼센트가 됐습니다.
    emphasis:
    - 3.5~3.75%
    sources:
    - clm_0015
- id: hold_2026
  sentences:
  - date: '2026'
    text: 올해 FOMC는 7월까지 다섯 번의 회의에서 모두 금리를 동결했습니다.
    tts: 올해 연방공개시장위원회는 칠월까지 다섯 번의 회의에서 모두 금리를 동결했습니다.
    emphasis:
    - 동결
    sources:
    - clm_0010
    - clm_0011
    - clm_0012
    - clm_0013
    - clm_0005
  - date: 2026.02.28
    text: NBC와 ABC에 따르면 이란 전쟁은 2월 28일 미국과 이스라엘의 공격으로 시작됐습니다.
    tts: 엔비씨와 에이비씨에 따르면 이란 전쟁은 이월 이십팔일 미국과 이스라엘의 공격으로 시작됐습니다.
    emphasis:
    - 이란 전쟁
    sources:
    - clm_0037
  - date: '2026'
    text: ABC뉴스는 이란이 호르무즈 해협을 사실상 봉쇄했다고 보도했습니다.
    tts: 에이비씨뉴스는 이란이 호르무즈 해협을 사실상 봉쇄했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: '2026.05'
    text: ABC뉴스는 워시가 5월 연준 의장에 취임했다고 보도했습니다.
    tts: 에이비씨뉴스는 워시가 오월 연준 의장에 취임했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0018
  - date: '2026.06'
    text: 연준 자료에 따르면 워시 의장이 처음 주재한 회의는 6월이었습니다.
    tts: 연준 자료에 따르면 워시 의장이 처음 주재한 회의는 유월이었습니다.
    emphasis: []
    sources:
    - clm_0017
  - date: '2026'
    text: 선제 지침은 중앙은행이 앞으로의 금리 방향을 미리 시사하는 문구입니다.
    emphasis:
    - 선제 지침
    sources:
    - clm_0019
  - date: '2026'
    text: CNN과 폭스비즈니스는 워시 체제에서 성명의 선제 지침이 빠졌다고 보도했습니다.
    tts: 씨엔엔과 폭스비즈니스는 워시 체제에서 성명의 선제 지침이 빠졌다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0019
- id: july_dissent
  sentences:
  - date: 2026.07.29
    text: 7월 29일 동결 결정은 9대 3으로 갈렸습니다.
    tts: 칠월 이십구일 동결 결정은 구 대 삼으로 갈렸습니다.
    emphasis:
    - 9대 3
    sources:
    - clm_0006
  - date: 2026.07.29
    text: 연준 성명에 따르면 해맥·카시카리·로건은 0.25%p 인상을 원하며 반대했습니다.
    tts: 연준 성명에 따르면 해맥, 카시카리, 로건은 영점이오 퍼센트포인트 인상을 원하며 반대했습니다.
    emphasis:
    - 인상
    sources:
    - clm_0006
    - clm_0007
  - date: 2026.07.29
    text: ABC뉴스는 같은 방향 반대표 3표가 10년 만에 가장 많았다고 보도했습니다.
    tts: 에이비씨뉴스는 같은 방향 반대표 세 표가 십 년 만에 가장 많았다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0008
  - date: 2026.07.29
    text: CNN은 그날 다우지수가 1,153포인트 떨어졌다고 보도했습니다.
    tts: 씨엔엔은 그날 다우지수가 천백오십삼 포인트 떨어졌다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0009
- id: prices_jobs
  sentences:
  - date: 2026.09.16
    text: PCE 물가는 개인이 소비한 상품과 서비스 가격의 변화를 재는 지표입니다.
    tts: 개인소비지출 물가는 개인이 소비한 상품과 서비스 가격의 변화를 재는 지표입니다.
    emphasis:
    - PCE 물가
    sources:
    - clm_0020
  - date: 2026.09.16
    text: 근원 PCE는 변동이 큰 식품과 에너지를 뺀 값입니다.
    tts: 근원 개인소비지출 물가는 변동이 큰 식품과 에너지를 뺀 값입니다.
    emphasis:
    - 근원 PCE
    sources:
    - clm_0021
  - date: 2026.09.16
    text: 워시 의장은 8월 PCE 상승률을 약 3.6%로 추정했습니다.
    tts: 워시 의장은 팔월 개인소비지출 물가 상승률을 약 삼점육 퍼센트로 추정했습니다.
    emphasis:
    - 3.6%
    sources:
    - clm_0020
  - date: 2026.09.16
    text: 근원 PCE는 약 3.2% 수준이라고 밝혔습니다.
    tts: 근원 개인소비지출 물가는 약 삼점이 퍼센트 수준이라고 밝혔습니다.
    emphasis:
    - 3.2%
    sources:
    - clm_0021
  - date: '2026.08'
    text: 노동통계국 자료로 8월 소비자물가는 전년 같은 달보다 3.35% 올랐습니다.
    tts: 노동통계국 자료로 팔월 소비자물가는 전년 같은 달보다 삼점삼오 퍼센트 올랐습니다.
