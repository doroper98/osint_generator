# 『연준, 다시 금리를 올리다』 주문 (v4.4.0, back_and_forth D-0090 작업 4) — docs/handoff/20 §11 주문 템플릿을 그대로 채웠다.
# 사용자 결정 항목(D-0090 표)은 사용자 답이 오기 전까지 지침 기본값이다(by: default — provenance 에 "사용자 미확정").
schema_version: 1
