instructions:   # 20 §11 원문
  - "장르: 지정학 아님 → 20번 문서의 장르 확장 규약을 따른다."
  - 불변 층(20 §1.1)은 모두 지킨다.
  - "장르 프로필이 없으면 먼저 제안하라 — 주 무대 1개, 새 시각 요소 최대 3개, 색 의미, 데이터 출처. 실제 엔진으로 렌더한 스케치 프리뷰 1~3컷과 함께 보고하고 승인을 받는다."
  - 승인 후 원고(원고 승인 게이트) → 연출 → 시각 검수 → 프리뷰 승인 게이트 → 렌더 순서로 진행한다.
  - 모든 수치는 공개 데이터 출처와 기준 시점을 표기한다. 투자 권유 표현은 쓰지 않는다.
  - 슬라이드처럼 차트를 한 장씩 넘기는 구성은 금지다. 연속된 무대 위의 카메라 문법을 지킨다.
