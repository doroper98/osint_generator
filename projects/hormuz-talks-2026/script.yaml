schema_version: 1
title: 호르무즈 협상 — 무엇을 먼저 할 것인가
subtitle: 해협과 제재, 동결 자금, 그리고 핵 사찰
date: 2026.09.30
scenes:
- id: open
  sentences:
  - date: 2026.09.26
    text: 9월 26일, 트럼프 대통령이 이란의 해협 재개방 제안을 거부했습니다.
    tts: 구월 이십육일, 트럼프 대통령이 이란의 해협 재개방 제안을 거부했습니다.
    emphasis:
    - 거부
    sources:
    - clm_0001
  - date: 2026.09.26
    text: 트럼프 대통령은 이란 제안을 받아들일 수 없다고 말했습니다.
    emphasis: []
    sources:
    - clm_0002
  - date: '2026.09'
    text: 보도에 따르면 쟁점은 해협과 제재, 자금, 핵 사찰 가운데 무엇을 먼저 하느냐입니다.
    emphasis:
    - 먼저
    sources:
    - clm_0004
    - clm_0013
- id: proposal
  sentences:
  - date: 2026.09.16
    text: 알자지라에 따르면 이란 관리는 9월 16일 중재자를 통해 최신 제안을 냈다고 밝혔습니다.
    tts: 알자지라에 따르면 이란 관리는 구월 십육일 중재자를 통해 최신 제안을 냈다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0009
  - date: 2026.09.25
    text: 아락치 외무장관은 조건이 충족되면 7일 안에 해협을 열 수 있다고 밝혔습니다.
    tts: 아락치 외무장관은 조건이 충족되면 칠일 안에 해협을 열 수 있다고 밝혔습니다.
    emphasis:
    - 7일
    sources:
    - clm_0006
  - date: 2026.09.25
    text: 미국 측 조치는 4~5일 안에 끝날 수 있다고도 말했습니다.
    tts: 미국 측 조치는 사오일 안에 끝날 수 있다고도 말했습니다.
    emphasis: []
    sources:
    - clm_0007
  - date: 2026.09.25
    text: 이란은 동결 자금 해제, 제재 해제, 해상봉쇄 종료를 요구합니다.
    emphasis:
    - 해상봉쇄 종료
    sources:
    - clm_0004
  - date: 2026.09.25
    text: 알자지라는 해제 대상 동결 자산이 약 120억 달러라고 보도했습니다.
    tts: 알자지라는 해제 대상 동결 자산이 약 백이십억 달러라고 보도했습니다.
    emphasis:
    - 120억 달러
    sources:
    - clm_0005
- id: rejection_dispute
  sentences:
  - date: 2026.09.26
    text: 트럼프 대통령은 기자들에게 그들의 제안을 거부한다고 말했습니다.
    emphasis: []
    sources:
    - clm_0003
  - date: 2026.09.26
    text: AP 통신에 따르면 익명의 관리들은 공식 거부가 아니며 협상 전술일 수 있다고 밝혔습니다.
    tts: 에이피 통신에 따르면 익명의 관리들은 공식 거부가 아니며 협상 전술일 수 있다고 밝혔습니다.
    emphasis:
    - 협상 전술
    sources:
    - clm_0003
  - date: 2026.09.26
    text: 아락치 외무장관은 중재자를 통한 확정 답변을 기다린다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0008
- id: mediation
  sentences:
  - date: '2026.09'
    text: 협상은 카타르가 중재하고 있습니다.
    emphasis:
    - 카타르
    sources:
    - clm_0010
  - date: 2026.09.22
    text: 9월 22일 유엔총회 기간, 직접 회동이 있었는지를 두고 말이 엇갈립니다.
    tts: 구월 이십이일 유엔총회 기간, 직접 회동이 있었는지를 두고 말이 엇갈립니다.
    emphasis: []
    sources:
    - clm_0011
  - date: 2026.09.22
    text: 이란 국영매체는 아락치 장관과 위트코프 특사가 만났다고 전했습니다.
    emphasis: []
    sources:
    - clm_0011
  - date: 2026.09.22
    text: 위트코프 특사는 중재자들이 대표단 사이를 오가며 협상했다고 말했습니다.
    emphasis: []
    sources:
    - clm_0011
  - date: 2026.09.26
    text: 알자지라에 따르면 미국 관리는 거부 이후에도 간접 협상이 이어진다고 밝혔습니다.
    emphasis:
    - 간접 협상
    sources:
    - clm_0012
  - date: 2026.09.28
    text: 알자지라와 A 뉴스에 따르면 아락치 장관은 9월 28일 뉴욕에서 카타르 중재자들을 만났습니다.
    tts: 알자지라와 에이 뉴스에 따르면 아락치 장관은 구월 이십팔일 뉴욕에서 카타르 중재자들을 만났습니다.
    emphasis: []
    sources:
    - clm_0018
  - date: 2026.09.28
    text: 아락치 장관은 카타르가 새 아이디어를 미국에 전달할 것이라고 밝혔습니다.
    emphasis:
    - 새 아이디어
    sources:
    - clm_0019
  - date: 2026.09.30
    text: 모하제라니 정부 대변인은 9월 30일 미국의 답변을 받았다고 밝혔습니다.
    tts: 모하제라니 정부 대변인은 구월 삼십일 미국의 답변을 받았다고 밝혔습니다.
    emphasis:
    - 미국의 답변
    sources:
    - clm_0020
  - date: 2026.09.30
    text: 대변인에 따르면 답변 내용은 공개되지 않았습니다.
    emphasis: []
    sources:
    - clm_0021
- id: nuclear
  sentences:
  - date: '2026.09'
    text: 알자지라에 따르면 미국 관리는 핵 문제가 빠지면 합의는 없다고 밝혔습니다.
    emphasis:
    - 핵 문제
    sources:
    - clm_0013
  - date: '2026.09'
    text: 이 관리는 핵 진전이 있으면 제재 완화와 자금 해제도 가능하다고 말했습니다.
    emphasis: []
    sources:
    - clm_0014
  - date: '2026.09'
    text: AP 통신에 따르면 한 역내 관리는 미국이 사찰단 입국을 요구한다고 말했습니다.
    tts: 에이피 통신에 따르면 한 역내 관리는 미국이 사찰단 입국을 요구한다고 말했습니다.
    emphasis:
    - 사찰단
    sources:
    - clm_0015
  - date: '2026.09'
    text: NPR은 페제시키안 대통령이 제안이 수용되면 유엔 사찰단을 받겠다고 말했다고 보도했습니다.
    tts: 엔피알은 페제시키안 대통령이 제안이 수용되면 유엔 사찰단을 받겠다고 말했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0016
  - date: 2026.09.26
    text: 페제시키안 대통령은 미국과의 협상을 더는 신뢰하지 않는다고 말했습니다.
    emphasis:
    - 신뢰
    sources:
    - clm_0017
- id: war_background
  sentences:
  - date: 2026.02.28
    text: 이란은 2월 28일 미국·이스라엘의 공격 직후 해협을 봉쇄했습니다.
    tts: 이란은 이월 이십팔일 미국과 이스라엘의 공격 직후 해협을 봉쇄했습니다.
    emphasis:
    - 봉쇄
    sources:
    - clm_0028
  - date: '2026.09'
    text: NPR은 페제시키안 대통령이 미국이 먼저 이란의 길을 막았다고 말했다고 보도했습니다.
    tts: 엔피알은 페제시키안 대통령이 미국이 먼저 이란의 길을 막았다고 말했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0029
  - date: '2026.04'
    text: A 뉴스는 4월에 휴전 합의가 이뤄졌다고 보도했습니다.
    tts: 에이 뉴스는 사월에 휴전 합의가 이뤄졌다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0042
  - date: '2026.06'
    text: 미국과 이란은 6월 양해각서에 서명했습니다.
    tts: 미국과 이란은 유월 양해각서에 서명했습니다.
    emphasis:
    - 양해각서
    sources:
    - clm_0025
  - date: '2026.06'
    text: PBS와 알자지라는 이 합의가 며칠 만에 무산됐다고 보도했습니다.
    tts: 피비에스와 알자지라는 이 합의가 며칠 만에 무산됐다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0026
  - date: '2026.06'
    text: 미국 관리는 이란이 상선에 발포해 합의를 깼다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0027
  - date: '2026.06'
    text: 이란 정부는 이를 부인하며 레바논 공격을 못 막은 미국 탓이라고 주장했습니다.
    emphasis: []
    sources:
    - clm_0027
- id: pressure
  sentences:
  - date: 2026.09.28
    text: 알자지라에 따르면 트럼프 대통령은 9월 28일 미국이 이길 것이라고 말했습니다.
    tts: 알자지라에 따르면 트럼프 대통령은 구월 이십팔일 미국이 이길 것이라고 말했습니다.
