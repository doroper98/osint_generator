    tts: 알자지라에 따르면 팔월 말 로이터와 입소스 조사에서 미국인 육십삼 퍼센트가 전쟁에 반대했습니다.
    emphasis:
    - 63%
    sources:
    - clm_0043
- id: shipping_oil
