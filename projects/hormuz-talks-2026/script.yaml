    emphasis: []
    sources:
    - clm_0023
  - date: '2026.09'
    text: 월스트리트저널은 트럼프가 중간선거 뒤 폭격 재개를 예상한다고 측근들에게 말했다고 보도했습니다.
    emphasis:
