  - date: 2026.09.28
    text: 두 매체는 배럴당 108달러 안팎까지 올랐다고 전했습니다.
    tts: 두 매체는 배럴당 백팔 달러 안팎까지 올랐다고 전했습니다.
    emphasis:
    - 108달러
    sources:
    - clm_0037
- id: second_strait
  sentences:
  - date: '2026.09'
