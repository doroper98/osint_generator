# 칸나이 병력·사상자 레코드(schemas.data_models.ForceFiguresFile) — 문장 sources 의 force:<id> 가 가리킨다([casualty-unsourced]).
# 사료 값 = 영역본 문장 그대로(quote). 절 번호: Paton 영역은 본문에 절이 없어 그리스어 쪽 여백 번호로 맞췄다(OCR), Foster 는 라틴어 쪽 여백 번호.
# band(범위 띠): 현대 학술 추정을 이 세션에서 열람하지 못했다(Wikipedia·학술 사이트 차단) → kind ancient_range(고대 사료 간 범위, D-0610 ①).
# 라벨 문구는 rules war_history.casualty.band_labels — '현대 추정' 이라 부르지 않는다. 학술 출처가 열리면 modern_estimate 로 교체.
