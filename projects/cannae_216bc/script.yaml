  - date: '-216'
    text: 리비우스는 누미디아 기병 약 500명이 거짓 투항한 뒤 후방을 공격했다고 전했습니다.
    tts: 리비우스는 누미디아 기병 약 오백 명이 거짓 투항한 뒤 후방을 공격했다고 전했습니다.
    emphasis:
    - 거짓 투항
    sources:
    - clm_0021
  - date: '-216'
    text: 아이밀리우스는 이 전투에서 전사했습니다.
