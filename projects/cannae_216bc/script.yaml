    sources:
    - clm_0024
  - date: '-216'
    text: 함께 달아난 기병을 폴리비오스는 70명, 리비우스는 약 50명으로 전했습니다.
    tts: 함께 달아난 기병을 폴리비오스는 일흔 명, 리비우스는 약 쉰 명으로 전했습니다.
    emphasis:
