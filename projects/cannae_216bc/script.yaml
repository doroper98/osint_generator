    sources:
    - clm_0022
  - date: '1773'
    text: 이 장면은 훗날 존 트럼불이 「칸나이 전투에서 파울루스 아이밀리우스의 죽음」으로 그렸습니다.
    tts: 이 장면은 훗날 존 트럼불이 칸나이 전투에서 파울루스 아이밀리우스의 죽음으로 그렸습니다.
