# v3(D-0609·D-0610, 구현 세션): 문장 머리 접속사 정리, 귀속 꼴 변주·논쟁 쌍 묶기, 중복 제거, 흉상 '전해지는'·위치 이동, 증거 층(보충 검증 claim). 사실·수치는 claims·force 그대로
schema_version: 1
title: 칸나이, 기원전 216년
subtitle: 한니발의 초승달 진형과 양익 포위
date: 2026.11.01
scenes:
- id: cold_open
  kind: cold
  stage: 이탈리아
  sentences:
  - date: '-216'
    text: 기원전 216년, 로마 원로원은 8개 군단을 전장에 보내기로 했습니다.
    tts: 기원전 이백십육 년, 로마 원로원은 여덟 개 군단을 전장에 보내기로 했습니다.
    emphasis:
    - 8개 군단
    sources:
    - clm_0002
  - date: '-216'
    text: 폴리비오스가 적은 로마군은 동맹군을 포함해 보병 약 8만 명, 기병 6천여 명이었습니다.
    tts: 폴리비오스가 적은 로마군은 동맹군을 포함해 보병 약 팔만 명, 기병 육천여 명이었습니다.
    emphasis:
    - 약 8만 명
    sources:
    - clm_0003
  - date: '-216'
    text: 반면 카르타고군은 보병 약 4만 명, 기병 약 1만 명이었습니다.
    tts: 반면 카르타고군은 보병 약 사만 명, 기병 약 만 명이었습니다.
    emphasis:
    - 약 4만 명
    sources:
    - clm_0005
    - clm_0004
    - force:carthage_strength
  - date: '-216'
    text: 그러나 이 전투에서 포위돼 무너진 쪽은 병력이 많은 로마군이었습니다.
    emphasis:
    - 로마군
    sources:
    - clm_0018
- id: prelude
  kind: act
  stage: 이탈리아
  sentences:
  - date: '-216'
    text: 전투에 앞서 로마 지휘부 안에서는 이견이 있었습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0033
  - date: '-216'
    text: 로마군은 두 집정관이 함께 이끌고 있었습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0035
    - clm_0032
  - date: '-216'
    text: 집정관 루키우스 아이밀리우스 파울루스는 평탄한 지형에서 싸우는 데 반대했습니다.
    emphasis:
    - 반대
    sources:
    - clm_0033
  - date: '-216'
    text: 적의 기병이 우세했기 때문이었습니다.
    emphasis: []
    sources:
    - clm_0033
  - date: '-216'
    text: 폴리비오스가 옮긴 연설에서 아이밀리우스는, 이전 패전 때는 두 집정관이 함께 싸운 적이 없었다고 강조했습니다.
    emphasis: []
    sources:
    - clm_0032
  - date: '-216'
    text: 한편 한니발은 누미디아 기병을 보내 작은 로마 진영의 물 긷는 병사들을 공격했습니다.
    emphasis:
    - 누미디아 기병
    sources:
    - clm_0034
  - date: '1667'
    text: 한니발로 전해지는 대리석 흉상은 1667년 카푸아에서 발견됐습니다.
    tts: 한니발로 전해지는 대리석 흉상은 천육백육십칠 년 카푸아에서 발견됐습니다.
    role: background
    emphasis:
    - 대리석 흉상
    sources:
    - clm_0039
  - date: '-216'
    text: 전투 당일 지휘 당번은 집정관 테렌티우스 바로였고, 그가 군을 출진시켰습니다.
    emphasis:
    - 테렌티우스 바로
    sources:
    - clm_0035
  - date: '-216'
    text: 리비우스는 바로가 아이밀리우스와 상의하지 않고 출진 신호를 올렸다고 전했습니다.
    emphasis:
    - 상의하지 않고
    sources:
    - clm_0036
  - date: '-216'
    text: 이렇게 두 군대는 강을 끼고 마주 섰습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0007
- id: deployment
  kind: act
  stage: 이탈리아
  sentences:
  - date: '-216'
    text: 전투는 두 군대가 진을 치는 데서 시작됐습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0006
  - date: '-216'
    text: 로마군은 남쪽을, 카르타고군은 북쪽을 향해 진을 쳤습니다.
    role: intro
    emphasis:
    - 남쪽
    - 북쪽
    sources:
    - clm_0006
  - date: '-216'
    text: 로마 기병은 강 쪽 우익에 섰습니다.
    emphasis: []
    sources:
    - clm_0007
  - date: '-216'
    text: 로마군 우익은 아이밀리우스가, 좌익은 바로가 지휘했습니다.
    emphasis: []
    sources:
    - clm_0008
  - date: '-216'
    text: 그리고 중앙은 그나이우스 세르빌리우스가 맡았습니다.
    emphasis: []
    sources:
    - clm_0009
  - date: '-216'
    text: 이에 맞서 카르타고군 좌익은 하스드루발이 지휘했습니다.
    emphasis:
    - 하스드루발
    sources:
    - clm_0010
  - date: '-216'
    text: 카르타고군 중앙은 한니발이 동생 마고와 함께 맡았습니다.
    emphasis:
    - 한니발
    sources:
    - clm_0012
  - date: '-216'
    text: 우익 장수는 폴리비오스가 한노로, 리비우스가 마하르발로 전했습니다.
    emphasis:
    - 한노
    - 마하르발
    sources:
    - clm_0011
  - date: '-216'
    text: 한니발은 중앙의 히스파니아·켈트 보병을 앞으로 내밀었습니다.
    tts: 한니발은 중앙의 히스파니아, 켈트 보병을 앞으로 내밀었습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: '-216'
    text: 즉 중앙을 적 쪽으로 볼록하게 내민 이 배치가 초승달 진형이었습니다.
    emphasis:
    - 초승달
    sources:
    - clm_0013
  - date: '-216'
    text: 또한 아프리카 보병은 앞선 전투에서 노획한 로마 무기로 무장했습니다.
    emphasis:
    - 노획한 로마 무기
    sources:
    - clm_0014
  - date: '-216'
    text: 리비우스는 볼투르누스라는 바람이 먼지를 몰아 로마군의 시야를 가렸다고 전했습니다.
    emphasis:
    - 볼투르누스
    sources:
    - clm_0015
  - date: '-216'
    text: 진형이 갖춰진 두 군대 사이에서 마침내 전투가 시작됐습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0006
    - clm_0016
- id: encirclement
  kind: act
  stage: 이탈리아
  sentences:
