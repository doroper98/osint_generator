# 칸나이 terrain3d 구간 부대 기록(schemas.war_units.WarForces — v7.4.0 back_and_forth D-0615 §2).
# 위치·크기·간격은 개략(축척 아님). 배치·이동 = 폴리비오스 『역사』 III.113~116(Paton 영역 1922) 서술의 개략 — projects/cannae_sketch/sketch.yaml 과 같은 좌표.
# 키프레임 시각 = 원고 문장 앵커(sid). 문장이 부대를 말할 때 그 부대가 나오거나 움직인다(구성 = 연출, 수치·검증 = 코드, P8).
#  로마군 남쪽(180°)을 봄: 우익(강 쪽) 로마 기병 · 중앙 보병 · 좌익 동맹 기병 · 앞에 벨리테스(III.113)
#  카르타고군 북쪽(0°)을 봄: 좌익(강 쪽) 히스파니아·켈트 기병 · 아프리카 보병 · 히스파니아·켈트 보병(가운데를 앞으로 내민 초승달) ·
#  아프리카 보병 · 우익 누미디아 기병(III.113~114). 기병 충돌·로마 기병 패주(III.115) → 로마 보병이 초승달을 밀어 오목 → 아프리카 보병이
#  양쪽에서 안으로 돌아섬 → 하스드루발 기병이 뒤를 침(III.115~116)
