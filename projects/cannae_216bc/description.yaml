# 『칸나이, 기원전 216년』 유튜브 설명문 (v7.4.0, D-0632). chapters.at = 원고 장면 id 또는 TITLE. 수치는 원고와 같은 귀속(폴리비오스·리비우스)으로만.
schema_version: 1
headline: 칸나이, 기원전 216년 — 한니발은 어떻게 로마군을 에워쌌나
summary: 기원전 216년 아풀리아의 아우피두스 강가에서 한니발의 카르타고군이 로마군을 양쪽 측면과 후방에서 에워쌌습니다. 폴리비오스 『역사』 III권과 리비우스 『로마사』 XXII권의 서술을 따라 두 군대의 배치, 초승달 진형, 기병의 충돌과 포위, 그리고 전투 뒤를 지형 위에서 다시 그렸습니다. 두 사료가 다르게 전하는 대목은 둘 다 밝혔고, 부대 위치·크기·간격은 사료 서술의 개략입니다(축척 아님). 작품·유물 화면에는 작가·연대·소장처를 적었습니다.
