instructions:
  - "장르 war_history 문법(UF-206·UF-150): 지도는 뼈대, 미술·사료·지명이 살이다. 고대 증거 층 = 당대 미술(period_art) ≥ 1 · 후대 미술 ≥ 1 · 현장(site) · 지명 유래(toponymy) 1문장 · 사료 인용(quote) ≥ 2."
  - "사료는 폴리비오스 『역사』 III.107~118(Paton 영역 1922)과 리비우스 『로마사』 XXII.43~51(Foster 영역 1929)만. 인용은 저자·작품·권·장을 밝힌다. 두 사료가 다르면 둘 다 같은 무게로 말한다(G4)."
  - "병력·사상자 수치는 forces.yaml 레코드(사료 값 + 추정 범위 띠)를 인용한 문장에서만 말한다([casualty-unsourced]). 수치는 '폴리비오스에 따르면' 처럼 귀속한다."
  - "작품을 보일 때마다 작가·연대·소장처·만든 뜻을 한 문장(레코드 art_history). 후대 작품은 후대 묘사임을 말로도 밝힌다."
  - "과거 시제. 상투 문구 0(slop_check). 발음 텍스트에 숫자·기호 없음."
  - "부대 이동·배치는 개략(사료 서술 범위 안). 지어낸 대사·심리 묘사 금지. 한니발의 의도는 사료가 말한 만큼만."
