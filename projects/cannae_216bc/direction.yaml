  - {at: {sid: encirclement_5}, mode: move, dur: 3.0, camera: {lon: 16.11, lat: 41.334, w: 0.08}, stage: terrain3d, reason: 중앙 보병으로}
  - {at: {sid: encirclement_6}, mode: drift, dur: 4.0, camera: {lon: 16.11, lat: 41.334, w: 0.08}, stage: terrain3d, reason: 양익 포위 — 천천히 기울어 궤도}
