# direction.yaml — 칸나이(cannae_216bc) 콘티 판 v1 연출. 구현 세션 작성(D-0616 §1-3 감독 메모 + D-0615·D-0617). 수치·검증은 코드(P8).
# 주 무대 mercator relief(장르 기본) — 이탈리아 작전 지도 → 칸나이 확대 → terrain3d 구간(deployment_1 ~ encirclement_14, D-0617 승인):
#   90° 내려다보기로 들어가 부대 키프레임(forces.terrain3d.yaml)이 배치·초승달·포위를 움직인다. 궤도는 drift 숏 두 곳(deployment_10 초승달,
#   encirclement_6 포위)에서만 장면 단위로. 그 밖은 90° 시점 숏 단위 pan·push 로 움직이는 부대를 따라간다(encirclement_0 기병 충돌, encirclement_5 중앙).
# 증거 카드: 흉상·셰켈 은화·타니트 비석·트럼불·Smith 사전·클로스 / 사료 인용 2(quote.source, D-0617 ①). 날짜 뱃지는 문장 date 가 정한다.
version: 1
genre: war_history
stage: mercator
media_note: >-
  콘티 판 v1(흐름 검토). 사상자 문장의 사료 간 범위 띠(force 레코드 band)는 화면 요소가 아직 엔진에 없어 이번 판에 넣지 않았다(R 에 기록).
  지도는 고대 기반(stage_config.mercator.basemap_era ancient — 현대 국경·현대 지명 없음).
stage_config:
  mercator:
    basemap_era: ancient
  terrain3d:
    forces: forces.terrain3d.yaml
places:
  rome: [12.4964, 41.8919]
  cannae: [16.1325, 41.3065]
