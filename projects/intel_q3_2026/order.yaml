  - "차트는 하나의 시간축 세계(C0·UF-135): 분기 매출 막대 + 예상 표식 + 4분기 가이던스 띠(INTC_GUIDE_REV_LO/HI) + 주가 선(보조 계열 끝값 핀). 차트 아일랜드 하나에 층 3 이상, 새 층 간격 4초 이상. 무대 조판 정본 D-0330(손실 막대 A, noturno)."
  - "주가 반응은 창을 밝힌다: 시간외(보도 인용) / 10월 30일 정규장 종가(레코드)."
  - "act5 는 mercator 보조 무대 전환 1회: 미국(본사·공장) · 이스라엘 공장 사고 · 한국 메모리(삼성 편과의 고리)."
  - 투자 권유 표현 금지, 엔딩 카드 투자 고지 줄. 화면 조작 해설 문구 금지(UF-202). 사고 사망자는 숫자만, 자극적 묘사 금지.
