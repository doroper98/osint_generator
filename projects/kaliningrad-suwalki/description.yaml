summary: 2026년 9월 30일, 러시아는 나토가 칼리닌그라드 봉쇄를 준비한다는 정보가 있다며 핵무기를 포함한 모든 무기를 쓸 준비가 돼 있다고 밝혔습니다. 튜턴 기사단의 쾨니히스베르크가 어떻게 러시아의 역외 영토 칼리닌그라드가 됐는지, 폴란드와 리투아니아 국경 위의 수바우키 회랑이 왜 발트 3국과 나토를 잇는 유일한 육로가 됐는지, 그리고 나토와 러시아가 이 지역을 어떻게 다뤄 왔는지 지도로 정리했습니다.
