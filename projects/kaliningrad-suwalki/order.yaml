# 『칼리닌그라드와 수바우키 회랑』 주문 (v5.5.1) — 사용자 요청(2026-10-04) 그대로 옮김.
schema_version: 1
topic: 칼리닌그라드는 어떻게 생겨났는지(쾨니히스베르크·동프로이센·1945년 소련 편입·1991년 고립 영토), 수바우키 회랑은 왜 생겼는지(1920년 폴란드·리투아니아 국경), 나토와 러시아가 이 지역을 어떻게 다뤄 왔고 지금(2026년 가을) 어떻게 다루고 있는지
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다
instructions:
  - "사용자 요청: 위의 내용을 자세히 설명하는 영상. 콘티판 먼저. 나토 휘장도 만들어 쓴다(나토가 주체인 문장 = 휘장 뱃지)."
  - 역사(형성) → 회랑이 생긴 이유 → 나토·러시아가 다뤄 온 방식(시간 순) → 지금 상황 순서로 흐름을 만든다.
  - 수바우키 회랑은 누가 일부러 '만든' 통로가 아니라 국경이 그어진 결과라는 점을 사실대로 설명한다(1920 수바우키 협정·1945 국경·1991 리투아니아 독립).
  - 러시아·나토·리투아니아·폴란드·벨라루스 쪽 입장을 같은 무게로, 발언은 귀속한다("~라고 말했습니다").
  - 수치(회랑 폭·국경 길이·병력·사거리·예산)는 출처와 기준 시점이 있는 것만, 기준이 다르면 기준을 밝힌다(직선 거리 약 65km vs 국경 길이 약 104km).
  - 지도 무대 중심 — 칼리닌그라드, 수바우키, 리투아니아·폴란드·벨라루스, 발트해, 빌뉴스, 민스크.
  - 시간 순 사건(1255 → 1945 → 1991 → 2002 통과 협정 → 2004 나토·EU 가입 → 2016 전진 배치 → 2018 이스칸데르 → 2022 통과 제재 → 2025 독일 여단·자파드 → 2026)은 겹침 카드(cascade)·연표로.
  - 직접 인용은 인용 화면(quote), 가격·추이·통계는 알맞은 차트.
