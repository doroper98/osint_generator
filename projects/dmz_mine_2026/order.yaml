  - 사건의 발단과 전개, 그리고 현재에 이르는 과정을 다룬다.
  - 국내 관점뿐 아니라 해외 관점, 특히 러시아와 우크라이나가 이 북한 관련 사건을 어떻게 보고 다루는지 밀착 검토한다.
  - "사용자 지시: 영상에 <미검증> 딱지·글씨·문구·언급을 넣지 않는다 → 검증 라벨을 숨기지 않는다(C9). 대신 unverified·disputed claim 을 원고에서 인용하지 않는다(verified·corroborated 만 인용)."
  - 단독 보도(RDX 검출·'의도적 도발로 확인'·PMD-6·'북한 부인')와 쿠르스크 공병 경험 → DMZ 매설 인과는 쓰지 않는다.
  - 러시아·우크라이나 정부의 이번 사건 공식 발언은 확인되지 않았다 — 매체 보도 방식과 맥락 사실(북러 조약, 쿠르스크 북한 공병)만 사실로 다룬다.
