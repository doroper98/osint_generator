# 『경유의 길 — 사흘에 한 번』 원고 v2.1 (v7.4.0, D-0229 §3·D-0233 — 사용자 의견 UF-104·105·108·114~117). 콜드 오픈 = 사용자 개고본, 보도 출처는 엔딩 크레딧.
schema_version: 1
title: 경유의 길 — 사흘에 한 번
subtitle: 우크라이나의 정유소 타격, 울산발 유조선, 걸프의 불길, 그리고 워싱턴의 경유 거래
date: 2026.10.17
scenes:
- id: cold
  kind: cold
  stage: 러시아
  sentences:
  - date: 2026.10.15
    text: 전장과는 조금 떨어져 있는 조용하던 10월 15일 새벽, 모스크바에서 남동쪽으로 약 200km 떨어진 도시 랴잔의 정유소에 불길이 올랐습니다.
    tts: 전장과는 조금 떨어져 있는 조용하던 시월 십오일 새벽, 모스크바에서 남동쪽으로 약 이백 킬로미터 떨어진 도시 랴잔의 정유소에 불길이 올랐습니다.
    emphasis:
    - 랴잔
    sources:
    - clm_0099
  - date: 2026.10.15
    text: 러시아 국방부는 우크라이나의 무인기를 격추했으나 그 파편이 불을 냈다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0100
  - date: 2026.10.15
    text: 이 공격으로 나흘 전 트럼프 대통령이 발표한 에너지 휴전은 끝났습니다.
    emphasis:
    - 에너지 휴전
    sources:
    - clm_0099
  - date: 2026.10.15
    text: 젤렌스키 대통령은 휴전에 대해 "이제 끝났다"고 말했습니다.
    tts: 젤렌스키 대통령은 휴전에 대해 이제 끝났다고 말했습니다.
    emphasis: []
    sources:
    - clm_0101
  - date: 2026.10.06
    text: 그리고 이 전쟁이 만든 경유 부족은 한국의 울산항까지 닿아 있었습니다.
    emphasis:
    - 울산항
    sources:
    - clm_0001
- id: act1
  kind: act
  stage: 러시아
  sentences:
  - date: '2026.09'
    text: 이야기의 시작은 올해 봄부터 이어진 러시아 정유소 타격입니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0039
  - date: '2026.09'
    text: 우크라이나의 드론은 왜 유전이 아니라 정유소를 노렸을까요.
    role: intro
    emphasis: []
    sources:
    - clm_0039
    - clm_0117
  - date: '2026.09'
    text: 먼저 그 규모부터 보겠습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0039
  - date: 2026.09.17
    text: 올해 첫 여덟 달 동안 우크라이나는 사흘에 한 번꼴로 러시아 정유소를 타격했습니다.
    emphasis:
    - 사흘에 한 번
    sources:
    - clm_0039
  - date: 2026.09.17
    text: 또한 표적은 원유를 캐는 유전이 아니라, 원유를 경유와 휘발유로 바꾸는 정유소였습니다.
    emphasis: []
    sources:
    - clm_0039
  - date: '2026.09'
    text: 카네기 국제평화재단은 표적이 정유소로 옮겨 간 뒤 러시아 안에서 원유를 정제하기 어려워졌다고 분석했습니다.
    emphasis: []
    sources:
    - clm_0117
  - date: '2026.09'
    text: 다만 같은 분석은 러시아의 원유 수출이 오히려 늘었다고 짚었습니다.
    emphasis: []
    sources:
    - clm_0117
  - date: 2026.09.11
    text: 즉 원유는 계속 팔려 나갔지만, 러시아 안에서 쓸 경유와 휘발유를 만드는 공장이 타격을 받은 것입니다.
    emphasis: []
    sources:
    - clm_0117
    - clm_0041
  - date: 2026.09.11
    text: 특히 국제에너지기구는 드론이 이제 분해·개질 같은 2차 설비를 때리고 있다고 분석했습니다.
    tts: 특히 국제에너지기구는 드론이 이제 분해 개질 같은 이차 설비를 때리고 있다고 분석했습니다.
    emphasis:
    - 2차 설비
    sources:
    - clm_0112
  - date: 2026.09.11
    text: 국제에너지기구는 이런 설비를 바꾸는 데 6~8개월이 걸릴 수 있다고 밝혔습니다.
    tts: 국제에너지기구는 이런 설비를 바꾸는 데 육에서 팔 개월이 걸릴 수 있다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0112
    - clm_0042
  - date: 2026.09.11
    text: 게다가 서방 제재로 러시아는 정제 설비의 교체 장비를 구하기 어렵습니다.
    emphasis: []
    sources:
    - clm_0113
  - date: 2026.10.11
    text: 피해가 확인된 타격 54건 가운데 14건은 2차 설비만, 6건은 두 설비를 모두 망가뜨렸습니다.
    tts: 피해가 확인된 타격 오십사 건 가운데 십사 건은 이차 설비만, 여섯 건은 두 설비를 모두 망가뜨렸습니다.
    emphasis: []
    sources:
    - clm_0115
  - date: 2026.10.11
    text: 유라시아그룹 분석가는 공격 주기가 수리에 걸리는 시간보다 짧은 것이 문제라고 말했습니다.
    emphasis: []
    sources:
    - clm_0116
  - date: 2026.10.04
    text: 우크라이나 국방부는 최근 키리시와 사라토프, 시즈란 등의 정유소를 타격했다고 밝혔습니다.
    emphasis:
    - 키리시
    sources:
    - clm_0050
  - date: '2026.06'
    text: 그 결과 러시아의 정제 처리량은 크게 줄었습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: '2026.06'
    text: 6월 러시아의 정제 처리량은 하루 380만 배럴로, 20여 년 만에 가장 적었습니다.
    tts: 유월 러시아의 정제 처리량은 하루 삼백팔십만 배럴로, 이십여 년 만에 가장 적었습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: '2026.05'
    text: 또한 3월 월 750만 t이던 러시아 경유 생산은 5월 약 590만 t으로 떨어졌습니다.
    tts: 또한 삼월 월 칠백오십만 톤이던 러시아 경유 생산은 오월 약 오백구십만 톤으로 떨어졌습니다.
    emphasis: []
    sources:
    - clm_0043
  - date: 2026.09.17
    text: 국제에너지기구는 올해 러시아의 경유 생산이 30% 가까이 줄었다고 추정했습니다.
    tts: 국제에너지기구는 올해 러시아의 경유 생산이 삼십 퍼센트 가까이 줄었다고 추정했습니다.
    emphasis: []
    sources:
    - clm_0041
  - date: 2026.07.08
    text: 그러자 러시아는 7월 8일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    tts: 그러자 러시아는 칠월 팔일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    emphasis: []
    sources:
    - clm_0045
  - date: '2026.09'
    text: 이어서 9월에는 러시아의 6대 경유 생산 정유소 가운데 세 곳이 생산을 크게 줄이거나 멈췄습니다.
    tts: 이어서 구월에는 러시아의 육대 경유 생산 정유소 가운데 세 곳이 생산을 크게 줄이거나 멈췄습니다.
    emphasis: []
    sources:
    - clm_0044
  - date: '2026.10'
    text: 10월 초 러시아의 경유 해상 수출은 하루 약 14만 6천 배럴로 줄었습니다.
    tts: 시월 초 러시아의 경유 해상 수출은 하루 약 십사만 육천 배럴로 줄었습니다.
    emphasis: []
    sources:
    - clm_0049
    - clm_0048
  - date: '2026.08'
    text: 게다가 러시아는 거꾸로 연료를 사들이기 시작했습니다.
    emphasis: []
    sources:
    - clm_0046
  - date: '2026.08'
    text: 에너지·청정대기연구센터 크레아는 8월 러시아의 석유제품 수입이 사상 최대였다고 밝혔습니다.
    tts: 에너지 청정대기연구센터 크레아는 팔월 러시아의 석유제품 수입이 사상 최대였다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0047
    - clm_0046
  - date: '2026.08'
    text: 그 70%를 인도가 공급했고, 대부분 휘발유였습니다.
    tts: 그 칠십 퍼센트를 인도가 공급했고, 대부분 휘발유였습니다.
    emphasis: []
    sources:
    - clm_0047
  - date: '2026.09'
    text: 한편 우크라이나 국방부는 러시아 정제 능력의 51% 이상이 마비됐다고 발표했습니다.
    tts: 한편 우크라이나 국방부는 러시아 정제 능력의 오십일 퍼센트 이상이 마비됐다고 발표했습니다.
    emphasis: []
    sources:
    - clm_0050
  - date: '2026.09'
    text: 다만 AP통신은 이 수치를 독립적으로 검증할 수 없다고 전했습니다.
    tts: 다만 에이피 통신은 이 수치를 독립적으로 검증할 수 없다고 전했습니다.
    emphasis: []
    sources:
    - clm_0050
  - date: '2026.09'
    text: 이렇게 정유소가 멈추자, 경유를 팔던 러시아는 연료를 사 와야 하는 처지가 됐습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0045
    - clm_0046
  - date: '2026.09'
    text: 그리고 가장 먼저 탈이 난 곳은 정유소가 드문 동쪽 끝이었습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0118
    - clm_0110
- id: act2
  kind: act
  stage: 극동
  sentences:
  - date: '2026.08'
    text: 이제 무대를 러시아의 동쪽 끝, 극동으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0118
  - date: '2026.08'
    text: 극동의 연료 사정은 처음부터 넉넉하지 않았습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0108
  - date: '2026.06'
    text: 러시아 철도 관계자는 극동연방관구에 정유소가 두 곳뿐이라고 말했습니다.
    emphasis: []
    sources:
    - clm_0118
  - date: '2026.04'
    text: 특히 러시아의 한 업계 전문가는 극동 정유소가 경유 수요의 60~65%만 채운다고 말했습니다.
    tts: 특히 러시아의 한 업계 전문가는 극동 정유소가 경유 수요의 육십에서 육십오 퍼센트만 채운다고 말했습니다.
    emphasis: []
    sources:
    - clm_0108
  - date: '2026.04'
    text: 같은 전문가는 극동으로도 오던 옴스크 정유소의 물량이 드론 피해를 입은 서쪽으로 돌려졌다고 말했습니다.
    emphasis: []
    sources:
    - clm_0119
  - date: '2026.04'
    text: 즉 극동은 다른 지역에서 철도로 들어오는 연료에 기대 왔습니다.
    emphasis: []
    sources:
    - clm_0108
    - clm_0118
  - date: '2026.08'
    text: 하바롭스크주에는 NNK의 하바롭스크 정유소와 로스네프트의 콤소몰스크 정유소가 있습니다.
    tts: 하바롭스크주에는 엔엔케이의 하바롭스크 정유소와 로스네프트의 콤소몰스크 정유소가 있습니다.
    emphasis: []
    sources:
    - clm_0109
  - date: '2026.08'
    text: 그리고 극동의 연료 부족은 5월 정유소 피격 뒤 시작됐습니다.
    tts: 그리고 극동의 연료 부족은 오월 정유소 피격 뒤 시작됐습니다.
    emphasis: []
    sources:
    - clm_0110
  - date: 2026.08.11
    text: 8월에는 콤소몰스크나아무레의 로스네프트 정유소에서 불이 났습니다.
    tts: 팔월에는 콤소몰스크나아무레의 로스네프트 정유소에서 불이 났습니다.
    emphasis: []
    sources:
    - clm_0052
  - date: 2026.08.11
    text: 이 정유소는 극동 시장의 주요 연료 공급처입니다.
    emphasis: []
    sources:
    - clm_0055
  - date: 2026.08.11
    text: 우크라이나에서 약 6500km 떨어진 곳입니다.
    tts: 우크라이나에서 약 육천오백 킬로미터 떨어진 곳입니다.
    emphasis: []
    sources:
    - clm_0122
  - date: 2026.08.12
    text: 한편 연해주는 화물차 경유 주유를 시내 100리터, 간선도로 200리터로 묶었습니다.
    tts: 한편 연해주는 화물차 경유 주유를 시내 백 리터, 간선도로 이백 리터로 묶었습니다.
    emphasis: []
    sources:
    - clm_0120
  - date: 2026.08.12
    text: 이에 대해 연해주 당국은 실제 부족이 아니라 되팔기를 막기 위한 조치라고 설명했습니다.
    emphasis: []
    sources:
    - clm_0121
  - date: '2026.07'
    text: 그 무렵, 바다 건너 한국의 항구에서 유조선들이 움직이기 시작했습니다.
    emphasis: []
    sources:
    - clm_0036
    - clm_0037
  - date: '2026.07'
    text: 7월 말, 울산항 저장탱크의 정제유 약 3만 t이 러시아 극동으로 향했습니다.
    tts: 칠월 말, 울산항 저장탱크의 정제유 약 삼만 톤이 러시아 극동으로 향했습니다.
    emphasis: []
    sources:
    - clm_0036
    - clm_0037
  - date: '2026.08'
    text: 동북아에서 러시아로 이런 선적이 간 것은 2022년 2월 이후 처음이었습니다.
    tts: 동북아에서 러시아로 이런 선적이 간 것은 이천이십이 년 이월 이후 처음이었습니다.
    emphasis: []
    sources:
    - clm_0123
  - date: '2026.08'
    text: 그만큼 한국에서 러시아로 연료가 가는 일은 드물었습니다.
    emphasis: []
    sources:
    - clm_0123
  - date: '2026.08'
    text: 지도상 블라디보스토크는 울산에서 동해를 곧장 건너면 닿는 가장 가까운 러시아의 큰 항구입니다.
    emphasis: []
    sources: []
  - date: '2026.06'
    text: 극동에서 석유제품을 철도로 내리는 주된 곳도 블라디보스토크가 있는 연해주입니다.
    emphasis: []
    sources:
    - clm_0118
  - date: 2026.10.06
    text: 이후 가디언이 항만 기록과 선박 추적 자료를 분석해 그 전체 규모를 밝혀냈습니다.
    emphasis: []
    sources:
    - clm_0001
  - date: 2026.10.06
    text: 7~8월 한국 항구에서 연료 17만 6천 t 이상이 실렸고, 대부분 경유였습니다.
    tts: 칠에서 팔월 한국 항구에서 연료 십칠만 육천 톤 이상이 실렸고, 대부분 경유였습니다.
    emphasis:
    - 17만 6천 t
    sources:
    - clm_0001
  - date: 2026.10.06
    text: 유조선 일곱 척이 러시아 극동으로 열네 번 오갔습니다.
    emphasis: []
    sources:
    - clm_0002
  - date: 2026.10.06
    text: 그 가운데 세 척은 영국과 유럽연합의 제재 대상이었습니다.
    emphasis:
    - 세 척
    sources:
    - clm_0003
  - date: '2026.08'
    text: 제재 유조선 레일라호는 7월과 8월 두 차례 울산을 떠나 블라디보스토크로 갔습니다.
    tts: 제재 유조선 레일라호는 칠월과 팔월 두 차례 울산을 떠나 블라디보스토크로 갔습니다.
    emphasis: []
    sources:
    - clm_0005
  - date: '2026.08'
    text: 이렇게 레일라호가 두 번에 실어 나른 경유는 약 5만 7천 t이었습니다.
    tts: 이렇게 레일라호가 두 번에 실어 나른 경유는 약 오만 칠천 톤이었습니다.
    emphasis: []
    sources:
    - clm_0005
  - date: 2026.08.10
    text: 그런데 두 번째 항해에서 레일라호는 목적지를 일본 니가타로 신고했습니다.
    emphasis:
    - 니가타
    sources:
    - clm_0007
  - date: 2026.08.10
    text: 신고한 목적지와 실제로 닿은 항구가 달랐던 것입니다.
    emphasis: []
    sources:
    - clm_0007
  - date: 2026.08.01
    text: 아스토리아호도 8월 1일 울산에서 약 1만 1천 t을 실었습니다.
    tts: 아스토리아호도 팔월 일일 울산에서 약 만 천 톤을 실었습니다.
    emphasis: []
    sources:
    - clm_0008
  - date: '2026.08'
    text: 아스토리아호 역시 목적지를 일본으로 적은 뒤 블라디보스토크로 갔습니다.
    emphasis: []
    sources:
    - clm_0009
  - date: '2026.08'
    text: 청천호는 여수 앞바다에서 다른 유조선으로부터 연료 약 2만 6천 t을 옮겨 받았습니다.
    tts: 청천호는 여수 앞바다에서 다른 유조선으로부터 연료 약 이만 육천 톤을 옮겨 받았습니다.
    emphasis: []
    sources:
    - clm_0010
  - date: '2026.08'
    text: 청천호가 적은 목적지는 싱가포르였지만, 배는 블라디보스토크로 향했습니다.
    emphasis: []
    sources:
    - clm_0011
  - date: 2026.10.06
    text: 케이플러 자료로는 구매자 가운데 러시아 국영 석유회사 로스네프트가 있었습니다.
    emphasis: []
    sources:
    - clm_0016
  - date: 2026.10.06
    text: 또 다른 구매자는 하바롭스크 정유소를 가진 NNK였습니다.
    tts: 또 다른 구매자는 하바롭스크 정유소를 가진 엔엔케이였습니다.
    emphasis: []
    sources:
    - clm_0019
    - clm_0021
  - date: '2026.08'
    text: 케이플러 자료로는 8월 러시아 해상 석유제품 수입의 31%, 약 11만 2천 t이 한국산이었습니다.
    tts: 케이플러 자료로는 팔월 러시아 해상 석유제품 수입의 삼십일 퍼센트, 약 십일만 이천 톤이 한국산이었습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: '2026.08'
    text: 한편 크레아 집계로는 8월 한국산이 약 1만 8천 t이었습니다.
    tts: 한편 크레아 집계로는 팔월 한국산이 약 만 팔천 톤이었습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: 2026.10.06
    text: 정유소가 모자란 극동의 빈자리에, 한국 항구에서 실린 경유가 들어간 셈입니다.
    role: outro
    emphasis: []
    sources:
    - clm_0108
    - clm_0001
- id: act3
  kind: act
  stage: 한국
  sentences:
  - date: 2026.10.07
    text: 시점은 다시 10월, 서울로 옮겨 옵니다.
    tts: 시점은 다시 시월, 서울로 옮겨 옵니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0028
  - date: 2026.10.07
    text: 가디언 보도가 나오자 한국 정부와 우크라이나 사이에 논쟁이 붙었습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0028
  - date: 2026.10.07
    text: 쟁점은 이 선적이 법에 어긋났는지, 그리고 제재의 취지를 거슬렀는지입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0025
    - clm_0035
  - date: 2026.10.08
    text: 먼저 외교부는 상업용 경유와 항공유 같은 석유 정제제품은 대러 수출통제 품목이 아니라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0124
  - date: 2026.10.08
    text: 정부는 군사용으로 쓰일 수 있는 1,402개 품목을 상황허가 대상으로 묶어 관리하고 있다고 밝혔습니다.
    tts: 정부는 군사용으로 쓰일 수 있는 천사백두 개 품목을 상황허가 대상으로 묶어 관리하고 있다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0026
  - date: 2026.10.06
    text: 가디언도 한국의 독자 제재가 주로 산업장비와 전자제품, 차량을 겨냥한다고 분석했습니다.
    emphasis: []
    sources:
    - clm_0023
  - date: 2026.10.06
    text: 그래서 가디언은 이번 선적이 한국 법을 어긴 것은 아닌 것으로 보인다고 분석했습니다.
    emphasis: []
    sources:
    - clm_0025
  - date: '2026.10'
    text: 주요 7개국의 가격 상한제는 러시아산 석유의 운송과 보험, 금융 서비스를 묶는 제도입니다.
    tts: 주요 칠 개국의 가격 상한제는 러시아산 석유의 운송과 보험, 금융 서비스를 묶는 제도입니다.
    emphasis: []
    sources:
    - clm_0128
  - date: '2026.10'
    text: 즉 이 제도가 겨누는 것은 러시아가 파는 석유이지, 러시아가 사들이는 연료가 아닙니다.
    emphasis: []
    sources:
    - clm_0128
  - date: '2024'
    text: 또한 한국 정유사들은 2024년 경유 2억 166만 배럴을 수출해 1992년 통계 이후 최대를 기록했습니다.
    tts: 또한 한국 정유사들은 이천이십사 년 경유 이억 백육십육만 배럴을 수출해 천구백구십이 년 통계 이후 최대를 기록했습니다.
    role: background
    emphasis: []
    sources:
    - clm_0146
  - date: '2026.09'
    text: 정유업계 관계자는 국내에 충분히 공급하고도 물량이 남는다고 말했습니다.
    emphasis: []
    sources:
    - clm_0060
  - date: 2026.10.04
    text: 올해 1~8월 한국의 경유 수출량은 1억 2,982만 배럴로 1년 전보다 3.4% 줄었습니다.
    tts: 올해 일월부터 팔월까지 한국의 경유 수출량은 일억 이천구백팔십이만 배럴로 일 년 전보다 삼 점 사 퍼센트 줄었습니다.
    emphasis: []
    sources:
    - clm_0111
  - date: '2026.09'
    text: 다만 정부는 휘발유·경유·등유 수출 물량을 지난해 수준 안으로 묶어 관리하고 있습니다.
    tts: 다만 정부는 휘발유, 경유, 등유 수출 물량을 지난해 수준 안으로 묶어 관리하고 있습니다.
    emphasis: []
    sources:
    - clm_0057
  - date: 2026.10.08
    text: 그런데 정부는 실제 항로와 신고한 목적국이 다른지 더 살펴 국내법 위반 여부를 가리겠다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0125
  - date: 2026.10.08
    text: 다만 정부는 신고지로 곧장 가지 않았다는 사실만으로 허위 신고를 단정하기는 어렵다고도 밝혔습니다.
    emphasis: []
    sources:
    - clm_0126
  - date: 2026.10.07
    text: 한편 청와대 국가안보실은 무역통계상 한국에서 러시아로 경유와 휘발유, 제트유가 수출된 기록은 없다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0127
  - date: 2026.10.06
    text: 다만 연료의 소유주나 판매자는 한국 항만 기록에 나오지 않습니다.
    emphasis: []
    sources:
    - clm_0014
  - date: 2026.10.07
    text: 그렇지만 우크라이나의 시각은 달랐습니다.
    emphasis: []
    sources:
    - clm_0035
  - date: 2026.10.07
    text: 우크라이나 대통령실의 블라시우크 제재 담당 위원은 한국산 연료가 러시아의 연료난 대처를 도왔다고 주장했습니다.
    emphasis: []
    sources:
    - clm_0030
    - clm_0029
  - date: 2026.10.07
    text: 블라시우크 위원은 선적이 정유소 타격으로 러시아의 정제량이 줄어든 바로 그때 시작됐다고 말했습니다.
    emphasis: []
    sources:
    - clm_0031
  - date: 2026.10.07
    text: 우크라이나가 문제 삼은 것은 법 조항보다 그 시점이었습니다.
    emphasis: []
    sources:
    - clm_0035
  - date: 2026.10.07
    text: 이에 대해 강유정 청와대 수석대변인은 우크라이나 측 주장이 사실과 다르고 부적절하다고 반박했습니다.
    emphasis: []
    sources:
    - clm_0032
  - date: 2026.10.07
    text: 청와대는 거래 주체와 원산지, 최종 구매자가 아직 가려지지 않은 개별 거래라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0015
  - date: 2026.10.06
    text: 논쟁의 또 다른 축은 구매자였습니다.
    emphasis: []
    sources:
    - clm_0016
    - clm_0017
  - date: 2026.10.06
    text: 특히 로스네프트는 영국과 미국, 유럽연합, 호주의 제재 대상입니다.
    emphasis: []
    sources:
    - clm_0017
  - date: 2025.10.22
    text: 미국 재무부는 2025년 10월 22일 로스네프트를 제재 대상에 올렸습니다.
    tts: 미국 재무부는 이천이십오 년 시월 이십이일 로스네프트를 제재 대상에 올렸습니다.
    emphasis: []
    sources:
    - clm_0018
  - date: 2025.10.23
    text: 미국 재무부는 제재 대상과 중대한 거래를 돕는 외국 금융기관도 제재받을 수 있다고 경고했습니다.
    emphasis: []
    sources:
    - clm_0129
  - date: 2026.10.08
    text: 외교 갈등은 주우크라이나 대사 소환으로까지 번졌습니다.
    emphasis: []
    sources:
    - clm_0033
    - clm_0035
  - date: 2026.10.08
    text: 이 소환은 북한군 포로 이송 공개를 둘러싼 갈등에 뒤이은 것이기도 했습니다.
    emphasis: []
    sources:
    - clm_0034
  - date: 2026.10.08
    text: 법을 어긴 것은 아니라는 한국 정부와, 제재의 구멍이라는 우크라이나의 입장은 지금도 맞서 있습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0025
    - clm_0035
- id: act4
  kind: act
  stage: 걸프
  sentences:
  - date: '2026.03'
    text: 이번에는 시점을 올해 2월 말, 무대를 페르시아만으로 옮깁니다.
    tts: 이번에는 시점을 올해 이월 말, 무대를 페르시아만으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0063
  - date: '2026.03'
    text: 같은 경유를 두고, 그곳에서는 또 다른 전쟁이 벌어지고 있었습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0063
    - clm_0061
  - date: '2026.09'
    text: 2월 28일 개전 뒤 걸프의 기반시설 최소 84곳이 드론과 미사일 공격을 135회 넘게 받았습니다.
    tts: 이월 이십팔일 개전 뒤 걸프의 기반시설 최소 여든네 곳이 드론과 미사일 공격을 백삼십오 회 넘게 받았습니다.
    emphasis: []
    sources:
    - clm_0063
  - date: 2026.03.13
    text: 3월 13일에는 미국이 이란 하르그섬의 군사 목표물을 타격했습니다.
    tts: 삼월 십삼일에는 미국이 이란 하르그섬의 군사 목표물을 타격했습니다.
    emphasis:
    - 하르그섬
    sources:
    - clm_0077
  - date: 2026.03.13
    text: 다만 트럼프 대통령은 하르그섬의 석유 시설은 겨냥하지 않기로 했다고 말했습니다.
    emphasis: []
    sources:
    - clm_0078
  - date: 2026.03.18
    text: 3월 18일에는 이스라엘이 이란의 사우스파르스 가스전 시설을 타격했습니다.
    tts: 삼월 십팔일에는 이스라엘이 이란의 사우스파르스 가스전 시설을 타격했습니다.
    emphasis:
    - 사우스파르스
    sources:
    - clm_0073
  - date: 2026.03.18
    text: 이에 대해 이란은 미국과 이스라엘이 함께 공격했다고 주장했습니다.
    emphasis: []
    sources:
    - clm_0075
  - date: 2026.03.18
    text: 이어서 이란은 걸프 전역의 에너지 시설에 보복하겠다고 경고했습니다.
    emphasis: []
    sources:
    - clm_0076
  - date: 2026.03.18
    text: 그 뒤 걸프의 에너지 시설이 차례로 표적이 됐습니다.
    emphasis: []
    sources:
    - clm_0063
  - date: '2026.09'
    text: 또한 카타르 라스라판의 LNG 시설은 공격으로 콜드박스 2기가 손상됐습니다.
    tts: 또한 카타르 라스라판의 엘엔지 시설은 공격으로 콜드박스 두 기가 손상됐습니다.
    emphasis:
    - 라스라판
    sources:
    - clm_0067
  - date: '2026.09'
    text: 라스라판의 LNG 생산 라인 14기 가운데 2기가 멈춰 연 1,300만 t, 생산 능력의 약 17%가 묶였습니다.
    tts: 라스라판의 엘엔지 생산 라인 열네 기 가운데 두 기가 멈춰 연 천삼백만 톤, 생산 능력의 약 십칠 퍼센트가 묶였습니다.
    emphasis: []
    sources:
    - clm_0068
  - date: '2026.09'
    text: 카타르에너지의 사드 알카아비 최고경영자는 복구에 3~5년이 걸린다고 말했습니다.
    tts: 카타르에너지의 사드 알카아비 최고경영자는 복구에 삼에서 오 년이 걸린다고 말했습니다.
    emphasis: []
    sources:
    - clm_0069
  - date: '2026.09'
    text: 카타르 가스 수출 능력의 일부가 몇 년 동안 묶이게 된 셈입니다.
    emphasis: []
    sources:
    - clm_0068
  - date: '2026.09'
    text: 한편 아랍에미리트의 푸자이라항은 이란의 드론과 미사일에 최소 19차례 겨냥됐습니다.
    tts: 한편 아랍에미리트의 푸자이라항은 이란의 드론과 미사일에 최소 열아홉 차례 겨냥됐습니다.
    emphasis: []
    sources:
    - clm_0064
  - date: 2026.09.10
    text: 9월 10일에는 드론이 사우디아라비아 동서 송유관의 펌프장을 타격했습니다.
    tts: 구월 십일에는 드론이 사우디아라비아 동서 송유관의 펌프장을 타격했습니다.
    emphasis: []
    sources:
    - clm_0070
  - date: 2026.09.10
    text: 미국 당국자는 이 드론이 이라크에서 날아왔다고 말했습니다.
    emphasis: []
    sources:
    - clm_0071
  - date: 2026.09.11
    text: 이어서 사우디는 다음 날 예방 조치로 동서 송유관을 멈췄습니다.
    emphasis: []
    sources:
    - clm_0072
  - date: '2026.09'
    text: 걸프 각국 정부는 최소 34차례 피해를 요격 탄약이나 떨어진 잔해 탓으로 돌렸습니다.
    tts: 걸프 각국 정부는 최소 서른네 차례 피해를 요격 탄약이나 떨어진 잔해 탓으로 돌렸습니다.
    emphasis: []
    sources:
    - clm_0065
  - date: '2026.09'
    text: 이에 대해 로이터는 피해가 낙하 잔해가 아니라 의도된 정밀 타격이었다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0066
  - date: '2026.09'
    text: 그렇다면 걸프의 불길은 어떻게 경유 시장으로 번졌을까요.
    emphasis: []
    sources:
    - clm_0141
  - date: 2026.09.30
    text: 호르무즈를 지나는 석유제품은 하루 67만 7천 배럴로, 전쟁 전 360만 배럴에 크게 못 미쳤습니다.
    tts: 호르무즈를 지나는 석유제품은 하루 육십칠만 칠천 배럴로, 전쟁 전 삼백육십만 배럴에 크게 못 미쳤습니다.
    emphasis: []
    sources:
    - clm_0144
  - date: '2026.08'
    text: 7월 호르무즈를 지난 경유는 하루 16만 5천 배럴로, 분쟁 전 약 80만 배럴의 일부였습니다.
    tts: 칠월 호르무즈를 지난 경유는 하루 십육만 오천 배럴로, 분쟁 전 약 팔십만 배럴의 일부였습니다.
    emphasis: []
    sources:
    - clm_0061
    - clm_0062
  - date: 2026.10.14
    text: 그 결과 3분기 세계 경유 공급은 1년 전보다 하루 170만 배럴 줄었습니다.
    tts: 그 결과 삼분기 세계 경유 공급은 일 년 전보다 하루 백칠십만 배럴 줄었습니다.
    emphasis: []
    sources:
    - clm_0141
  - date: 2026.10.14
    text: 9월 경유 정제마진은 배럴당 약 95달러로 사상 최고였습니다.
    tts: 구월 경유 정제마진은 배럴당 약 구십오 달러로 사상 최고였습니다.
    emphasis: []
    sources:
    - clm_0142
  - date: '2026.08'
    text: 한국 원유 수입의 중동산 비중도 지난해 69.1%에서 올해 5~7월 48.5%로 내려갔습니다.
    tts: 한국 원유 수입의 중동산 비중도 지난해 육십구 점 일 퍼센트에서 올해 오에서 칠월 사십팔 점 오 퍼센트로 내려갔습니다.
    emphasis: []
    sources:
    - clm_0145
  - date: 2026.10.14
    text: 러시아의 정유소와 걸프의 수출항이 함께 흔들리자, 국제에너지기구는 경유 부족이 2027년까지 이어질 수 있다고 밝혔습니다.
    tts: 러시아의 정유소와 걸프의 수출항이 함께 흔들리자, 국제에너지기구는 경유 부족이 이천이십칠 년까지 이어질 수 있다고 밝혔습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0143
    - clm_0107
  - date: 2026.10.14
    text: 그리고 이 경유 부족은 워싱턴으로 이어집니다.
    role: outro
    emphasis: []
    sources:
    - clm_0133
- id: act5
  kind: act
  stage: 워싱턴
  sentences:
  - date: 2026.10.09
    text: 마지막으로 시점을 지난주로, 무대를 워싱턴으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0083
  - date: 2026.10.09
    text: 미국은 지난해 러시아 석유회사들을 제재한 나라입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0018
  - date: 2026.10.09
    text: 그런데 올해 미국의 선택은 거꾸로 움직였습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0080
    - clm_0083
  - date: 2026.03.12
    text: 미국 재무부는 3월 12일 이미 배에 실린 러시아산 원유와 석유제품의 거래를 허용하는 일반허가 134호를 냈습니다.
    tts: 미국 재무부는 삼월 십이일 이미 배에 실린 러시아산 원유와 석유제품의 거래를 허용하는 일반허가 백삼십사 호를 냈습니다.
    emphasis: []
    sources:
    - clm_0080
  - date: 2026.03.12
    text: 베선트 재무장관은 이 허가를 좁게 설계한 단기 조치라고 말했습니다.
    emphasis: []
    sources:
    - clm_0082
  - date: 2026.10.09
    text: 이어서 재무부는 러시아산 경유의 판매와 운송, 수입을 허용하는 일반허가 135호를 내놨습니다.
    tts: 이어서 재무부는 러시아산 경유의 판매와 운송, 수입을 허용하는 일반허가 백삼십오 호를 내놨습니다.
    emphasis:
    - 일반허가 135호
    sources:
    - clm_0083
  - date: 2026.10.09
    text: 이 허가는 2027년 4월 7일까지 유효합니다.
    tts: 이 허가는 이천이십칠 년 사월 칠일까지 유효합니다.
    emphasis: []
    sources:
    - clm_0084
  - date: 2026.10.09
    text: 트럼프 대통령은 러시아가 경유 30만 t 이상을 즉시 공급할 것이라고 말했습니다.
    tts: 트럼프 대통령은 러시아가 경유 삼십만 톤 이상을 즉시 공급할 것이라고 말했습니다.
    emphasis: []
    sources:
    - clm_0085
  - date: 2026.10.10
    text: 노바크 러시아 부총리는 경유 수출이 월 300만~350만 t까지 늘 수 있다고 말했습니다.
    tts: 노바크 러시아 부총리는 경유 수출이 월 삼백만에서 삼백오십만 톤까지 늘 수 있다고 말했습니다.
    emphasis: []
    sources:
    - clm_0087
  - date: 2026.10.11
    text: 베선트 재무장관은 가진 모든 법적 권한으로 이 거래를 이행하겠다고 말했습니다.
    emphasis: []
    sources:
    - clm_0088
  - date: 2026.10.10
    text: 카네기 국제평화재단은 이 거래의 이론상 가치를 6개월 약 500만 t 기준 약 70억 달러로 추정했습니다.
    tts: 카네기 국제평화재단은 이 거래의 이론상 가치를 육 개월 약 오백만 톤 기준 약 칠십억 달러로 추정했습니다.
    emphasis: []
    sources:
    - clm_0090
  - date: 2026.10.10
    text: 이에 대해 미국 공화·민주 양당 의원들은 거래를 철회하라고 촉구했습니다.
    tts: 이에 대해 미국 공화 민주 양당 의원들은 거래를 철회하라고 촉구했습니다.
    emphasis: []
    sources:
    - clm_0089
  - date: 2026.09.20
    text: 미국은 왜 러시아 경유에 문을 열었을까요.
    emphasis: []
    sources:
    - clm_0133
  - date: 2026.10.10
    text: 트럼프 대통령은 젤렌스키 대통령에게 러시아 정유소 공격을 멈추라고 요구했습니다.
    emphasis: []
    sources:
    - clm_0102
  - date: 2026.09.20
    text: 앞서 트럼프 대통령은 우크라이나의 러시아 정유소 공격이 경유 부족을 일으킨다고 주장했습니다.
    emphasis: []
    sources:
    - clm_0132
  - date: 2026.10.12
    text: 한편 미국의 경유 평균 가격은 갤런당 6.26달러로, 연초보다 80% 가까이 올랐습니다.
    tts: 한편 미국의 경유 평균 가격은 갤런당 육 점 이육 달러로, 연초보다 팔십 퍼센트 가까이 올랐습니다.
    emphasis:
    - 6.26달러
    sources:
    - clm_0134
  - date: 2026.10.12
    text: 경유값은 미국 국내 정치의 문제가 됐습니다.
    emphasis: []
    sources:
    - clm_0133
    - clm_0134
  - date: 2026.10.11
    text: 트럼프 대통령은 중간선거를 앞두고 경유값 상승을 정유소 공격 탓으로 돌려 왔습니다.
    emphasis: []
    sources:
    - clm_0133
  - date: 2026.10.11
    text: 그리고 그 해법으로 꺼낸 것이 에너지 휴전이었습니다.
    emphasis: []
    sources:
    - clm_0130
    - clm_0133
  - date: 2026.10.11
    text: 이어서 10월 11일, 트럼프 대통령은 즉시 에너지 휴전이 발효된다고 밝혔습니다.
    tts: 이어서 시월 십일일, 트럼프 대통령은 즉시 에너지 휴전이 발효된다고 밝혔습니다.
    emphasis:
    - 에너지 휴전
    sources:
    - clm_0130
    - clm_0091
  - date: 2026.10.11
    text: 백악관 당국자는 첫 단계가 두 나라가 서로의 정유소를 공격하지 않는 것이라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0131
  - date: 2026.10.11
    text: 이에 대해 우크라이나는 러시아의 정유망이 훨씬 커서 맞교환은 불공평하다고 반발했습니다.
    emphasis: []
    sources:
    - clm_0135
  - date: 2026.10.11
    text: 젤렌스키 대통령은 휴전 발표를 처음 듣는 소식이라고 말했습니다.
    emphasis: []
    sources:
    - clm_0136
  - date: 2026.10.11
    text: 젤렌스키 대통령은 러시아가 에너지 시설 공격을 멈추면 우크라이나도 멈추겠다고 말했습니다.
    emphasis: []
    sources:
    - clm_0094
  - date: 2026.10.15
    text: 하지만 우크라이나 당국은 러시아가 그 주에도 하르키우와 폴타바의 가스 시설을 공격했다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0095
    - clm_0096
    - clm_0097
  - date: 2026.10.15
    text: 그리고 10월 15일, 우크라이나는 랴잔 정유소를 다시 타격했습니다.
    tts: 그리고 시월 십오일, 우크라이나는 랴잔 정유소를 다시 타격했습니다.
    emphasis: []
    sources:
    - clm_0099
  - date: 2026.10.15
    text: 크렘린궁은 우크라이나의 에너지 시설 공격이 미국의 평화 노력에 어긋난다고 말했습니다.
    emphasis: []
    sources:
    - clm_0137
  - date: 2026.10.15
    text: 젤렌스키 대통령은 트럼프 대통령에게 배신감을 느낀다고 말했습니다.
    tts: 젤렌스키 대통령은 트럼프 대통령에게 배신감을 느낀다고 말했습니다.
    emphasis: []
    sources:
    - clm_0139
  - date: 2026.10.15
    text: 휴전은 나흘 만에 끝났습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0099
  - date: 2026.10.13
    text: 그 사이 이재명 대통령은 13일 국무회의에서 러시아와의 관계 관리도 중요하다고 말했습니다.
    tts: 그 사이 이재명 대통령은 십삼일 국무회의에서 러시아와의 관계 관리도 중요하다고 말했습니다.
    emphasis: []
    sources:
    - clm_0104
  - date: 2026.10.13
    text: 이재명 대통령은 외교에는 영원한 적도 영원한 우방도 없다고 말했습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0105
- id: ending
  kind: ending
  sentences:
  - date: 2026.10.17
    text: 사흘에 한 번 타격당한 러시아의 정유소, 울산을 떠난 유조선, 불붙은 걸프의 수출항, 그리고 워싱턴의 경유 거래.
    emphasis: []
    sources:
    - clm_0039
    - clm_0001
    - clm_0063
    - clm_0083
  - date: 2026.10.17
    text: 네 장면은 모두 모자란 경유 한 가지로 이어져 있습니다.
    emphasis: []
    sources:
    - clm_0141
    - clm_0107
  - date: 2026.10.17
    text: 국제에너지기구는 그 부족이 2027년까지 이어질 수 있다고 내다봤고, 경유를 둘러싼 거래와 타격은 지금도 계속되고 있습니다.
    tts: 국제에너지기구는 그 부족이 이천이십칠 년까지 이어질 수 있다고 내다봤고, 경유를 둘러싼 거래와 타격은 지금도 계속되고 있습니다.
    emphasis: []
    sources:
    - clm_0143
    - clm_0099
