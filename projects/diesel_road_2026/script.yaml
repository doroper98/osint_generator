schema_version: 1
title: 경유의 길 — 사흘에 한 번
subtitle: 우크라이나의 정유소 타격, 울산발 유조선, 걸프의 불길, 그리고 워싱턴의 경유 거래
date: 2026.10.17
scenes:
- id: cold
  sentences:
  - date: 2026.10.15
    text: AP통신에 따르면 10월 15일 새벽, 러시아 랴잔의 정유소에 불길이 올랐습니다.
    tts: 에이피 통신에 따르면 시월 십오일 새벽, 러시아 랴잔의 정유소에 불길이 올랐습니다.
    emphasis:
    - 랴잔
    sources:
    - clm_0099
  - date: 2026.10.15
    text: 러시아 국방부는 격추한 무인기의 파편이 불을 냈다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0100
  - date: 2026.10.15
    text: 반면 우크라이나 당국자는 이번 공격을 확인했다고 AP통신은 전했습니다.
    emphasis: []
    sources:
    - clm_0099
    - clm_0097
    tts: 반면 우크라이나 당국자는 이번 공격을 확인했다고 에이피 통신은 전했습니다.
  - date: 2026.10.11
    text: AP통신은 이 공격으로 나흘 전 트럼프 대통령이 발표한 에너지 휴전이 끝났다고 보도했습니다.
    emphasis:
    - 에너지 휴전
    sources:
    - clm_0091
    - clm_0099
    tts: 에이피 통신은 이 공격으로 나흘 전 트럼프 대통령이 발표한 에너지 휴전이 끝났다고 보도했습니다.
  - date: 2026.10.15
    text: 젤렌스키 대통령은 "이제 끝났다"고 말했습니다.
    tts: 젤렌스키 대통령은 이제 끝났다고 말했습니다.
    emphasis: []
    sources:
    - clm_0101
  - date: 2026.10.06
    text: 그리고 이 전쟁이 만든 경유 부족은 한국의 울산항까지 닿아 있었습니다.
    emphasis:
    - 울산항
    sources:
    - clm_0001
- id: act1
  sentences:
  - date: 2026.09.17
    text: 국제에너지기구에 따르면 올해 첫 여덟 달 동안 우크라이나는 사흘에 한 번꼴로 러시아 정유소를 맞혔습니다.
    emphasis:
    - 사흘에 한 번
    sources:
    - clm_0039
  - date: 2026.09.17
    text: 국제에너지기구에 따르면 표적은 원유를 캐는 유전이 아니라, 원유를 경유와 휘발유로 바꾸는 정유소였습니다.
    emphasis: []
    sources:
    - clm_0039
  - date: 2026.09.17
    text: 특히 크게 부서지면 수리에 6~8개월이 걸리는 분해·개질 같은 2차 설비를 맞히는 일이 늘었다고 국제에너지기구는 밝혔습니다.
    tts: 특히 크게 부서지면 수리에 육에서 팔 개월이 걸리는 분해 개질 같은 이차 설비를 맞히는 일이 늘었다고 국제에너지기구는 밝혔습니다.
    emphasis:
    - 6~8개월
    sources:
    - clm_0042
  - date: 2026.10.04
    text: 우크라이나 국방부는 최근 키리시와 사라토프, 시즈란 등의 정유소를 타격했다고 밝혔습니다.
    emphasis:
    - 키리시
    sources:
    - clm_0050
  - date: '2026.06'
    text: 국제에너지기구에 따르면 6월 러시아의 정제 처리량은 하루 380만 배럴로, 20여 년 만에 가장 적었습니다.
    tts: 국제에너지기구에 따르면 유월 러시아의 정제 처리량은 하루 삼백팔십만 배럴로, 이십여 년 만에 가장 적었습니다.
    emphasis:
    - 380만 배럴
    sources:
    - clm_0040
  - date: '2026.06'
    text: 국제에너지기구는 1년 전보다 약 30% 줄어든 양이라고 밝혔습니다.
    tts: 국제에너지기구는 일 년 전보다 약 삼십 퍼센트 줄어든 양이라고 밝혔습니다.
    emphasis:
    - 약 30%
    sources:
    - clm_0040
  - date: 2026.05.29
    text: 로이터 산정에 따르면 3월 월 750만 t이던 러시아 경유 생산은 5월 약 590만 t으로 떨어졌습니다.
    tts: 로이터 산정에 따르면 삼월 월 칠백오십만 톤이던 러시아 경유 생산은 오월 약 오백구십만 톤으로 떨어졌습니다.
    emphasis:
    - 약 590만 t
    sources:
    - clm_0043
  - date: 2026.05.29
    text: 두 달 만에 약 20%가 사라진 셈이라고 로이터는 전했습니다.
    tts: 두 달 만에 약 이십 퍼센트가 사라진 셈이라고 로이터는 전했습니다.
    emphasis: []
    sources:
    - clm_0043
  - date: 2026.09.15
    text: 이어서 9월에는 러시아의 6대 경유 생산 정유소 가운데 세 곳이 생산을 크게 줄이거나 멈췄다고 로이터는 보도했습니다.
    tts: 이어서 구월에는 러시아의 육대 경유 생산 정유소 가운데 세 곳이 생산을 크게 줄이거나 멈췄다고 로이터는 보도했습니다.
    emphasis:
    - 세 곳
    sources:
    - clm_0044
  - date: 2026.09.17
    text: 국제에너지기구는 올해 러시아의 경유 생산이 30% 가까이 줄었다고 추정했다고 밝혔습니다.
    tts: 국제에너지기구는 올해 러시아의 경유 생산이 삼십 퍼센트 가까이 줄었다고 추정했다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0041
  - date: 2026.07.08
    text: 그러자 러시아는 7월 8일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    tts: 그러자 러시아는 칠월 팔일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    emphasis:
    - 경유 수출 전면 금지
    sources:
    - clm_0045
  - date: 2026.10.16
    text: 블룸버그가 인용한 보르텍사 자료에 따르면 10월 초 경유 해상 수출이 하루 약 14만 6천 배럴이었습니다.
    tts: 블룸버그가 인용한 보르텍사 자료에 따르면 시월 초 경유 해상 수출이 하루 약 십사만 육천 배럴이었습니다.
    emphasis:
    - 약 14만 6천 배럴
    sources:
    - clm_0049
  - date: 2026.07.08
    text: 게다가 러시아는 연료를 사들이기 시작했습니다.
    emphasis: []
    sources:
    - clm_0046
  - date: '2026.08'
    text: 에너지·청정대기연구센터 크레아는 8월 러시아의 석유제품 수입이 사상 최대였다고 밝혔습니다.
    tts: 에너지 청정대기연구센터 크레아는 팔월 러시아의 석유제품 수입이 사상 최대였다고 밝혔습니다.
    emphasis:
    - 사상 최대
    sources:
    - clm_0047
    - clm_0046
  - date: '2026.08'
    text: 크레아에 따르면 그 70%를 인도가 공급했고, 대부분 휘발유였습니다.
    tts: 크레아에 따르면 그 칠십 퍼센트를 인도가 공급했고, 대부분 휘발유였습니다.
    emphasis:
    - 인도
    sources:
    - clm_0047
  - date: 2026.10.04
    text: 한편 우크라이나 국방부는 러시아 정제 능력의 51% 이상이 마비됐다고 발표했습니다.
    tts: 한편 우크라이나 국방부는 러시아 정제 능력의 오십일 퍼센트 이상이 마비됐다고 발표했습니다.
    emphasis:
    - 51% 이상
    sources:
    - clm_0050
  - date: 2026.10.05
    text: 다만 AP통신은 이 수치를 독립적으로 검증할 수 없다고 전했습니다.
    tts: 다만 에이피 통신은 이 수치를 독립적으로 검증할 수 없다고 전했습니다.
    emphasis: []
    sources:
    - clm_0050
- id: act2
  sentences:
  - date: '2026.08'
    text: 이제 러시아의 동쪽 끝, 극동으로 가 보겠습니다.
    tts: 이제 러시아의 동쪽 끝, 극동으로 가 보겠습니다.
    emphasis:
    - 극동
    sources:
    - clm_0055
  - date: '2026.09'
    text: 디인사이더에 따르면 극동은 현지 정제로 휘발유 수요의 55~60%, 경유 수요의 60~65%만 채우고, 나머지는 다른 지역에서 들여옵니다.
    tts: 디인사이더에 따르면 극동은 현지 정제로 휘발유 수요의 오십오에서 육십 퍼센트, 경유 수요의 육십에서 육십오 퍼센트만 채우고, 나머지는 다른 지역에서 들여옵니다.
    emphasis:
    - 60~65%
    sources:
    - clm_0108
  - date: 2026.03.01
    text: 바이칼24에 따르면 하바롭스크주에는 NNK의 하바롭스크 정유소(연 500만 t)와 로스네프트의 콤소몰스크 정유소(연 800만 t)가 있습니다.
    tts: 바이칼 이십사에 따르면 하바롭스크주에는 엔엔케이의 하바롭스크 정유소, 연 오백만 톤과 로스네프트의 콤소몰스크 정유소, 연 팔백만 톤이 있습니다.
    emphasis:
    - 하바롭스크
    sources:
    - clm_0109
  - date: '2026.07'
    text: 이스트러시아에 따르면 극동의 연료 부족은 5월 정유소 피격 뒤 시작됐고, 여름 중반에야 안정됐습니다.
    tts: 이스트러시아에 따르면 극동의 연료 부족은 오월 정유소 피격 뒤 시작됐고, 여름 중반에야 안정됐습니다.
    emphasis:
    - 연료 부족
    sources:
    - clm_0110
  - date: 2026.10.17
    text: 로스네프트에 따르면 콤소몰스크나아무레 정유소는 극동 시장의 주요 연료 공급처입니다.
    emphasis:
    - 콤소몰스크나아무레
    sources:
    - clm_0055
  - date: 2026.08.11
    text: 8월 11일 이 정유소에서 불이 났다고 우크라이나 매체들이 보도했습니다.
    tts: 팔월 십일일 이 정유소에서 불이 났다고 우크라이나 매체들이 보도했습니다.
    emphasis: []
    sources:
    - clm_0052
  - date: 2026.08.11
    text: 다만 화재 원인에 대한 공식 설명은 나오지 않았다고 이 매체들은 전했습니다.
    emphasis: []
    sources:
    - clm_0053
  - date: 2026.08.07
    text: 로이터는 7월 말 한국에서 러시아로 정제 연료 약 3만 t이 실려 갔다고 보도했습니다.
    tts: 로이터는 칠월 말 한국에서 러시아로 정제 연료 약 삼만 톤이 실려 갔다고 보도했습니다.
    emphasis:
    - 약 3만 t
    sources:
    - clm_0036
  - date: 2026.10.06
    text: 이어서 10월 6일 영국 가디언은 7~8월 한국 항구에서 17만 6천 t이 넘는 연료가 실렸고, 대부분 경유였다고 보도했습니다.
    tts: 이어서 시월 육일 영국 가디언은 칠월과 팔월 한국 항구에서 십칠만 육천 톤이 넘는 연료가 실렸고, 대부분 경유였다고 보도했습니다.
    emphasis:
    - 17만 6천 t
    sources:
    - clm_0001
  - date: 2026.10.06
    text: 가디언에 따르면 유조선 일곱 척이 열네 번에 걸쳐 러시아 극동으로 날랐습니다.
    emphasis:
    - 일곱 척
    sources:
    - clm_0002
  - date: 2026.10.06
    text: 그 가운데 세 척은 영국과 유럽연합의 제재 대상이었습니다.
    emphasis:
    - 제재 대상
    sources:
    - clm_0003
  - date: 2026.10.06
    text: 가디언은 제재 대상 레일라호가 울산에서 블라디보스토크로 두 차례 경유 약 5만 7천 t을 날랐다고 보도했습니다.
    tts: 가디언은 제재 대상 레일라호가 울산에서 블라디보스토크로 두 차례 경유 약 오만 칠천 톤을 날랐다고 보도했습니다.
    emphasis:
    - 레일라호
    sources:
    - clm_0005
  - date: 2026.10.06
    text: 가디언은 두 번째 항해 때 신고한 목적지가 일본 니가타였다고 전했습니다.
    emphasis:
    - 니가타
    sources:
    - clm_0007
  - date: 2026.08.01
    text: 가디언에 따르면 아스토리아호도 8월 1일 울산에서 약 1만 1천 t을 싣고 일본을 목적지로 적었지만, 블라디보스토크로 갔습니다.
    tts: 가디언에 따르면 아스토리아호도 팔월 일일 울산에서 약 만 천 톤을 싣고 일본을 목적지로 적었지만, 블라디보스토크로 갔습니다.
    emphasis:
    - 아스토리아호
    sources:
    - clm_0008
    - clm_0009
  - date: 2026.10.06
    text: 또한 가디언에 따르면 청천호는 항구에 들르지 않고 여수 앞바다에서 다른 유조선으로부터 약 2만 6천 t을 옮겨 실었습니다.
    tts: 또한 가디언에 따르면 청천호는 항구에 들르지 않고 여수 앞바다에서 다른 유조선으로부터 약 이만 육천 톤을 옮겨 실었습니다.
    emphasis:
    - 청천호
    sources:
    - clm_0010
    - clm_0011
    - clm_0004
  - date: 2026.10.06
    text: 이후 목적지를 싱가포르로 적은 뒤 블라디보스토크로 향했다고 가디언은 전했습니다.
    emphasis:
    - 싱가포르
    sources:
    - clm_0010
    - clm_0011
  - date: 2026.10.06
    text: 가디언에 따르면 케이플러가 확인한 구매자는 로스네프트와 NNK이고, 두 회사는 극동에 정유소를 가지고 있습니다.
    tts: 케이플러가 확인한 구매자는 로스네프트와 엔엔케이이고, 두 회사는 극동 정유소를 가지고 있습니다.
    emphasis:
    - 로스네프트와 NNK
    sources:
    - clm_0016
    - clm_0019
    - clm_0021
    - clm_0055
  - date: 2026.10.06
    text: 다만 연료의 소유주와 판매자는 분명하지 않다고 가디언은 전했습니다.
    emphasis: []
    sources:
    - clm_0014
  - date: '2026.08'
    text: 가디언이 인용한 케이플러 자료에 따르면 8월 러시아 해상 석유제품 수입의 31%, 약 11만 2천 t이 한국산이었습니다.
    tts: 가디언이 인용한 케이플러 자료에 따르면 팔월 러시아 해상 석유제품 수입의 삼십일 퍼센트, 약 십일만 이천 톤이 한국산이었습니다.
    emphasis:
    - 약 11만 2천 t
    sources:
    - clm_0013
  - date: '2026.08'
    text: 반면 크레아에 따르면 8월 한국산은 약 1만 8천 t이었습니다.
