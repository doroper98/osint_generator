# 『경유의 길 — 사흘에 한 번』 유튜브 설명문 (v7.3.0, D-0225). chapters.at = 장면 id 또는 TITLE.
schema_version: 1
headline: 경유의 길 — 사흘에 한 번 · 우크라이나의 정유소 타격, 울산발 유조선, 걸프의 불길, 그리고 워싱턴의 경유 거래
summary: 국제에너지기구에 따르면 2026년 첫 여덟 달 동안 우크라이나는 사흘에 한 번꼴로 러시아 정유소를 타격했고, 러시아의 정제 처리량과 경유 생산은 크게 줄었습니다. 러시아가 경유 수출을 막고 연료 수입에 나선 사이, 가디언은 7~8월 한국 항구에서 17만 6천 t이 넘는 연료(대부분 경유)가 유조선 일곱 척에 실려 러시아 극동으로 갔고 그중 세 척이 영국·유럽연합 제재 대상이라고 보도했습니다. 한국 정부는 경유가 대러 수출통제 품목이 아니며 사실관계를 확인하고 있다고 밝혔습니다. 같은 해 걸프에서는 라스라판·푸자이라·동서 송유관이 공격을 받아 호르무즈를 지나는 경유가 크게 줄었고, 미국은 10월 러시아산 경유 거래를 허용했습니다. 에너지 휴전 발표 나흘 만에 정유소와 가스 시설 공격이 다시 시작된 과정을 출처와 기준 시점과 함께 지도로 정리했습니다. 수치는 각 기관·매체의 발표값이며, 출처마다 다른 수치(8월 한국산 물량 — 케이플러 약 11만 2천 t, 크레아 약 1만 8천 t)는 함께 적었습니다. 우크라이나 국방부의 '정제 능력 51% 마비' 발표는 독립 검증 전입니다.
