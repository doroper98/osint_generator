# 『경유의 길 — 사흘에 한 번』 주문 (v7.2.0→v7.3.0) — 감독 지시 D-0225·사용자 결정 D232(2026-10-17 밤, 게이트 ①·② 감독 위임).
schema_version: 1
topic: 우크라이나의 러시아 정유소 타격과 러시아 경유 부족, 한국산 경유의 블라디보스토크행, 걸프 에너지 시설 타격, 미국의 러시아 경유 거래와 에너지 휴전 붕괴
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다
instructions:
  - "사용자 원문(D232): '원고나 콘티의 나의 검토 없이 니 검토로 바로 내일 아침까지 영상이 제작될 수 있도록 해.' '영상에 인물이 필요하면 인물 등장씬을 적극적으로 작동시켜. 기사도 적극적으로 조판하고. 이번에는 좀 방대한 영상이 될 수 있겠다?'"
  - "막 구성(D-0225 §2.3): 콜드 오픈(5~6문장, 10월 15일 새벽 랴잔 재타격 — 휴전이 깨진 순간) → 1막 '사흘에 한 번'(25~30, 우크라이나의 러시아 정유소 타격·표적 논리(유전이 아니라 정제)·IEA 수치·경유 생산 3~5월·정제 처리량·수출·러시아 수출 금지와 수입 급증(인도 휘발유 70%·한국 2위)) → 2막 '철도 끝'(20~25, 극동 지리·콤소몰스크·5월 연료난·구매자 로스네프트·NNK·한국 수출 관리·정유사 '물량 남는데'·울산→블라디보스토크·7척 14회 17만6천t·제재 선박 3척·허위 목적지·여수 해상 환적·한국 정부 입장·우크라이나 비판·포로 송환 갈등·대사 소환) → 3막 '걸프'(보조 무대 20~25, 2월 28일 개전·호르무즈·3월 18일 사우스파르스·라스라판 콜드박스·푸자이라 19회·동서 파이프라인 펌프장 9월 10일·하르그섬·걸프 정부 '요격 파편' 대 로이터 '의도적'·호르무즈 통과 경유 7월 16만5천) → 4막 '역류'(15~20, 로스네프트 SDN → 일반허가 → 트럼프·푸틴 경유 거래(10/9, 2027-04 까지)·베선트·에너지 휴전(10/11)과 붕괴(10/15)·러시아의 하르키우·폴타바 가스 타격·노박 '월 300만~350만t'·이재명 '영원한 적도 우방도 없다'(10/13)) → 엔딩(네 전장을 관통하는 한 줄 + 엔딩 카드)."
  - "귀속(D-0225 §3, G4·C9): 양측 병기 의무 — 사우스파르스 귀속(이스라엘 단독 보도 / 이란 '미국·이스라엘'), 걸프 피해(정부 '요격 파편' / 로이터 '의도적'), 8월 한국산 수입량(CREA 1만8천t / Kpler 11만2천t), 51%(우크라이나 국방부 발표, 독립 검증 전)."
  - "본문 금지(D-0225 §3): 콤소몰스크 '피격'(→ '화재 보도가 있었으나 원인은 확인되지 않았습니다'), 나프토가스 '공격 2배', 러시아 구매 가격·프리미엄, '로스네프트·NNK 가 자기 주유소를 채우려고'(추론 — 'Kpler 가 확인한 구매자는 이 두 회사이고, 두 회사는 극동 정유소를 가지고 있습니다' 수준으로만)."
  - "분량(D-0225 §2.3·U5): 7~10분, 90~125문장. 10분을 넘으면 1부 = 콜드 오픈~2막."
  - 숫자는 발표값 그대로, '약' 표기 유지. 환산값은 화면에 '환산' 표기. 출처 없는 수치 금지.
  - 인물 발언 문장마다 인용 후보, 기사 출처 문장마다 기사 카드 후보(UF-101·102). 발음 텍스트 숫자·기호 금지, banned_phrases 0.
  - "엔딩 카드 맨 아래 가장 작은 글씨: '비행 경로·출발 위치는 개략 표현 · 51%·31%는 우크라이나 측 발표로 독립 검증 전'(D-0225 §2.3). 31% 는 가디언이 인용한 Kpler 집계이며 우크라이나 제재 담당관이 인용 — 원고에서는 Kpler 귀속."
  - "주 무대 메르카토르(울산~블라디보스토크~시베리아~서부 러시아~우크라이나), 보조 무대 걸프(암전 1회 진입·1회 복귀)."
