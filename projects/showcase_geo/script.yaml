schema_version: 1
title: 쇼케이스 — 지도 위의 경유
subtitle: 『경유의 길』 축약과 호르무즈·DMZ 자료 장 — 화면 요소·목소리·글꼴 확인용
date: 2026.10.28
scenes:
- id: cold
  kind: cold
  stage: 러시아
  sentences:
  - date: 2026.10.15
    text: 전장과는 조금 떨어져 있는 조용하던 10월 15일 새벽, 모스크바에서 남동쪽으로 약 200km 떨어진 도시 랴잔의 정유소에 불길이 올랐습니다.
    tts: 전장과는 조금 떨어져 있는 조용하던 시월 십오일 새벽, 모스크바에서 남동쪽으로 약 이백 킬로미터 떨어진 도시 랴잔의 정유소에 불길이 올랐습니다.
    emphasis:
    - 랴잔
    sources:
    - clm_0099
  - date: 2026.10.06
    text: 그리고 이 전쟁이 만든 경유 부족은 한국의 울산항까지 닿아 있었습니다.
    emphasis:
    - 울산항
    sources:
    - clm_0001
- id: act1
  kind: act
  stage: 러시아
  sentences:
  - date: '2026.09'
    text: 이야기의 시작은 올해 봄부터 이어진 러시아 정유소 타격입니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0039
  - date: '2026.09'
    text: 우크라이나의 드론은 왜 유전이 아니라 정유소를 노렸을까요.
    role: intro
    emphasis: []
    sources:
    - clm_0039
    - clm_0117
  - date: 2026.09.17
    text: 올해 첫 여덟 달 동안 우크라이나는 사흘에 한 번꼴로 러시아 정유소를 타격했습니다.
    emphasis:
    - 사흘에 한 번
    sources:
    - clm_0039
  - date: 2026.09.17
    text: 또한 표적은 원유를 캐는 유전이 아니라, 원유를 경유와 휘발유로 바꾸는 정유소였습니다.
    emphasis: []
    sources:
    - clm_0039
  - date: 2026.09.11
    text: 즉 원유는 계속 팔려 나갔지만, 러시아 안에서 쓸 경유와 휘발유를 만드는 공장이 타격을 받은 것입니다.
    emphasis: []
    sources:
    - clm_0117
    - clm_0041
  - date: '2026.06'
    text: 그 결과 러시아의 정제 처리량은 크게 줄었습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: '2026.06'
    text: 6월 러시아의 정제 처리량은 하루 380만 배럴로, 20여 년 만에 가장 적었습니다.
    tts: 유월 러시아의 정제 처리량은 하루 삼백팔십만 배럴로, 이십여 년 만에 가장 적었습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: 2026.07.08
    text: 그러자 러시아는 7월 8일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    tts: 그러자 러시아는 칠월 팔일부터 정유사까지 포함한 경유 수출 전면 금지에 들어갔습니다.
    emphasis: []
    sources:
    - clm_0045
  - date: '2026.09'
    text: 그리고 가장 먼저 탈이 난 곳은 정유소가 드문 동쪽 끝이었습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0118
    - clm_0110
- id: act2
  kind: act
  stage: 극동
  sentences:
  - date: '2026.08'
    text: 이제 무대를 러시아의 동쪽 끝, 극동으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0118
  - date: '2026.08'
    text: 극동의 연료 사정은 처음부터 넉넉하지 않았습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0108
  - date: 2026.10.06
    text: 7~8월 한국 항구에서 연료 17만 6천 t 이상이 실렸고, 대부분 경유였습니다.
    tts: 칠에서 팔월 한국 항구에서 연료 십칠만 육천 톤 이상이 실렸고, 대부분 경유였습니다.
    emphasis:
    - 17만 6천 t
    sources:
    - clm_0001
  - date: 2026.10.06
    text: 유조선 일곱 척이 러시아 극동으로 열네 번 오갔습니다.
    emphasis: []
    sources:
    - clm_0002
  - date: '2026.08'
    text: 제재 유조선 레일라호는 7월과 8월 두 차례 울산을 떠나 블라디보스토크로 갔습니다.
    tts: 제재 유조선 레일라호는 칠월과 팔월 두 차례 울산을 떠나 블라디보스토크로 갔습니다.
    emphasis: []
    sources:
    - clm_0005
  - date: 2026.08.10
    text: 그런데 두 번째 항해에서 레일라호는 목적지를 일본 니가타로 신고했습니다.
    emphasis:
    - 니가타
    sources:
    - clm_0007
  - date: 2026.10.06
    text: 정유소가 모자란 극동의 빈자리에, 한국 항구에서 실린 경유가 들어간 셈입니다.
    role: outro
    emphasis: []
    sources:
    - clm_0108
    - clm_0001
- id: act3
  kind: act
  stage: 걸프
  sentences:
  - date: '2026.03'
    text: 이번에는 시점을 올해 2월 말, 무대를 페르시아만으로 옮깁니다.
    tts: 이번에는 시점을 올해 이월 말, 무대를 페르시아만으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0063
  - date: '2026.03'
    text: 같은 경유를 두고, 그곳에서는 또 다른 전쟁이 벌어지고 있었습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0063
    - clm_0061
  - date: '2025'
    text: 호르무즈 해협은 페르시아만에서 먼바다로 나가는 유일한 바닷길입니다.
    emphasis:
    - 유일한 바닷길
    sources:
    - clm_hz_0005
    role: background
  - date: 2026.02.28
    text: 올해 2월 28일, 미국과 이스라엘이 이란을 공습했습니다.
    tts: 올해 이월 이십팔일, 미국과 이스라엘이 이란을 공습했습니다.
    sources:
    - clm_hz_0009
  - date: 2026.03.02
    text: 이란은 곧바로 호르무즈 해협을 닫았습니다.
    emphasis:
    - 해협을 닫았습니다
    sources:
    - clm_hz_0011
  - date: 2026.03.18
    text: 그 뒤 걸프의 에너지 시설이 차례로 표적이 됐습니다.
    emphasis: []
    sources:
    - clm_0063
  - date: 2026.03.21
    text: 3월 21일, 한국은 영국, 프랑스, 일본 등 일곱 나라의 공동성명에 이름을 올렸습니다.
    tts: 삼월 이십일일, 한국은 영국, 프랑스, 일본 등 일곱 나라의 공동성명에 이름을 올렸습니다.
    sources:
    - clm_hz_0017
  - date: '2026.08'
    text: 7월 호르무즈를 지난 경유는 하루 16만 5천 배럴로, 분쟁 전 약 80만 배럴의 일부였습니다.
    tts: 칠월 호르무즈를 지난 경유는 하루 십육만 오천 배럴로, 분쟁 전 약 팔십만 배럴의 일부였습니다.
    emphasis: []
    sources:
    - clm_0061
    - clm_0062
  - date: 2026.10.14
    text: 그 결과 3분기 세계 경유 공급은 1년 전보다 하루 170만 배럴 줄었습니다.
    tts: 그 결과 삼분기 세계 경유 공급은 일 년 전보다 하루 백칠십만 배럴 줄었습니다.
    emphasis: []
    sources:
    - clm_0141
    role: outro
- id: act4
  kind: act
  stage: 한반도
  sentences:
  - date: 2026.09.21
    text: 이제 자료 장으로, 지난 9월 한반도의 비무장지대로 무대를 옮깁니다.
    tts: 이제 자료 장으로, 지난 구월 한반도의 비무장지대로 무대를 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_dmz_0001
  - date: 2026.09.21
    text: 9월 21일 오전, 서부전선 비무장지대에서 폭발이 일어났습니다.
    tts: 구월 이십일일 오전, 서부전선 비무장지대에서 폭발이 일어났습니다.
    emphasis: []
    sources:
    - clm_dmz_0001
    role: intro
  - date: 2026.09.21
    text: 군사분계선에서 남쪽으로 약 10m 떨어진 곳이었습니다.
    tts: 군사 분계선에서 남쪽으로 약 십 미터 떨어진 곳이었습니다.
    emphasis:
    - 약 10m
    sources:
    - clm_dmz_0022
  - date: 2026.09.29
    text: 지뢰를 누가, 언제 묻었는지는 아직 규명되지 않았습니다.
    emphasis:
    - 누가, 언제
    sources:
    - clm_dmz_0024
    role: outro
- id: act5
  kind: act
  stage: 워싱턴
  sentences:
  - date: 2026.10.09
    text: 마지막으로 시점을 지난주로, 무대를 워싱턴으로 옮깁니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0083
  - date: 2026.10.09
    text: 미국은 지난해 러시아 석유회사들을 제재한 나라입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0018
  - date: 2026.10.09
    text: 그런데 올해 미국의 선택은 거꾸로 움직였습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0080
    - clm_0083
  - date: 2026.10.09
    text: 이어서 재무부는 러시아산 경유의 판매와 운송, 수입을 허용하는 일반허가 135호를 내놨습니다.
    tts: 이어서 재무부는 러시아산 경유의 판매와 운송, 수입을 허용하는 일반허가 백삼십오 호를 내놨습니다.
    emphasis:
    - 일반허가 135호
    sources:
    - clm_0083
  - date: 2026.10.11
    text: 이어서 10월 11일, 트럼프 대통령은 즉시 에너지 휴전이 발효된다고 밝혔습니다.
    tts: 이어서 시월 십일일, 트럼프 대통령은 즉시 에너지 휴전이 발효된다고 밝혔습니다.
    emphasis:
    - 에너지 휴전
    sources:
    - clm_0130
    - clm_0091
  - date: 2026.10.15
    text: 휴전은 나흘 만에 끝났습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0099
- id: ending
  kind: ending
  sentences:
  - date: 2026.10.17
    text: 사흘에 한 번 타격당한 러시아의 정유소, 울산을 떠난 유조선, 불붙은 걸프의 수출항, 그리고 워싱턴의 경유 거래.
    emphasis: []
    sources:
    - clm_0039
    - clm_0001
    - clm_0063
    - clm_0083
  - date: 2026.10.17
    text: 네 장면은 모두 모자란 경유 한 가지로 이어져 있습니다.
    emphasis: []
    sources:
    - clm_0141
    - clm_0107
