  - "차트는 하나의 시간축 세계(C0·UF-135): 분기 실적 막대와 주가 선은 같은 시간축 위 두 레인. 차트 아일랜드 하나에 층 3 이상([chart-layers-min]), 새 층 간격 4초 이상([chart-overload]). 무대 조판 정본 D-0330(손실 막대 A, noturno), 열 확대 인셋(가이던스·slope·덤벨·diverging, D-0336)."
  - "삼성전자는 4분기 숫자 가이던스를 내지 않았다 — act3 는 회사 전망 문장(인용)과 비트 출하 전망으로. 가이던스 띠를 지어내지 않는다."
  - "act5 는 mercator 보조 무대 전환 1회: 한국 생산 거점 → 미국 텍사스 테일러, 환율, 메모리 부족 고리(인텔 실적 자료)."
  - 투자 권유 표현 금지, 엔딩 카드 투자 고지 줄. 화면 조작 해설 문구 금지(UF-202).
