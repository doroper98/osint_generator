schema_version: 1
title: 우크라이나 드론 전쟁, 주장과 검증
subtitle: 탈환 면적부터 40일 작전까지, 누가 무엇을 말했나
date: 2026.06.29
scenes:
- id: open
  sentences:
  - date: '2026'
    text: 시르스키 총사령관과 젤렌스키 대통령은 올해 들어 약 600km²를 되찾았다고 밝혔습니다.
    tts: 시르스키 총사령관과 젤렌스키 대통령은 올해 들어 약 육백 제곱킬로미터를 되찾았다고 밝혔습니다.
    emphasis:
    - 600km²
    sources:
    - clm_0001
  - date: '2026'
    text: 로이터는 이 주장을 독자적으로 검증하지 못했다고 보도했습니다.
    emphasis:
    - 검증하지 못했다
    sources:
    - clm_0001
  - date: '2026.06'
    text: 이 영상은 우크라이나 드론 전력을 둘러싼 주장들이 어디까지 확인됐는지 따라갑니다.
    emphasis: []
    sources: []
- id: frontline
  sentences:
  - date: '2026.06'
    text: 우크라이나 전선의 길이는 약 1,200km입니다.
    tts: 우크라이나 전선의 길이는 약 천이백 킬로미터입니다.
    emphasis:
    - 1,200km
    sources:
    - clm_0005
  - date: '2026.06'
    text: 가장 격렬한 전투는 훌랴이폴레 일대에서 벌어지고 있습니다.
    emphasis:
    - 훌랴이폴레
    sources:
    - clm_0006
  - date: '2025.12'
    text: 러시아는 2025년 12월 포크로우스크를 점령했다고 주장했습니다.
    tts: 러시아는 이천이십오년 십이월 포크로우스크를 점령했다고 주장했습니다.
    emphasis:
    - 포크로우스크
    sources:
    - clm_0004
  - date: '2025.12'
    text: 우크라이나 독립 전장 지도 딥스테이트도 수주째 이곳을 러시아 완전 장악 지역으로 표시하고 있습니다.
    emphasis:
    - 딥스테이트
    sources:
    - clm_0004
- id: may_claim
  sentences:
  - date: '2026.05'
    text: 시르스키 총사령관은 텔레그램에서 5월에 잃은 땅보다 약 100km²를 더 되찾았다고 밝혔습니다.
    tts: 시르스키 총사령관은 텔레그램에서 오월에 잃은 땅보다 약 백 제곱킬로미터를 더 되찾았다고 밝혔습니다.
    emphasis:
    - 100km²
    sources:
    - clm_0002
  - date: '2026.05'
    text: 로이터는 이 수치 역시 독자적으로 검증하지 못했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0002
- id: drone_field
  sentences:
  - date: '2026.06'
    text: 이어지는 숫자들은 각각 한 매체나 한 기고문이 전한 내용입니다.
    emphasis: []
    sources: []
  - date: '2026'
    text: 드론XL은 일부 광섬유 유선 드론의 케이블이 최대 40km에 이른다고 보도했습니다.
    tts: 드론엑스엘은 일부 광섬유 유선 드론의 케이블이 최대 사십 킬로미터에 이른다고 보도했습니다.
    emphasis:
    - 40km
    sources:
    - clm_0009
  - date: '2026'
    text: 드론XL은 우크라이나 보병 2명이 교대 없이 오리히우 인근 진지를 165일간 지켰다고 보도했습니다.
    tts: 드론엑스엘은 우크라이나 보병 두 명이 교대 없이 오리히우 인근 진지를 백육십오일간 지켰다고 보도했습니다.
    emphasis:
    - 165일
    sources:
    - clm_0011
  - date: '2026.02'
    text: 카네기 기고문은 우크라이나가 2026년 2월 러시아 장거리 무인기의 스타링크 사용을 제한했다고 썼습니다.
    tts: 카네기 기고문은 우크라이나가 이천이십육년 이월 러시아 장거리 무인기의 스타링크 사용을 제한했다고 썼습니다.
    emphasis:
    - 스타링크
    sources:
    - clm_0008
- id: deep_strike
  sentences:
  - date: '2026.06'
    text: 한국경제는 젤렌스키 대통령이 보안국(SBU) 주도의 '40일 작전'을 승인했다고 보도했습니다.
    tts: 한국경제는 젤렌스키 대통령이 우크라이나 보안국 주도의 사십일 작전을 승인했다고 보도했습니다.
    emphasis:
    - 40일 작전
    sources:
    - clm_0018
  - date: '2026.06'
    text: 같은 보도에 따르면 작전 선포 직후 우크라이나 드론 660기가 러시아를 공격했습니다.
    tts: 같은 보도에 따르면 작전 선포 직후 우크라이나 드론 육백육십 기가 러시아를 공격했습니다.
    emphasis:
    - 660기
    sources:
    - clm_0019
- id: robot_debate
  sentences:
  - date: '2026'
    text: 잘루즈니 전 총사령관 등은 로봇이 보병을 대규모로 대체할 수 없다고 봤습니다.
    emphasis:
    - 대체할 수 없다
    sources:
    - clm_0017
  - date: '2026'
    text: 땅을 확보하려면 여전히 보병이 필요하다는 입장입니다.
    emphasis: []
    sources:
    - clm_0017
  - date: '2026'
    text: 자고로드뉴크는 무인 체계가 기존 무기 체계를 대체하고 있다고 주장했습니다.
    emphasis:
    - 대체하고 있다
    sources:
    - clm_0017
  - date: '2026'
    text: 그 변화가 군 조직과 교리까지 바꾸고 있다는 입장입니다.
    emphasis: []
    sources:
    - clm_0017
- id: close
  sentences:
  - date: '2026.06'
    text: 되찾은 땅의 실제 면적도, 로봇이 보병의 자리를 어디까지 채울지도 아직 확인되지 않았습니다.
    emphasis: []
    sources:
    - clm_0001
    - clm_0017
