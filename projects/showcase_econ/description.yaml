headline: 쇼케이스 — 금리 선 위의 1년 · 연준의 인하·동결·인상을 한 시간축 위에서
summary: 이 영상은 저장소가 지금 그릴 수 있는 경제 데이터 화면 요소·목소리·글꼴을 한 편에 담은 데모입니다. 2025년 10월부터 2026년 9월까지 미국 연준의 금리 결정을 하나의 시간축 위에 놓고 따라갑니다. 수치는 연준·노동통계국 공개 자료(FRED)와 연준 경제전망요약(SEP)이며 기준 시점을 화면에 적었습니다. 새 사실과 새 수치는 없습니다. 투자 권유가 아닌 정보 제공 목적의 영상입니다.
