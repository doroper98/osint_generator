schema_version: 1
title: 호르무즈와 한국
subtitle: 한국은 왜 파병하지 않았나
date: 2026.09.26
scenes:
- id: open
  sentences:
  - date: 2026.09.18
    text: 9월 18일, 이재명 대통령이 기자회견을 열었습니다.
    tts: 구월 십팔일, 이재명 대통령이 기자회견을 열었습니다.
    sources: [clm_0001]
  - date: 2026.09.18
    text: 전쟁에 개입하는 파병은 하지 않겠다는 발표였습니다.
    emphasis:
    - 파병은 하지 않겠다
    sources: [clm_0002]
  - date: 2026.09.18
    text: 한국 선박과 국민을 보호하는 최소한의 활동만 이어가겠다고 했습니다.
    emphasis:
    - 최소한의 활동
    sources: [clm_0003]
  - date: 2026.09.18
    text: 미국이 동맹국들에 해협 방어를 요구한 지 여섯 달 만에 나온 결론입니다.
    sources: [clm_0004]
- id: route
  sentences:
  - date: '2025'
    text: 호르무즈 해협은 페르시아만에서 먼바다로 나가는 유일한 바닷길입니다.
    emphasis:
    - 유일한 바닷길
    sources: [clm_0005]
  - date: '2025'
    text: 지난해 한국이 수입한 원유의 61%가 이 해협을 지났습니다.
    tts: 지난해 한국이 수입한 원유의 육십일 퍼센트가 이 해협을 지났습니다.
    emphasis:
    - 61%
    sources: [clm_0006]
  - date: '2025'
    text: 플라스틱의 원료인 나프타도 54%가 같은 길로 들어왔습니다.
    tts: 플라스틱의 원료인 나프타도 오십사 퍼센트가 같은 길로 들어왔습니다.
    emphasis:
    - 54%
    sources: [clm_0007]
  - date: '2025'
    text: 유조선은 해협을 나와 인도양을 건너고, 믈라카 해협을 거쳐 한국 남해안에 닿습니다.
    sources: [clm_0008]
- id: war
  sentences:
  - date: 2026.02.28
    text: 올해 2월 28일, 미국과 이스라엘이 이란을 공습했습니다.
    tts: 올해 이월 이십팔일, 미국과 이스라엘이 이란을 공습했습니다.
    sources: [clm_0009]
  - date: 2026.02.28
    text: 이 공격으로 이란의 최고지도자 알리 하메네이가 숨졌습니다.
    sources: [clm_0010]
  - date: 2026.03.02
    text: 이란은 곧바로 호르무즈 해협을 닫았습니다.
    emphasis:
    - 해협을 닫았습니다
    sources: [clm_0011]
  - date: '2026.03'
    text: 이란이 허가한 배만 지나갈 수 있었고, 대부분 중국과 인도로 가는 유조선이었습니다.
    sources: [clm_0012]
- id: ask
  sentences:
  - date: 2026.03.15
    text: 3월 15일, 트럼프 대통령은 이 해협으로 석유를 받는 나라들이 직접 지키라고 요구했습니다.
    tts: 삼월 십오일, 트럼프 대통령은 이 해협으로 석유를 받는 나라들이 직접 지키라고 요구했습니다.
    sources: [clm_0013]
  - date: 2026.03.16
    text: 다음 날 독일, 영국, 일본, 호주, 그리고 한국이 이 요구를 거절했습니다.
    emphasis:
    - 거절
    sources: [clm_0014]
  - date: 2026.03.16
    text: 독일 국방장관은 우리가 시작한 전쟁이 아니라고 말했습니다.
    sources: [clm_0015]
  - date: 2026.03.17
    text: 트럼프 대통령은 동맹들의 결정을 매우 어리석은 실수라고 비판했습니다.
    sources: [clm_0016]
  - date: 2026.03.21
    text: 3월 21일, 한국은 영국, 프랑스, 일본 등 일곱 나라의 공동성명에 이름을 올렸습니다.
    tts: 삼월 이십일일, 한국은 영국, 프랑스, 일본 등 일곱 나라의 공동성명에 이름을 올렸습니다.
    sources: [clm_0017]
  - date: 2026.03.21
    text: 이란의 공격을 규탄하고, 항행의 자유를 지키는 노력에 함께한다는 내용이었습니다.
    emphasis:
    - 항행의 자유
    sources: [clm_0018]
- id: timeline
  sentences:
  - date: '2026.04'
    text: 그 뒤 여섯 달 동안 전쟁과 협상이 번갈아 이어졌습니다.
    sources: [clm_0019]
  - date: 2026.04.07
    text: 4월 7일, 해협을 열기 위한 무력 사용 결의안은 러시아와 중국의 거부권에 막혔습니다.
    tts: 사월 칠일, 해협을 열기 위한 무력 사용 결의안은 러시아와 중국의 거부권에 막혔습니다.
    sources: [clm_0020]
  - date: 2026.04.13
    text: 4월 13일, 미국은 이란 항구를 드나드는 배를 막는 해상 봉쇄에 들어갔습니다.
    tts: 사월 십삼일, 미국은 이란 항구를 드나드는 배를 막는 해상 봉쇄에 들어갔습니다.
    sources: [clm_0021]
  - date: 2026.06.17
    text: 6월 17일에는 미국과 이란이 전쟁을 끝내는 양해각서에 서명했습니다.
    tts: 유월 십칠일에는 미국과 이란이 전쟁을 끝내는 양해각서에 서명했습니다.
    sources: [clm_0022]
  - date: 2026.07.08
    text: 하지만 7월 8일, 해협에서 상선들이 공격받고 미국이 다시 이란을 공습하면서 휴전은 무너졌습니다.
    tts: 하지만 칠월 팔일, 해협에서 상선들이 공격받고 미국이 다시 이란을 공습하면서 휴전은 무너졌습니다.
    emphasis:
    - 휴전은 무너졌습니다
    sources: [clm_0023]
  - date: 2026.08.25
    text: 8월 25일, 미국은 해협 통항로의 기뢰를 모두 제거했다고 밝혔습니다.
    tts: 팔월 이십오일, 미국은 해협 통항로의 기뢰를 모두 제거했다고 밝혔습니다.
    sources: [clm_0024]
- id: cost
  sentences:
  - date: 2026.06.11
    text: 국제해사기구는 6월 11일까지 선박 공격 46건과 선원 14명의 죽음을 확인했습니다.
    tts: 국제해사기구는 유월 십일일까지 선박 공격 사십육 건과 선원 열네 명의 죽음을 확인했습니다.
    emphasis:
    - 46건
    - 14명
    sources: [clm_0025]
  - date: 2026.06.11
    text: 배 천여 척과 선원 2만 명이 걸프 안쪽에 발이 묶였습니다.
    tts: 배 천여 척과 선원 이만 명이 걸프 안쪽에 발이 묶였습니다.
    sources: [clm_0026]
- id: review
  sentences:
  - date: 2026.09.03
    text: 9월 초, 국내 방송사들은 정부가 연내 파병을 준비하고 있다고 보도했습니다.
    tts: 구월 초, 국내 방송사들은 정부가 연내 파병을 준비하고 있다고 보도했습니다.
    sources: [clm_0027]
  - date: 2026.09.03
    text: 해상초계기와 군수지원함 같은 선택지가 거론됐습니다.
    sources: [clm_0028]
  - date: 2026.09.04
    text: 대통령실은 군사적 방안을 포함해 검토하고 있지만, 결정된 것은 없다고 밝혔습니다.
    sources: [clm_0029]
  - date: 2026.09.04
    text: 실제로 보낸다면 2009년 청해부대 이후 한반도 밖으로 나가는 첫 해상 파견이 될 수 있었습니다.
    tts: 실제로 보낸다면 이천구 년 청해부대 이후 한반도 밖으로 나가는 첫 해상 파견이 될 수 있었습니다.
    sources: [clm_0030]
- id: past
  sentences:
  - date: '2004'
    text: 한국이 이런 결정을 내려야 했던 것은 처음이 아닙니다.
    sources: [clm_0031]
  - date: '2004'
    text: 2004년 노무현 정부는 이라크 아르빌에 자이툰 부대를 보냈습니다.
    tts: 이천사 년 노무현 정부는 이라크 아르빌에 자이툰 부대를 보냈습니다.
    sources: [clm_0032]
  - date: '2004'
    text: 북핵 6자회담에서 미국의 지지를 지키려는 판단이었지만, 국내 여론은 싸늘했습니다.
    tts: 북핵 육자회담에서 미국의 지지를 지키려는 판단이었지만, 국내 여론은 싸늘했습니다.
    sources: [clm_0033]
  - date: '2020.01'
    text: 2020년에는 청해부대의 작전 구역을 호르무즈까지 넓히되, 지휘권은 한국군이 갖는 방식을 택했습니다.
    tts: 이천이십 년에는 청해부대의 작전 구역을 호르무즈까지 넓히되, 지휘권은 한국군이 갖는 방식을 택했습니다.
    emphasis:
    - 지휘권은 한국군
    sources: [clm_0034]
- id: debate
  sentences:
  - date: 2026.09.07
    text: 9월 7일, 정부는 전투가 격해지고 반대 여론이 커지자 계획을 다시 조정하기 시작했습니다.
    tts: 구월 칠일, 정부는 전투가 격해지고 반대 여론이 커지자 계획을 다시 조정하기 시작했습니다.
    sources: [clm_0035]
  - date: 2026.09.08
    text: 다음 날 서울 미국대사관 근처에서는 대학생들이 파병 반대 집회를 열었습니다.
    sources: [clm_0036]
  - date: 2026.09.08
    text: 파병을 지지하는 쪽은 호르무즈가 곧 한국의 경제 안보라고 말합니다.
    emphasis:
    - 경제 안보
    sources: [clm_0037]
  - date: 2026.09.10
    text: 반대하는 쪽은 비전투 부대라도 미사일과 드론이 오가는 곳에서는 표적이 될 수 있다고 봅니다.
    emphasis:
    - 표적
    sources: [clm_0038]
  - date: 2026.09.10
    text: 미국의 방공 미사일 재고가 줄고 있다는 점도 반대 논리의 근거가 됐습니다.
    sources: [clm_0039]
- id: decision
  sentences:
  - date: 2026.09.18
    text: 그리고 9월 18일, 이재명 대통령은 전쟁에 들어가는 파병은 없다고 분명히 했습니다.
    tts: 그리고 구월 십팔일, 이재명 대통령은 전쟁에 들어가는 파병은 없다고 분명히 했습니다.
    emphasis:
    - 파병은 없다
    sources: [clm_0040]
  - date: 2026.09.18
    text: 대신 분쟁의 주변부에서 한국군이 맡을 역할은 열어 두었습니다.
    sources: [clm_0041]
- id: now
  sentences:
  - date: '2026.09'
    text: 미군은 호위 작전으로 원유 10억 배럴을 해협 밖으로 내보냈다고 밝혔습니다.
    tts: 미군은 호위 작전으로 원유 십억 배럴을 해협 밖으로 내보냈다고 밝혔습니다.
    emphasis:
    - 10억 배럴
    sources: [clm_0042]
  - date: '2026.09'
    text: 전쟁은 아직 끝나지 않았고, 해협의 통행도 정상으로 돌아오지 않았습니다.
    sources: [clm_0043]
  - date: '2026.09'
    text: 지난해 기준 원유 수입의 61%가 이 해협에 기대고 있다는 사실도 그대로입니다.
    tts: 지난해 기준 원유 수입의 육십일 퍼센트가 이 해협에 기대고 있다는 사실도 그대로입니다.
    sources: [clm_0044]
  - date: '2026.09'
    text: 청해부대가 어디까지 움직일지, 국회가 이 문제를 어떻게 다룰지는 아직 정해지지 않았습니다.
    sources: [clm_0045]
