# 『발다이 포럼 — 러시아의 핵 억지 발언과 에너지 압박』 주문 (v5.3.0) — 사용자 요청(2026-10-02) 그대로 옮김.
schema_version: 1
topic: 2026년 9월 28일~10월 1일 모스크바 발다이 토론클럽 — 10월 1일 푸틴 대통령의 칼리닌그라드 등 영토 직접 공격 시 모든 무기 사용 검토 경고, 유럽 공격 계획 부인, 제재 유지 시 경유 세계시장 미공급, 우크라이나의 정유시설 공격 피해 인정
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다
instructions:
  - "사용자 요청: 위의 내용에 대한 상세한 영상. 콘티판 영상부터 시작한다."
  - 핵무기 사용을 결정했다는 발표가 아니라 서방에 개입의 한계를 경고하는 발언이라는 점을 분명히 한다(사용자 주문 문장).
  - 군사적 긴장과 연료 공급, 제재 문제를 연결한 메시지로 읽는 것은 해석이다 — 해석은 해석으로 표기하고 사실과 섞지 않는다.
  - 푸틴 발언은 귀속한다("~라고 말했습니다"). 러시아·나토·우크라이나 쪽 입장을 같은 무게로 다룬다.
  - 수치(정유 피해 GDP 1%, 정유 능력 타격 비율, 경유 수출 금지 기한 등)는 출처와 기준 시점이 있는 것만, 주장 주체를 밝힌다.
  - 지도 무대 중심 — 칼리닌그라드(폴란드·리투아니아 사이), 모스크바, 발트해, 우크라이나·러시아 정유시설.
  - 사건 경과(회의 일정, 9월 30일 경유 수출 금지 연장, 10월 1일 발언, 나토 반응)는 겹침 카드(cascade)로(사용자 지시 2026-10-02 "사건 경과를 겹침 카드로").
