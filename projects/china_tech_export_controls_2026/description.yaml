# 『제품은 팔고, 능력은 안 판다』 유튜브 설명문 (v7.4.0, D-0283). chapters.at = 장면 id 또는 TITLE.
schema_version: 1
headline: 제품은 팔고, 능력은 안 판다 · 중국 기술 수출통제 열흘, 그리고 한국
summary: 중국 상무부는 2026년 10월 16일부터 26일까지 열흘 남짓 사이 다섯 건의 수출통제 공고를 냈습니다. 인공지능·생물의약·태양광 기술 40개를 수출 금지·제한 목록에 새로 넣는 초안(금지 후보 14개, 제한 후보 26개), 드론·터널굴착기·준설선 수출 관리(11월 18일 시행), 그리고 영업비밀 특별규정 초안입니다. 터널굴착기는 민감 국가·지역으로 갈 때 허가, 그 밖은 등록으로 수출을 증명하게 되며, 민감 국가 명단은 아직 공개되지 않았습니다. 상무부는 특정 국가·지역·실체를 겨냥하지 않는 정례 작업이라고 밝혔고, 인도 옵서버연구재단의 마노즈 조시는 제품은 팔면서 기술 우위는 지키려는 조치로 해석했습니다. 2025년 희토류 통제 확대와 부산 미중 정상회담 뒤의 유예, 2027년 1월 10일까지 연장된 휴전을 배경으로 놓고, 중국산 터널굴착기가 들어간 경기도 전력구 공사와 진천 페로브스카이트 시험 라인 등 한국 접점을 출처와 기준 시점과 함께 지도로 정리했습니다. 기술 목록 개정과 영업비밀 규정은 의견 수렴 중인 초안이며, 일부 한국 접점은 단일 보도에 근거합니다.
