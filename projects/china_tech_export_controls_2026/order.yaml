instructions:
  - "사용자 원문(D-0282): 'fable 감독 세션 하나 띄워서 … 나한테 뭐 묻지 말고 새로 띄운 fable 에서 알아서 영상 완성본을 나한테 전달하도록 해.'"
  - "막 구성(D-0283 §4): cold(3~4, 11/18 터널굴착기 허가제) → act1 '열흘'(14~18, 10/16 기술 목록 초안 → 10/19 드론·터널굴착기 → 10/26 영업비밀 초안, 시간축 한 세계) → act2 '제품과 능력'(10~14, 2025-10 희토류 통제와의 차이, 상무부 입장 ↔ 해설 양측 귀속, 휴전 맥락) → act3 '한국'(출처 있는 접점만) → act4 '다음 날짜'(11/15·11/18·11/24, 2027-01-10 은 카드) → ending."
  - "사실 정정(R-0286, 조사 결과): 드론 공고는 10/14 가 아니라 10/19(제49호 — 제50·51·52호와 같은 날). 첫 공고(10/16)부터 마지막(10/26)까지 열흘이라 '보름' 대신 '열흘'. 오픈소스·논문으로 이미 공개된 인공지능 기술은 관리 대상에서 빠진다(공고 제48호) — '오픈소스 공개 = 기술 수출' 카드는 쓰지 않는다."
  - "귀속(G4·C9): 상무부 '정례 작업·특정 국가 겨냥 아님'(당사자 발언) ↔ ORF 조시 '제품은 팔고 능력은 지킨다'·관영 GT 논평 — 같은 무게. 민감 국가·지역 목록은 공표되지 않았다 → 지도에 특정 국가를 허가 대상으로 칠하지 않는다."
  - "한국 접점은 출처 있는 것만: 경기도 전력구 공사의 중국철건중공 굴착기(업계지 2025-12), 국내 시장 양강 구도(대한경제 2023 — 배경), 태양광(IBK 분석 귀속), 바이오(위탁생산·라이선스 제외). 지티엑스에 중국산 굴착기 투입은 출처 없음 → 쓰지 않는다."
  - 발음 텍스트 숫자·기호·라틴 약어 금지(TBM → 티비엠은 쓰지 않고 '터널굴착기', AI → 인공지능). 문장 끝 '~니다'. banned_phrases 0.
  - "엔딩 카드 맨 아래 가장 작은 글씨: 미검증 표기(D85) — '목록 초안·영업비밀 규정은 의견 수렴 중 초안 · 해석은 각 기관 견해'."
