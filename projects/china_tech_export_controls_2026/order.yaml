# 『제품은 팔고, 능력은 안 판다 — 중국 기술 수출통제』 주문 (v7.4.0, back_and_forth D-0283 — 사용자 위임 D-0282 "나한테 뭐 묻지 말고", 게이트 ①·② 감독 위임).
schema_version: 1
tempo: breath
attribution_mode: credits   # D243 — 보도 귀속은 엔딩 크레딧 장면별, 당사자 발언·논쟁 해석은 본문 귀속
topic: 중국 상무부 2026년 10월 기술·이중용도 수출통제 — 기술 목록 개정 초안(제48호, 10/16), 드론·터널굴착기·준설선(제49~51호, 10/19, 11/18 시행), 영업비밀 보호 특별규정 초안(10/26), 그리고 한국 접점
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다   # D-0283 §4 목표 3~5분 ≈ 문장 45~70
instructions:
  - "사용자 원문(D-0282): 'fable 감독 세션 하나 띄워서 … 나한테 뭐 묻지 말고 새로 띄운 fable 에서 알아서 영상 완성본을 나한테 전달하도록 해.'"
  - "막 구성(D-0283 §4): cold(3~4, 11/18 터널굴착기 허가제) → act1 '열흘'(14~18, 10/16 기술 목록 초안 → 10/19 드론·터널굴착기 → 10/26 영업비밀 초안, 시간축 한 세계) → act2 '제품과 능력'(10~14, 2025-10 희토류 통제와의 차이, 상무부 입장 ↔ 해설 양측 귀속, 휴전 맥락) → act3 '한국'(출처 있는 접점만) → act4 '다음 날짜'(11/15·11/18·11/24, 2027-01-10 은 카드) → ending."
  - "사실 정정(R-0286, 조사 결과): 드론 공고는 10/14 가 아니라 10/19(제49호 — 제50·51·52호와 같은 날). 첫 공고(10/16)부터 마지막(10/26)까지 열흘이라 '보름' 대신 '열흘'. 오픈소스·논문으로 이미 공개된 인공지능 기술은 관리 대상에서 빠진다(공고 제48호) — '오픈소스 공개 = 기술 수출' 카드는 쓰지 않는다."
  - "귀속(G4·C9): 상무부 '정례 작업·특정 국가 겨냥 아님'(당사자 발언) ↔ ORF 조시 '제품은 팔고 능력은 지킨다'·관영 GT 논평 — 같은 무게. 민감 국가·지역 목록은 공표되지 않았다 → 지도에 특정 국가를 허가 대상으로 칠하지 않는다."
  - "한국 접점은 출처 있는 것만: 경기도 전력구 공사의 중국철건중공 굴착기(업계지 2025-12), 국내 시장 양강 구도(대한경제 2023 — 배경), 태양광(IBK 분석 귀속), 바이오(위탁생산·라이선스 제외). 지티엑스에 중국산 굴착기 투입은 출처 없음 → 쓰지 않는다."
  - 발음 텍스트 숫자·기호·라틴 약어 금지(TBM → 티비엠은 쓰지 않고 '터널굴착기', AI → 인공지능). 문장 끝 '~니다'. banned_phrases 0.
  - "연출 메모 — 무대(R-0289 권고 B, 엔진이 mercator 주 무대 + timeline 보조 무대를 아직 렌더하지 못함): 주 무대 mercator 하나, stage_config.mercator.theme light(장르 기본 D154 — theme_reason 쓰지 않아도 된다). 시간축은 panel timeline 두 번: act1(제목 '공고 열흘', start 2026-10-01, end 2026-12-01, 핀 10/16 제48호 기술 목록 초안(act1_2) · 10/19 제49~51호(act1_11) · 10/26 영업비밀 규정 초안(act1_16) — 핀은 문장 t 로 차례로) · act4(같은 start·end, 핀 11/15 의견 마감(act4_2) · 11/18 시행(act4_4) · 11/24 의견 마감(act4_5)). 두 패널 축 범위 같게(한 세계, UF-135·138). 2027-01-10 휴전 만료는 축 밖 → card(act4_6)."
  - "연출 메모 — 카메라·지점(출처 있는 지점만, W1.1 M5): 베이징(39.90N 116.40E, 상무부 소재 도시) · 부산 김해공항(35.18N 128.94E, 2025-10-30 회담) · 경기도(권역 marker, sub '공사 지점 비공개') · 진천(36.86N 127.44E, 한화큐셀 시험 라인 소재 군) · 바이윈어보(41.78N 109.97E, 희토류 광산 — act2_1 사진과 함께) · 뉴델리(28.61N 77.21E, act2_10 인도 인프라 해석 — 라벨만). 민감 국가·지역 명단 미공표 → country 강조로 특정 국가를 허가 대상처럼 칠하지 않는다. 교역 흐름 route·paths 없음(출처 있는 흐름 수치 없음, 회사 본사·공장 위치처럼 원고·출처에 없는 지점과 경로를 만들지 않는다). 대만은 국기 없이 지명 라벨만. 문장마다 요소 2~3개, 한꺼번에 튀어나오는 관계선 금지, 이유 없는 카메라 이동 금지."
  - "연출 메모 — 패널·카드: act1_4 panel dots(인공지능 23 · 태양광 12 · 생물의약 5, 출처 줄 '보도 집계') · act1_5 panel versus(수출 금지 14 대 수출 제한 26) · cold_1 card(허가 = 분쟁 있는 민감 국가·지역 / 등록 = 그 밖, 한 줄 병렬) · act1_8~10 card(이미 공개된 기술 제외 · 범위 밖: 앱·웹 서비스 / 범위 안: 해외 현지 설치 · 새 기술은 수출 전 등록) · act3_4~5 card(동아지질: 중국산 부품 10% 미만 · 반입 지연 시 일부 현장 영향 가능) · act4_6 card(2027-01-10 미국이 밝힌 휴전 만료) · act4_7 card(민감 국가 명단·최종 목록 미공표). 축척 다른 독립 차트를 번갈아 띄우지 않는다(chart_world_split)."
  - "연출 메모 — 인물·인용: 뱃지는 공용 라이브러리 xi_jinping·trump(act2_3)·bessent(act2_4)만. 상무부 대변인(act2_7·act2_8)·마노즈 조시(act2_9)는 초상 없음 → quote 카드에 직함만(인용 후보 claims direct_quotes). 국기 cn·us·kr."
  - "연출 메모 — 사진(등록 10장, 사진·영상 밀도 하한 rules media_beats.min_density_per_min 1.5): cold_0 cn_tbm_crchi_2021 · act1_3 cn_datacenter_server · act1_12 cn_dji_matrice30 · act1_4 cn_rotary_cell_culture · act1_7 cn_iss_stem_cell · act2_1 cn_bayan_obo_mine · act2_2 cn_rare_earth_oxides · act2_3 cn_trump_xi_gimhae_2025 · act2_6 cn_solar_wall_nasa · act3_7 cn_perovskite_cell. 캡션에 자료사진·위성 영상 표기. 기사 카드는 60초당 2장 이하, 각 막 핵심 보도(로이터·CGTN·신화·GT·연합·이투데이·EBN·AI타임스·메디파나·토요경제·Tunnelling Journal·대한경제·CNBC·Al Jazeera) 우선."
  - "엔딩 카드 맨 아래 가장 작은 글씨: 미검증 표기(D85) — '목록 초안·영업비밀 규정은 의견 수렴 중 초안 · 해석은 각 기관 견해'."
