# 『제품은 팔고, 능력은 안 판다 — 중국 기술 수출통제』 주문 (v7.4.0, back_and_forth D-0283 — 사용자 위임 D-0282 "나한테 뭐 묻지 말고", 게이트 ①·② 감독 위임).
