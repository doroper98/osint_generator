  sentences:
  - date: 2026.10.19
    text: 11월 18일부터 중국산 터널굴착기를 일부 나라로 수출하려면 중국 상무부의 허가를 받아야 합니다.
    tts: 십일월 십팔일부터 중국산 터널굴착기를 일부 나라로 수출하려면 중국 상무부의 허가를 받아야 합니다.
    emphasis:
    - 터널굴착기
    sources:
    - clm_0014
    - clm_0016
  - date: 2026.10.19
    text: 다만 대상은 중국과 분쟁이 있는 민감 국가와 지역이고, 그 명단은 공개되지 않았습니다.
    emphasis:
    - 민감 국가
    sources:
    - clm_0016
    - clm_0017
  - date: 2026.10.21
    text: 그런데 국내 시공사 동아지질은 국내 현장에도 중국산 터널굴착기가 여러 대 돌고 있다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0036
  - date: 2026.10.19
    text: 그리고 이 공고는 열흘 남짓 사이 중국이 내놓은 다섯 건의 통제 조치 가운데 하나입니다.
    emphasis:
    - 다섯 건
    sources:
    - clm_0001
    - clm_0012
    - clm_0014
    - clm_0038
    - clm_0021
- id: act1
  kind: act
  stage: 중국
  sentences:
  - date: 2026.10.16
    text: 다섯 건 가운데 둘은 의견을 묻는 초안이고, 셋은 다음 달 시행이 정해진 공고입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0001
    - clm_0021
    - clm_0012
    - clm_0014
    - clm_0038
  - date: 2026.10.16
    text: 먼저 10월 16일부터 날짜 순서대로 보겠습니다.
    tts: 먼저 시월 십육일부터 날짜 순서대로 보겠습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0001
  - date: 2026.10.16
    text: 10월 16일, 중국 상무부와 과학기술부는 수출을 금지하거나 제한하는 기술 목록의 개정 초안을 냈습니다.
    tts: 시월 십육일, 중국 상무부와 과학기술부는 수출을 금지하거나 제한하는 기술 목록의 개정 초안을 냈습니다.
    emphasis:
    - 기술 목록
    sources:
    - clm_0001
  - date: 2026.10.16
    text: 새로 넣는 기술은 인공지능, 생물의약, 태양광 세 분야의 40개입니다.
    tts: 새로 넣는 기술은 인공지능, 생물의약, 태양광 세 분야의 사십 개입니다.
    emphasis:
    - 40개
    sources:
    - clm_0002
  - date: 2026.10.16
    text: 보도 집계로는 인공지능이 23개, 태양광이 12개, 생물의약이 5개입니다.
    tts: 보도 집계로는 인공지능이 스물세 개, 태양광이 열두 개, 생물의약이 다섯 개입니다.
    emphasis: []
    sources:
    - clm_0003
  - date: 2026.10.16
    text: 또한 40개 가운데 14개는 수출 금지 후보, 26개는 수출 제한 후보입니다.
    tts: 또한 사십 개 가운데 열네 개는 수출 금지 후보, 스물여섯 개는 수출 제한 후보입니다.
    emphasis:
    - 수출 금지
    sources:
    - clm_0004
  - date: 2026.10.16
    text: 특히 상무부가 든 금지 예시에는 인공지능으로 악성코드를 만들고 변형하는 기술이 있습니다.
    emphasis:
    - 악성코드
    sources:
    - clm_0005
  - date: 2026.10.16
    text: 그리고 자체 지식재산권을 가진 세포·유전자 치료 공정 플랫폼과 페로브스카이트·탠덤 전지 모듈 생산기술도 금지 예시입니다.
    tts: 그리고 자체 지식재산권을 가진 세포 유전자 치료 공정 플랫폼과 페로브스카이트 탠덤 전지 모듈 생산기술도 금지 예시입니다.
    emphasis:
    - 페로브스카이트
    sources:
    - clm_0005
  - date: 2026.10.16
    text: 다만 상무부는 오픈소스나 논문으로 이미 공개된 기술은 대상에서 뺀다고 밝혔습니다.
    emphasis:
    - 이미 공개된 기술
    sources:
    - clm_0008
  - date: 2026.10.16
    text: 또한 대형 모델을 해외에 앱이나 웹으로 서비스하는 것은 범위 밖이고, 해외 현지 설치는 범위 안이라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0033
  - date: 2026.10.16
    text: 동시에 목록이 확정되기 전이라도, 이 기술들을 수출하려면 먼저 상무부 시스템에 등록해야 합니다.
    emphasis:
    - 등록
    sources:
    - clm_0007
  - date: 2026.10.19
    text: 이어서 사흘 뒤인 10월 19일에는 공고 세 건이 한꺼번에 나왔습니다.
    tts: 이어서 사흘 뒤인 시월 십구일에는 공고 세 건이 한꺼번에 나왔습니다.
    emphasis: []
    sources:
    - clm_0012
    - clm_0014
    - clm_0038
  - date: 2026.10.19
    text: 드론 공고는 고성능 기종과 부품, 소프트웨어, 비행 제어 기술 등 13개 부류를 허가 대상으로 정했습니다.
    tts: 드론 공고는 고성능 기종과 부품, 소프트웨어, 비행 제어 기술 등 열세 개 부류를 허가 대상으로 정했습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: 2026.10.19
    text: 반면 일부 민수용 기종은 등록만으로 수출할 수 있도록 절차를 줄였습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: 2026.10.19
    text: 터널굴착기 공고는 완제품과 커터헤드 같은 핵심 부품, 재제조 기술, 일부 보행식 굴착기까지 묶었습니다.
    emphasis:
    - 핵심 부품
    sources:
    - clm_0015
  - date: 2026.10.19
    text: 한편 같은 날 준설선 관련 통제도 조정됐고, 세 공고는 모두 11월 18일에 시행됩니다.
    tts: 한편 같은 날 준설선 관련 통제도 조정됐고, 세 공고는 모두 십일월 십팔일에 시행됩니다.
    emphasis: []
    sources:
    - clm_0038
    - clm_0012
    - clm_0014
  - date: 2026.10.26
    text: 그리고 10월 26일, 상무부는 중국 영업비밀 보호 특별규정 초안을 공개했습니다.
    tts: 그리고 시월 이십육일, 상무부는 중국 영업비밀 보호 특별규정 초안을 공개했습니다.
    emphasis:
    - 영업비밀
    sources:
    - clm_0021
  - date: 2026.10.26
    text: 외국 실체가 중국 영업비밀을 침해해 국가 안보와 발전 이익을 해치면, 수출입과 투자, 입국까지 제한할 수 있다는 내용입니다.
    emphasis: []
    sources:
    - clm_0022
  - date: 2026.10.26
    text: 이렇게 열흘 남짓 사이 초안 둘과 시행 공고 셋이 나왔습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0001
    - clm_0021
    - clm_0012
    - clm_0014
    - clm_0038
- id: act2
  kind: act
  stage: 미중
  sentences:
  - date: 2026.10.26
    text: 이제 이번 공고들을 1년 전 희토류 통제와 견주어 보겠습니다.
    tts: 이제 이번 공고들을 일 년 전 희토류 통제와 견주어 보겠습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0023
  - date: 2026.10.26
    text: 이야기의 출발점은 지난해 가을의 희토류 통제였습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0023
  - date: 2025.10.09
    text: 중국은 지난해 10월 9일 희토류와 관련 기술의 수출통제를 넓혔습니다.
    tts: 중국은 지난해 시월 구일 희토류와 관련 기술의 수출통제를 넓혔습니다.
    role: background
    emphasis:
    - 희토류
    sources:
    - clm_0023
  - date: 2025.10.30
    text: 이후 같은 달 30일 부산에서 트럼프 대통령과 시진핑 주석이 만난 뒤, 중국은 이 통제를 1년 동안 미뤘습니다.
    tts: 이후 같은 달 삼십일 부산에서 트럼프 대통령과 시진핑 주석이 만난 뒤, 중국은 이 통제를 일 년 동안 미뤘습니다.
    role: background
    emphasis:
    - 부산
    sources:
    - clm_0024
  - date: 2026.09.24
    text: 한편 미국 재무장관은 9월, 미중 휴전을 내년 1월 10일까지 연장한다고 밝혔습니다.
    tts: 한편 미국 재무장관은 구월, 미중 휴전을 내년 일월 십일까지 연장한다고 밝혔습니다.
    role: background
    emphasis:
    - 내년 1월 10일
    sources:
    - clm_0025
  - date: 2026.10.16
    text: 희토류 통제가 한 가지 소재와 그 가공 기술을 묶었다면, 이번 초안은 인공지능과 생물의약, 태양광 같은 새 산업의 기술로 범위를 넓혔습니다.
    emphasis:
    - 새 산업의 기술
    sources:
    - clm_0023
    - clm_0002
  - date: 2026.10.16
    text: 다만 상무부는 관리 기준에 못 미치는 태양광 기술은 계속 자유롭게 수출할 수 있다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0010
  - date: 2026.10.16
    text: 또한 상무부 대변인은 이번 개정이 정례 작업이며, 특정 국가나 지역, 실체를 대상으로 하지 않는다고 말했습니다.
    emphasis: []
    sources:
    - clm_0009
  - date: 2026.10.19
    text: 터널굴착기 통제에 대해서도 대변인은 규정에 맞는 신청은 승인하겠다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0034
  - date: 2026.10.28
    text: 이에 대해 인도 싱크탱크 옵서버연구재단의 마노즈 조시는, 중국이 기술로 만든 제품은 팔면서 기술 우위는 지키려 한다고 밝혔습니다.
    emphasis:
    - 기술 우위
    sources:
    - clm_0027
  - date: 2026.10.26
    text: 한편 일부 분석가들은 터널굴착기 통제를 인도의 인프라 사업과 연결해 읽는다고 해외 매체들은 전했습니다.
    emphasis: []
    sources:
    - clm_0020
  - date: 2026.10.17
    text: 그러나 중국 관영 매체 글로벌 타임스는 논평에서 이번 조치가 국제 관행에 맞는다고 주장했습니다.
    emphasis: []
    sources:
    - clm_0028
  - date: 2026.10.19
    text: 즉 장비는 허가나 등록을 거쳐 수출하고, 핵심 생산 기술은 금지와 제한 목록으로 관리하는 구조입니다.
    role: outro
    emphasis: []
    sources:
    - clm_0016
    - clm_0004
- id: act3
  kind: act
  stage: 한국
  sentences:
  - date: 2026.10.21
    text: 이제 한국의 공사 현장과 공장으로 가 보겠습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0017
  - date: 2026.10.21
    text: 보도에 따르면 한국과 닿는 곳은 지하 공사 장비와 차세대 태양전지입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0036
    - clm_0037
  - date: 2025.12.11
    text: 지난해 11월 중국철건중공은 경기도 전력구 공사에 쓸 이수식 터널굴착기 두 대를 한국으로 보냈다고 터널 업계지는 전했습니다.
    tts: 지난해 십일월 중국철건중공은 경기도 전력구 공사에 쓸 이수식 터널굴착기 두 대를 한국으로 보냈다고 터널 업계지는 전했습니다.
    role: background
    emphasis:
    - 경기도 전력구
    sources:
    - clm_0029
  - date: 2023.02.13
    text: 2023년 국내 보도에 따르면 터널굴착기 시장은 독일 헤렌크네히트와 중국 업체의 양강 구도였습니다.
    tts: 이천이십삼 년 국내 보도에 따르면 터널굴착기 시장은 독일 헤렌크네히트와 중국 업체의 양강 구도였습니다.
    role: background
    emphasis:
    - 양강 구도
    sources:
    - clm_0030
  - date: 2023.02.13
    text: 게다가 헤렌크네히트 역시 중국 공장에서 장비를 만든다고 이 보도는 전했습니다.
    role: background
    emphasis: []
    sources:
    - clm_0030
  - date: 2026.10.21
    text: 동아지질은 자체 개발한 굴착기의 중국산 부품이 10% 미만이라, 독일과 일본 장비로 대체할 수 있다고 밝혔습니다.
    tts: 동아지질은 자체 개발한 굴착기의 중국산 부품이 십 퍼센트 미만이라, 독일과 일본 장비로 대체할 수 있다고 밝혔습니다.
    emphasis:
    - 10% 미만
    sources:
    - clm_0035
  - date: 2026.10.21
    text: 다만 새 장비 반입이나 부품 공급이 늦어지면 일부 현장 공정에 영향이 생길 수 있다고 말했습니다.
    emphasis: []
    sources:
    - clm_0036
  - date: 2026.10.19
    text: 그런데 민감 국가 명단이 공개되지 않아, 한국이 허가와 등록 가운데 어느 쪽인지는 알 수 없습니다.
    emphasis:
    - 허가와 등록
    sources:
    - clm_0017
    - clm_0016
  - date: 2026.10.20
    text: 한편 태양광에서는 페로브스카이트·탠덤 전지 생산기술이 금지 후보에 올랐습니다.
    tts: 한편 태양광에서는 페로브스카이트 탠덤 전지 생산기술이 금지 후보에 올랐습니다.
    emphasis: []
    sources:
    - clm_0005
  - date: 2026.10.20
    text: 보도에 따르면 한화큐셀은 진천에 이 차세대 전지의 시험 생산 라인을 두고 있습니다.
    emphasis:
    - 진천
    sources:
    - clm_0039
  - date: 2026.10.20
    text: 다만 국내 태양광 업계는 직접 타격이 매우 제한적일 것으로 내다봤다고 이 보도는 전했습니다.
    emphasis: []
    sources:
