# 『제품은 팔고, 능력은 안 판다』 원고 v1 (v7.4.0, back_and_forth D-0283 §4 · 감독 조사표 D-0284 반영).
# 사실 교정(D-0284 §0): 드론 공고 10/19(10/14 아님) · 공고 다섯 건 10/16~10/26("보름" 대신 "열흘 남짓") · 오픈소스 조항(이미 공개된 기술 제외).
# 쓰지 않는 것(D-0284 §4): 드론군집 · 2조 파라미터 · GTX 공사 차질 · 한국 CDMO 영향 · 민감 국가 명단 · 인도 겨냥 단정.
schema_version: 1
title: 제품은 팔고, 능력은 안 판다
subtitle: 중국의 기술 수출통제 열흘 — 드론·인공지능·태양광·굴착기, 그리고 한국
date: 2026.10.30
scenes:
