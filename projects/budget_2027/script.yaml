    sources: [clm_0005]
  - date: 2026.10.26
    text: 국회예산정책처는 새로 만드는 미래대응기금의 사업 가운데 13조 원 남짓이 이 분야로 분류된 것을 이유로 들었습니다.
    tts: 국회예산정책처는 새로 만드는 미래대응기금의 사업 가운데 십삼조 원 남짓이 이 분야로 분류된 것을 이유로 들었습니다.
    sources: [clm_0008]
  - date: 2026.10.26
    text: 한편 증가율이 가장 높은 분야는 산업·중소기업·에너지로, 29.7% 늘어납니다.
    tts: 한편 증가율이 가장 높은 분야는 산업 중소기업 에너지로, 이십구 점 칠 퍼센트 늘어납니다.
