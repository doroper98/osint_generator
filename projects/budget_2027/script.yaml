# 『2027년 예산안 분석』 원고 초안 v3 (v7.4.0, back_and_forth D-1007 §1·D-1008·D-1009) — 게이트 ① 전(렌더하지 않는다).
# 사실은 intake/claims.json(clm_0001~0030)과 data/categorical 레코드(국회예산정책처 p.15)뿐. 정부안 수치는 "정부안"이라 말하고 국회 확정 전임을 밝힌다(D-1003 §2·G4).
# 막마다 무엇이 늘고 줄었나 → 왜(정부 설명·국회예산정책처 분석) → 수혜·부담을 받을 수 있는 곳(UF-302 — "~할 가능성이 있습니다", 한 단계까지만, '추정' 표지 없음).
# 흐름은 내용의 순서·지시어·핵심어 반복으로 잇고, 첫머리 접속어는 대조·양측 병기 자리에만(UF-303, [connective-initial] ≤ 20%).
# 데이터 무대 위 문장이 말하는 금액·비율은 그 문장 동안 화면 라벨에 있어야 한다(UF-304 [spoken-number-visible]) — 연출에서 맞춘다.
