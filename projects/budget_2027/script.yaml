    sources: [clm_0007]
  - date: 2026.10.26
    role: outro
    text: 그런데 이렇게 늘어난 지출의 돈이 어디서 오는지가 이번 예산안의 다음 질문입니다.
    tts: 그런데 이렇게 늘어난 지출의 돈이 어디서 오는지가 이번 예산안의 다음 질문입니다.
