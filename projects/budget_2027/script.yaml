    text: 정부가 9월 3일 국회에 낸 2027년도 예산안의 총지출은 820조 9천억 원입니다.
    tts: 정부가 구월 삼일 국회에 낸 이천이십칠년도 예산안의 총지출은 팔백이십조 구천억 원입니다.
    emphasis: [820조 9천억 원]
    sources: [clm_0001]
  - date: 2026.09.03
    text: 올해 본예산보다 12.8% 많은 규모입니다.
    tts: 올해 본예산보다 십이 점 팔 퍼센트 많은 규모입니다.
    emphasis: [12.8%]
    sources: [clm_0002]
  - date: 2026.09.03
    text: 이 숫자는 아직 정부안이고, 국회는 12월 2일까지 예산안을 의결해야 합니다.
    tts: 이 숫자는 아직 정부안이고, 국회는 십이월 이일까지 예산안을 의결해야 합니다.
