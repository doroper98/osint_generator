# 『2027년 예산안 분석』 원고 초안 v1 (v7.4.0, back_and_forth D-1006 §4) — 게이트 ① 전(렌더하지 않는다).
# 사실은 intake/claims.json(clm_0001~0022)과 data/categorical 레코드(국회예산정책처 p.15)뿐. 정부안 수치는 "정부안"이라 말하고 국회 확정 전임을 밝힌다(D-1003 §2·G4).
# 쟁점(act4)은 발간사가 든 셋 — 국세 전망 불확실성 · 미래대응기금 운용과 국회 통제 · 관리재정수지 개선의 계상 방식. 여야는 같은 무게(문장 수·인용 길이).
# 증가율은 기준을 밝힌다: 12.8% = 2026 본예산 대비, 국가채무·재정수지 비교 = 2026 추경 대비(재정총량 분석 p.20).
schema_version: 1
title: 2027년 예산안, 820조 원은 어디로 가나
subtitle: 정부안 12대 분야 배분과 재원, 그리고 국회의 쟁점
date: 2026.11.03
scenes:
- id: cold
  kind: cold
  stage: 국회
  sentences:
  - date: 2026.09.03
    text: 정부가 9월 3일 국회에 낸 2027년도 예산안의 총지출은 820조 9천억 원입니다.
    tts: 정부가 구월 삼일 국회에 낸 이천이십칠년도 예산안의 총지출은 팔백이십조 구천억 원입니다.
    emphasis: [820조 9천억 원]
    sources: [clm_0001]
  - date: 2026.09.03
    text: 올해 본예산보다 12.8% 많습니다.
    tts: 올해 본예산보다 십이 점 팔 퍼센트 많습니다.
    emphasis: [12.8%]
    sources: [clm_0002]
  - date: 2026.09.03
    text: 다만 이 숫자는 아직 정부안이고, 국회는 12월 2일까지 예산안을 의결해야 합니다.
    tts: 다만 이 숫자는 아직 정부안이고, 국회는 십이월 이일까지 예산안을 의결해야 합니다.
    emphasis: [정부안]
    sources: [clm_0003]
- id: act1
  kind: act
  stage: 국회
  sentences:
  - date: 2026.10.26
    role: bridge
    text: 국회예산정책처는 이 정부안을 열두 개 분야로 나눠 분석한 보고서를 10월에 냈습니다.
    tts: 국회예산정책처는 이 정부안을 열두 개 분야로 나눠 분석한 보고서를 시월에 냈습니다.
    sources: [clm_0004]
  - date: 2026.10.26
    role: intro
    text: 총지출은 예산과 기금을 합친 뒤, 회계 사이를 오가는 내부거래와 국채 발행 같은 보전거래를 뺀 규모입니다.
    tts: 총지출은 예산과 기금을 합친 뒤, 회계 사이를 오가는 내부거래와 국채 발행 같은 보전거래를 뺀 규모입니다.
    emphasis: [총지출]
    sources: [clm_0017]
  - date: 2026.10.26
    role: intro
    text: 가장 큰 분야는 보건·복지·고용으로, 289조 원입니다.
    tts: 가장 큰 분야는 보건 복지 고용으로, 이백팔십구조 원입니다.
    emphasis: [보건·복지·고용]
    sources: [clm_0004]
  - date: 2026.10.26
    text: 즉, 총지출의 3분의 1이 넘는 돈이 이 한 분야에 들어갑니다.
    tts: 즉, 총지출의 삼분의 일이 넘는 돈이 이 한 분야에 들어갑니다.
    sources: [clm_0004, clm_0001]
  - date: 2026.10.26
    text: 그 뒤를 일반·지방행정 149조 원, 교육 110조 7천억 원이 잇습니다.
    tts: 그 뒤를 일반 지방행정 백사십구조 원, 교육 백십조 칠천억 원이 잇습니다.
    sources: [clm_0005]
  - date: 2026.10.26
    text: 이어서 국방이 73조 3천억 원으로 네 번째입니다.
    tts: 이어서 국방이 칠십삼조 삼천억 원으로 네 번째입니다.
    sources: [clm_0004]
  - date: 2026.10.26
    role: background
    text: 다만 올해부터 군인연금기금이 복지 분야에서 국방 분야로 옮겨 가, 두 분야의 숫자는 예년 보도와 기준이 다릅니다.
    tts: 다만 올해부터 군인연금기금이 복지 분야에서 국방 분야로 옮겨 가, 두 분야의 숫자는 예년 보도와 기준이 다릅니다.
    sources: [clm_0009]
  - date: 2026.10.26
    role: outro
    text: 이처럼 규모로는 복지가 압도적이지만, 증가 폭으로 보면 순서가 달라집니다.
    tts: 이처럼 규모로는 복지가 압도적이지만, 증가 폭으로 보면 순서가 달라집니다.
    sources: [clm_0005, clm_0004]
