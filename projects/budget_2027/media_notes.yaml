# 『2027년 예산안 분석』 미디어 사유(게이트 ① 미디어 계획 표, D-1009 §1-11·D611). 검색 기록 = media_search.json(media_fetch search --log).
schema_version: 1
project_photo: 권리 통과 실사가 적다(R-0612·R-0613). korea.kr 정책포토는 공공누리 무표시·4유형뿐(1유형 0), Flickr Korea.net 은 CC BY-SA(07 §3.2 불허). D611 뒤 Commons CC0·PD·CC BY 대상 검색과 Flickr CC BY(정부 계정)로 넓혀, 15년 이내·피사체 일치 후보 9건(조건부
  1 포함)을 문장별로 적었다. 쟁점 막(act4)은 기사 카드 3건, 구성 무대·시간축 문장은 데이터 무대. 규칙 값은 낮추지 않는다. 사실 장면 AI 생성 없음.
