# 『2027년 예산안 분석』 미디어 사유(게이트 ① 미디어 계획 표, D-1009 §1-11). 검색 기록 = media_search.json(media_fetch search --log).
schema_version: 1
project_photo: >-
  권리 통과 실사가 적다(R-0612). ① korea.kr 은 재시도로 열리지만 정책포토·카드는 공공누리 표시가 없거나 4유형(상업 이용 금지)뿐이다 —
  검색 6개 주제 23쪽에서 1유형 0건. ② Flickr Korea.net 은 CC BY-SA 이고 저장소 규칙이 SA 를 받지 않는다(schemas.emblem_models.license_allowed,
  rules media.flickr.licenses_allowed = PD·CC0·미 정부만, 07 §3.2). ③ Commons 의 공공누리 1유형은 국회의장실 업로드(의장 면담·접견)가 대부분이라
  원고 문장(예산안 제출·예결위·고속도로·공공임대·반도체)과 대상이 다르다. 쓸 수 있는 것은 국회의사당 외관 영상(CC BY 4.0)과 삼성전자 평택캠퍼스
  사진(퍼블릭 도메인, 2022) 둘이다. 쟁점 막(act4)은 기사 카드 3건, 구성 무대 문장(act1·act2 앞부분)은 사진이 필요 없다. 규칙 값은 낮추지 않는다.
sentences:
  cold_0:
    photo: >-
      통과 후보 3건 중 국회의사당 외관 영상(File:National Assembly Building of South Korea 2019 July 27.webm, CC BY 4.0)은 연출 단계에서 클립으로 등록해 쓴다.
      나머지 둘(1975년 준공 기념우표, 1998년 클린턴 대통령 국회 연설 사진)은 이 문장(2026년 9월 예산안 제출)과 시점·대상이 달라 쓰지 않는다
  act2_19:
    photo: >-
      통과 후보 4건이 모두 다른 대상 — 미군 자녀 학교 교원 모집, 미 해병 사진, 태국 초등학교 교실 건립, 주한미군 공병단의 학교 방문 행사.
      한국 공립 유아·초중등 교육 예산 문장의 사진이 아니어서 쓰지 않는다
  act2_9:
    photo: >-
      고속도로 건설 현장 사진 — korea.kr 정책포토 7건(세종-안성·서부내륙 등)은 공공누리 표시 없음 또는 4유형, Commons 는 한국 고속도로 공사 통과 후보 0
      (통과 1건은 폴란드 공사 현장이라 대상이 다르다). 쓰지 않는다
  act2_11:
    photo: korea.kr·Commons 에서 자율주행 실증·대중교통비 환급 장면의 1유형·CC BY 후보 0
  act2_14:
    photo: >-
      공공임대주택 — korea.kr 위스테이 별내·공공임대 간담회 사진은 4유형. Commons 통과 후보는 1978년 잠실 아파트(1유형) 등 옛 사진뿐이라
      2027년 보편형 건설임대 문장과 시점·대상이 다르다
  act2_16:
    photo: 고용센터·구직급여 장면의 Commons 통과 후보 0(공공누리 1유형 검색 포함)
  act2_5:
    photo: 중소기업·에너지 산업 현장 사진의 통과 후보 0(울산 산업단지·공장 검색, 1유형 검색 포함)
  act3_1:
    photo: >-
      통과 후보 — 삼성전자 평택캠퍼스(Commons 퍼블릭 도메인, 2022 미 대통령 방문 사진). 반도체 공장 실사라 문장(반도체 호황 배경)에 맞는다.
      자료사진 · 2022 표기로, 인물이 작게 보이는 컷을 고른다
  act4_5:
    photo: >-
      예결위 공청회 사진 — korea.kr 국회 시정연설 사진은 4유형, Commons 1유형은 의장 접견 사진(2026.3 기획예산처 장관 면담 등)으로 10월 30일 공청회와
      다르다. 이 문장은 등록 기사 카드(SBS Biz 10.30 공청회)로 보인다(article_candidates.yaml)
