headline: "2027년 예산안 820조 9천억 원 — 정부안의 분야별 증감과 재원, 국회의 쟁점"
summary: >-
  정부가 9월 3일 국회에 낸 2027년도 예산안(정부안)을 국회예산정책처 분석 자료로 정리합니다.
  열두 개 분야의 규모와 증감, 늘어난 세수와 미래대응기금, 관리재정수지·국가채무 계획, 국회 심사의 세 가지 쟁점을 다룹니다.
  예산안은 국회 의결 전이며 12월 2일까지 바뀔 수 있습니다.
