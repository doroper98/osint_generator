# 『중국산 무기가 걸프에 들어온 날』 주문 (v7.2.0) — 사용자 결정 D227(2026-10-12 밤, 게이트 ①·② 감독 위임)·back_and_forth D-0223.
schema_version: 1
topic: 사우디에 배치됐다고 보도된 파키스탄군의 중국산 HQ-9 방공체계와 JF-17 전투기, 사우디가 비용을 대는 구조, 미국 무기 의존에서의 변화, 그리고 한국 방산(천궁-II)의 걸프 수출과의 경쟁 구도
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다
instructions:
  - "사용자 원문(D227): 주제 '중국산 무기가 걸프에 들어온 날'. 사우디에 배치된 파키스탄군의 HQ-9 방공체계와 JF-17 전투기, 사우디가 비용을 대는 구조, 미국 무기 의존에서의 변화. 한국 연결 = 한국 방산의 걸프 수출(천궁-II 등)과의 경쟁 구도. 지경학. 5분 내외."
  - 사실 수준을 정확히(G4 — 이 영상의 핵심 위험). 공식 확인 = 파키스탄군 사우디 주둔(2026-10-07 파키스탄군 공보처 ISPR), 파키스탄 전투기·지원기의 킹압둘아지즈 공군기지 도착(2026-04-11 사우디 국방부 발표 — 기종 미공개). 보도 수준 = HQ-9·JF-17 약 16대·약 8,000명·무인기 2개 대대·파키스탄 인원 운용·사우디 비용 부담(2026-05-18 로이터, 익명 보안 관리·정부 소식통 — 양국 정부 미확인). 보도 수준 사실은 '로이터가 소식통을 인용해 보도했다', '양국 정부는 확인하지 않았다'로 쓴다. 확정 사실처럼 쓰지 않는다.
  - '흐름 — 지금(로이터 보도: 중국산 방공체계와 전투기가 사우디에) → 무엇인가(HQ-9·JF-17 — 중국 설계·생산, 파키스탄 공동 생산, 파키스탄 운용) → 누가 돈을 내나(사우디 부담 보도, 2025-09 방위협정) → 왜 변화인가(사우디 방공의 중심은 미국 패트리엇·사드 — 미국 무기 의존에서 공급선 다변화의 신호인지는 해설) → 한국 연결(천궁-II 걸프 수출 계약: UAE 2022 약 35억 달러 10개 포대, 사우디 2024 약 32억 달러 10개 포대, 이라크 2024 3.71조 원 — 보도·회사 공시 귀속) → 남은 질문.'
  - 무기 수치(대수·사거리·가격·계약액)는 모두 출처 귀속("○○에 따르면"). 추정치는 추정이라 말한다. 출처 없는 수치는 넣지 않는다. 양측 수치가 다르면 둘 다 같은 무게로.
  - 경쟁 구도(중국·파키스탄 체계 대 한국 천궁-II)는 해설(논평)로 분명히 구분한다. 사실처럼 단정하지 않는다.
  - 파키스탄 정부가 10월 로이터 후속 보도(3만~4만 명)를 부인한 사실이 있으면 같은 무게로 쓴다.
  - 지도 무대 중심 — 아라비아반도·걸프·이라크·파키스탄·중국·한반도(대략 동경 30~132, 북위 5~46). 리야드·킹압둘아지즈 공군기지(동부주)·이슬라마바드·베이징·아부다비·바그다드·서울.
  - 보도 인용 문장은 기사 카드. 인물은 권리 확인된 초상만.
