schema_version: 1
title: 중국산 무기가 걸프에 들어온 날
subtitle: 사우디에 배치된 파키스탄군의 HQ-9과 JF-17, 그리고 천궁-II
date: 2026.10.12
scenes:
- id: open
  sentences:
  - date: 2026.10.05
    text: 10월 5일, 파키스탄·사우디·튀르키예 3국이 리야드에서 긴급회의를 열었습니다.
    tts: 시월 오일, 파키스탄, 사우디, 튀르키예 세 나라가 리야드에서 긴급회의를 열었습니다.
    emphasis:
    - 긴급회의
    sources:
    - clm_0023
  - date: 2026.10.05
    text: 그리고 3국은 집단방위 공약을 실제로 이행하기로 결정했습니다.
    tts: 그리고 세 나라는 집단방위 공약을 실제로 이행하기로 결정했습니다.
    emphasis:
    - 실제로 이행
    sources:
    - clm_0023
  - date: 2026.10.05
    text: 이어서 익스프레스 트리뷴은 3국 공동성명이 합의된 병력과 역량을 사우디에 즉각 배치한다고 밝혔다고 보도했습니다.
    tts: 이어서 익스프레스 트리뷴은 세 나라 공동성명이 합의된 병력과 역량을 사우디에 즉각 배치한다고 밝혔다고 보도했습니다.
    emphasis:
    - 즉각 배치
    sources:
    - clm_0024
  - date: 2026.10.05
    text: 또한 미닛 미러는 메카 협정 위원회가 이를 위한 조치를 지시했다고 전했습니다.
    emphasis: []
    sources:
    - clm_0025
  - date: '2026'
    text: 한편 사우디에는 파키스탄군이 운용하는 중국산 방공체계가 배치된 것으로 보도됐습니다.
    emphasis:
    - 중국산 방공체계
    sources:
    - clm_0006
    - clm_0007
- id: pact_2025
  sentences:
  - date: 2025.09.17
    text: 그 바탕에는 2025년 9월 파키스탄과 사우디가 서명한 상호방위협정이 있었습니다.
    tts: 그 바탕에는 이천이십오년 구월 파키스탄과 사우디가 서명한 상호방위협정이 있었습니다.
    emphasis:
    - 상호방위협정
    sources:
    - clm_0012
  - date: 2025.09.17
    text: 특히 이 협정은 한쪽에 대한 공격을 양국 모두에 대한 공격으로 간주합니다.
    emphasis:
    - 양국 모두에 대한 공격
    sources:
    - clm_0013
- id: iran_shock
  sentences:
  - date: 2026.02.28
    text: 이후 알자지라는 2월 28일 미국과 이스라엘이 하메네이 이란 최고지도자를 살해했다고 보도했습니다.
    tts: 이후 알자지라는 이월 이십팔일 미국과 이스라엘이 하메네이 이란 최고지도자를 살해했다고 보도했습니다.
    emphasis:
    - 하메네이
    sources:
    - clm_0014
  - date: '2026.03'
    text: 이어서 이샤크 다르 파키스탄 외무장관은 3월 초 이란 지도부에 사우디와의 협정 의무를 직접 경고했다고 말했습니다.
    tts: 이어서 이샤크 다르 파키스탄 외무장관은 삼월 초 이란 지도부에 사우디와의 협정 의무를 직접 경고했다고 말했습니다.
    emphasis:
    - 협정 의무
    sources:
    - clm_0015
  - date: 2026.04.07
    text: 또한 알자지라에 따르면 셰바즈 샤리프 파키스탄 총리는 사우디 왕세자에게 전화해 함께하겠다고 약속했습니다.
    emphasis:
    - 함께하겠다고
    sources:
    - clm_0016
- id: jets
  sentences:
  - date: '2026.04'
    text: 그리고 파키스탄은 4월 초 JF-17 위주의 전투기 약 16대를 사우디에 보낸 것으로 여러 매체가 보도했습니다.
    tts: 그리고 파키스탄은 사월 초 제이에프 십칠 위주의 전투기 약 열여섯 대를 사우디에 보낸 것으로 여러 매체가 보도했습니다.
    emphasis:
    - JF-17
    sources:
    - clm_0003
    - clm_0004
  - date: 2026.04.11
    text: 특히 알자지라는 이 전투기들이 4월 11일 사우디 동부주 킹압둘아지즈 공군기지에 착륙했다고 보도했습니다.
    tts: 특히 알자지라는 이 전투기들이 사월 십일일 사우디 동부주 킹압둘아지즈 공군기지에 착륙했다고 보도했습니다.
    emphasis:
    - 킹압둘아지즈 공군기지
    sources:
    - clm_0005
  - date: 2026.04.11
    text: 한편 파키스탄은 이슬라마바드에서 미국과 이란의 직접 협상을 주최했습니다.
    emphasis:
    - 직접 협상
    sources:
    - clm_0017
  - date: '2026.04'
    text: 그리고 4월 미국과 이란 사이의 휴전을 중재했습니다.
    tts: 그리고 사월 미국과 이란 사이의 휴전을 중재했습니다.
    emphasis:
    - 휴전
    sources:
    - clm_0018
  - date: '2026'
    text: 그러나 미들이스트아이는 UAE가 이 협상 주최에 대응해 파키스탄에 대한 30억 달러 대출을 회수했다고 보도했습니다.
    tts: 그러나 미들이스트아이는 아랍에미리트가 이 협상 주최에 대응해 파키스탄에 대한 삼십억 달러 대출을 회수했다고 보도했습니다.
    emphasis:
    - 30억 달러
    sources:
    - clm_0019
- id: troops_8000
  sentences:
  - date: '2026.05'
    text: 이후 파키스탄은 사우디에 병력 약 8,000명을 배치한 것으로 여러 매체가 보도했습니다.
    tts: 이후 파키스탄은 사우디에 병력 약 팔천 명을 배치한 것으로 여러 매체가 보도했습니다.
    emphasis:
    - 8,000명
    sources:
    - clm_0001
  - date: 2026.05.18
    text: 다만 데일리스타는 이 수치가 로이터가 인용한 안보·정부 소식통 5명의 말이라고 전했습니다.
    tts: 다만 데일리스타는 이 수치가 로이터가 인용한 안보, 정부 소식통 다섯 명의 말이라고 전했습니다.
    emphasis:
    - 소식통 5명
    sources:
    - clm_0002
  - date: 2026.05.18
    text: 그리고 파키스탄 군과 외무부, 사우디 정부 미디어실은 논평 요청에 응하지 않았다고 데일리스타는 전했습니다.
    emphasis: []
    sources:
    - clm_0009
- id: hq9
  sentences:
  - date: '2026'
    text: 특히 파키스탄은 사우디에 중국산 HQ-9 방공체계를 배치한 것으로 보도됐습니다.
    tts: 특히 파키스탄은 사우디에 중국산 에이치큐 구 방공체계를 배치한 것으로 보도됐습니다.
    emphasis:
    - HQ-9
    sources:
    - clm_0006
  - date: '2026'
    text: 게다가 그 장비는 파키스탄 인력이 운용하고, 비용은 사우디가 대는 것으로 보도됐습니다.
    emphasis:
    - 비용은 사우디가
    sources:
    - clm_0007
  - date: '2026'
    text: 한편 미들이스트아이는 사우디가 미국산 패트리엇과 사드 방공체계를 보유하고 있다고 전했습니다.
    emphasis:
    - 패트리엇과 사드
    sources:
    - clm_0020
- id: mecca_pact
  sentences:
  - date: 2026.08.07
    text: 이어서 8월 7일 파키스탄·사우디·튀르키예는 메카 공동방위협정을 체결했습니다.
    tts: 이어서 팔월 칠일 파키스탄, 사우디, 튀르키예는 메카 공동방위협정을 체결했습니다.
    emphasis:
    - 메카 공동방위협정
    sources:
    - clm_0021
  - date: 2026.08.07
    text: 그리고 이 협정은 한 회원국에 대한 무력 공격을 3국 모두에 대한 공격으로 간주합니다.
    tts: 그리고 이 협정은 한 회원국에 대한 무력 공격을 세 나라 모두에 대한 공격으로 간주합니다.
    emphasis:
    - 3국 모두
    sources:
    - clm_0022
- id: troops_40000
  sentences:
  - date: 2026.10.02
    text: 그런데 10월 2일 로이터는 파키스탄이 사우디에 병력 3만~4만 명을 배치했다고 보도했습니다.
    tts: 그런데 시월 이일 로이터는 파키스탄이 사우디에 병력 삼만에서 사만 명을 배치했다고 보도했습니다.
    emphasis:
    - 3만~4만 명
    sources:
    - clm_0026
  - date: 2026.10.06
    text: 특히 로이터가 인용한 익명의 파키스탄 관리는 이 병력이 국경 방어와 드론·미사일 요격 지원을 위해 배치됐다고 말했습니다.
    tts: 특히 로이터가 인용한 익명의 파키스탄 관리는 이 병력이 국경 방어와 드론, 미사일 요격 지원을 위해 배치됐다고 말했습니다.
    emphasis:
    - 국경 방어
    sources:
    - clm_0027
  - date: 2026.10.06
    text: 반면 파키스탄 정보방송부는 추측성·미검증 수치라며 보도를 거부했고, 작전 세부사항은 기밀이라고 밝혔습니다.
    tts: 반면 파키스탄 정보방송부는 추측성, 미검증 수치라며 보도를 거부했고, 작전 세부사항은 기밀이라고 밝혔습니다.
    emphasis:
    - 거부
    sources:
    - clm_0029
  - date: 2026.10.02
    text: 또한 로이터가 인용한 파키스탄 관리는 예멘 전투 파병은 결정하지 않았다고 말했습니다.
    emphasis:
    - 예멘
    sources:
    - clm_0028
  - date: 2026.10.07
    text: 이후 10월 7일 아흐메드 샤리프 차우드리 ISPR 사무총장은 파키스탄군이 사우디에 여러 역할로 주둔하고 있다고 밝혔습니다.
    tts: 이후 시월 칠일 아흐메드 샤리프 차우드리 파키스탄군 홍보국 사무총장은 파키스탄군이 사우디에 여러 역할로 주둔하고 있다고 밝혔습니다.
    emphasis:
    - 여러 역할로 주둔
    sources:
    - clm_0032
- id: korea_cheongung
  sentences:
  - date: 2022.01.16
    text: 한편 한국은 2022년 1월 UAE와 천궁-II 수출 계약을 맺었습니다.
    tts: 한편 한국은 이천이십이년 일월 아랍에미리트와 천궁 투 수출 계약을 맺었습니다.
    emphasis:
    - 천궁-II
    sources:
    - clm_0033
  - date: 2022.01.16
    text: 그리고 디펜스뉴스는 이 계약 규모를 약 35억 달러로 보도했습니다.
    tts: 그리고 디펜스뉴스는 이 계약 규모를 약 삼십오억 달러로 보도했습니다.
    emphasis:
    - 35억 달러
    sources:
    - clm_0034
  - date: '2024.02'
    text: 이어서 LIG넥스원은 사우디 국방부와도 천궁-II 수출 계약을 맺었습니다.
    tts: 이어서 엘아이지넥스원은 사우디 국방부와도 천궁 투 수출 계약을 맺었습니다.
    emphasis:
    - 사우디 국방부
    sources:
    - clm_0035
  - date: '2024.02'
    text: 또한 코리아타임스는 이 계약 규모를 32억 달러로 보도했습니다.
    tts: 또한 코리아타임스는 이 계약 규모를 삼십이억 달러로 보도했습니다.
    emphasis:
    - 32억 달러
    sources:
    - clm_0036
  - date: 2024.09.20
    text: 게다가 LIG넥스원은 이라크와 28억 달러 규모의 중거리 지대공미사일 수출 계약도 따냈습니다.
    tts: 게다가 엘아이지넥스원은 이라크와 이십팔억 달러 규모의 중거리 지대공미사일 수출 계약도 따냈습니다.
    emphasis:
    - 이라크
    sources:
    - clm_0037
  - date: '2026'
    text: 즉 중국산 HQ-9이 배치된 것으로 보도된 사우디는 한국산 천궁-II의 계약 상대국이기도 합니다.
    tts: 즉 중국산 에이치큐 구가 배치된 것으로 보도된 사우디는 한국산 천궁 투의 계약 상대국이기도 합니다.
    emphasis:
    - 계약 상대국
    sources:
    - clm_0006
    - clm_0035
- id: briefing
  sentences:
  - date: '2026.10'
    text: 2025년 양자 협정에서 출발해 메카 3국 동맹으로 넓어진 파키스탄과 사우디의 군사 협력.
    tts: 이천이십오년 양자 협정에서 출발해 메카 세 나라 동맹으로 넓어진 파키스탄과 사우디의 군사 협력.
    emphasis:
    - 메카 3국 동맹
    sources:
    - clm_0012
    - clm_0021
  - date: 2026.10.05
    text: 3국은 집단방위 공약의 실제 이행을 결정했고, 사우디에는 파키스탄군의 HQ-9과 JF-17이 들어갔다는 보도가 이어졌습니다.
    tts: 세 나라는 집단방위 공약의 실제 이행을 결정했고, 사우디에는 파키스탄군의 에이치큐 구와 제이에프 십칠이 들어갔다는 보도가 이어졌습니다.
    emphasis:
    - 실제 이행
    sources:
    - clm_0023
    - clm_0006
    - clm_0003
  - date: '2026.10'
    text: 그 사이 한국산 천궁-II는 사우디와 UAE, 이라크와 맺은 계약으로 같은 지역에 자리를 넓혀 왔습니다.
    tts: 그 사이 한국산 천궁 투는 사우디와 아랍에미리트, 이라크와 맺은 계약으로 같은 지역에 자리를 넓혀 왔습니다.
    emphasis:
    - 천궁-II
    sources:
    - clm_0033
    - clm_0035
    - clm_0037
  - date: 2026.10.07
    text: 익명 관리의 병력 증언과 정부의 부인이 맞선 채, 걸프의 집단방위는 서명을 넘어 실제 배치로 옮겨 가고 있습니다.
    emphasis:
    - 실제 배치
    sources:
    - clm_0027
    - clm_0029
    - clm_0023
    - clm_0032
