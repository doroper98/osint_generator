schema_version: 1
title: 중국산 무기가 걸프에 들어온 날
subtitle: 파키스탄군의 HQ-9·JF-17 배치 보도와 사우디의 비용, 그리고 천궁-II
date: 2026.10.12
scenes:
- id: open
  sentences:
  - date: 2026.05.18
    text: 올해 5월 18일, 로이터는 사우디아라비아에 중국산 방공체계가 들어갔다고 보도했습니다.
    tts: 올해 오월 십팔일, 로이터는 사우디아라비아에 중국산 방공체계가 들어갔다고 보도했습니다.
    emphasis:
    - 중국산 방공체계
    sources:
    - clm_0006
  - date: 2026.05.18
    text: 로이터가 인용한 소식통들에 따르면 이 체계를 운용하는 것은 사우디군이 아니라 파키스탄군입니다.
    emphasis:
    - 파키스탄군
    sources:
    - clm_0007
  - date: 2026.05.18
    text: 그리고 비용은 사우디가 댄다고 소식통들은 말했습니다.
    emphasis:
    - 비용은 사우디
    sources:
    - clm_0007
  - date: 2026.05.18
    text: 로이터는 파키스탄 군과 외무부, 사우디 정부 미디어실이 논평 요청에 답하지 않았다고 전했습니다.
    emphasis: []
    sources:
    - clm_0009
- id: what
  sentences:
  - date: 2026.05.18
    text: 먼저 로이터 보도에 따르면 배치 규모는 병력 약 8,000명과 전투기 약 16대입니다.
    tts: 먼저 로이터 보도에 따르면 배치 규모는 병력 약 팔천 명과 전투기 약 열여섯 대입니다.
    emphasis:
    - 약 8,000명
    sources:
    - clm_0001
    - clm_0003
  - date: '2026.04'
    text: 이 보도는 전투기 대부분이 JF-17이고, 4월 초부터 사우디로 건너갔다고 전했습니다.
    tts: 이 보도는 전투기 대부분이 제이에프 세븐틴이고, 사월 초부터 사우디로 건너갔다고 전했습니다.
    emphasis:
    - JF-17
    sources:
    - clm_0003
    - clm_0004
  - date: 2026.05.19
    text: 군사 전문 매체 아미 레코그니션은 JF-17이 파키스탄항공단지와 중국 청두항공기공업그룹이 함께 개발한 전투기라고 전했습니다.
    tts: 군사 전문 매체 아미 레코그니션은 제이에프 세븐틴이 파키스탄 항공단지와 중국 청두 항공기 공업그룹이 함께 개발한 전투기라고 전했습니다.
    emphasis:
    - 중국
    sources:
    - clm_0039
  - date: 2026.05.18
    text: 여기에 중국산 HQ-9 방공체계가 더해졌다고 로이터는 보도했습니다.
    tts: 여기에 중국산 에이치큐 나인 방공체계가 더해졌다고 로이터는 보도했습니다.
    emphasis:
    - HQ-9
    sources:
    - clm_0006
  - date: 2026.05.18
    text: 또한 안보 관리 두 명은 무인기 2개 대대도 함께 보냈다고 말했습니다.
    tts: 또한 안보 관리 두 명은 무인기 두 개 대대도 함께 보냈다고 말했습니다.
    emphasis: []
    sources:
    - clm_0008
- id: official
  sentences:
  - date: 2026.04.11
    text: 공식 발표로 확인된 것도 있습니다.
    emphasis:
    - 공식 발표
    sources:
    - clm_0005
  - date: 2026.04.11
    text: 알자지라에 따르면 사우디 국방부는 4월 11일 파키스탄 전투기가 동부주 킹압둘아지즈 공군기지에 도착했다고 발표했습니다.
    tts: 알자지라에 따르면 사우디 국방부는 사월 십일일 파키스탄 전투기가 동부주 킹압둘아지즈 공군기지에 도착했다고 발표했습니다.
    emphasis:
    - 킹압둘아지즈 공군기지
    sources:
    - clm_0005
  - date: 2026.10.07
    text: 이어서 10월 7일에는 파키스탄군 공보처장이 파키스탄군이 사우디에 여러 역할로 주둔하고 있다고 밝혔습니다.
    tts: 이어서 시월 칠일에는 파키스탄군 공보처장이 파키스탄군이 사우디에 여러 역할로 주둔하고 있다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0032
  - date: 2026.10.07
    text: 그렇지만 HQ-9과 JF-17이 배치됐다는 내용은 두 나라 정부가 확인하지 않은 보도로 남아 있습니다.
    tts: 그렇지만 에이치큐 나인과 제이에프 세븐틴이 배치됐다는 내용은 두 나라 정부가 확인하지 않은 보도로 남아 있습니다.
    emphasis: []
    sources:
    - clm_0006
    - clm_0009
- id: pact
  sentences:
  - date: 2025.09.17
    text: 로이터는 이 배치가 2025년 9월 두 나라가 서명한 상호방위협정에 따른 것이라고 보도했습니다.
    tts: 로이터는 이 배치가 이천이십오년 구월 두 나라가 서명한 상호방위협정에 따른 것이라고 보도했습니다.
    emphasis:
    - 상호방위협정
    sources:
    - clm_0012
    - clm_0001
  - date: 2025.09.17
    text: 당시 두 나라는 한쪽에 대한 공격을 양국 모두에 대한 공격으로 간주한다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: 2026.05.18
    text: 다만 협정 전문은 공개되지 않았고, 로이터 소식통은 최대 8만 명 배치 가능성까지 열려 있다고 말했습니다.
    tts: 다만 협정 전문은 공개되지 않았고, 로이터 소식통은 최대 팔만 명 배치 가능성까지 열려 있다고 말했습니다.
    emphasis: []
    sources:
    - clm_0010
  - date: 2026.05.18
    text: 정리하면 사람과 장비는 파키스탄이, 돈은 사우디가 대는 구조라고 소식통들은 설명했습니다.
    emphasis:
    - 돈은 사우디
    sources:
    - clm_0007
- id: us_arms
  sentences:
  - date: 2026.05.18
    text: 한편 미들이스트아이는 사우디가 미국산 패트리어트와 사드 방공체계를 갖고 있다고 전했습니다.
    tts: 한편 미들 이스트 아이는 사우디가 미국산 패트리어트와 사드 방공체계를 갖고 있다고 전했습니다.
    emphasis:
    - 패트리어트
    - 사드
    sources:
    - clm_0020
  - date: 2026.05.18
    text: 로이터 보도대로라면 그 옆에 중국산 HQ-9이 놓인 것입니다.
    tts: 로이터 보도대로라면 그 옆에 중국산 에이치큐 나인이 놓인 것입니다.
    emphasis: []
    sources:
    - clm_0006
    - clm_0020
  - date: 2026.05.18
    text: 게다가 사우디가 이 체계를 직접 산 것이 아니라, 동맹국 군대가 들여와 운용하고 사우디가 비용을 대는 방식이라는 점이 다릅니다.
    emphasis: []
    sources:
    - clm_0007
- id: scale
  sentences:
  - date: 2026.10.02
    text: 규모를 두고는 보도와 정부 입장이 맞섰습니다. 10월 2일 로이터는 파키스탄 병력이 3만에서 4만 명에 이른다고 보도했습니다.
    tts: 규모를 두고는 보도와 정부 입장이 맞섰습니다. 시월 이일 로이터는 파키스탄 병력이 삼만에서 사만 명에 이른다고 보도했습니다.
    emphasis:
    - 3만에서 4만 명
    sources:
    - clm_0026
  - date: 2026.10.06
    text: 반면 파키스탄 정보방송부는 이 보도를 거부하며, 수치와 세부 내용이 검증되지 않았다고 반박했습니다.
    emphasis: []
    sources:
    - clm_0029
    - clm_0031
- id: korea
  sentences:
  - date: 2022.01.16
    text: 걸프에는 한국산 방공체계도 들어가 있습니다. 한국은 2022년 1월 UAE와 천궁-II 수출 계약을 맺었습니다.
    tts: 걸프에는 한국산 방공체계도 들어가 있습니다. 한국은 이천이십이년 일월 아랍에미리트와 천궁 투 수출 계약을 맺었습니다.
    emphasis:
    - 천궁-II
    sources:
    - clm_0033
  - date: 2022.01.18
    text: 당시 디펜스 뉴스는 계약 규모를 약 35억 달러로 보도했습니다.
    tts: 당시 디펜스 뉴스는 계약 규모를 약 삼십오억 달러로 보도했습니다.
    emphasis: []
    sources:
    - clm_0034
  - date: 2024.02.06
    text: 이어서 2024년 2월에는 사우디와 맺은 계약이 공개됐고, 코리아 타임스는 규모를 32억 달러로 보도했습니다.
    tts: 이어서 이천이십사년 이월에는 사우디와 맺은 계약이 공개됐고, 코리아 타임스는 규모를 삼십이억 달러로 보도했습니다.
    emphasis: []
    sources:
    - clm_0035
    - clm_0036
  - date: 2024.09.20
    text: 같은 해 9월 LIG넥스원은 이라크와도 28억 달러 규모의 중거리 지대공미사일 수출 계약을 따냈다고 밝혔습니다.
    tts: 같은 해 구월 엘아이지 넥스원은 이라크와도 이십팔억 달러 규모의 중거리 지대공미사일 수출 계약을 따냈다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0037
  - date: 2026.04.03
    text: 가격도 비교 대상입니다. 더프린트는 뉴욕타임스를 인용해 천궁-II 요격탄은 1발에 약 110만 달러, 패트리어트 PAC-3는 약 370만 달러라고 전했습니다.
    tts: 가격도 비교 대상입니다. 더 프린트는 뉴욕 타임스를 인용해 천궁 투 요격탄은 한 발에 약 백십만 달러, 패트리어트 팩 쓰리는 약 삼백칠십만 달러라고 전했습니다.
    emphasis:
    - 110만 달러
    sources:
    - clm_0040
  - date: 2026.10.12
    text: 계약대로라면 사우디 하늘에는 미국산과 한국산, 그리고 로이터 보도대로라면 중국산 방공체계가 함께 서게 됩니다.
    emphasis: []
    sources:
    - clm_0020
    - clm_0035
    - clm_0006
- id: briefing
  sentences:
  - date: 2026.10.12
    text: 중국산 무기의 걸프 진입은 사우디가 사들인 것이 아니라 파키스탄군을 통해 들어온 길이라는 점에서 새롭습니다.
    emphasis: []
    sources:
    - clm_0006
    - clm_0007
  - date: 2026.10.12
    text: 공식 발표로 확인된 것은 파키스탄군의 사우디 주둔과 전투기 도착입니다.
    emphasis: []
    sources:
    - clm_0032
    - clm_0005
  - date: 2026.10.12
    text: 반면 HQ-9과 JF-17, 그리고 사우디의 비용 부담은 지금도 익명 소식통을 인용한 로이터 보도로만 알려져 있습니다.
    tts: 반면 에이치큐 나인과 제이에프 세븐틴, 그리고 사우디의 비용 부담은 지금도 익명 소식통을 인용한 로이터 보도로만 알려져 있습니다.
    emphasis: []
    sources:
    - clm_0006
    - clm_0007
  - date: 2026.10.12
    text: 로이터 보도대로라면, 미국산 패트리어트와 사드를 갖춘 사우디 하늘에 중국산 체계가 동맹국 군대를 통해 들어선 것입니다.
    emphasis: []
    sources:
    - clm_0020
    - clm_0006
    - clm_0007
