# 『중국산 무기가 걸프에 들어온 길』 유튜브 설명문 (v7.2.0). chapters.at = 장면 id 또는 TITLE.
schema_version: 1
headline: 중국산 무기가 걸프에 들어온 길 — 파키스탄군의 HQ-9·JF-17 배치 보도와 사우디의 비용, 그리고 천궁-II
summary: 2026년 5월 18일 로이터는 익명 소식통을 인용해 파키스탄이 사우디아라비아에 병력 약 8,000명과 JF-17 위주의 전투기 약 16대, 중국산 HQ-9 방공체계를 배치했고 비용은 사우디가 댄다고 보도했습니다. 두 나라 정부는 이 내용을 확인하지 않았습니다. 공식 발표로 확인된 것(파키스탄군의 사우디 주둔, 파키스탄 전투기의 킹압둘아지즈 공군기지 도착)과 보도로만 알려진 것을 나누고, 미국산 패트리어트·사드와 한국산 천궁-II가 함께 놓인 걸프 방공 시장을 출처와 기준 시점과 함께 지도로 정리했습니다.
