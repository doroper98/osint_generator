instructions:
  - "사용자 원문(D-0290 §0): '미국 중간선거 결과를 분석하는 영상을 만들어. … 최대한 미국의 주별 결과, 주요한 격전지나 핫스팟, 역사적 맥락이 있는 곳 등에 대해 비쥬얼하게(우리 기존 지도 형식 적용 안해도 됨) 잘 설명해주는 영상을 만들어.'"
  - "막 구성(D-0290 §4-4): cold(주가 동→서로 색을 입는다, area) → act1 전국 성적표(상원 versus·하원 dots·주지사·출구조사) → act2 뒤집힌 일곱 자리(TX·KS·SC·IA·OH·NC·ME 지도 투어, 유지 GA·MI) → act3 아직 안 끝난 곳(MS·AK 상원, KS·AK 주지사 — area counting 빗금) → act4 주 정부(주지사 뒤집힘·FL·주의회·재획정) → act5 역사(APP 표 precedent) → act6 다음 → ending."
  - "주별 결과는 area 로만 칠한다(D-0290 §3). 색·상태는 data/state_results.yaml 과 같아야 한다([area-data-mismatch] hard). 콜 없는 주 = muted·counting."
  - "수치 귀속: 상원·하원·주지사 수치는 NBC 집계(11월 5일 09:30 KST), 역사 수치는 APP 표. AP 콜은 2차 보도 인용. 해석(심판론)은 NBC 분석 ↔ 트럼프 대통령 발언 같은 무게."
  - 발음 텍스트 숫자·기호·라틴 약어 금지(AP → 에이피, NBC → 엔비씨, CBS → 씨비에스, JD → 제이디). 문장 끝 '~니다'. banned_phrases 0. card 이벤트 0(UF-148).
