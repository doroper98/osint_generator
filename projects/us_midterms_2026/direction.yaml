media_note: 'UF-148 card 0. 사진 26장 가운데 큰 액자(인물 우선 D-0292 §2.2, 개표 중 주는 의사당). 기사 카드 11(60초당 ≤2, 문장 매체 이름과 같은 매체만 — UF-130). 정당 공식 로고 emblem 뱃지 5회(cold_2·act1 앞뒤·act2 텍사스·act4 플로리다) — 사용자 지시 UF-165·D519 권리
