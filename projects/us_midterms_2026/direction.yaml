version: 1
media_note: 'UF-148 card 0. 사진 이벤트 17(가운데 큰 액자 — 인물 우선 D-0292 §2.2; 받은 원본 + 공용 트럼프 1, 하원 본회의장 2회). 결과 문장 16곳은 후보별 득표율 막대 bars(D-0303 §3, UF-170) — 그 문장의 사진은 다음 문장으로 옮기거나 뺐다(media_notes drop: 해밀턴 유세·아이오와
  의사당). 조지아·오하이오 주지사 문장은 후보 사진(보텀스·액턴)을 두고 bars 를 두지 않았다(문장 7초 — 사진·막대 각 4초 불가). 플로리다는 앞 절반 사진·뒤 절반 막대. 기사 카드 5(60초당 ≤2, 문장 매체 이름과 같은 매체만 — UF-130; 결과 문장 자리를 bars 에 내주며 0028·0037·0035·0029 뺌). 정당 공식 로고
  emblem 뱃지 4회(cold_2·act1_5·act2_2 민주, act4_7 공화) — UF-165·D519 권리 예외, 비공개 시청 한정. 알래스카 1순위는 versus 패널 대신 bars. 주 이름 표기 admin1_labels prominent(UF-167). 클립 0(c-span.org 403 봇 차단, 우회 안 함). · 콘티 판 v1: Wikimedia
  429 대기로 아직 못 받은 자산 3건(collins, jeffries, sc_capitol) — 그 문장의 이벤트를 빼고 지도·패널로 진행, 전편 전에 채운다(D-0298 §1-2).'
