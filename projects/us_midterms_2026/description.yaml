headline: 뒤집힌 일곱 자리 · 2026 미국 중간선거 — 주별 결과·격전지·역사 맥락
summary:
- 2026년 11월 3일 미국 중간선거에서 민주당이 하원과 상원을 모두 되찾았습니다. 상원에서는 텍사스·캔자스·사우스캐롤라이나·아이오와·오하이오·노스캐롤라이나·메인 일곱 곳이 공화당에서 민주당으로 넘어갔습니다. 주지사는 텍사스·조지아·오하이오·아이오와·네바다 다섯 곳이 바뀌었습니다. 중간선거가 무엇인지, 주별 결과와 격전지, 1934년 이후 90년의 중간선거 성적을 지도 위에서 정리했습니다.
- 수치는 11월 5일 저녁 NBC 집계 기준입니다. 미시시피·알래스카 상원과 캔자스·알래스카 주지사는 AP 발표 전이라 선두 후보를 '유력'으로 표기했고, 결과는 바뀔 수 있습니다.
