# 『뒤집힌 일곱 자리』 유튜브 설명문 (v7.4.0, D-0290). chapters.at = 장면 id 또는 TITLE.
schema_version: 1
headline: 뒤집힌 일곱 자리 · 2026 미국 중간선거 — 주별 결과·격전지·역사 맥락
summary: 2026년 11월 3일 미국 중간선거에서 민주당이 하원과 상원을 모두 되찾았습니다. 상원에서는 텍사스·캔자스·사우스캐롤라이나·아이오와·오하이오·노스캐롤라이나·메인 일곱 곳이 공화당에서 민주당으로 넘어갔고, 미시시피와 알래스카는 AP 승자 발표 전이지만 민주당 후보가 사실상 유력합니다. 주지사는 텍사스·조지아·오하이오·아이오와·네바다 다섯 곳이 민주당으로 바뀌었고, 펜실베이니아와 텍사스 주의회도 움직였습니다. 1934년 이후 대통령의 당이 중간선거에서 잃은 의석(아메리칸 프레지던시 프로젝트 표)과 나란히 놓고 지도 위에서 주별로 정리했습니다. 수치는 NBC 집계(11월 5일 저녁, 한국 시각) 기준이며 AP 승자 발표 전인 곳(유력)은 바뀔 수 있습니다.
