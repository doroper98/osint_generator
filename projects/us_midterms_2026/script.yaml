    text: 그래서 이 네 곳은 지도에서 빗금으로 남겨 둡니다.
    role: outro
    emphasis: []
    sources:
    - clm_0030
    - clm_0031
    - clm_0032
    - clm_0033
- id: act4
  kind: act
  stage: 미국 주 정부
  sentences:
  - date: 2026.11.04
    text: 이제 시선을 워싱턴에서 주 정부로 옮겨 보겠습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0007
  - date: 2026.11.04
    text: 주지사와 주의회는 선거구와 투표 규칙을 정하는 자리입니다.
    role: intro
    emphasis: []
    sources:
    - clm_0036
    - clm_0037
  - date: 2026.11.03
    text: 먼저 텍사스에서는 지나 이노호사 후보가 현직 그레그 애벗 주지사를 꺾었습니다.
    emphasis: []
    sources:
    - clm_0038
  - date: 2026.11.03
    text: 1995년 퇴임한 앤 리처즈 이후 첫 민주당 주지사이자, 텍사스의 첫 라틴계 여성 주지사입니다.
    tts: 천구백구십오년 퇴임한 앤 리처즈 이후 첫 민주당 주지사이자, 텍사스의 첫 라틴계 여성 주지사입니다.
    emphasis: []
    sources:
    - clm_0038
  - date: 2026.11.03
    text: 조지아에서는 키샤 랜스 보텀스 후보가 54 대 46으로 이겨, 미국 역사상 첫 흑인 여성 주지사가 됩니다.
    tts: 조지아에서는 키샤 랜스 보텀스 후보가 오십사 대 사십육으로 이겨, 미국 역사상 첫 흑인 여성 주지사가 됩니다.
    emphasis:
    - 첫 흑인 여성 주지사
    sources:
    - clm_0039
  - date: 2026.11.03
    text: 이어서 오하이오에서는 의사 출신 에이미 액턴 후보가 비벡 라마스와미 후보를 52 대 44로 이겼습니다.
    tts: 이어서 오하이오에서는 의사 출신 에이미 액턴 후보가 비벡 라마스와미 후보를 오십이 대 사십사로 이겼습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: 2026.11.04
    text: 그리고 네바다에서는 애런 포드 후보가 현직 조 롬바르도 주지사를 물리쳤고, 아이오와에서도 롭 샌드 후보가 이겼습니다.
    emphasis: []
    sources:
    - clm_0041
    - clm_0042
  - date: 2026.11.03
    text: 반면 공화당이 지킨 플로리다에서는 바이런 도널즈 후보가 50.0 대 48.7로 이겨 플로리다의 첫 흑인 주지사가 됩니다.
    tts: 반면 공화당이 지킨 플로리다에서는 바이런 도널즈 후보가 오십 점 영 대 사십팔 점 칠로 이겨 플로리다의 첫 흑인 주지사가 됩니다.
    emphasis: []
    sources:
    - clm_0043
  - date: 2026.11.04
    text: 주의회에서는 펜실베이니아 민주당이 주 상원까지 가져와, 1993년 이후 처음으로 주지사와 양원을 모두 쥐었습니다.
    tts: 주의회에서는 펜실베이니아 민주당이 주 상원까지 가져와, 천구백구십삼년 이후 처음으로 주지사와 양원을 모두 쥐었습니다.
    emphasis: []
    sources:
    - clm_0044
  - date: 2026.11.04
    text: 한편 선거구를 새로 그린 텍사스에서 공화당 연방 하원 의석은 오히려 25석에서 24석으로 줄었습니다.
    tts: 한편 선거구를 새로 그린 텍사스에서 공화당 연방 하원 의석은 오히려 이십오석에서 이십사석으로 줄었습니다.
    emphasis: []
    sources:
    - clm_0036
  - date: 2026.11.03
    text: 미주리에서는 공화당이 새로 그린 하원 지도가 주민투표에서 부결됐습니다.
    emphasis: []
    sources:
    - clm_0037
  - date: 2026.11.04
    text: 이렇게 주지사 다섯 자리와 주의회 다수가 바뀌면서, 다음 선거의 규칙을 정할 사람도 바뀝니다.
    role: outro
    emphasis: []
    sources:
    - clm_0007
    - clm_0044
- id: act5
  kind: act
  stage: 미국 의회 90년
  sentences:
  - date: 2026.11.05
    text: 그렇다면 이번 결과는 역사 속에서 어느 정도일까요.
    role: bridge
    emphasis: []
    sources:
    - clm_0045
  - date: 2026.11.05
    text: 지난 90년의 중간선거와 나란히 놓아 보겠습니다.
    tts: 지난 구십년의 중간선거와 나란히 놓아 보겠습니다.
    role: intro
    emphasis: []
    sources:
    - clm_0045
  - date: 2026.11.05
    text: 아메리칸 프레지던시 프로젝트 집계로는, 1934년부터 2022년까지 대통령의 당이 중간선거에서 하원 평균 27석, 상원 평균 약 3석을 잃었습니다.
    tts: 아메리칸 프레지던시 프로젝트 집계로는, 천구백삼십사년부터 이천이십이년까지 대통령의 당이 중간선거에서 하원 평균 이십칠석, 상원 평균 약 삼석을 잃었습니다.
    emphasis:
    - 평균 27석
    sources:
    - clm_0045
  - date: 2026.11.05
    text: 대통령의 당이 하원 의석을 늘린 해는 1934년, 1998년, 2002년 세 번뿐입니다.
    tts: 대통령의 당이 하원 의석을 늘린 해는 천구백삼십사년, 천구백구십팔년, 이천이년 세 번뿐입니다.
    emphasis: []
    sources:
    - clm_0046
  - date: 2026.11.05
    text: 1994년 클린턴 대통령의 민주당은 하원 54석을, 2010년 오바마 대통령의 민주당은 63석을 잃었습니다.
    tts: 천구백구십사년 클린턴 대통령의 민주당은 하원 오십사석을, 이천십년 오바마 대통령의 민주당은 육십삼석을 잃었습니다.
    emphasis: []
    sources:
    - clm_0047
  - date: 2026.11.05
    text: 트럼프 대통령 1기였던 2018년에는 하원 41석을 잃었지만, 상원은 2석 늘었습니다.
    tts: 트럼프 대통령 일기였던 이천십팔년에는 하원 사십일석을 잃었지만, 상원은 이석 늘었습니다.
    emphasis: []
    sources:
    - clm_0048
  - date: 2026.11.05
    text: 이번에는 하원에서 지금까지 확정된 자리만으로 공화당이 34석을 잃어, 90년 평균보다 많습니다.
    tts: 이번에는 하원에서 지금까지 확정된 자리만으로 공화당이 삼십사석을 잃어, 구십년 평균보다 많습니다.
    emphasis: []
    sources:
    - clm_0049
    - clm_0045
  - date: 2026.11.05
    text: 다만 상원의 공화당 7석 손실은 개표가 끝나지 않은 숫자이고, 1960년 이후 상원에서 7석 이상을 잃은 해는 1986년, 1994년, 2014년 세 번이었습니다.
    tts: 다만 상원의 공화당 칠석 손실은 개표가 끝나지 않은 숫자이고, 천구백육십년 이후 상원에서 칠석 이상을 잃은 해는 천구백팔십육년, 천구백구십사년, 이천십사년 세 번이었습니다.
    role: outro
    emphasis: []
    sources:
    - clm_0005
    - clm_0050
- id: act6
  kind: act
  stage: 워싱턴
  sentences:
  - date: 2026.11.04
    text: 이제 다시 워싱턴으로 돌아가 보겠습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0051
  - date: 2027.01.03
    text: 새 의회는 2027년 1월에 문을 엽니다.
    tts: 새 의회는 이천이십칠년 일월에 문을 엽니다.
    role: intro
    emphasis: []
    sources:
    - clm_0051
  - date: 2026.11.04
    text: 하원의장에는 민주당 하킴 제프리스 원내대표가 오를 것으로 보입니다.
    emphasis: []
    sources:
    - clm_0052
  - date: 2026.11.04
    text: 척 슈머 민주당 원내대표는 트럼프 대통령이 국민의 뜻이나 법을 거스르면 조사하고 법정에 세우겠다고 말했습니다.
    emphasis: []
    sources:
    - clm_0053
  - date: 2026.11.04
    text: 트럼프 대통령은 결과를 받아들이겠다면서도, 민주당이 통과시키는 법안에는 거부권을 쓰겠다고 말했습니다.
    emphasis: []
    sources:
    - clm_0054
  - date: 2026.11.03
    text: 한편 주민투표에서는 버지니아와 네바다가 낙태권을, 오하이오와 노스캐롤라이나가 투표 때 사진 신분증 제시를 주 헌법에 넣었습니다.
    emphasis: []
    sources:
    - clm_0055
    - clm_0056
  - date: 2027.01.03
    text: 그래서 2027년의 워싱턴은 민주당 의회와 공화당 대통령이 마주 앉는 구도로 시작합니다.
    tts: 그래서 이천이십칠년의 워싱턴은 민주당 의회와 공화당 대통령이 마주 앉는 구도로 시작합니다.
    role: outro
    emphasis: []
    sources:
    - clm_0002
    - clm_0051
- id: ending
  kind: ending
  stage: 미국
  sentences:
  - date: 2026.11.05
    text: 끝으로, 11월 5일 아침 기준으로 민주당은 상원 54석과 하원 과반, 주지사 과반을 확보했습니다.
    tts: 끝으로, 십일월 오일 아침 기준으로 민주당은 상원 오십사석과 하원 과반, 주지사 과반을 확보했습니다.
    role: bridge
    emphasis: []
    sources:
    - clm_0005
    - clm_0006
    - clm_0008
  - date: 2026.11.05
    text: 그리고 상원의 최종 의석은 미시시피와 알래스카의 개표가 끝나야 정해집니다.
    emphasis: []
    sources:
    - clm_0030
    - clm_0035
