# 『걸프의 새 방패 — 파키스탄군은 왜 사우디에 있나』 주문 (v5.20.0) — 사용자 결정 D156(2026-10-10)·back_and_forth D-0163 §1·§4·§5, D-0179 순서.
schema_version: 1
topic: 파키스탄군의 사우디 주둔 공식 확인(2026-10-07 ISPR)과 사우디·튀르키예·파키스탄 메카 공동방위협정의 첫 발동(2026-10-05~06), 후티의 사우디 공항 공격과 이란 전쟁 속 걸프 에너지 안보, 그리고 한국
genre: geopolitics
invariant_layer: docs/handoff/20 §1.1
length: 내용이 정한다
instructions:
  - "사용자 결정 D156: 파키스탄군 사우디 주둔 공식 확인 + 사우디·튀르키예·파키스탄 집단방위 이행, 걸프 에너지 안보(지정학+지경학). 5분 내외."
  - 흐름 — 지금(10월 ISPR 확인·협정 발동·리야드 공항 공격) → 협정이 어떻게 생겼나(2025-09 사우디·파키스탄 양자 협정 → 2026-08 튀르키예가 더해진 메카 협정) → 무엇이 배치됐나(보도 수치, 기관·시점 명시) → 왜 지금인가(이란 전쟁·후티 공격) → 한국과의 연결(호르무즈·원유 의존) → 남은 질문 순서.
  - 배치 규모는 기관마다 다르다(5월 Reuters 보도 8,000명·전투기 1개 대대·방공체계 / 10월 Reuters 보도 파키스탄 관리 인용 3만~4만 명 / 파키스탄 정보부 "추측성 보도"). 두 수치를 같은 무게로 출처·시점과 함께 나란히 쓰거나, 쓰지 않는다(G4). 정부 반박도 같은 무게로.
  - 협정 조문은 확인된 문구만("한쪽에 대한 침략은 양쪽에 대한 침략", 2025-09-17 공동성명). 확인 안 된 조항은 쓰지 않는다.
  - 발언은 귀속한다("~라고 말했습니다"·"~라고 보도했습니다"). 파키스탄 공군의 후티 공습 보도는 파키스탄 정부가 "가짜"라고 부인 — 양측 병기 또는 쓰지 않는다.
  - 사상자 수는 사우디 당국 발표를 그 날짜와 함께. 공격 주체 귀속(후티 주장·사우디 발표)을 밝힌다.
  - 한국 연결은 CSIS(2026-04 기준 원유 수입 70% 호르무즈 경유) 등 출처·기준 시점이 있는 수치만. 호르무즈 영상의 61%(대통령실·2025 기준)와 기준이 다르면 섞지 않는다.
  - 지도 무대 중심 — 아라비아반도·홍해·걸프·호르무즈·파키스탄(대략 동경 30~75, 북위 10~40). 리야드·아브하·메카·이슬라마바드·앙카라·사나·바브엘만데브.
  - 보도 인용 문장은 기사 카드(P1-0 — 기사 카드 후보 의무). 인물(샤리프 총리·무함마드 빈 살만·에르도안·아심 무니르·ISPR 대변인)은 권리 확인된 초상만.
