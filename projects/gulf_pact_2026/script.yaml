schema_version: 1
title: 걸프의 새 방패 — 파키스탄군은 왜 사우디에 있나
subtitle: 메카 집단방위 협정 발동과 후티의 리야드 공항 공격
date: 2026.10.11
scenes:
- id: open
  sentences:
  - date: 2026.10.07
    text: 10월 7일, 파키스탄군 대변인 아흐메드 샤리프 차우드리 중장이 CNN 인터뷰에 나섰습니다.
    tts: 시월 칠일, 파키스탄군 대변인 아흐메드 샤리프 차우드리 중장이 씨엔엔 인터뷰에 나섰습니다.
    emphasis: []
    sources:
    - clm_0024
  - date: 2026.10.07
    text: 그리고 파키스탄군이 사우디아라비아에 여러 역할로 주둔하고 있다고 공식 확인했습니다.
    emphasis:
    - 공식 확인
    sources:
    - clm_0024
    - clm_0025
- id: pact_origin
  sentences:
  - date: 2025.09.17
    text: 이 주둔의 출발점은 2025년 9월 17일이었습니다.
    tts: 이 주둔의 출발점은 이천이십오년 구월 십칠일이었습니다.
    emphasis: []
    sources:
    - clm_0003
  - date: 2025.09.17
    text: 그날 사우디아라비아와 파키스탄은 양자 전략적 상호방위협정을 맺었습니다.
    emphasis:
    - 상호방위협정
    sources:
    - clm_0003
  - date: 2026.08.07
    text: 이어서 올해 8월 7일, 파키스탄·사우디아라비아·튀르키예 3국이 메카 공동방위협정을 맺었습니다.
    tts: 이어서 올해 팔월 칠일, 파키스탄, 사우디아라비아, 튀르키예 세 나라가 메카 공동방위협정을 맺었습니다.
    emphasis:
    - 메카 공동방위협정
    sources:
    - clm_0001
  - date: 2026.08.07
    text: 특히 협정은 한 나라에 대한 무력 공격을 3국 모두에 대한 공격으로 간주합니다.
    tts: 특히 협정은 한 나라에 대한 무력 공격을 세 나라 모두에 대한 공격으로 간주합니다.
    emphasis:
    - 3국 모두에 대한 공격
    sources:
    - clm_0002
  - date: '2026'
    text: 이렇게 묶인 3국의 현역 병력은 글로벌 파이어파워 2026 지수 기준 약 140만 명입니다.
    tts: 이렇게 묶인 세 나라의 현역 병력은 글로벌 파이어파워 이천이십육 지수 기준 약 백사십만 명입니다.
    emphasis:
    - 140만 명
    sources:
    - clm_0006
- id: reactions
  sentences:
  - date: 2026.08.07
    text: 이에 대해 알자지라에 따르면, 사우디 공공외교 차관 라에드 크림리는 협정이 역내 어느 나라에도 위협이 아니라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0004
  - date: 2026.08.07
    text: 반면 이란 의원 에브라힘 레자에이는 튀르키예·파키스탄과의 종이 협정이 사우디에 안보를 가져다주지 못할 것이라고 말했습니다.
    tts: 반면 이란 의원 에브라힘 레자에이는 튀르키예, 파키스탄과의 종이 협정이 사우디에 안보를 가져다주지 못할 것이라고 말했습니다.
    emphasis:
    - 종이 협정
    sources:
    - clm_0005
- id: mecca_attack
  sentences:
  - date: '2026'
    text: 한편 예멘의 후티 세력은 바브엘만데브 해협을 포함한 홍해 연안을 장악했습니다.
    emphasis:
    - 바브엘만데브 해협
    sources:
    - clm_0009
  - date: 2026.09.25
    text: 그런데 9월 25일, 3국 군 고위 관계자들은 메카를 겨냥한 공격을 규탄했습니다.
    tts: 그런데 구월 이십오일, 세 나라 군 고위 관계자들은 메카를 겨냥한 공격을 규탄했습니다.
    emphasis: []
    sources:
    - clm_0007
  - date: 2026.09.25
    text: 사우디와 협정 3국은 후티가 메카와 메디나를 겨냥한 공격을 시도했다고 주장했습니다.
    tts: 사우디와 협정 세 나라는 후티가 메카와 메디나를 겨냥한 공격을 시도했다고 주장했습니다.
    emphasis:
    - 메카와 메디나
    sources:
    - clm_0008
  - date: 2026.09.25
    text: 반면 후티와 이란은 이 혐의를 부인했습니다.
    emphasis: []
    sources:
    - clm_0008
- id: invocation
  sentences:
  - date: 2026.10.05
    text: 이후 10월 5일, 메카 협정의 전략정치국방위원회가 리야드에서 긴급회의를 열었습니다.
    tts: 이후 시월 오일, 메카 협정의 전략정치국방위원회가 리야드에서 긴급회의를 열었습니다.
    emphasis: []
    sources:
    - clm_0010
  - date: 2026.10.05
    text: 그리고 집단방위 공약을 실제로 이행하는 협정 발동을 결정했습니다.
    emphasis:
    - 협정 발동
    sources:
    - clm_0011
  - date: 2026.10.05
    text: 특히 포린폴리시는 이번 발동이 8월 서명 이후 처음이라고 보도했습니다.
    tts: 특히 포린폴리시는 이번 발동이 팔월 서명 이후 처음이라고 보도했습니다.
    emphasis: []
    sources:
    - clm_0012
  - date: 2026.10.05
    text: 다만 같은 날 나온 3국 공동성명은 후티를 위협으로 명시하지 않았습니다.
    tts: 다만 같은 날 나온 세 나라 공동성명은 후티를 위협으로 명시하지 않았습니다.
    emphasis: []
    sources:
    - clm_0014
  - date: 2026.10.05
    text: 또한 익스프레스 트리뷴은 성명이 합의된 군사력을 사우디에 즉시 배치한다고 밝혔다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0013
  - date: 2026.10.05
    text: 반면 비즈니스 스탠더드는 성명이 배치 세부 내용이나 일정은 밝히지 않았다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0015
  - date: '2026.10'
    text: 한편 포린폴리시는 튀르키예 의회가 아직 이 협정을 비준하지 않았다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0016
- id: roles
  sentences:
  - date: 2026.10.05
    text: 이에 카와자 아시프 파키스탄 국방장관은 파키스탄과 튀르키예가 정찰 등 지원 역할로 사우디를 돕고 있다고 밝혔습니다.
    emphasis:
    - 지원 역할
    sources:
    - clm_0017
  - date: 2026.10.05
    text: 다만 비즈니스 스탠더드에 따르면, 아시프 장관은 전투 작전에는 사우디군만 참여하고 있다고 말했습니다.
    emphasis: []
    sources:
    - clm_0018
  - date: '2026.10'
    text: 그리고 튀르키예도 사우디에 군사 지원을 제공했습니다.
    emphasis: []
    sources:
    - clm_0031
- id: troop_numbers
  sentences:
  - date: '2026.05'
    text: 앞서 5월 로이터는 파키스탄이 병력 8,000명과 전투기 편대, 방공체계를 사우디에 보냈다고 보도했습니다.
    tts: 앞서 오월 로이터는 파키스탄이 병력 팔천 명과 전투기 편대, 방공체계를 사우디에 보냈다고 보도했습니다.
    sources:
    - clm_0026
    - clm_0027
    - clm_0028
  - date: 2026.10.02
    text: 그리고 10월 2일, 로이터는 파키스탄이 사우디에 병력 3만~4만 명을 배치했다고 보도했습니다.
    tts: 그리고 시월 이일, 로이터는 파키스탄이 사우디에 병력 삼만에서 사만 명을 배치했다고 보도했습니다.
    emphasis:
    - 3만~4만 명
    sources:
    - clm_0020
    - clm_0019
  - date: 2026.10.02
    text: 로이터는 익명의 파키스탄 관리를 인용해 이 병력이 국경 방어와 드론·미사일 요격을 맡았다고 전했습니다.
    tts: 로이터는 익명의 파키스탄 관리를 인용해 이 병력이 국경 방어와 드론, 미사일 요격을 맡았다고 전했습니다.
    emphasis: []
    sources:
    - clm_0019
    - clm_0020
  - date: 2026.10.02
    text: 또한 같은 관리는 예멘 전투 파병은 결정하지 않았다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0021
  - date: 2026.10.06
    text: 반면 파키스탄 정보방송부는 10월 6일 이를 익명 소식통에 기댄 추측성 보도라며 거부했습니다.
    tts: 반면 파키스탄 정보방송부는 시월 육일 이를 익명 소식통에 기댄 추측성 보도라며 거부했습니다.
    emphasis:
    - 추측성 보도
    sources:
    - clm_0022
  - date: 2026.10.06
    text: 그러면서 작전 세부사항은 기밀이라며 배치 내용은 공개하지 않겠다고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0023
  - date: 2026.10.07
    text: 이어서 10월 7일, 앞서 본 군 대변인의 CNN 인터뷰로 주둔 사실이 공식 확인됐습니다.
    tts: 이어서 시월 칠일, 앞서 본 군 대변인의 씨엔엔 인터뷰로 주둔 사실이 공식 확인됐습니다.
    emphasis: []
    sources:
    - clm_0024
  - date: '2026.09'
    text: 게다가 카마 프레스가 전한 로이터 보도에 따르면, 한 파키스탄 관리는 9월 방공체계 등을 실은 수송기 4대를 아덴에 보냈다고 밝혔습니다.
    tts: 게다가 카마 프레스가 전한 로이터 보도에 따르면, 한 파키스탄 관리는 구월 방공체계 등을 실은 수송기 네 대를 아덴에 보냈다고 밝혔습니다.
    emphasis:
    - 아덴
    sources:
    - clm_0029
  - date: 2026.10.08
    text: 한편 ARY 뉴스에 따르면, 정보방송부는 10월 8일 파키스탄 공군의 후티 공격 투입 가능성을 다룬 뉴욕 타임스 보도를 거부했습니다.
    tts: 한편 에이알와이 뉴스에 따르면, 정보방송부는 시월 팔일 파키스탄 공군의 후티 공격 투입 가능성을 다룬 뉴욕 타임스 보도를 거부했습니다.
    emphasis: []
    sources:
    - clm_0030
- id: yemen_front
  sentences:
  - date: '2026.10'
    text: 한편 예멘에서는 사우디 주도 연합군과 예멘 정부군이 10월 초 후티 점령지 탈환 공세를 시작했습니다.
    tts: 한편 예멘에서는 사우디 주도 연합군과 예멘 정부군이 시월 초 후티 점령지 탈환 공세를 시작했습니다.
    emphasis:
    - 탈환 공세
    sources:
    - clm_0032
  - date: 2026.10.05
    text: 예멘 정부군은 10월 5일 모카에 도달해 후티를 해협에서 밀어냈다고 주장했습니다.
    tts: 예멘 정부군은 시월 오일 모카에 도달해 후티를 해협에서 밀어냈다고 주장했습니다.
    emphasis:
    - 모카
    sources:
    - clm_0033
  - date: 2026.10.05
    text: 반면 후티는 정부군의 이 주장을 부인했습니다.
    emphasis: []
    sources:
    - clm_0033
  - date: 2026.10.07
    text: 그리고 타임에 따르면, 후티 지지자들은 10월 7일 사나에서 튀르키예·파키스탄의 사우디 지원에 반대하는 무장 집회를 열었습니다.
    tts: 그리고 타임에 따르면, 후티 지지자들은 시월 칠일 사나에서 튀르키예와 파키스탄의 사우디 지원에 반대하는 무장 집회를 열었습니다.
    emphasis: []
    sources:
    - clm_0035
- id: riyadh_airport
  sentences:
  - date: 2026.10.08
    text: 이어서 후티는 10월 8일 탄도미사일로 리야드 킹칼리드 국제공항을 공격했다고 밝혔습니다.
    tts: 이어서 후티는 시월 팔일 탄도미사일로 리야드 킹칼리드 국제공항을 공격했다고 밝혔습니다.
    emphasis:
    - 킹칼리드 국제공항
    sources:
    - clm_0036
  - date: 2026.10.08
    text: 이 공항 공격으로 3명이 숨졌습니다.
    tts: 이 공항 공격으로 세 명이 숨졌습니다.
    emphasis: []
    sources:
    - clm_0037
  - date: 2026.10.08
    text: 알자지라에 따르면, 사우디 민간항공청은 사망자 3명이 조종사를 포함한 사우디인이라고 밝혔습니다.
    tts: 알자지라에 따르면, 사우디 민간항공청은 사망자 세 명이 조종사를 포함한 사우디인이라고 밝혔습니다.
    emphasis: []
    sources:
    - clm_0038
    - clm_0037
  - date: 2026.10.10
    text: 그 뒤 알자지라는 후티가 10월 10일 같은 공항을 다시 공격했다고 보도했습니다.
    tts: 그 뒤 알자지라는 후티가 시월 십일 같은 공항을 다시 공격했다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0039
  - date: 2026.10.10
    text: 그러면서 후티 미디어국장은 공항을 폐쇄시켰다고 주장했습니다.
    emphasis: []
    sources:
    - clm_0040
  - date: 2026.10.10
    text: 이에 대해 사우디는 이 공격으로 최소 12명이 숨졌다고 밝혔습니다.
    tts: 이에 대해 사우디는 이 공격으로 최소 열두 명이 숨졌다고 밝혔습니다.
    emphasis:
    - 최소 12명
    sources:
    - clm_0041
  - date: 2026.10.10
    text: 또한 사우디 민간항공청은 최소 309명이 다쳤다고 밝혔습니다.
    tts: 또한 사우디 민간항공청은 최소 삼백아홉 명이 다쳤다고 밝혔습니다.
    emphasis:
    - 309명
    sources:
    - clm_0042
  - date: 2026.10.10
    text: 특히 알자지라는 사망자 가운데 미국 시민 1명이 있다고 보도했습니다.
    tts: 특히 알자지라는 사망자 가운데 미국 시민 한 명이 있다고 보도했습니다.
    emphasis: []
    sources:
    - clm_0043
  - date: 2026.10.10
    text: 이에 사우디 주도 연합군은 공항 공격을 전면적 전쟁범죄라고 밝혔습니다.
    emphasis:
    - 전쟁범죄
    sources:
    - clm_0044
  - date: '2026.10'
    text: 한편 알자지라에 따르면, 후티는 민항기들에 사우디 영공을 피하라고 경고했습니다.
    emphasis: []
    sources:
    - clm_0045
  - date: '2026.10'
