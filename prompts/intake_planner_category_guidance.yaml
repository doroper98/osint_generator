# IntakePlannerWorker 카테고리별 인테이크 항목 가이드 (v2.0.0 파일 분리 — 원본 workers/intake_planner_worker.py CATEGORY_GUIDANCE).
# docs/04_DYNAMIC_INTAKE_PAGE_SPEC.md §4 와 동기화. 값은 user prompt 의 {guidance} 자리에 그대로 들어간다.
geopolitics: |-
  지정학 카테고리 표준 항목:
  - 핵심 사건 / 발표 출처 (정부·국방부·외교부 공식 채널)
  - 관련 지역 좌표 / 지명 (지도 장면용)
  - 양측 입장 (해당국 + 상대국 공식 성명)
  - OSINT 분석가 트윗 / 해외 전문가 견해
  - 과거 유사 사례 (역사적 맥락)
  - 에너지·해운 경로 등 인프라 지도
  - 미검증 주장 (음모론 라벨 필요 항목)
war_military: |-
  전쟁/군사 카테고리 표준 항목:
  - 핵심 사건 영상 (X/Telegram 링크, rights_status 기록 필수)
  - 위치 좌표 / 지명 (전선 지도용)
  - 공식 발표 (정부·국방부 양측)
  - OSINT 분석가 트윗 (geolocation 검증 가능)
  - 과거 유사 작전 사례
  - 위성 사진 (Maxar/Planet 등)
  - 무기 체계명 / 식별 정보
economy: |-
  경제/금융/산업 카테고리 표준 항목:
  - 핵심 지표 (유가, 환율, 금리, 운임 등)
  - 시계열 데이터 출처 (Bloomberg/Reuters/공식 통계)
  - 산업 보고서 (PDF 또는 링크)
  - 관련 기업 (티커, 시가총액, 사업 영역)
  - 정책 발표 (중앙은행 / 정부 / 규제 당국)
  - 공급망 다이어그램 자료
disinformation: |-
  정보전/해외 음모론 카테고리 표준 항목 (국내 정치/인물은 GOAL.md G2/G5 에서 범위 외):
  - 원 주장 출처 (누가 처음 퍼뜨렸는가)
  - 확산 경로 (어느 플랫폼 / 시간순)
  - 반박 자료 (팩트체크 / 공식 부인)
  - 검증 / 미검증 상태 (각 주장 단위)
  - 영상 내 `<미검증>` 라벨이 필요한 항목 표시
  - 관련 음모론 클러스터 / 변종
earthquake: |-
  자연재해/지진 카테고리 표준 항목:
  - 진앙 좌표 / 규모 / 진원 깊이
  - 발생 시각 (UTC + 현지)
  - 1차 출처 (USGS / JMA / CWA / CENC / KMA 등)
  - 여진 추이 (시계열)
  - 쓰나미 경보 유무 / 영향 해안
  - 인근 도시 / 인구 노출
  - 판 경계 / 해구 / 단층 구조
  - 현장 영상 / CCTV (rights_status 기록)
  - 피해 사진
  - 과거 유사 지진 (재현 주기 / 비교군)
