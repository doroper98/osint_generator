# 엔티티 레지스트리 (v2.4.0, back_and_forth D-0029 작업 2, 07 §6).
# 인물·기관·국가를 이름으로 찾는 사전. 스키마: schemas/entity_models.py, 로더: engine/entities.py.
# - 라이브러리 24인(assets/library/library_manifest.json)은 자동 등재된다. 여기 같은 id 로 적으면 보강(국기·직함·별칭).
# - 라이브러리 밖 인물은 portrait(프로젝트 assets/portraits/<id>.png, tools/portrait_fallback.py 산출)와 rights 를 적는다.
# - 기관(org)은 flag(휘장 제한·부재 시 대체 국기, D5)와 emblem(assets/emblems/registry.json 키)을 적는다.
# - 등재 없는 이름·id 를 연출이 참조하면 RegistryError(15 P10). 별칭은 두 엔티티에 겹칠 수 없다.
schema_version: 1
entities:
  # ---------------------------------------------------------------- 인물 (v3 호르무즈 4명)
  lee_jae_myung:
    kind: person
    names: [이재명, 이재명 대통령, Lee Jae-myung]
    flag: kr
    portrait: lee_jae_myung
    role_default: 대한민국 대통령
    accent: gold
    rights: people.lee_jae_myung
