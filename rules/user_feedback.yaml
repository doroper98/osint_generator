# 규칙: ① 의견을 받으면 그 자리에서 원문 그대로 append(번호 오름차순, 과거 줄 수정 금지 — 상태·장치 칸 보강만)
#       ② guards = 재발하면 실제로 실패를 내는 것(check = engine.checks id, test = 경로::클래스::함수, rule = rules 점 경로, code = 함수 점 경로)
