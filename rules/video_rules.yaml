flight:                    # v7.3.0 back_and_forth D-0206·D-0225(사용자 결정 D232 U3·D234 U6) — 비행 이벤트(engine/layers/flight.draw_flight). 설계 px(480p)
  # 개략 표현: 비행 시간은 거리와 무관하게 고정, 꼬리선은 점선, 출발 위치는 점·라벨 없는 발광(U3-a). 착탄 링 = effects.draw_boom 그대로(새 링 모양 금지)
  dur_sec: 2.4             # 출발(t0) → 착탄. 연출은 착탄 시각을 쓰지 않는다(코드 계산, P8)
