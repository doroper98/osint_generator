  # 흐름·호흡을 게이트 ② 전에 싸게 검토한다. 자막·타이틀·엔딩 카드·마커·경로·타격 링·시리즈·카메라·dip·음악은 그대로, 사진·뱃지 등은 자리표시 상자.
  # v5.6.0 사용자 지적(2026-10-04 "콘티판에는 패널이라고만 나와서 대본 말고는 승인할 게 없다", PIPELINE-AP-018) — 패널·카드(숫자·문구·도식)는 전편 렌더러 그대로. 패널 안 뱃지만 자리표시.
  profile: 480p            # config engine.output 프로파일 — fps 24 유지(타이밍이 프레임 단위라 낮추지 않는다)
  output: animatic.mp4     # out/animatic.mp4 (영상 + out/mix.f32 음성·음악). out/video_noaudio.mp4·final.mp4 는 건드리지 않는다
  preset: veryfast         # 콘티 판 인코딩만(전편 preset 은 config 그대로)
  mp4_comment: "animatic — 콘티 판 · 검토용 · 배포 금지"   # mp4 메타데이터 comment — engine.mux(deliver)가 이 표식을 보면 거부
  # flat_map(막지도) — v7.4.0 D-0241 §2(UF-121) 삭제. 콘티 판도 본 지도
  placeholder:             # 요소와 같은 자리·크기(G7 값)·타이밍(팝인·페이드)의 상자 + `[종류: 이름]`
    fill: [0.09, 0.11, 0.15, 0.78]
    stroke: [0.91, 0.72, 0.38, 0.95]
    stroke_w: 1.2
    dash: [4, 3]
    text: [1.0, 1.0, 1.0, 1.0]
    font: sansb
    size: 12               # layout_480p.min_font_px(9.5) 이상
    line_gap: 15
    max_chars: 30          # 한 줄 글자 수 상한(넘으면 … — 자리표시 문구만, 자막·카드 문구 아님)
    cutout_h_ratio: 0.4    # 컷아웃 높이 ÷ 폭 — 레지스트리에 비율이 없다(tool.params width 만). 파일을 열지 않으려고 쓰는 근사(p8 실측 134/360 = 0.37)
    kinds: {person: 뱃지, flag: 국기, emblem: 휘장, photo: 사진, clip: 영상, cutout: 컷아웃, article: 기사, post: 게시물,
            primitive: 요소, backdrop: 배경, island: 아일랜드, press: 프레스, cascade: 사건, quote: 인용, inset: 인셋}   # backdrop = v5.1.0 D-0123 §3 — 회색 판 + [배경: id]
  band:                    # 화면 위 가운데 얇은 띠 — 배포 사고 방지 표식(모서리는 날짜만 규칙 유지)
    text: "콘티 판 · 검토용 · 배포 금지"
    font: sansb
    size: 11
    h: 17
    pad_x: 14
    baseline: 12.5
    bg: [0.62, 0.1, 0.12, 0.9]
    fg: [1.0, 1.0, 1.0, 1.0]
  missing_license: "권리 기록 없음 — 콘티 판"   # 권리 레지스트리(assets/rights_registry.json, 생성 자산)가 없을 때 엔딩 카드 license_ref 자리. 전편은 RightsError 그대로
  # 콘티 판 검사 프로파일 — 미디어·글꼴·정직성이 없으므로 건너뛴다(provenance animatic.checks_skipped, checks.json skipped).
  # 타이밍(shots)·자막(subtitles)·offscreen·stage_continuity·overlap·date·forbidden·genre_elements 는 그대로 돈다
  checks_skip: [glyphs, glyph_size, rights, media_upscaled, chart_honesty, series_limit_3, units_visible, as_of_visible, labels]
  cost_target_sec_per_300s: 180   # 5분 영상 콘티 판 = 4코어 3분 이내("저렴"의 정의, 실측은 reports/phaseG8/run_log.md)

catalog:                   # v7.4.0 back_and_forth D-0251 §1.1 — 카탈로그 판(catalog ← 그리스어 katalogos "목록으로 세어 적음"). `engine.render --catalog`
  # 전편 레이어 전부 + 왼쪽 위 라벨 층(지금 화면의 레지스트리 요소·실제로 그린 글꼴·표준 음성). 별도 산출물 — final.mp4 에 넣지 않는다(mux 가 표식을 보면 거부)
  profile: final             # config engine.output 프로파일 또는 별칭
  output: catalog.mp4        # out/catalog.mp4 (out/catalog_noaudio.mp4 + out/mix.f32). out/video_noaudio.mp4·final.mp4 는 건드리지 않는다
  preset: veryfast
  mp4_comment: "catalog — 카탈로그 판 · 검토용 · 배포 금지"
  sample_every_sec: 1.0      # out/catalog_frames.json 표본 간격(요소 표 tools/catalog_table.py 입력)
  label:                     # 480p 설계 px. 날짜 뱃지·자막과 교차하면 checks [catalog-label-overlap] hard
    font: monom
    size: 9.5                # layout_480p.min_font_px 와 같다
    pos: [10, 8]             # 글자 블록 좌상단
    max_w: 420
    alpha: 0.92
    color: [1.0, 1.0, 1.0, 1.0]
    plate: [0.0, 0.0, 0.0, 0.55]
    pad: 4
    line_gap: 12
    max_lines: 9               # D-0252 — 요소 줄은 자르지 않는다. 넘칠 때만 … +N, provenance catalog_run.truncated
    font_keys: [sans, serif, display, mono]
    sep: " · "
    indent: "  "
    more: "… +{n}"
    no_theme: "-"
    lines:
      stage: "무대 {stage} · 테마 {theme}"
      elements: "요소 {items}"
      fonts: "글꼴 {items}"
      voice: "음성 {backend} {style} ×{speed} · 끝 '{suffix}' {span}자 −{semitones}반음"
      voice_flat: "음성 {backend} {style} ×{speed}"

qa_checks:                 # 17 §3 — 결정적 사전 검사 임계
  # v7.4.0 D-0248(사용자 의견 UF-129 "그래프 넣는 씬에서 오른쪽 상단 아일랜드가 그래프를 가리지 않도록 해") — 패널(모든 kind)이 페이드 뺀 구간에 떠 있는 동안
  # 덮개 요소의 제자리 상자가 패널 상자(+panel_pad_px)와 겹치고 시간 겹침 > min_overlap_sec 이면 [card-over-panel] hard.
  # 패널 상자 = 화면 가운데 panel.min_screen_use 폭 × (제목 위 ~ 자막 띠 위). 날짜 배지·자막·패널 자체 뱃지(over_panel)는 제외
  # v7.4.0 D-0249(D260) — 서사 패널(timeline·precedent 등) = cover_types 만(골든 v3 의 패널 위 사진·영상 유지). 데이터 패널(series[].record 보유 —
  # dual_line·dots·versus·gantt) = cover_types + cover_types_on_data_panels("그래프를 가리지 않도록"). 사진·영상·컷아웃·뱃지는 화면 덮개로 본다(시간 겹침).
  # versus 위 뱃지는 badge_over_panel 이 보고(중복 없음)
  # v7.4.0 D-0250(사용자 의견 UF-130 "기사 조판과 자막 나래이션이 다름") — 기사 카드가 떠 있는 문장(시간 겹침 ≥ outlet_min_overlap_sec)에 매체 이름이
  # 나오는데 카드의 매체(미디어 레지스트리 url 도메인·credit_author)가 그 매체가 아니면 [article-outlet-mismatch] hard. 문장에 매체 이름이 없으면 통과.
  # 매체 id → names(원고에 쓰는 한글·영문 표기) · domains(url). 2차 보도 카드(가디언을 인용한 Kyiv Independent 등)는 가디언 문장에 두지 않는다
  outlet_min_overlap_sec: 0.5
  outlet_names:
    guardian: {names: [가디언, Guardian], domains: [theguardian.com]}
    reuters: {names: [로이터, Reuters], domains: [reuters.com]}
    ap: {names: [AP, AP통신, 에이피, Associated Press], domains: [apnews.com]}
    bloomberg: {names: [블룸버그, Bloomberg], domains: [bloomberg.com]}
    afp: {names: [AFP, 에이에프피, 아에프페], domains: [afp.com]}
    iea: {names: [국제에너지기구, IEA], domains: [iea.org]}
    yonhap: {names: [연합뉴스, Yonhap], domains: [yna.co.kr, yonhapnews.co.kr]}
    kyunghyang: {names: [경향신문, 주간경향, Kyunghyang], domains: [khan.co.kr]}
    hankyung: {names: [한국경제, 한경], domains: [hankyung.com]}
    aljazeera: {names: [알자지라, Al Jazeera], domains: [aljazeera.com]}
    kyiv_independent: {names: [키이우 인디펜던트, Kyiv Independent], domains: [kyivindependent.com]}
    united24: {names: [유나이티드24, UNITED24], domains: [united24media.com]}
    ukrainska_pravda: {names: [우크라인스카 프라우다, Ukrainska Pravda], domains: [pravda.com.ua]}
    korea_times: {names: [코리아타임스, Korea Times], domains: [koreatimes.co.kr]}
    joongang: {names: [중앙일보, 코리아중앙데일리, JoongAng], domains: [joongang.co.kr]}
    nyt: {names: [뉴욕타임스, New York Times], domains: [nytimes.com]}
    wsj: {names: [월스트리트저널, Wall Street Journal], domains: [wsj.com]}
    ft: {names: [파이낸셜타임스, Financial Times], domains: [ft.com]}
    bbc: {names: [BBC, 비비씨], domains: [bbc.com, bbc.co.uk]}
    cnn: {names: [CNN, 씨엔엔], domains: [cnn.com]}
  # v7.4.0 back_and_forth D-0251 §6.2-3·D-0252(사용자 의견 UF-135 ① "너무 차트만 나오기도 하고") — 차트·카드만 보이는 구간이 max_sec 를 넘으면 [chart-only-run] hard.
  # 모든 무대·장르, 콘티 판·프리뷰·전편 같은 키(C12-3). 지도 = 비차트(장소), timeline 무대의 시간축 = 차트. provenance chart_only_runs
  chart_only_run:
    max_sec: 12
    step_sec: 0.1
    chart_types: [panel, series, card]
    chart_island_kinds: [chart]
    chart_primitives: [dot_plot, statement_diff]
    neutral_types: [dip, island]   # island 는 kind 로만 판정(chart → 차트). 그 밖 아일랜드는 안의 사진·영상 이벤트가 따로 센다
    exempt_projects:   # v7.4.0 D-0271 — 회귀 기준만(새 영상·쇼케이스 면제 없음). 검사는 돌고 provenance chart_only_runs·chart_only_exempt 기록, hard 만 면제. 범위 = tests/test_chart_world.py 가 이 하나로 고정
      hormuz_korea: "v3 골든 회귀 기준(사용자 합격본 2026-09-28, 화소 골든 25컷) — 고치면 골든이 바뀐다"
    map_stages: [mercator]
  card_over_panel: {min_overlap_sec: 0.3, panel_pad_px: 4, cover_types: [card, cascade, article, quote, primitive],
                    cover_types_on_data_panels: [photo, clip, cutout, badge],
                    # v7.4.0 back_and_forth D-0259(UF-129 미보호 경로) — 시간축 주 무대: 틀 안 시리즈 레인(레코드가 그려지는 레인) 상자를
                    # 데이터 패널로 센다(사건 레인은 v7.4.0 D-0274 에서 삭제 — 핀은 값 레인 위). 기사·인용은 프레스 v2 화면 전체 규약이라 세지 않는다
                    timeline_frame_cover_types: [card, cascade, primitive, photo, clip, cutout, badge]}
  # v5.21.10 사용자 의견(2026-10-11 "기사 화면이 나왔는데 0.5초도 안 돼서 사라진다", D-0191 §1-2) — 기사(프레스 단독·페이드 뺀 글자 구간)·인용(페이드 뺀 구간)
  # 완전 노출 하한. 문장이 짧으면 연출이 다음 문장까지 늘리거나 앞당긴다. 검사 card_exposure hard
  card_full_exposure_min_sec: 2.5
  # v7.4.0 D-0229 §2.6(UF-113 "몇 척중 몇척은 제재 대상임을 그래픽으로") — 문장에 "N 척 중·가운데 M" 문형이 있는데 그 문장 구간에 dots·versus 패널·series 가 없으면 warning ratio_graphic
  ratio_patterns:
    - '(\d+|[일이삼사오육칠팔구십백천만]+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|스무|스물)\s*(척|곳|건|명|개|대|기)\s*(중|가운데)'
    - '(중|가운데)\s*(\d+|[일이삼사오육칠팔구십백천만]+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(척|곳|건|명|개|대|기)'
  ratio_graphic_kinds: [dots, versus]
  cutaway_full_types: [article, backdrop]   # v7.4.0 D-0229 §2.3(UF-110 "기사 나왔다가 지도 나왔다가 또 기사") — 전면 컷어웨이. 끝난 뒤 shot_grammar.shot_min_hold_sec 안에 다음 전면 = hard cutaway_churn(사진·영상은 상자 배치라 지도가 보인다)
  label_jump_px: 4.0   # v5.22.7 D209 — 경로 이름표가 보이는 중 한 프레임 사이 (이름표 가운데 − 가장 가까운 경로 점) 변화 상한, 넘으면 hard label_jump
  # v7.1.0 UF-99 D-0220 — 원칙: 카메라 검사는 화면에 그려진 뷰를 잰다(engine.camera.screen_track — 렌더와 같은 View).
  # 렌더 단계의 보정(무대 경계 클램프 등)이 카메라에 걸리면 실패한다 — 클램프는 안전망일 뿐 연출 수단이 아니다(hard camera_bounds).
  camera_bounds_rel_tol: 0.001   # 요청 궤적 − 화면 궤적 차이 ÷ w 상한(View 경계 여유 0.01 보다 넉넉, 반올림 오차만 허용)
  label_slot_sample_sec: 0.25   # v5.22.7 D210 — 경로 이름표 자리 고르기: 수명 전체를 이 간격으로 훑어 전 구간 비충돌 후보(없으면 겹치는 구간 흐림)
  # v5.21.14 사용자 의견(2026-10-11 "아덴에 보냈다는데 사우디 방면 선만 — 오해", "미사일 궤적 선이 없다", D-0195·D-0197) — 문장에 아래 동사와
  # 그 문장이 부르는 마커가 함께 있으면 그 마커에 닿는(끝점 endpoint_tol_deg 안) 경로가 문장 구간에 있어야 한다. 없음 = route_missing warning, 다른 경로만 보임 = route_missing_other hard
  route_missing:
    move_verbs: [보냈, 보내, 파병, 배치, 수송, 이동, 도착, 증파, 급파, 고립]   # 고립 = v5.22.4 UF-78(D124 ② 고립 표현엔 항로)
    attack_verbs: [공격, 발사, 타격, 요격, 폭격, 포격]
    endpoint_tol_deg: 0.6
  # v5.21.14 사용자 의견(2026-10-11 "지도에 예멘 쪽이 안 보인다", D-0199) — 문장이 부르는 나라(라벨 점)·마커가 문장 구간 내내 화면 밖이면 frame_missing warning,
  # 그 문장의 이동·공격 대상(위 동사 + 마커)이면 frame_missing_target hard
  frame_missing: {margin_px: 8, sample_sec: 0.5}
  # v5.22.0 사용자 의견 UF-08(2026-10-11 "반군과 정부군이 어떤 도시를 점령하고 탈환했는지 — 아무것도 안 나와서 뭔지 모르겠음", D-0200) — 전황 문장에
  # 지도 마커·경로가 하나도 없으면 battle_geo warning. UF-10("트럼프의 이미지") — 인물 이름이 나오는 문장에 쓸 수 있는 초상이 있는데 그 인물 뱃지·인용이 없으면 portrait_unused warning
  battle_geo:
    verbs: [점령, 탈환, 공세, 장악, 진격, 교전, 함락, 격퇴]
  overlap_core_elements: 0
  offscreen_clip: 0
  missing_glyphs: 0
  labels_per_frame_max: 18
  subtitle_lines_max: 2
  rights_missing: 0
  forbidden_components: 0
  # v3.6.0 D-0069 — 최소 글자(glyph_size, hard): 임계는 layout_480p.min_font_px(9.5, 09 §2 "최소 글자") 한 값을 참조(여기 다시 적지 않음).
  # 설계 px 로 판정(해상도 무관). 아래 역할로 그린 글자만 예외 — 역할 없는 글자는 예외가 아니다(기본 엄격).
  glyph_size_exempt:
    - end_card     # fullcards.draw_endcard — 엔딩 카드 전부(머리 8.5, 항목 9.2, 라이선스 7.8, 날짜·안내 7.8). 규칙 min_font_px 주석의 기존 예외
    - media_meta   # 권리·출처 메타(C9): layers/media.media_tag 7.5(PHOTO·VIDEO), media_caption 출처 줄 7.8, draw_article ARTICLE 7.5·날짜 8.5·메모 7.8,
                   # draw_cutout 출처 줄 8.5, layers/post 핸들 8.5·칩 7.5·원문 8·꼬리 7.8(18 §5)
  # v5.18.0 D-0161 §4(가이드 23 §7) — [map-contrast] 렌더 프레임의 합성 배경 대비. 필수 글자(마커 이름·부제·도시) 4.5 hard,
  # 경로 선 3.0 warning. 국가·바다·도 이름은 보조 질감(§7 "같은 대비로 올리지 않는다") — 측정표에만
