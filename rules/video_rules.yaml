    # 실측: hormuz 2패스(dynamic) 전 −1.50 → final −1.47(+0.03), taiwan_f1_music 전 −1.50 → −1.35(+0.15), 무음악 linear −2.27. 최대 0.15
    tp_codec_margin_db: 0.15
    sentence_rms_dev_db: 3.0               # D-0061 쟁점 2 A — 문장 RMS 가 평균에서 이만큼 넘게 벗어나면 warning(정규화는 하지 않음). hormuz 0건(편차 0.65dB)
    sentence_rms_window_sec: 0.02          # 문장 RMS: 이 길이 창의 RMS 중
