    push_in: {missile: 0.035, campaign: 0.03}   # 숏 안 느린 푸시인 비율(줌 범프 없음). 이동은 앞 숏의 푸시인 끝 상태에서 시작(멈칫 교훈, docs/handoff/22 §2.6)
    hold_min_sec: 1.0                            # 푸시인 분모 하한 max(이 값, 다음 숏 시작 − 이동 끝)
    move_min_sec: 2.4                            # 큰 줌(4배 안팎) 이동 하한(docs/handoff/22 §2.6) — 검사·스킬 안내용
  fade:
    open_sec: 1.0          # 첫 화면 검정에서 열림
    close_sec: 1.2         # 끝 화면 검정으로 닫힘
    black_min: 0.001       # 이 아래 검정 덮개는 그리지 않는다
    min_alpha: 0.01        # 이 아래로 흐린 요소는 그리지 않는다
    win_in: 0.5            # 라벨·태그 창 페이드(window fin·fout)
    win_out: 0.6
    note_in: 0.6           # 화면 아래 출처 줄
    note_out: 0.6
    end_dim_alpha: 0.92    # 엔딩 자료 카드 바탕 어둡게
    end_bg: [0.02, 0.025, 0.04]
    end_in_sec: 0.6
    date_in_t: 0.4         # 날짜 배지 등장 시작
    date_alpha: 0.95
    date_line_alpha: 0.9
    date_halo: 3
    date_hide_lead_sec: 0.2   # 날짜는 엔딩 카드보다 이만큼 먼저 물러난다(미사일 TOTAL−4.6 / 엔딩 −4.4, 천왕성 −5.2 / −5.0)
    date_hide_sec: 0.5
  text:                    # 글자 크기·후광(typography.text size·halo) — 코드에 리터럴 금지(test_sketch_no_literals a)
