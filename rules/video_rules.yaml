  lane_line_alpha: 0.14
  lane_line_w: 0.8
  lod:                     # 20 §6 — 화면 폭 w(일) 이 이 값보다 작으면 그 단위 눈금. 넓으면 연도
    quarter_below_w: 1500
    month_below_w: 420
    day_below_w: 45
