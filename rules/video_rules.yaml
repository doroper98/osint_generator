# rules/video_rules.yaml — 영상 규칙 SSOT (docs/handoff/15 §3 P3). 코드·프롬프트·린트·검증기가 모두 이 파일을 읽는다.
# 수치의 출처는 docs/handoff/{03,05,08,09,14}. 사용자 합격 값이므로 근거 없이 바꾸지 않는다.
schema_version: 1
rules_version: "2.0.0"

banned_phrases:            # 03 §2 — 정규식, 자막 텍스트에 적용. 하나라도 맞으면 린트 실패
  patterns:
    - '가지.{0,8}(화살|문제|흐름).{0,12}모인다'
    - '한\s?번에 흔들'
    - '세\s?겹'
    - '방향을 정한다'
    - '같은\s?자리로 돌아'
    - '로 읽으면'
    - '승부는'
    - '진짜 뉴스'
    - '계약서에'
    - '서\s?있는 자리'
    - '만 보면'
    - '로 읽힌다'
    - '말하지 않는\s?것'
    - '이것이 바로'
    - '핵심은 .{0,10}(이다|입니다)$'
    - '시장은 .{0,12}(을|를) 주목하고 있다'   # v4.4.0 — 20 §7 경제 해설 상투어(사람 승인 = back_and_forth D-0090 작업 1)
    - '의 향방이 관건'                        # v4.4.0 — 같음
    - '촉각을 곤두세우'                       # v4.4.0 — 같음
    - '지켜봐야\s?(하겠|할|겠)'                # v5.6.0 사용자 결정(2026-10-04) — 마무리 관전 권유 금지("끓어오르고 있습니다"처럼 단정, LLM-AP-016)
    - '귀추가 주목'                           # v5.6.0 — 같음
  candidates:              # 03 §2.1 추가 후보 — 사람 승인 후 patterns로 승격
    - '결국 .{0,12}의 문제다'
    - '의 시대가 열렸다'
    - '판이 바뀌었다'
    - '게임 체인저'
    - '라는 질문이 남는다'
  defect_classes:          # 새 문구 판단 기준(프롬프트 머리말에 삽입)
    - 수렴 은유
    - 과장된 동시성
    - 숫자 겹 은유
    - 예언형 결론
    - 회귀 수사
    - 해석 강요
    - 가짜 대구
    - 진짜 이유류 메타 발언

balance_principles:        # 03 §3 — 프롬프트 공통 머리말
  - 모든 수치에 출처(매체·날짜). 화면 카드에는 src 줄.
  - 주장은 귀속한다(밝혔습니다/보도했습니다).
  - 논쟁 사안은 양쪽을 같은 무게로, 출처와 함께.
  - 추정은 "추정"으로 표시. 출처 없는 차트는 "추정 · 출처 미기재" 태그.
  - 마무리는 앵커 브리핑 — 대상의 정체·지금 상황(확인된 사실)·긴장의 현재 상태를 단정하는 결론(v5.6.0 사용자 결정, "지켜봐야 하겠습니다" 금지, 예언·미확인 나열 금지, script_grammar).

opening:                  # v5.6.0 사용자 요청(2026-10-05 "지리를 잘 모르는 사람은 수바우키 회랑이 어디인지 인지하기 어렵다 — 전체 지도에서 해당 지역으로 천천히 들어가는 오프닝", RENDER-AP-016). 검사 opening_establish hard(연출 opening_exempt 사유로만 면제)
  min_w: 30                 # 첫 카메라 폭(경도 °) — 나라·주변국이 함께 보이는 폭
  max_sec: 25               # 이 시간 안에
  min_zoom: 2.5             # 첫 폭의 1/2.5 이하로 들어간다
  min_move_sec: 4.0         # 들어가는 이동은 4초 이상(천천히)
weapon_photo:             # v5.6.0 사용자 요청(2026-10-05 "무기체계가 나올 때는 웬만하면 실사 이미지", RENDER-AP-017) — 문장에 이름이 나오는데 그 문장 동안 사진·영상·컷아웃이 없으면 warning(권리 있는 실사가 없을 수 있다)
  terms: [이스칸데르, 오레시니크, 킨잘, 칼리브르, 지르콘, 사르마트, 토폴, 야르스, S-400, S-300, S-500, 패트리어트, 사드, THAAD, 하이마스, HIMARS, 에이태킴스, ATACMS, 토마호크, 타우러스, 스톰 섀도, 샤헤드, F-35, F-16, Su-35, Su-57, 레오파르트, 에이브럼스, K2 전차, K9 자주포, 천무]
route_frame:              # v5.6.0 사용자 지적(2026-10-04 "철도 훈련 장면의 철도 구간이 프레임 밖", RENDER-AP-012) — 다 그려진 경로 곡선이 화면 밖으로 이 비율 넘게 나가면 hard
  max_out: 0.25
source_note:              # v5.6.0 사용자 결정(2026-10-04) — 참조 출처(위키백과 등)는 내레이션에서 "~에 따르면"으로 읽지 않고, 그 문장 동안 화면 아래에 아주 작게 링크만(글자 크기 = end_card.version_stamp.size)
  publishers: [Wikipedia]   # sources.json publisher 가 이 이름으로 시작하면 참조 출처
  x: 12                     # 왼쪽 아래 — 설계 좌표(480p)
  y_from_bottom: 6
  alpha: 0.55
  prefix: "출처 · "
  spoken_names: [위키백과, 위키피디아]   # 사용자 결정 2026-10-04 "위키백과에 따르면·위키백과가 전했다 삭제" — 내레이션에 나오면 린트 오류
script_grammar:            # v5.5.0 사용자 결정(2026-10-02, 개정 2026-10-03 "막지 말고 양측을 밝혀라") — 원고 서술 규약. 프롬프트 {{RULES.script_grammar}}(script·genre_script), 린트가 같은 값으로 강제
  lines:
    - '논쟁 중인 주장(claims status disputed)은 숨기지 않고 양측이 한 말을 나란히 쓴다 — "러시아는 ~라고 주장했습니다. 반면 나토는 ~라고 부인했습니다." 말한 사람(귀속) 없이 한쪽 주장을 사실처럼 쓰지 않는다(린트 [disputed-claim] 오류). 양측 병기 자체가 논쟁 중임을 보여 준다.'
    - '출처마다 조금 다른 수치는 출처를 붙여 쓰거나("AP통신은 약 80km라고 보도했습니다") 숫자 없이 쓴다. 수치 자체가 쟁점의 핵심이면 양측 수치를 각각 출처와 함께 쓴다.'
    - '"엇갈립니다·아직 확인되지 않았습니다·불분명합니다·정해지지 않았습니다"처럼 내용 없이 미확인이라는 결론만 붙이는 서술을 내레이터 목소리로 쓰지 않는다 — 누가 무엇을 말했는지를 쓴다. 당사자가 그렇게 말한 것을 귀속해 전하는 것은 된다("나토는 근거가 확인되지 않은 주장이라고 반박했습니다")(린트 [uncertain-phrase] 오류).'
    - '문장과 문장 사이에 흐름을 만든다 — 앞 문장과의 관계를 드러내는 연결어로 문장을 시작해 잇고, 사실의 나열로 쓰지 않는다. 린트가 세는 연결어는 아래 목록이다(린트 [flow-sparse] 오류).'
    - '과거의 사건과 과거 시점의 상태는 과거형으로 쓴다(…했습니다·…였습니다·…있었습니다). 현재형은 지금(영상 날짜)도 사실인 것만 — 시청자가 과거 일을 지금 일로 헷갈린다(린트 [tense-present] 경고, 사용자 결정 2026-10-04).'
    - '위키백과 같은 참조 출처는 내레이션에서 "위키백과에 따르면"·"위키백과는 전했습니다"로 읽지 않는다 — 그 문장 동안 화면 아래에 작게 링크가 자동으로 붙는다(rules source_note). 뉴스 매체·기관의 귀속("~가 보도했습니다")은 그대로 쓴다.'
    - '연결어는 관계가 사실일 때만 쓴다 — 인과(그래서·따라서·그러므로)는 출처가 그 인과를 말할 때만, 대조(그렇지만·하지만·반면)는 실제로 다른 입장·결과일 때만. 근거 없는 인과 연결은 사실 왜곡이다.'
    - '마무리는 뉴스 앵커 브리핑처럼 맺는다(사용자 결정 2026-10-04) — ① 대상의 정체를 한 문장으로("1946년까지 쾨니히스베르크로 불렸던 칼리닌그라드." 명사로 끝내도 된다) ② 지금 상황을 확인된 사실로 ③ 지금 긴장의 상태를 확인된 사실로 단정하는 현재진행형 결론으로("핵 경고와 국경 요새화, 맞불 군사훈련이 맞물리며 … 긴장은 끓어오르고 있습니다" — kaliningrad 마무리 4문장, 사용자 합격 "아주 좋았어" 2026-10-05). 시청자에게 관전을 권하는 문장("…지켜봐야 하겠습니다"·"귀추가 주목됩니다")으로 끝내지 않는다(사용자 결정 2026-10-04 "지켜봐야겠습니다가 아니라 끓어오르고 있습니다", 금지 문구). 싱크탱크·지정학 포럼이 쓰는 용어(열전 hot war, 풀다 갭 등)는 누가 그렇게 불렀는지 귀속해 쓴다. 마무리는 3~4문장. "정리하면"으로 시작하지 않는다. 예언·추측·미확인 나열은 금지 그대로.'
    - '결과를 말하기 전에 그 전제를 먼저 말한다 — "포기·반환·철회·상실"을 말하면 그 전에 "보유·소유·지배"했던 사실과 시기를 쓴다(예: 1990년 독일의 영유권 주장 포기 앞에 쾨니히스베르크가 2차 대전 전까지 독일 도시였다는 문장). 연표를 건너뛰어 시청자가 "언제부터 그랬지?"라고 묻게 만들지 않는다(사용자 지적 2026-10-04, LLM-AP-017).'
  connectives: [그래서, 따라서, 그러므로, 그렇지만, 하지만, 그러나, 반면, 게다가, 또한, 그리고, 이어서, 이후, 그 뒤, 이에 대해, 이에, 그런데, 다만, 결국, 한편, 특히, 더욱이, 오히려, 물론, 즉, 이처럼, 이렇게, 그러면서, 동시에, 그 결과, 이 때문에, 이로 인해, 그러자, 그럼에도]   # v5.5.0 개정(2026-10-03) — 자연스러운 접속어 추가, 프롬프트에 이 목록 그대로 노출
  connective_min_ratio: 0.3     # 원고 전체에서 연결어로 시작하거나 앞 문장을 받는 문장의 비율 하한(미만 = [flow-sparse] 오류)
  connective_max_ratio: 0.7     # 상한(초과 = [flow-overuse] 경고 — 남발도 나열만큼 어색하다)
  uncertain_patterns: ["확인되지 않았", "확인된 바 없", "엇갈립니다", "엇갈린다", "엇갈렸습니다", "불분명합니다", "불분명하다", "알려지지 않았습니다", "알려지지 않았다", "정해지지 않았", "불확실합니다", "불확실하다"]   # 내레이터 목소리의 미확인 결론. 귀속 문장("~라고 반박했습니다")은 린트가 뺀다(v5.5.0 개정 2026-10-03)
script_schema:             # 02 §2.1 요약 — 프롬프트 예시는 tests/anti_inertia/test_prompt_schema_parity 로 검증
  sentence_fields: [date, text, tts, emphasis, sources, media]
  date_formats: ["YYYY", "YYYY.MM", "YYYY.MM.DD"]
  subtitle_max_lines: 2
  subtitle_wrap_px_480p: 700
  scene_count: free        # 고정 막 금지(G4-13)
  duration_limit_sec: null # 길이 제한 없음
  # v3.0.0(D42) → v3.2.0(D-0051 작업 7): 문장 검증 라벨은 코드가 **claims.json status** 로 계산한다(15 P8, SSOT 이동).
  # 문장 sources = claims.json claim_id. 한 문장이 여러 claim 을 인용하면 가장 약한 status(strength_order 앞쪽)가 라벨.
  # 키 = 18 §2 검증 status 4종(D-0052 D50 정의). verified·corroborated 는 라벨 없음.
  # v4.5.0(D85, D-0096): 이 표는 **기록용** — 화면 표기 없음(자막·패널·post 카드에 그리지 않는다). script_labels.json·provenance·린트 대조에만 쓰고, 화면에는 end_card.notice_unverified 한 줄(건수)만.
  labels:
    verified: null
    corroborated: null
    unverified: "<미검증>"
    disputed: "<논쟁>"          # v3.2.0 D-0054 — 양측 주장 대립(한쪽이 논파된 것처럼 읽히는 "<반박됨>" 정정)
  label_strength_order: [disputed, unverified, corroborated, verified]
  # v3.2.0 D-0051 작업 8 — unverified claim 을 인용하는 문장은 누가 말했는지 귀속한다(18 §3-3). 자막에 이 중 하나가 없으면 린트 경고
  attribution_markers: ["주장했", "주장합니다", "주장이", "올렸", "빗댄", "빗댔", "반박했", "부인했", "일축했", "규탄", "강조했", "경고했", "답했", "밝혔", "따르면", "전했", "말했", "발표했", "보도했", "주장하", "라고 했", "확인되지 않", "claimed", "claims", "said", "says", "called", "alleged", "according to"]   # "확인되지 않" = 미확인임을 스스로 밝히는 문장(e2e 실측). "보도했" = v4.10.0 D-0116(G4 보류 D84 — 매체 귀속 "~라고 보도했습니다"). 영어 = 검증 인용의 귀속 판정(D-0054 B, 대소문자 무시)

verification:              # v3.2.0 back_and_forth D-0052(D50) — 교차 확인 = 인용 대조. LLM 은 claim 후보·인용·stance, 판정은 코드(orchestrator/source_verify.py)
  quote_max_chars: 160     # 인용 상한(저작권상 짧게). 인용은 소스 본문의 연속 부분 문자열(공백 정규화 후) — 불일치 = 근거 폐기 + drops[]
  independent_min: 2       # supports 근거의 독립 origin(x_post=handle, article=publisher, document=issuer) 이 이 수 이상이면 corroborated
  reprint_markers: ["재인용"]   # 기사 note 에 있으면 독립 origin 에서 뺀다
  body_max_chars: 12000    # 검증 LLM 입력에 넣는 소스 본문 상한 — 넘으면 자르고 "(잘림)" 표시

tts_rules:                 # 03 §4·§5
  forbidden_chars_regex: '[0-9%~/:→()\[\]]'
  sino_numbers_no_inner_space: true       # TTS-AP-058
  native_count_units: [개, 명, 번, 살, 회]  # 고유어 수사
  sino_count_units: [개월, 건, 년, 원, 달러, 배럴, 척, 퍼센트]
  month_readings: {"6월": "유월", "10월": "시월"}
  abbreviation_policy: korean_expansion   # CENTCOM → 미군 중부사령부
  decimal_policy: repo_jjeom_no_space     # D6 확정(DECISIONS.md): 저장소 정책 "십삼쩜일"(TTS-AP-059) 유지, ElevenLabs 청취 후 최종 확정
  emphasis_must_be_substring: true
  alignment_sources: [edge_word_boundary, elevenlabs_timestamps]   # D34 — 단어 정렬 출처(at_word 정렬 경로). 등재 외 = 오류
  # v5.6.0 TTS-AP-075(사용자 시청 2026-10-04 "에이에프피 → 앞프", "씨에스아이에스 → 크시스") — 붙여 쓴 글자 이름 연속은 엔진이 한 낱말로 읽는다.
  # 합성 직전(script.lint.pronounce_tts) 등재 약어(acronyms.letters)·발음 사전 값 중 글자 이름만으로 된 연속을 띄운다("에이에프피" → "에이 에프 피").
  # 아무 한글 연속에나 적용하지 않는다 — '비디오'·'오디오' 같은 낱말이 깨진다.
  letter_names: [에이치, 더블유, 에이, 에프, 에스, 아이, 제이, 케이, 브이, 엑스, 와이, 제트, 비, 씨, 디, 이, 지, 엘, 엠, 엔, 오, 피, 큐, 알, 티, 유]
  # 약어 읽기 등재(사용자 결정 2026-10-04) — UN·NATO·USA 처럼 낱말로 굳은 것은 등재하지 않는다. 국내 뉴스가 알파벳과 국문 명칭을 함께 읽는 기관 = letters_and_name.
  # 원고 text 에 abbr 이 있으면 tts 에 letters(띄어쓰기 무관)가, letters_and_name 이면 name 도 있어야 한다(린트 tts-acronym 오류)
  acronyms:
    - {abbr: AFP, letters: 에이에프피, read: letters}
    - {abbr: AP, letters: 에이피, read: letters}
    - {abbr: CSIS, letters: 씨에스아이에스, name: 전략국제문제연구소, read: letters_and_name}
    - {abbr: EIA, letters: 이아이에이, name: 미국 에너지정보청, read: letters_and_name}
    - {abbr: IAEA, letters: 아이에이이에이, name: 국제원자력기구, read: letters_and_name}
    - {abbr: IEA, letters: 아이이에이, name: 국제에너지기구, read: letters_and_name}
    - {abbr: IMF, letters: 아이엠에프, name: 국제통화기금, read: letters_and_name}
    - {abbr: WHO, letters: 더블유에이치오, name: 세계보건기구, read: letters_and_name}
    - {abbr: WTO, letters: 더블유티오, name: 세계무역기구, read: letters_and_name}
    - {abbr: ICC, letters: 아이씨씨, name: 국제형사재판소, read: letters_and_name}
    - {abbr: IISS, letters: 아이아이에스에스, name: 국제전략문제연구소, read: letters_and_name}

# v3.0.0(back_and_forth D-0040 작업 8) — 옛 orchestrator/tts_lint(v0.16.0) 패턴·orchestrator/tts_pronounce 사전 경로를 규칙 파일로(16 §3, 15 P3).
# tts_risk: 발음 텍스트(tts, 없으면 text)의 TTS-위험 표기 → script.lint 경고 `tts-risk`. 목록 순서 = 보고 우선순위.
# roman_letters 는 covered_before_roman 종류가 이미 덮은 구간이면 생략. pronounce: 번들 어댑터(bundle/text)가 쓰는 음차 사전.
tts_risk:
  covered_before_roman:
  - url_email
  - file_path
  - version
  - unit_attached
  patterns:
  - kind: url_email
    regex: https?://\S+|[\w.+-]+@[\w.-]+\.\w+
    hint: URL/이메일은 음성에서 읽지 말 것 — 자막/화면으로. narration 에서 제거.
  - kind: file_path
    regex: '[A-Za-z]:\\\S+|/\w+/\S+|\b\w+\.(?:json|exe|xlsx|csv|png|mp4|txt|py|js|wav|mp3)\b'
    hint: 파일명/경로/확장자는 의미로 풀어서 ('해당 실행 파일' 등). narration 에서 제거.
  - kind: version
    regex: \bv(?:er)?\.?\s*\d+(?:\.\d+)+
    hint: 버전 표기는 '버전 일 점 이' 처럼 한국어로.
    ignore_case: true
  - kind: time_colon
    regex: (?<!\d)\d{1,2}:\d{2}(?!\d)
    hint: 시각 콜론(09:30)은 '아홉 시 삼십 분'처럼. 비율(1:1)은 '일대일'.
  - kind: date_sep
    regex: \b\d{4}\s*[.\-]\s*\d{1,2}\s*[.\-]\s*\d{1,2}\b
    hint: 날짜 점/하이픈(2026.05.19)은 '이천이십육년 오월 십구일'로.
  - kind: arrow
    regex: →|⟶|=>|->
    hint: 화살표는 '~에서 ~로'로 풀어서.
  - kind: range_tilde
    regex: \d\s*~\s*\d|\d\s*∼\s*\d
    hint: 물결 범위(3~5)는 '삼에서 오까지'로.
  - kind: thousands_comma
    regex: (?<!\d)\d{1,3}(?:,\d{3})+(?!\d)
    hint: 천단위 콤마(3,000)는 '삼천'처럼 한국어 수로.
  - kind: unit_attached
    regex: \d\s?(?:kg|km|cm|mm|kWh|MWh|Wh|mAh|Ah|Hz|kHz|GHz|ms|kbps|Mbps|ppm|°C|℃|°F)(?![A-Za-z])
    hint: 숫자+영문/기호 단위는 단위를 한국어로 ('18킬로미터', '백 킬로와트시').
    ignore_case: true
  - kind: slash
    regex: (?<=\S)/(?=\S)
    hint: 슬래시는 '와/또는/부터'로 풀거나 생략 (날짜·비율 포함).
  - kind: symbols
    regex: '[※▲▼△▽◆◇■□●○•◦#@±℃→←↑↓]'
    hint: 기호(※▲•#@ 등)는 풀어 읽거나 생략 ('참고로', '첫 번째' 등).
  - kind: roman_letters
    regex: '[A-Za-z]{1,}'
    hint: 'narration 에 로마자 금지 — 한국어 명칭/음차로 (예: USGS→''미국 지질조사소''). 영문은 caption 에만.'
  # v5.3.0 TTS-AP-071~073(사용자 시청 2026-10-02, valdai-2026 콘티 판) — 사전 적용 뒤 실제 합성 문자열에서 본다(script.lint `tts-spoken:*` 경고).
  spoken_patterns:
  - kind: glued_acronym
    regex: (?:에이|비|씨|디|에프|지|에이치|아이|제이|케이|엘|엠|엔|오|피|큐|알|에스|티|브이|더블유|엑스|와이|제트){2,}(?=통신|뉴스|방송|신문|그룹|전자|연구소)
    hint: 글자 이름으로 읽는 약어 뒤에 명사를 붙이면 엔진이 앞 음절을 삼킨다('에이피통신' → [피 통신], TTS-AP-071). 약어와 명사 사이를 띄운다('에이피 통신').
  - kind: glued_media_name
    regex: '[가-힣]{2,}(?:타임스|포스트|저널|헤럴드|트리뷴|가디언|텔레그래프)'
    hint: 외래어 매체명 붙여쓰기는 엔진이 엉뚱한 자리에서 끊는다('모스크바타임스' → [모스크 바타임스], TTS-AP-072). 고유명과 매체 종류 사이를 띄운다 — 발음 사전 등재.
  - kind: bare_parallel_names
    regex: (?:폴란드|리투아니아|러시아|우크라이나|벨라루스|미국|중국|이란|이스라엘|한국|북한|일본|대만) (?:폴란드|리투아니아|러시아|우크라이나|벨라루스|미국|중국|이란|이스라엘|한국|북한|일본|대만)(?![와과])
    hint: 하이픈 병렬(폴란드-리투아니아)을 공백으로만 바꾸면 엔진이 두 이름 사이·뒤에서 길게 쉰다(TTS-AP-073). 원고를 '폴란드와 리투아니아 사이'처럼 조사로 잇는다.
  - kind: particle_merge_seo
    regex: '[가-힣]에 서[가-힣]'
    hint: 조사 '에' 뒤에 '서'로 시작하는 낱말이 오면 엔진이 '에서'로 묶어 읽는다('나토에 서면 메시지' → [나토에서면 / 메시지], TTS-AP-074). 어순을 바꾸거나('서면 메시지를 나토에') 다른 낱말로('협정에 서명' → '협정을 맺었다').
  - kind: modifier_name_group
    regex: (?:나머지|다른|모든|여러) (?:나토|유럽연합|유엔|미국|러시아|중국) [가-힣]+
    hint: 관형어 + 고유명 + 명사는 엔진이 관형어와 고유명을 한 덩이로 묶고 그 뒤에서 쉰다('나머지 나토 회원국' → [나머지나토 / 회원국], TTS-AP-076). '나토의 다른 회원국'처럼 고유명을 앞에 두고 '의'로 잇는다.
  - kind: dest_noun_chain
    regex: '[가-힣]+행 (?:러시아|폴란드|리투아니아|벨라루스|미국|중국|우크라이나|나토) [가-힣]+ [가-힣]+'
    hint: …행 + 나라 + 명사 + 명사 처럼 관형 명사를 셋 이상 늘어놓으면 엔진이 나라 이름 뒤에서 길게 쉰다('칼리닌그라드행 러시아 통과 열차' → [러시아 (쉼) 통과 열차], TTS-AP-077). '칼리닌그라드로 가는 러시아 열차'처럼 서술로 푼다.
  - kind: short_name_after_modifier
    regex: (?:인근|근처|부근) [가-힣]{1,3}(?=,)
    hint: 인근 + 짧은 고유명 + 쉼표는 엔진이 '인근'과 고유명을 한 낱말로 묶고 쉼표에서 쉰다('리투아니아 인근 고자,' → [인근고자 (쉼)], TTS-AP-078). '리투아니아와 가까운 고자 훈련장,'처럼 고유명 뒤에 일반 명사를 붙인다.
  - kind: name_org_title
    regex: '[가-힣]{2,} (?:나토|유엔|유럽연합) (?:대변인|사무총장|대사|의장)'
    hint: 외국 인명 + 기관명 + 직함은 엔진이 인명 끝과 기관명을 붙여 읽는다('앨리슨 하트 나토 대변인' → [하트나토], TTS-AP-079). '나토의 앨리슨 하트 대변인'처럼 기관을 앞에 두고 '의'로 잇는다.
  - kind: op_name_noun_run
    regex: (?:센트리|실드|쉴드|포스|스톰|이글) (?!활동|작전|훈련)[가-힣]+ [가-힣]+
    hint: 외래 작전·활동 이름 바로 뒤에 조사 없이 명사를 이으면 엔진이 이름 끝과 다음 명사를 붙인다('발트 센트리 해저 기반시설' → [센트리해저 / 기반], TTS-AP-081). '발트 센트리 활동으로 … 해저 기반시설을'처럼 이름 뒤에 조사·일반 명사를 둔다.
pronounce:
  dict_path: assets/pronounce/pronounce_ko.json

direction_grammar:         # v4.7.0 back_and_forth D-0104 D2(a) — 연출 문법(사람 승인 = D-0104, 15 P11). 연출·수정 프롬프트 {{RULES.direction_grammar}}
  - 인물이 발언 주체인 문장("~는 ~라고 말했습니다")에는 그 인물의 초상 뱃지(엔티티 레지스트리에 초상이 있을 때) 또는 그 발언을 전한 기사 카드(미디어 레지스트리 기사)를 건다. 텍스트 카드만으로 대신하지 않는다.
  - 원고 문장에 media 큐가 있으면 그 미디어를 우선 쓴다.
  - 경계선(군사분계선·국경·NLL 등)을 route 로 그리지 않는다 — 지도 경계선이 이미 있다(v4.7.0 D-0107, 검사 [boundary-as-route] hard).
  - 화면에 조약·협정·작전 같은 고유 명칭이 나오는데 내레이션이 그 뜻을 풀지 않으면, 연도 카드(precedent) 패널의 footnote(1~2줄·근거 claim 필수)로 짧게 설명한다 — 자막 구역 위, 카드 아래(v5.6.0 사용자 요청 2026-10-05 "해결 조약 풋노트", 검사 [panel-footnote]).
  - 연도 단위 경과(수십~수백 년)는 연도 카드(precedent, 4장 이하)로, 월 눈금 타임라인(timeline)은 36개월 이하만(v5.6.0 RENDER-AP-011, 검사 [timeline-span]).
  - 문장의 주제가 되는 경로·지역은 그 문장 카메라 프레임 안에 둔다. 한 장면에서 주제 지역이 크게 바뀌면 문장 경계에 카메라 이동 1회(v5.6.0 RENDER-AP-012, 검사 [route-frame]).
  - 오프닝은 넓은 지도(나라와 주변국이 함께 보이는 폭)에서 시작해 대상 지역으로 천천히(4초 이상) 들어간다 — 지리를 모르는 시청자도 "유럽의 어디쯤"인지 먼저 잡는다(v5.6.0 사용자 요청, rules opening, 검사 [opening-establish]).
  - 고립·봉쇄·우회를 말할 때는 막힌 길과 실제로 쓰는 길을 함께 그린다 — 육로(막힘)와 항로(예 — 러시아 본토 → 발트해 공해 상공 → 칼리닌그라드, 리투아니아·폴란드 영공 우회)를 각각 경로로. 항로는 점선 route(ship false)에 "항로" 이름표(v5.6.0 사용자 요청 2026-10-05).
  - 무기체계 이름이 나오는 문장에는 그 무기의 실사 사진(권리 기록된 자료사진 — Commons PD·CC, 정부 공개 자료)을 우선 띄운다. 큰 숫자 카드만으로 끝내지 않는다(v5.6.0 사용자 요청, rules weapon_photo, 검사 [weapon-photo] warning).
  - 국기 뱃지는 그 나라 땅·바다·화면 가장자리에 둔다 — 다른 나라 땅 위에 두면 시청자가 그 땅을 그 나라 것으로 오해한다(예 — 리투아니아 위 러시아 국기). 슬롯 자리가 남의 땅에 걸리면 슬롯을 바꾼다(v5.6.0 사용자 지적, 검사 [flag-territory]).
  - 기사 조판(article)·실사(photo·clip·cutout)는 입력의 미디어 레지스트리 후보에서 고른다. 인용·기사·실사 중 0건으로 두는 항목이 있으면 direction.yaml media_note 에 이유를 한 줄 적는다 — 게이트 ② 미디어 요약에 보인다(막지 않는다, v5.6.0 사용자 결정 2026-10-05, PIPELINE-AP-019).
  - 양측 비교(versus) 패널이 떠 있는 동안에는 인물 뱃지를 띄우지 않는다 — 발언자는 기둥 제목이 밝힌다. 뱃지가 한 자리에 번갈아 뜨면 누구 의견인지 헷갈리고 기둥 글자를 가린다. 인물 소개는 패널 앞 문장에서 끝낸다(v5.6.0 사용자 지적, 검사 [badge-over-panel]).
  - 위치가 공개되지 않은 사건 지점은 marker sub 에 '좌표 비공개'(또는 '근사 위치')를 쓴다 — 지도 좌표는 근거가 있을 때만 사건 지점으로 보인다(v4.7.0 D-0107).
  - 청와대·대통령실(한국)이 발언·행위 주체인 문장에는 휘장 뱃지(kind emblem, img cheongwadae)를 건다. 대통령 개인이 주체면 초상 뱃지, 둘 다면 초상을 우선한다(v4.8.0 D-0109, 사용자 결정 D98).
  - 주제가 지리·이동·위치가 아니면(정책·금리·기업·법정·발언 중심) 지도 무대를 쓰지 않는다 — backdrop 무대 + 아일랜드(차트·개념도·사진·기사·패널)로 구성한다. 지도가 중심이면 mercator(v5.1.0 D-0123 §2). 장르 기본 무대와 다르게 고르면 stage_reason 에 이유를 적는다.
  - 보도를 인용하는 카드(출처가 매체 — 통신사·신문·방송)는 카드가 아니라 기사(article) 이벤트로 건다 — 프레스 규약 v2(가운데·세리프 헤드라인). backdrop 무대에서는 주 아일랜드가 항상 하나 보이고 카드만 있는 구간은 짧게 둔다(아래 사진 배경 무대 절, v5.2.0 D-0129, 검사 [backdrop-main-missing] hard).
  - 시간축 무대는 축 스케일(w)을 장면 단위로 고정한다 — 확대·축소는 영상당 몇 번뿐이고 그 밖은 중심 이동(pan)만(v5.1.0 D-0121 §A, 검사 [timeline-rescale] hard, 수치는 아래 축 스케일 절).
  - 지도 고정 구간에서 날짜가 있는 사건이 셋 이상 이어지면(협상 경과·발표 순서) 카드를 늘어놓지 않고 **겹침 카드(cascade) 하나**로 건다 — 지금 문장의 사건만 앞에 크게, 언급이 지나간 사건은 뒤로 물러나 겹친다. 사건마다 국기·날짜·제목 한 줄, 부제는 선택. 같은 순간 cascade 는 하나, 카드와 같이 두지 않는다(v5.3.0 D-0139, 사용자 결정 D116·D117, 검사 [cascade-*] hard).
  - '인물의 **직접 인용**(원문 기사에서 따옴표로 확인된 발언 = 입력의 "인용 후보" 목록, v5.6.0)은 카드가 아니라 **인용(quote)** 으로 건다 — 원문(영어 등)은 뜻을 바꾸지 않고 한국어로 옮긴다 — 초상(pid, 없으면 flag) + 화면 가운데 따옴표 인용문 + 아래 작은 이름·직함·매체·날짜. 기자의 요약·간접 화법("~라고 말했다"를 줄인 문구)에는 따옴표를 쓰지 않는다 — 카드(quote: false). A 의 인용과 그에 맞서는 B 의 인용을 함께 보일 때는 같은 순간 A = pos upper(왼쪽 위), B = pos lower(오른쪽 아래). 인용 중에는 같은 인물의 지도 뱃지를 겹쳐 두지 않는다(v5.4.0, 사용자 결정 2026-10-02, 검사 [quote-overflow]·[subtitle-overlap] hard).'
  - '가격·추이·통계 문장에는 알맞은 차트를 건다 — 시간에 따른 변화 = 선 차트(panel dual_line, 출처 있는 실측값, 촘촘한 날짜 라벨은 x_label_rotate), 전체 대비 비율 = 도트(panel dots), 단일 지표 = 큰 숫자 카드(bigs). 값은 출처가 있는 것만, 주장 수치는 주장 주체를 패널 문구에 적는다(v5.4.0, 사용자 지시 2026-10-02, 검사 정직성 4종 hard).'

shot_grammar:              # 05 §2
  camera_moves_per_scene_max: 1
  shot_min_hold_sec: 6.0
  move_dur_sec: [2.6, 3.4]
  # v5.5.0 사용자 지적(2026-10-02 "지도 이동 중간에 방향이 살짝 틀어진다", RENDER-AP) — 이동과 줌이 함께일 때 중심을 진행률(e)에 비례로,
  # 폭을 로그로 움직이면 지도 위 점들의 화면 경로가 휘는 곡선이 된다(흐름 방향이 이동 중 돈다). fixed_point = 중심을 폭 w 에 비례해 움직여
  # 한 고정점을 중심으로 한 확대·축소 + 평행이동(닮음 변환)이 되게 한다 → 모든 점이 직선으로 흐른다. 폭이 거의 같으면(순수 이동) linear 와 같다.
  move_path: fixed_point
  move_lead_sec: [0.6, 1.2]
  dip_total_sec: 1.0
  dip_max_per_sec: 90      # 90초당 1회 이하
  dip_alpha_peak: 0.93
  zoom_bump: false
  drift: {amount: 0.03, tau_sec: 9.0}
  ending_pullback: {w_from: 88, w_to: 96, dur_sec: 9.0}
  auto_transition: {dip_if_dist_over_w: 2.5, dip_if_w_ratio_over: 6.0}
  scene_attach_lead_sec: 1.5   # 문장 시작 1.5초 전 카메라 키까지 그 문장의 장면 숏(이동 선행, 6.9 checks 값)
  w_guide: {continental_route: [88, 96], ocean: [60, 72], region: [20, 30], strait: [12, 16], country: [6, 8], metro: [3, 5], city: 2.5}

pacing:                    # v4.11.0 back_and_forth D-0118 §1(사용자 위임 D103) — 정적 구간. 뷰 전환이 주 도구가 아니다: 같은 뷰 안의 '동기 있는 변화'(원고가 준다, P8)
  static_window:           # checks static_window(warning) `[static-window] t0-t1 changes=n` · provenance pacing.static_windows[] · 콘티 판도 같은 검사
    window_sec: 45         # 지도 무대(전면 카드·패널 덮개 밖)의 어떤 45초 창이든
    min_changes: 3         # change_kinds 이벤트 등장(t0)이 3개 미만이면 경고
    change_kinds:          # 레지스트리 이름(registries.event_types) + camera(카메라 키 t>0 — shot_grammar 안의 이동·컷·dip)
      - marker             # 마커·라벨 등장
      - route              # 관계선 하나
      - badge              # 뱃지·국기·휘장 등장
      - panel              # 패널 등장
      - card               # 카드 등장
      - photo              # 미디어
      - clip
      - cutout
      - article
      - post
      - country            # 강조·하이라이트(국가)
      - boom               # 강조(타격 링)
      - camera
    creep: {enabled: true, w_ratio: 0.96, min_window_sec: 45}   # 느린 푸시인 — 표시된 창에서만 w 를 창 길이에 걸쳐 4 % 선형 축소, 창 뒤 유지(다음 숏 이동이 흡수). shot_grammar.drift 와 곱한다
    ladder: "같은 뷰가 {window_sec}초를 넘으면 뷰를 바꾸지 말고 문장의 내용을 따라 ① 마커·라벨 등장 ② 관계선 하나 ③ 뱃지·카드 ④ 강조 ⑤ 그래도 없으면 숏 이동 순으로 변화를 준다. 이유 없는 카메라 이동 금지. 검사 [static-window]: 지도 무대의 어떤 {window_sec}초 창이든 변화({change_kinds})가 {min_changes}개 미만이면 경고한다. 표시된 창에는 엔진이 느린 푸시인(창 길이에 걸쳐 w × {w_ratio})을 건다 — 연출이 줌을 넣지 않는다."

stage:                     # v4.1.0 D-0076 작업 5·D-0077 — 무대 연속성(docs/handoff/20 §2.2·§12 관성 체크, GOAL G3-17). checks stage_continuity(hard)
  max_secondary: 1         # 영상의 주 무대 1 + 보조 무대 이 수 이하(20 §2.2-1)
  continuity:
    max_switches: 2        # 무대가 바뀌는 지점 수 상한 — 보조 무대에 한 번 들어갔다 나오기(20 §2.2 "짧은 삽입"). 넘으면 장면마다 새 캔버스(슬라이드)

camera:                    # v3.3.0 D-0056 — 카메라 자동화 보조(05 §7). 전환 임계는 shot_grammar.auto_transition(05 §7-2, 한 곳)
  framing:                 # frame_points — 장면 장소가 전부 보이는 최소 w 와 중심(05 §2.1·§7-1). px 는 480p 기준(09 §2 스케일 k = H/480)
    margin_px: 12          # 화면 가장자리 여백(좌우·아래 자막 위)
    top_px: 8              # 위 여백(날짜 배지는 예약 영역 상자로 따로 피한다)
    w_min: 2.5             # 05 §2.2 시가지
    w_max: 96              # 05 §2.2 대륙 간 항로
    w_steps: 64            # w_min~w_max 로그 등간격 후보 수
    center_grid: 9         # 가능한 중심 구간 안 격자(예약 영역 회피 탐색)
    date_reserve_chars: 8  # 날짜 배지 예약 폭 = 글자 크기 × 8(“2026.03.02” 모노 폭 상한)
    cover_samples: 5       # 숏이 전면 카드·패널에 덮였는지 볼 시각 수
    verify_rounds: 8       # 제안 → 실제 카메라 경로(이동·드리프트) 검증 → 화면 밖 숏 w 키우기 반복 상한
    path_w_step: 1.12      # 검증에서 화면 밖이 나온 숏의 w 배율
    context_w_min:         # D-0058 — 숏 분류(현재 카메라 w 가 속한 shot_grammar.w_guide 구간, 사이 값은 바로 아래 구간) → 제안 w 하한. 키 = w_guide
      continental_route: 88   # v3 route 30.8 w 90 · review 161.2 w 92 · now 254.6 w 90 (w_guide 88~96 하한)
      ocean: 60               # v3 실측 숏 없음 — w_guide 60~72 하한
      region: 20              # v3 open 23.2(route_0 호르무즈 한 점) w 24 (w_guide 20~30 하한)
      strait: 12              # v3 war 48.0 w 14 (w_guide 12~16 하한)
      country: 6              # v3 open 0.0 w 6.4 · decision 241.8 w 6.4 (w_guide 6~8 하한)
      metro: 3                # v3 debate 210.9(대사관 한 점) w 3.4 (w_guide 3~5 하한)
      city: 2.5               # w_guide city 2.5 = camera.framing.w_min
    marker_px: {up: 14, down: 26, side: 60}      # 마커 점 + 라벨(한 줄) 여유
    badge_px: {up_factor: 2.2, down_px: 44, side_factor: 1.4}   # 뱃지: 위 = R×2.2(머리), 아래 = 이름표 44px(05 §2.1, layout badge 값과 같은 뜻)
    point_px: {up: 10, down: 10, side: 10}       # 그 밖(컷아웃 기준점·경로 꼭짓점)

media:                     # v2.5.5 D-0037(D38) — 14 §10.1 밀도 경고. v3 실측: 292.4초 7개 = 41.8초당 1개, 60초 창 최대 3개(56.8초) → 40초 창 최대 2개
  density:
    per_item_sec: [40, 60]
    per_scene_max: 1
    scene_exempt_kinds: [article]
    no_same_kind_adjacent_scenes: true
    window_sec: 40
    window_max: 2                         # 40초 안 3개(기사 제외)부터 경고
    window_exempt_kinds: [article]

  flickr:                  # v4.4.0 D-0090 작업 4 — 기관 공식 Flickr(연준 이사회 등) 사진. 사진 페이지의 license 번호를 코드가 읽어 이 목록 밖이면 받지 않는다(07 §3.2·20 §8, C9)
    licenses_allowed: {"8": United States Government Work, "9": Public Domain Dedication (CC0), "10": Public Domain Mark}
    size_suffix: b         # 받을 크기(_b = 긴 변 1024)

media_beats:               # 14 §10
  kinds: [photo, clip, cutout, article, post]
  photo_show_sec: [4, 8]
  clip_show_sec: [3, 6]
  file_photo_label_required: true         # "자료사진 · 연월"
  caption_credit_required: true
  ai_generated_forbidden: true            # G4-10, 14 §2.2
  casualty_identifiable_forbidden: true
  credit_formats:                         # D-0036 — 화면 출처 줄은 레지스트리 필드로만 조립(연출이 문자열을 주면 모델 오류)
    photo: "{file_note} · {credit_author} · {license}"
    video: "{file_note} · {credit_author} · {license}"
    cutout: "{file_note} · {credit_author}"
  registry: assets/media/media_registry.json
  triggers:                               # 14 §10.2 — 문장 내용 → 형태 제안(suggest_media, 제안만 P8)
    clip: [공습, 타격, 발사, 나포, 충돌, 폭격, 격추]
    photo: [회담, 발표, 현장, 부대, 시위, 경계, 파병, 장병]
    cutout: [초계기, 구축함, 미사일, 전투기, 함정, 항공기, 잠수함, 드론]
    article: [보도했습니다, 보도했다, 기고, 사설, 보도에 따르면]
  caption_bar_px: 42

placement:                 # v3.1.0 D-0047 작업 5 — 배치 슬롯(17 §2 `place:`). 좌표 계산은 코드(engine/placement.py) — 연출 LLM 은 픽셀을 다루지 않는다
  # 연출이 place·x·y·w 를 안 준 사진·영상의 기본 슬롯(14 §10.3-5, v3 합격 좌표 — 옛 media_beats.placement 를 옮김)
  auto_media:
    clip: {map: map_left, panel: panel_center}
    photo: {map: map_right_low, panel: panel_gap}
  # box = 화면 상자 [x, y, 폭](854×480 설계 좌표, 사진·영상) / point = 화면 점 [x, y] → 이벤트 시작 순간 카메라로 경위도 역투영(뱃지·컷아웃·마커)
  # card = 카드 세로 위치(null = 렌더러 기본 panels.cards.y). 패널은 화면 가운데 고정이라 슬롯이 없다
  # v4.4.0 D-0093 — 무대 종류별 자리 바꾸기: 그 무대에서 이 종류의 이벤트는 연출이 준 지도 슬롯(map_*)·자동 슬롯 대신 이 슬롯(코드가 정한다, P8)
  # v4.8.0 D-0104 D2(c) — panel: 패널이 떠 있는 순간(t0) 시작하는 뱃지는 지도 슬롯(map_*) 대신 패널 위 화면 고정 자리(dmz_mine M7 — 지도 뱃지가 패널에 가렸다).
  # 무대 이름이 아니라 "패널 장면" 이다. 시간축 무대 자리보다 먼저 본다
  stage_slots:
    timeline: {badge: timeline_badge, photo: timeline_photo, clip: timeline_photo}
    panel: {badge: panel_badge}
  slots:
    map_left:        {kinds: [clip, photo], box: [40, 150, 300]}      # v3 clip_map
    panel_center:    {kinds: [clip, photo], box: [207, 112, 440]}     # v3 clip_panel
    map_right_low:   {kinds: [photo, clip], box: [560, 196, 262]}     # v3 photo_map
    panel_gap:       {kinds: [photo, clip], box: [292, 138, 280]}     # v3 photo_panel
    map_center:      {kinds: [badge, cutout, marker], point: [427, 240]}
    map_upper_left:  {kinds: [badge, cutout, marker], point: [190, 150]}
    map_upper_right: {kinds: [badge, cutout, marker], point: [660, 150]}
    map_lower_left:  {kinds: [badge, cutout, marker], point: [190, 290]}   # v5.3.1 사용자 지적(2026-10-02) — 330 은 solo R 56 이름·역할(아래 +102)이 두 줄 자막(≈402)과 겹쳤다(checks subtitle_overlap). 290 → 아래 끝 392
    map_lower_right: {kinds: [badge, cutout, marker], point: [660, 290]}   # v5.3.1 같은 이유(330 → 290)
    card_right:      {kinds: [card, primitive], card: null}   # primitive = v4.2.0 D-0081 작업 5(무대 무관 오버레이, 카드와 같은 슬롯)
    # v4.4.0 D-0093 — 시간축 무대 자리. 왼쪽 55%(레인 이름·출처·기준 시점 줄)와 오른쪽 축 값 자리(axis_zone_px)를 피한다
    # v4.8.0 D-0111 — solo R 56 상자(머리 2.2R 위 ~ 이름·역할 46px 아래, 원+그림자 ±63): x 640 → 577~703 — 55% 열(470) 오른쪽, 끝점 값 라벨(~760~)·축 값 자리(790~) 왼쪽
    # y 186 → 63~288: 레인 영역(area_top 60 ~ area_bottom 380) 안·날짜 배지 상자(y ≤ 50) 아래. 옛 [780, 118] 은 solo 에서 위로 잘렸다(top −5)
    timeline_badge:  {kinds: [badge], point: [640, 186]}
    timeline_photo:  {kinds: [photo, clip], box: [540, 196, 240]}     # 레인 오른쪽 아래 — 카드 자리(card_right, y 70~) 아래·왼쪽 레인 이름 열(55%)·오른쪽 축 값 자리(axis_zone_px) 밖
    # v5.2.0 back_and_forth D-0132(A) — backdrop 무대 전용 사진 자리(left 차트 아일랜드 x 24~564 와 함께). 카드 예약 구역(x ≥ 594, y 70~200) 아래·
    # 자막 구역(y 410) 위·left 상자 오른쪽 끝 564 밖. 폭 236 → 16:9 + 캡션 바 42 = y 212~387. stages = 이 무대에서만(다른 무대 = 배치 오류, P10).
    # 사용자 합격 값 아님(480p 시감 뒤 조정 가능)
    backdrop_right_low: {kinds: [photo, clip], box: [594, 212, 236], stages: [backdrop]}
    # v4.8.0 D-0104 D2(c) — 패널 위 인물 뱃지(화면 고정, 패널 층 위에 그린다). 동시에 떠 있는 n 번째 뱃지 = n 번째 점. 모자라면 오류.
    # y 300: solo R 56 상자(머리 2.2R 위 ~ 이름·역할 46px 아래) = y 177~402 — 자막 구역(y≥410) 밖. 왼쪽 먼저(카드 자리 x≥594 를 피함)
    panel_badge:     {kinds: [badge], screen: [[96, 300], [758, 300]]}
    # v3.2.0 D-0050 NB9 — 패널(타임라인 등) 위 미디어: 그 순간 패널이 차지한 상자(engine.placement.OCCUPIED)·자막·날짜를 피하는 첫 후보.
    # 후보 [x, y] = 제목·부제(y≤96) 아래 네 귀퉁이. 모두 막히면 오류(조용히 겹치지 않는다, P6)
    clip_panel_side:
      kinds: [clip, photo]
      beside_panel: {w: 190, gap_px: 4, candidates: [[630, 102], [566, 102], [24, 102], [630, 296], [24, 296]]}

hud:                       # 09 §5 — 모서리에는 날짜만
