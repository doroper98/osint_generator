# rules/video_rules.yaml — 영상 규칙 SSOT (docs/handoff/15 §3 P3). 코드·프롬프트·린트·검증기가 모두 이 파일을 읽는다.
# 수치의 출처는 docs/handoff/{03,05,08,09,14}. 사용자 합격 값이므로 근거 없이 바꾸지 않는다.
schema_version: 1
rules_version: "2.0.0"

banned_phrases:            # 03 §2 — 정규식, 자막 텍스트에 적용. 하나라도 맞으면 린트 실패
  patterns:
    - '가지.{0,8}(화살|문제|흐름).{0,12}모인다'
    - '한\s?번에 흔들'
    - '세\s?겹'
    - '방향을 정한다'
    - '같은\s?자리로 돌아'
    - '로 읽으면'
    - '승부는'
    - '진짜 뉴스'
    - '계약서에'
    - '서\s?있는 자리'
    - '만 보면'
    - '로 읽힌다'
    - '말하지 않는\s?것'
    - '이것이 바로'
    - '핵심은 .{0,10}(이다|입니다)$'
  candidates:              # 03 §2.1 추가 후보 — 사람 승인 후 patterns로 승격
    - '결국 .{0,12}의 문제다'
    - '의 시대가 열렸다'
    - '판이 바뀌었다'
    - '게임 체인저'
    - '라는 질문이 남는다'
    - '시장은 .{0,12}(을|를) 주목하고 있다'   # 20 §7 경제 해설 상투어 후보
    - '의 향방이 관건'
    - '촉각을 곤두세우'
  defect_classes:          # 새 문구 판단 기준(프롬프트 머리말에 삽입)
    - 수렴 은유
    - 과장된 동시성
    - 숫자 겹 은유
    - 예언형 결론
    - 회귀 수사
    - 해석 강요
    - 가짜 대구
    - 진짜 이유류 메타 발언

balance_principles:        # 03 §3 — 프롬프트 공통 머리말
  - 모든 수치에 출처(매체·날짜). 화면 카드에는 src 줄.
  - 주장은 귀속한다(밝혔습니다/보도했습니다).
  - 논쟁 사안은 양쪽을 같은 무게로, 출처와 함께.
  - 추정은 "추정"으로 표시. 출처 없는 차트는 "추정 · 출처 미기재" 태그.
  - 마무리는 예언 대신 미정 사실.

script_schema:             # 02 §2.1 요약 — 프롬프트 예시는 tests/anti_inertia/test_prompt_schema_parity 로 검증
  sentence_fields: [date, text, tts, emphasis, sources, media]
  date_formats: ["YYYY", "YYYY.MM", "YYYY.MM.DD"]
  subtitle_max_lines: 2
  subtitle_wrap_px_480p: 700
  scene_count: free        # 고정 막 금지(G4-13)
  duration_limit_sec: null # 길이 제한 없음

tts_rules:                 # 03 §4·§5
  forbidden_chars_regex: '[0-9%~/:→()\[\]]'
  sino_numbers_no_inner_space: true       # TTS-AP-058
  native_count_units: [개, 명, 번, 살, 회]  # 고유어 수사
  sino_count_units: [개월, 건, 년, 원, 달러, 배럴, 척, 퍼센트]
  month_readings: {"6월": "유월", "10월": "시월"}
  abbreviation_policy: korean_expansion   # CENTCOM → 미군 중부사령부
  decimal_policy: repo_jjeom_no_space     # D6 확정(DECISIONS.md): 저장소 정책 "십삼쩜일"(TTS-AP-059) 유지, ElevenLabs 청취 후 최종 확정
  emphasis_must_be_substring: true
  alignment_sources: [edge_word_boundary, elevenlabs_timestamps]   # D34 — 단어 정렬 출처(at_word 정렬 경로). 등재 외 = 오류

shot_grammar:              # 05 §2
  camera_moves_per_scene_max: 1
  shot_min_hold_sec: 6.0
  move_dur_sec: [2.6, 3.4]
  move_lead_sec: [0.6, 1.2]
  dip_total_sec: 1.0
  dip_max_per_sec: 90      # 90초당 1회 이하
  dip_alpha_peak: 0.93
  zoom_bump: false
  drift: {amount: 0.03, tau_sec: 9.0}
  ending_pullback: {w_from: 88, w_to: 96, dur_sec: 9.0}
  auto_transition: {dip_if_dist_over_w: 2.5, dip_if_w_ratio_over: 6.0}
  w_guide: {continental_route: [88, 96], ocean: [60, 72], region: [20, 30], strait: [12, 16], country: [6, 8], metro: [3, 5], city: 2.5}

media_beats:               # 14 §10
  per_runtime_sec: [40, 60]
  per_scene_max: 1
  article_card_exempt: true
  no_consecutive_same_kind: true
  kinds: [photo, clip, cutout, article, post]
  photo_show_sec: [4, 8]
  clip_show_sec: [3, 6]
  file_photo_label_required: true         # "자료사진 · 연월"
  caption_credit_required: true
  ai_generated_forbidden: true            # G4-10, 14 §2.2
  casualty_identifiable_forbidden: true

hud:                       # 09 §5 — 모서리에는 날짜만
  allowed_corner_elements: [date_badge]
  forbidden_components: [brand_mark, section_number, section_title, stamp, vignette, scrubber, chapter_number]
  date_badge: {font: mono, size: 15, x_right: 26, y: 40, underline_y: 48, underline_w: 1.4, slide_px: 6, slide_sec: 0.45}

layout_480p:               # 09 §2·§4, 08 §10 — 기준 해상도 854×480. 다른 해상도는 k = H/480
  base: {w: 854, h: 480, fps: 24}
  subtitle: {size: 19, last_line_y: 452, line_gap: 26, halo: 5.0, halo_alpha: 0.92, emphasis_color: gold}
  min_font_px: 9.5         # 화면 높이 2% 규칙(엔딩 카드 예외)
  title_card: {dur_sec: 5.6, title_size: 46, subtitle_size: 18, rule_w: 220}
  end_card: {dur_sec: 11.0, item_size: 9.2, license_size: 7.8}
  card: {x_right_margin: 24, y: 70, min_w: 230, slide_px: 30, fade_sec: 0.45, big_size: 30, line_size: 13, tag_size: 10.5, src_size: 9.5}
  article_card: {w: 300, y: 68}
  panel: {cover_alpha: 0.8, fade_sec: 0.6, title_size: 19, title_y: 74, subtitle_size: 11, subtitle_y: 96, min_screen_use: 0.7}
  badge: {R_person_map: [30, 34], R_person_panel: 36, R_flag: [17, 24], reserve_top_factor: 2.2, reserve_bottom_px: 44, popin_sec: 0.55}
  timeline_gaps: {gap_sec: 0.5, scene_gap_sec: 1.0, lead_sec: 1.2, title_after_cold_open: true}
  fade: {in_sec: 1.2, out_sec: 1.6}
  reserved_zones: {card: {x_from_right: 260, y: [70, 200]}, subtitle: {y_from: 410}}

panels:                    # D-0032 — 패널 기하·타이밍. 코드에 리터럴로 다시 적지 않는다(tests/anti_inertia/test_no_magic_numbers)
  relation:                # 08 §3 정돈된 관계선 규칙 6개 + v3 P_refusal 합격 값(수치 무변경)
    edge_dur_sec: 1.3
    edge_dur_range: [1.0, 1.3]      # 규칙 2 — 선 하나 1.0~1.3초
    edge_gap_sec: 0.75
    edge_gap_range: [0.6, 0.75]     # 규칙 2 — 선 간격 0.6~0.75초
    edges_after_nodes_sec: 0.4      # 규칙 1 — 노드가 모두 뜬 뒤(마지막 노드 등장 + 0.4초)에 첫 선. v3: 1.0+0.2×4+0.4 = 2.2
    max_edges: 7                    # 규칙 6 — 초과 = lint 경고 + 2분할 제안(자동 분할은 하지 않음, P8)
    curve_samples: 36               # 규칙 3 — 모든 선은 수평 접선 3차 베지어(곡률 통일)
    line_width: 1.5
    state_fade_sec: 0.5             # 규칙 5 — 상태 변화(요구→거절)는 내레이션이 이름을 부를 때(at_word)부터
    dash_after: 0.5
    source: {x: 235, cy: 262, dy: 62, R: 36, t0: 0.4, step: 0.2, pad: 4}     # 요구자 한쪽
    target: {x: 590, cy: 262, dy: 62, R: 19, t0: 1.0, step: 0.2, pad: 7}     # 대상 세로 열(이름 오른쪽)
    styles:
      demand: {color: gold, alpha: 0.8, dash: []}
      refuse: {color: ru, alpha: 0.55, dash: [4, 4]}
    state_label: {dx: 78, dy: 5, size: 12, halo: 2.4}
    edge_label: {x: 400, y: 150, size: 11, delay_sec: 3.2, fade_sec: 0.5, halo: 2.4}   # 규칙 4
    quote_bottom: {y: 414, size: 13, fade_sec: 0.4, halo: 3}
    quote_source: {dy: 92, size: 12.5, fade_sec: 0.4, halo: 3}
  timeline:                # 08 §5 v3 P_timeline 합격 값(수치 무변경) + 자동 층 배치(08 §11-3)
    x: [80, 774]
    y: 262
    axis_draw_sec: 1.2
    axis_alpha: 0.35
    axis_width: 1.4
    tick_h: 8
    tick_w: 1
    month: {size: 10.5, halo: 0}
    month_dx: 3
    month_dy: 22
    month_alpha: 0.9
    band_h: 14
    band_alpha: 0.18
    band_fade_sec: 0.6
    band_label: {size: 10.5, halo: 2}
    band_label_dy: 40
    event_fade_sec: 0.5
    dim_alpha: 0.55
    stem_alpha: 0.8
    stem_width: 1.2
    dot_r: 4.5
    layer_px: [44, 96, 148]         # 층 ±1·±2(v3) · ±3(자동 배치 여유)
    date: {size: 11, halo: 2.4}
    date_dy_above: -18
    date_dy_below: 14
    label: {size: 11.5, halo: 2.4}
    label_dy_above: 14
    label_dy_below: 15
    label_gap_px: 8
    cursor_alpha: 0.35
    cursor_width: 1
    cursor_dash: [2, 3]
    cursor_y: [118, 400]
  reserved:                # D-0033(D36) — 카드가 떠 있는 동안 그 영역을 예약. 뱃지는 최소 이동으로 밀려나고 카드가 사라지면 제자리로
    badge_strategy: push
    push_gap_px: 8
    push_directions: [left, down, left-down]   # 필요한 이동량이 가장 작은 방향. 같으면 이 순서
    max_push_px: 160                           # 넘으면 hide(카드 알파만큼 흐려짐), provenance reserved.avoidance 에 기록
    marker_label_strategy: hide                # 마커 점은 사실 위치라 옮기지 않고, 라벨만 카드 뒤에서 흐린다
    min_zone_alpha: 0.01
    lead_sec: 0.45                             # 카드 페이드와 같은 길이 — 카드가 들어오기 전에 비키고, 나간 뒤에 돌아온다
  prov_tag:                # D-0034(D37) — 추정 태그는 제목 아래(부제 다음 줄, 가운데). 08 §9 우상단(W−40, 52)은 C0 모서리 규칙과 충돌해 쓰지 않는다
    anchor: below_title
    y_offset_px: 20                 # 제목(부제가 있으면 부제) 기준선에서 태그 줄 기준선까지
    align: center
    font: sansb
    size: 10
    color: amber
    border_px: 1
    alpha: 0.9
    pad_x: 14
    h: 19
    box_dy: -13                     # 상자 위 끝 = 태그 기준선 + box_dy
    r: 3
    gap_px: 8                       # 태그와 <미검증> 등 검증 라벨 사이(같은 줄, 별개 장치 — C9)
    claim_color: ru
    body_top_px: 118                # 태그 없는 패널의 본문 기준 위 끝(v3 본문 시작)
    body_top_px_with_tag: 136       # 태그 줄이 있으면 본문을 여기서 시작 — 이동량 = 둘의 차(모든 차트 같은 값)
