genre_prompt:              # v4.4.0 D-0090 작업 1 — 장르 프롬프트 층(docs/handoff/20 §5.1·§5.2·§6·§7·§9, 15 P3). 워커가 장르 프로필 + 이 절로 프롬프트 끝 문단을 만든다(workers/prompt_loader.py)
  base_genre: geopolitics  # 기본 프롬프트(prompts/*.md)가 이미 전제한 장르 — 이 장르는 추가 문단 0(프롬프트 바이트 동일)
  narration:               # 20 §7 — 장르 프로필 narration 키가 참(또는 값 있음)이면 이 문장이 원고·리서치 프롬프트에 들어간다. {n} = 키 값
    define_terms_once: "전문 용어는 첫 등장 때 한 문장으로 정의한다(예: \"점도표는 FOMC 참가자들이 각자 예상하는 금리를 점으로 찍은 표입니다\"). 두 번째부터는 정의하지 않는다."
    attribute_causality: "인과는 단정하지 않고 귀속한다(\"연준은 ~라고 설명했습니다\", \"~라는 분석이 있습니다\"). 경제 인과는 논쟁 사안인 경우가 많다 — 균형 원칙을 그대로 적용한다."
    numbers_per_sentence_max: "한 문장에 숫자는 {n}개 이하. 나머지 숫자는 화면(시리즈·카드·패널)이 말한다."
    forecast_attribution: "전망은 누구의 전망인지 귀속한다(\"FOMC 참가자들의 전망 중앙값\"). 점도표는 약속이 아니라 참가자별 전망임을 한 번 말한다. 가격·금리 예측을 단정하지 않는다."
  data_sources:            # 20 §5.1 — 리서치·원고 프롬프트의 데이터 원칙
    - 수치는 1차·공개 출처(중앙은행 공식 발표, 통계기관, FRED 같은 공개 데이터 저장소)에서만 가져온다.
    - 시장 사업자의 독점 데이터(선물 가격에서 추정한 금리 확률 등)는 쓰지 않는다. 필요하면 보도 인용(기사)으로 대신하고 누가 보도했는지 귀속한다.
    - 데이터 레코드(series:<id>)가 있는 수치는 레코드 값과 기준 시점 그대로 쓴다(반올림·추정 금지).
  rubric_extra:            # 20 §9 — 시각 검수 루브릭 추가 7항목(17 §4.2 에 덧붙임). 검수 출력 rubric[] 에 항목마다 판정
    - 슬라이드처럼 보이는가(장면마다 새 캔버스, 차트가 한 장씩 넘어감) — 그렇다면 실패
    - 무대가 연속적인가(카메라가 같은 좌표계 위를 움직이는가)
    - 차트가 정직한가(0 기준·압축 물결·로그 표기), 단위·기준 시점·출처가 보이는가
    - 숫자가 화면과 내레이션에서 일치하는가
    - 색 의미가 장르 프로필과 일치하는가(인상/인하, 상승/하락)
    - 전문 용어가 정의 없이 쏟아지는가
    - 투자 권유로 읽히는 표현이 있는가
  stage_grammar:           # 20 §6 — 무대별 카메라·연출 문법. 주 무대 줄이 연출·수정·검수 프롬프트에 들어간다(키 ∈ registries.stages)
    timeline:
      - "이동: 왼쪽 → 오른쪽 시간 순이 기본이다. 되돌아갈 때는 이유가 있을 때만, 그 숏의 reason 에 이유를 적는다."
      - "확대: 사건 핀(회의일·발표일)에서 확대한다. 확대하면 월·일 눈금이 나타난다(LOD) — 휑한 화면 금지."
      - "암전 컷: 수십 년 점프, 보조 무대로 넘어갈 때만."
      - "공통: 장면당 이동 1회, 숏 6초 이상, 도착 뒤 드리프트, 요소는 하나씩."
      - "무대는 하나의 연속된 좌표계다. 장면마다 새 캔버스를 띄우지 않는다(슬라이드 금지). 차트는 시간축 레인 위 series 로, 무대로 말할 수 없는 정보만 패널·카드로."
      - "휑한 화면 금지: 컷마다 무대 밖 요소가 하나 이상 떠 있다(핀 카드·인물 뱃지·기사·사진·statement_diff·dot_plot). 얇은 선과 빈 레인만 있는 컷을 만들지 않는다."   # v4.4.0 D-0091 ①
      - "핀 = 사건 + 근거: 핀에서 확대할 때 근거(카드·기사·사진·statement_diff)를 함께 띄운다. 같은 핀에 숏 두 개로 머물지 않는다."   # v4.4.0 D-0091 ④
      - "콜드 오픈은 가장 최근 회의 핀 확대 + 인물 뱃지 + 성명 인용으로 연다(20 §10). 전체 조망은 끝에서 한 번."   # v4.4.0 D-0091 ⑤
      - "정책 금리 계단·목표 범위 띠는 color_by: change(인상·인하·동결 색을 코드가 레코드 변화로 정한다). 시장 금리·물가 선은 fixed."   # v4.4.0 D-0091 ②

data:                      # v4.3.0 D-0084 작업 1 — 데이터 레코드(docs/handoff/20 §5.1, schemas/data_models.py:SeriesRecord). 이 목록 밖 값 = 로드 오류(15 P6)
  units: ["%", "%p", "bp", "억 달러", "지수", "명", "원"]   # 화면 단위(20 §5.3 "단위를 화면에 표시")
  licenses_allowed: [us_gov_public_domain, cc_by_4]        # 재배포 가능한 공개 라이선스만(20 §5.1 "시리즈마다 이용 조건 확인")
  unit_prefixes: ["$", "₩", "€", "¥"]                    # v4.3.0 D-0087 보정 1 — 값 앞 통화 기호도 단위 표시로 인정(dual_line y_prefix)
  sources_allowed: [fred.stlouisfed.org, www.federalreserve.gov]   # source_url 도메인(tools/fetch_series.py 가 받는 곳). federalreserve.gov = v4.4.0 SEP 점도표(D-0090 작업 2)
  frequencies: [monthly, release]                           # 값 날짜 간격 — monthly = 매월 1일, 한 달씩. release = 발표 한 번(scatter, v4.4.0)
  transforms:                                               # 코드가 하는 변환(명시된 것만). 레코드 transform.formula 는 이 문구와 같아야 한다
    raw: "원자료(변형 없음)"
    yoy_pct: "전년 동월 대비 % = (x_t / x_(t-12) - 1) * 100, 소수 둘째 자리 반올림"
    sep_dots: "SEP 그림 2 표(값별 참가자 수) → 열마다 참가자별 점(값을 인원수만큼 되풀이, 오름차순)"   # v4.4.0 D-0090 작업 2 — scatter(점도표)
    month_last: "일별 → 그 달의 마지막 관측값(값은 원자료 그대로, 날짜는 그 달 1일)"   # v4.4.0 D-0090 작업 2 — DFEDTARU·DFEDTARL(목표 범위 상·하한)
  series_dir: data/series                                   # <series_id>.yaml(레코드) + <series_id>.csv(값) + raw/<series_id>.csv(받은 그대로)

primitives:                # v4.2.0 D-0081 작업 4 — 프리미티브(engine/primitives/<id>.py) 레이아웃 토큰. registries.primitives 마다 한 블록(20 §4.2 "색·크기는 토큰만")
  statement_diff:          # 작업 5 — 성명서 문구 비교(20 §10). 설계 px(480p). 글자 크기 ≥ layout_480p.min_font_px(glyph_size), 출처 줄 = layout_480p.card.src_size, 문구 상한 = verification.quote_max_chars
    w: 360                 # 상자 폭 — 오른쪽 여백·세로 기본값은 layout_480p.card(같은 슬롯 card_right)
    pad_x: 18
    pad_top: 23            # 상자 위 → 머리 글자 기준선(카드와 같음)
    pad_bottom: 12         # 출처 줄 기준선 → 상자 아래
    label_gap: 22          # 앞 기준선 → 행 이름 기준선
    line_h: 19             # 문구 줄 간격
    row_gap: 6             # 이전·새 행 사이 추가 간격
    src_gap: 20            # 마지막 문구 줄 → 출처 줄
    tag_size: 10.5
    tag_spacing: 0.4
    label_size: 10
    text_size: 13
    radius: 5
    bar_w: 3
    bar_inset: 10
    strike_w: 1.4          # 취소선 두께
    strike_rise: 0.32      # 취소선 높이 = 글자 크기 × 이 값(기준선 위)
    fade_sec: 0.5          # 등장·퇴장 페이드(20 §4.2 0.4~0.6초)
    slide_px: 24           # 등장 슬라이드(오른쪽 → 제자리, fade_sec 동안)
  dot_plot:                # v4.4.0 D-0090 작업 3 — 점도표(참가자별 전망 점, 열 = 연도, 중앙값 표시, 20 §5.2·§10). 설계 px(480p). 값은 scatter 레코드에서만
    w: 400                 # 상자 폭(같은 슬롯 card_right) — 한 값에 12명이 몰려도 열 폭 안(점 지름 + 간격 × 12)
    plot_h: 170            # 점 영역 높이
    pad_x: 18
    pad_top: 23            # 상자 위 → 머리 글자 기준선
    head_gap: 16           # 머리 → 고정 문구 기준선
    plot_gap: 16           # 고정 문구 → 점 영역 위
    col_label_gap: 15      # 점 영역 아래 → 열 이름 기준선
    src_gap: 16            # 열 이름 → 출처 줄 기준선
    pad_bottom: 12
    axis_w: 38             # 왼쪽 값 눈금 자리
    tick_step: 0.25        # 값 눈금 간격(%). 눈금 라벨은 tick_label_every 칸마다
    tick_label_every: 2
    tick_label_dx: 6       # 눈금 라벨 오른쪽 끝 → 점 영역 왼쪽(범례 선 간격도 같은 값)
    legend_rise: 0.33      # 가로선·눈금 라벨을 글자 가운데 높이로(글자 크기 × 이 값)
    dot_r: 2.3
    dot_gap: 0.5           # 같은 값 점 사이 추가 간격(지름 기준 더함)
    dot_color: white
    dot_alpha: 0.88
    median_color: gold
    median_w: 2.0
    median_half: 15        # 중앙값 가로선 반폭
    median_size: 10        # 중앙값 라벨
    grid_alpha: 0.10
    tick_size: 9.5
    col_size: 10
    tag_size: 10.5
    tag_spacing: 0.4
    note_size: 10
    note: "참가자별 전망이며 약속이 아님"   # 20 §5.2 — 고정 문구(연출이 바꿀 수 없다)
    median_label: "중앙값"
    radius: 5
    bar_w: 3
    bar_inset: 10
    fade_sec: 0.5          # 20 §4.2 0.4~0.6초
    slide_px: 24
    dot_stagger_sec: 0.6   # 점이 열마다 차례로(요소는 하나씩 — 05). 열 i 는 fade 뒤 i × (이 값 ÷ 열 수)

golden:                    # v3.6.0 D-0066 작업 4 · D-0067 요건 4 — 1080p 를 854×480 으로 Lanczos 축소해 480p 와 잰 컷별 MAD(/255) 상한.
  # 실측(hormuz 25컷, 1080p 티어 ppd×2.25): 평균 0.0107 · 최대 0.0181(p_0214.46). 설계 좌표가 같아 위치 차이는 0(frames·place_over 동일)이고,
  # 남는 차이는 래스터 선명도(지형 ppd 216 vs 96, 사진 원본 해상도)와 글자 힌팅·안티에일리어싱뿐 → 최대 실측 + 여유 약 10%
  res_compare_mad_max: 0.02

preview:                   # v3.3.0 D-0056 F6 — `--preview auto` 샘플. 짧은 영상에서 전면 카드만 뽑히지 않게 본편(문장 읽는 중) 컷 최소 수. golden 모드 무관
  min_body_cuts: 4

qa_checks:                 # 17 §3 — 결정적 사전 검사 임계
  overlap_core_elements: 0
  offscreen_clip: 0
  missing_glyphs: 0
  labels_per_frame_max: 18
  subtitle_lines_max: 2
  rights_missing: 0
  forbidden_components: 0
  # v3.6.0 D-0069 — 최소 글자(glyph_size, hard): 임계는 layout_480p.min_font_px(9.5, 09 §2 "최소 글자") 한 값을 참조(여기 다시 적지 않음).
  # 설계 px 로 판정(해상도 무관). 아래 역할로 그린 글자만 예외 — 역할 없는 글자는 예외가 아니다(기본 엄격).
  glyph_size_exempt:
    - end_card     # fullcards.draw_endcard — 엔딩 카드 전부(머리 8.5, 항목 9.2, 라이선스 7.8, 날짜·안내 7.8). 규칙 min_font_px 주석의 기존 예외
    - media_meta   # 권리·출처 메타(C9): layers/media.media_tag 7.5(PHOTO·VIDEO), media_caption 출처 줄 7.8, draw_article ARTICLE 7.5·날짜 8.5·메모 7.8,
                   # draw_cutout 출처 줄 8.5, layers/post 핸들 8.5·칩 7.5·원문 8·꼬리 7.8(18 §5)
  label_hidden_max_ratio: 0.5   # v3.6.0 D-0068 — 마커 라벨이 카드 영역 때문에 흐려진(알파 < 0.5) 시간 ÷ 그 마커 표시 시간. 초과 = overlap hard
  planned: []             # v4.2.0 D-0081 — 예정 검사(장르 프로필 proposed 의 qa_extra 만 참조). v4.3.0: 정직성 4개가 실제 검사로 옮겨 비었다
  # v4.3.0 D-0084 작업 5·D-0087 — 차트 정직성(engine/honesty.py, 20 §5.3). 요소의 축 종류(렌더러 모듈 AXIS) → 적용 검사.
  # 적용되지 않는 검사는 checks.json 메모 n/a(<축> 축)로 남는다(조용한 생략 아님)
  chart_targets:
    value: [chart_honesty, series_limit_3, units_visible, as_of_visible]   # series 레인·dots·dual_line
    date: [chart_honesty]                                                   # timeline·gantt 패널·시간축 무대(압축 표시)
    none: []                                                                # 값·날짜 축이 없는 패널
  series_max: 3            # 한 차트(레인·패널)의 계열 수 상한(20 §5.3)
  visual_qa_loop_max: 2
  loop_pick_order: [checks_hard, qa_hard, qa_soft]   # D-0049 쟁점 3 — 상한 도달 시 사전식 최소 판, 동점은 이른 회차

bundle:                    # v3.5.0 D-0063 작업 4 — 번들 어댑터(bundle/) 어휘 대응. 번들은 재료다(12 §5) — 여기 없는 차트 종류는 패널로 만들지 않고 unsupported 로 기록(P6)
  chart_panels: {stakeholder_map: network, dot_matrix: dots, gantt: gantt, dual_line: dual_line}   # 번들 차트 종류 → 패널 kind(12 §2)
  edge_types: {영향: influence, 연관: related, 대립: opposed, 동맹: allied}                         # stakeholder edges.type → panels.charts.network.styles
  verified_when: confirmed          # 번들 provenance.verification 이 이 값이고 출처 ≥ 1 이면 패널 provenance verified(태그 없음), 아니면 estimated(추정 태그, 08 §9)
  dual_line_colors: [gold, us]      # v2 render2 P_dual 계열 색(prompts/examples/panels/dual_line.yaml 과 같음)
  gantt_colors: [ru, muted, teal, green]
  node_accent: gold                 # stakeholder 노드 accent: true → 이 강조색(아니면 muted)
  dual_line_ticks: 4                # dual_line y 눈금 칸 수 목표(깔끔한 간격 = 아래 가수 × 10^n 중 span/칸 이상 최소)
  nice_mantissas: [1, 2, 2.5, 5, 10]

provenance:                # 15 §3 P5
  required_keys: [engine, rules_hash, prompts, features_used, qa, drops]
  fail_if_drops: true
