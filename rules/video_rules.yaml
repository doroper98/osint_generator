  # 새로 뜨는 뱃지는 자기 자신을 세어 처음부터 그 크기로 뜬다. 연출이 R 를 주면 그 값(적응 없음). 이름표 글자는 R 에 따라 group ↔ solo 사이 보간
  badge:
    R_person_solo: 56
    R_person_group: [30, 34]      # 옛 R_person_map
    R_person_panel: 36
    R_flag: [17, 24]
    R_other: 30                   # 국기·휘장 뱃지 연출 R 없을 때(v3 기본 — 옛 badge_at 리터럴)
    resize_sec: 0.6
    fade_in_sec: 0.01             # draw_badge window(옛 리터럴)
    fade_out_sec: 0.45
    label_solo: [15, 11]          # 인물 solo — [이름, 역할] 글자 크기
    label_group: [12, 10]         # 인물 group·국기·휘장(이름표 아래)
    label_side: [13, 10]          # side: right(v3)
    label_box: {pad_x: 8, gap: 5, pad_y: 8, inset: 5.5, role_gap: 8.5, role_pad: 4, side_dx: 10, side_dy: 1, side_role_dy: 17}
    reserve_top_factor: 2.2       # 머리 예약 상한(v3 값) — head_reserve: factor 면 이 값 그대로
    # v4.8.0 back_and_forth D-0112 A — 머리 예약 = 초상 실측(불러올 때 알파 윗줄로 head_top 계산, R 단위, 상한 reserve_top_factor). 초상 없는 인물은 상한
    head_reserve: measured        # measured | factor(되돌림)
    edge_nudge: true              # 그 순간 상자가 화면 밖이면 그 px 만큼 안쪽으로(avoid_badge 와 같은 단계, provenance reserve.avoidance strategy edge). 보정 뒤에도 밖이면 offscreen hard
    reserve_bottom_px: 44
    popin_sec: 0.55
    # v5.5.0 사용자 지적(2026-10-02 "푸틴의 정수리가 원 테두리 밖(위쪽)으로 나와 어색", RENDER-AP) — v3 의 '머리 내밀기'(원 위 2.4R 직사각형까지 그림)를 끈다.
    # 초상은 원 안에만 그리고, 실측 정수리(head_top, R 단위)가 head_inside_max 를 넘으면 그만큼 초상을 아래로 내려 머리 전체가 원 안에 든다.
    head_popout: false
