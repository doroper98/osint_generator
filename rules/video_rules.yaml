    alpha: 0.9
    shade_alpha: 0.55
    label: 압축
    label_font: sansb
    label_size: 10.5
    label_halo: 2.5
    label_dy: -7           # 레인 영역 위 끝 → 라벨 기준선(영역 바로 위 — 레인 이름과 겹치지 않게)
    label_margin_px: 30
  series:                  # series 이벤트(데이터 레코드에서 직접)
    lane_pad_top: 0.3      # 레인 띠 위 여백(레인 높이 비율) — 레인 이름 자리
    lane_pad_bottom: 0.22  # 레인 띠 아래 여백 — 출처·기준 시점 줄 자리
    line_w: 2.2
    tip_r: 3.2
    fade_sec: 0.5
    min_alpha: 0.01        # 이보다 흐리면 그리지 않는다(다른 레이어의 등장 문턱과 같은 값)
    playhead: 0.8          # grow 앞끝 = 화면 왼쪽 + 화면 폭 × 이 값(누적 최대). 화면 오른쪽 끝이 무대 끝에 가까워지면 1 로 늘어난다
    grow_in_sec: 1.6       # 등장 직후 화면 왼쪽에서 앞끝까지 쓸어 나가는 시간
    clip_below_px: 30
    value_dx: 7
    value_dy: -6
    value_size: 12
    value_font: sansb
    value_halo: 3
    value_min_x: 60        # 끝점이 화면 왼쪽 이 안쪽이면 값 라벨을 그리지 않는다(레인 이름과 겹침 방지 — 점은 그대로)
    axis_zone_px: 64       # 화면 오른쪽 축 값 라벨 자리 — 끝점 값 라벨이 여기로 넘어가면 끝점 왼쪽에 쓴다
    grid_alpha: 0.06
    zero_alpha: 0.16
    grid_w: 0.7
    axis_label_margin_px: 8
    axis_label_dy: -3
    axis_label_size: 11    # v4.4.0 D-0092 B: 10 → 11
    axis_label_font: mono
    axis_label_halo: 2.5
    source_dy: 7           # 레인 아래 끝 → 출처·기준 시점 줄 기준선(위로). 같은 레인 n 번째 series 는 source_step 씩 위
    source_step: 12
    source_size: 11        # v4.4.0 D-0092 B: 10 → 11
    source_font: sansm
    source_halo: 2.5
    change_regime_months: 2   # v4.4.0 D-0091 ② color_by change — 마지막 변화가 이 달 수 안이면 그 방향(hike·cut), 넘으면 hold(동결). FOMC 회의 간격(6~7주) — 연속 회의 인상·인하는 이어지고 동결 결정 뒤는 회색(6 → 2: fed_policy 검수 루브릭 5 지적, 2026 동결기가 인하 색)
  band:                    # v4.4.0 D-0090 작업 2 — series style band(두 레코드 사이 띠 = 목표 범위). 색은 이벤트 col
    fill_alpha: 0.28
    edge_alpha: 0.9
    edge_w: 1.4
    sep: "–"               # 끝점 값 라벨 "아래–위단위"
  missing_mark:            # D-0086 보정 1 — 빈 달(레코드 missing) 자리: 점선 + 라벨. 글자 ≥ layout_480p.min_font_px
    label: 자료 없음
    label_font: sansm
    label_size: 10
    label_halo: 2.5
    label_dy: -4
    color: muted
    alpha: 0.9
    dash: [2, 3]
    line_w: 1
    inset_px: 6
  # v5.1.0 back_and_forth D-0121 §A(사용자 피드백 D105 — fed 시간축 가로축 스케일이 숏마다 바뀌어 불편) — 축 스케일(카메라 w, 일)을 장면 단위로 고정.
  # w 변화 = 시간축 숏(지도 무대 제외)의 연속한 두 숏 사이 w 가 다름(첫 숏 설정은 변화 아님). checks timeline_rescale(hard)
  # `[timeline-rescale] {at} w {a}→{b} ({이유})`: ① scene_fixed 인데 같은 장면 안 변화 ② 영상 전체 변화 수 > max ③ 비율 max/min < ratio_min. provenance timeline.w_changes[]
  axis_scale:
    w_changes_per_video_max: 3     # 오프닝 뒤 작업 척도·중간 1회·엔딩 조망
    w_change_ratio_min: 1.5        # 이 미만의 w 변화는 '흔들림'
    scene_fixed: true              # 장면 안에서 w 변경 금지 — move 는 중심 이동(pan)만
    grammar: "시간축 무대는 축 스케일(카메라 w, 화면이 덮는 일수)을 장면 단위로 고정한다. 확대·축소는 영상 전체 {max}회 이하(오프닝 뒤 작업 척도·중간 1회·엔딩 조망), 한 번에 {ratio}배 이상만 바꾼다. 장면 안에서는 w 를 그대로 두고 중심 이동(pan)만 한다. 지도의 '문장마다 줌 금지'(G4-16)와 같은 원리다. 검사 [timeline-rescale] hard."

stage_backdrop:            # v5.1.0 back_and_forth D-0121 §B·D-0123 §1(사용자 결정 D106·D108) — 사진 배경 무대(engine/stage_backdrop.py)·backdrop 이벤트(engine/layers/backdrop.py). 설계 px(480p)
  # 사진 = 미디어 레지스트리 kind photo·rights_clear 만(C9·G4-10 — AI 생성·출처 불명 금지). 배경은 장식이라 캡션 바 없음, 크레딧은 credits.yaml media 참조.
  # 연출(LLM)이 장면마다 {type: backdrop, start: {scene_start}, end: {scene_end}, img: <mid>} 로 고른다(P8). 전환은 crossfade 만(줌 범프 금지)
  kind: photo              # 레지스트리 종류(이벤트 backdrop ↔ kind photo)
  # v5.2.0 D-0129 §A(사용자 판정 D113 "블러가 너무 강해 어떤 사진인지 알 수 없다") — 18·0.55·0.3 → 6·0.38·0.15.
  # 자막·카드·아일랜드 가독은 halo·상자 알파(island.fill_alpha)가 맡는다. 스윕 시트 3변형(4·0.30 / 6·0.38 / 10·0.45)에서 사용자가 확정
  blur_px: 6               # 가우시안 블러 반경(설계 px — 장치 해상도에서는 × k)
  dim: 0.38                # 검정 덮개 알파
  desaturate: 0.15         # 채도 낮춤(0 = 원본, 1 = 흑백)
  crossfade_sec: 1.2       # 등장 페이드 인 = 앞 사진 페이드 아웃(끝 + 이 값까지 남는다)
  ken_burns: 0.04          # 이벤트 길이에 걸친 느린 확대(1 → 1 + 이 값, 연속 변환 — G7 D6, 줌 범프 아님)
  change_on: scene         # 전환 단위 = 장면(주제 전환)
  min_photos: 3            # 영상 안 서로 다른 배경 사진 수(checks backdrop_repeat [backdrop-photos])
  max_photos: 6
  bg_rgb: [0.035, 0.045, 0.068]   # 사진 전·사이 바탕(= stage_timeline.bg_rgb 값)
  # 연출·수정 프롬프트 {{RULES.backdrop_island}} — {자리}는 같은 규칙 값(stage_backdrop·island·article_card)으로 로더가 채운다(15 P3·C2 .replace)
  grammar:
    - "사진 배경 무대: 최상위 `stage: backdrop`. 주 무대 카메라 숏은 `{\"at\": 0, \"mode\": \"cut\", \"dur\": 0, \"camera\": {}}` 하나(이동 없음)."
    - "배경 사진: 장면마다 `{\"type\": \"backdrop\", \"start\": {\"scene_start\": 장면}, \"end\": {\"scene_end\": 장면}, \"img\": 사진 id}`. img 는 사용자 메시지 미디어 목록의 사진(photo) id 만. 연속 같은 사진 금지, 영상 전체 서로 다른 사진 {min_photos}~{max_photos}장. 블러·어둡게·crossfade {crossfade}초는 코드가 한다(검사 [backdrop-repeat]·[backdrop-rights] hard)."
    - "차트 아일랜드: `{\"type\": \"island\", \"kind\": \"chart\", \"box\": {boxes} 중 하나, start, end}` — 시간축 차트가 이 상자 안에 뜬다. 차트 카메라는 `\"stage\": \"timeline\"` 숏(camera {date, lane?, w}) — 시간축 축 스케일 규칙을 그대로 따른다. series·date 마커는 차트 아일랜드가 떠 있는 동안에만 쓴다. 같은 순간 차트 아일랜드는 하나 — 차트가 필요한 구간 전체에 하나를 길게 두는 것이 기본이고, 둘을 이을 때는 앞 것의 end 뒤에 다음 것의 start 를 둔다(시각이 겹치면 오류). 오른쪽 카드와 함께면 box left."
    - "아일랜드(차트·사진·영상·프리미티브·패널)는 같은 순간 {max_concurrent}개 이하, 서로 겹치지 않는다(검사 [island-overlap] hard). 뱃지는 화면 슬롯(map_*)에, 프리미티브(statement_diff·dot_plot 등)·카드는 카드 슬롯에 둔다 — backdrop 무대에서 date·lane 앵커는 series·marker 만(그 밖은 오류)."
    - "주 아일랜드 상시(v5.2.0): backdrop 무대에서는 주 아일랜드({main_kinds})가 항상 하나 보인다. 카드만 있는 구간(블러 배경 + 카드)은 {card_only_max}초 이하 — 넘으면 검사 [backdrop-main-missing] hard(타이틀·엔딩 카드·기사 구간 제외). 차트 아일랜드는 오프닝 첫 문장부터 띄운다. 보도를 인용하는 카드(출처가 매체)는 카드가 아니라 article 이벤트로 — 프레스 규약 v2(가운데·세리프 헤드라인)로 조판한다. 카드는 아일랜드 상자와 겹치지 않는 자리에(겹치면 [card-island] warning)."
    - "차트 아일랜드 안 마커 라벨은 아일랜드 안에서만 보인다 — 오른쪽 끝 마커는 라벨이 점 왼쪽에 붙는다(코드가 정한다). 그래도 상자 밖이면 검사 [island-label-clip] hard, 라벨이 같은 레인 출처 줄과 겹치면 [island-label-overlap] warning — 마커 날짜·레인이나 카메라(date·w)를 바꿔 푼다."
    - "사진·영상을 left 차트 아일랜드와 같은 순간에 띄울 때는 `\"place\": \"backdrop_right_low\"`(backdrop 무대 전용 사진 자리 — 오른쪽 카드 자리 아래·자막 위·left 상자 밖, v5.2.0 D-0132). map_right_low·panel_gap·timeline_photo 는 left 상자와 겹친다([island-overlap] hard)."
    - "기사: `{\"type\": \"article\", \"mid\": 기사 id, \"theme\": dark|light(기본 {theme_default}), \"press\": 공식 사진 id(선택)}` — 화면 전체. 프레스 사진 {press_lead}초 → 덮개 + 세리프 헤드라인(원문 언어)·부제(번역)·출처 줄. press 는 미디어 목록의 권리 기록 사진만, 없으면 쓰지 않는다(코드가 지금 화면을 흐려 깐다)."

cascade:                   # v5.3.0 D-0139 겹침 카드(cascade, engine/cascade.py) — 사용자 제안(2026-10-01) 재구성, 사용자 결정 D116·판정 D117 채택. "띠"(D-0135) 폐기.
  # 지도(배경) 고정. 사건 카드를 왼쪽부터 step 간격으로 비스듬히 겹친다(윈도 '계단식 창 배열'처럼). 지금 말하는 사건 = 맨 앞·front 크기·accent 윗선,
  # 언급이 지나간 사건 = focus_sec 동안 back_scale 로 물러나 다음 카드 밑에 깔린다 → 뒤 카드는 왼쪽 step 폭(국기 원·날짜)만 보인다(겹친 부분은 그리지 않는다).
  # 뒤 카드가 max_back 을 넘으면 가장 오래된 카드가 shift_sec 동안 왼쪽으로 밀려 흐려져 나간다. 최악 폭 (max_back+1)×step + front.w ≤ width_cap(checks cascade).
  # 상자 = 아일랜드 공통 상자(island.* 재사용). 설계 px(480p). 값은 사용자 합격 값(D117, 2026-10-02) — C0 되돌림 금지, 사용자 결정 없이 바꾸지 않는다.
  status: adopted
  x0: 22
  y: 60                    # 카드 윗변(모서리 날짜 상자 y ≤ 50 아래)
  step: 68                 # 뒤 카드가 보이는 폭
  flag_R: 12               # 국기 원(카드 좌상단 모서리, 뒤 카드는 back_scale 배)
  front: {w: 214, h: 82, pad_x: 13, date_dx: 6, date_dy: 16, title_dy: 41, line_dy: 61, date_size: 10.5, title_size: 13, line_size: 10, accent_w: 3}
  back_scale: 0.86         # 뒤 카드 크기(앞 대비) — 앞 카드가 위·아래로 더 커서 뒤 카드를 덮는다
  back_text_alpha: 0.5     # 뒤 카드 글자·국기 알파(바탕·테두리는 그대로)
  # back_and_forth D-0138 보강(사용자 합격 값, D117): 뒤 카드도 제목을 남기고 덮이는 경계 back_fade_px 를 알파 그라데이션으로 가린다(자름 아님),
  # 앞에 쌓인 카드 수(depth)마다 back_dy 내려앉고 바탕을 back_dim 만큼 더 어둡게. 전환 = 물러나는 카드 글자 앞 절반 지움 → 새 카드 글자 뒤 절반
  back_fade_px: 12
  back_dy: 5
  back_dim: 0.06
  max_back: 4
  focus_sec: 0.5           # 앞 → 뒤 물러남 · 새 앞 카드 등장. 새 앞 카드 글자 = 앵커 + focus_sec 뒤 절반(0.25~0.5초, 밀기 없는 전환 — D-0137 §3·D-0139 §3)
  shift_sec: 0.6           # 가장 오래된 뒤 카드 밀려 나감. 밀기 있는 전환의 새 앞 카드 글자 = 앵커 + max(focus_sec, shift_sec) 뒤 절반(0.3~0.6초)
  width_cap: 560           # 최악 5 × 68 + 214 = 554, 정상 4 × 68 + 214 = 486
quote_center:              # v5.4.0 정규(사용자 결정 2026-10-02 "마음에 든다" — v5.3.1 시안 승격). engine/quote.py, 이벤트 quote. 설계 px(480p). 사용자 합격 값 — C0 되돌림 금지
  # 인물 발언 = 오른쪽 위 카드 대신 화면 가운데: 지도 위 균일 덮개(비네팅 아님) → 초상(뱃지 렌더러) → 세리프 인용문(큰 따옴표, 최대 quote_max_lines 줄)
  # → 이름·직함(who) → 매체·날짜(src, 가장 작게). 등장 = fade_sec 페이드 + rise_px 위로 떠오름(줌 튐 없음). 넘치면 렌더 전 오류(QuoteError, 자름 없음 P6).
  status: adopted
  scrim_rgb: [0.02, 0.03, 0.05]
  scrim_alpha: 0.62
  portrait_R: 44
  portrait_y: 185           # v5.3.1 사용자 지적 "너무 위로 올라가 있어" — 날짜 상자(≤50) 아래·자막(≈402) 위 공간의 세로 가운데로(120 → 185)
  quote_y: 279              # 첫 줄 기준선(214 → 279, 초상과 같은 +65)
  quote_size: 21
  quote_line_h: 30
  quote_max_w: 620
  quote_max_lines: 2
  mark_size: 34             # 여는·닫는 따옴표(accent)
  mark_alpha: 0.85
  who_size: 12
  who_dy: 32                # 마지막 인용 줄 기준선 → 이름 줄
  src_size: 10.5
  src_dy: 19                # 이름 줄 → 매체·날짜 줄
  rise_px: 8
  fade_sec: 0.35
  # v5.3.1 사용자 지시(2026-10-02) — A 의 인용과 그에 맞서는 B 의 인용: A = 왼쪽 위 초상 + 윗줄(왼쪽 정렬), B = 오른쪽 아래 초상 + 아랫줄(오른쪽 정렬).
  # 이벤트 quote pos: upper | lower(기본 center). 덮개는 같은 순간 한 번만 깐다.
  pair_R: 38
  pair_max_w: 540
  upper: {portrait: [116, 140], text_x: 172, quote_y: 134}
  lower: {portrait: [738, 290], text_x: 682, quote_y: 284}
border_glow:               # v5.4.0 정규(사용자 결정 2026-10-02 — v5.3.1 시안 승격). engine/layers/borders.draw_border_glow. 지도 무대 기본 켜짐(default_on), 끄기 = direction stage_config.mercator.border_glow: false
  # 국경선(행정구역 선 제외) 위에 옅은 빛(halo)을 상시 깔고, 짧은 빛 조각이 선을 따라 천천히 흐른다(cairo 대시 오프셋 = speed_px × t). 설계 px. 사용자 합격 값
  status: adopted
  default_on: true
  rgb: [0.62, 0.84, 1.0]
  halo: [[5.0, 0.03], [2.6, 0.055]]          # [선 폭, 알파] — 상시
  run_seg_px: 34                              # 흐르는 빛 조각 길이
  run_period_px: 320                          # 조각 사이 간격(한 주기)
  run_speed_px: 20                            # 초당 이동(설계 px) — "천천히"
  run_layers: [[6.0, 0.045], [3.2, 0.09], [1.4, 0.24]]   # 바깥 → 안 [선 폭, 알파], 둥근 끝
island:                    # v5.1.0 back_and_forth D-0123 §1·D-0126(Q1~Q4 A) — backdrop 무대 위 내용물 상자(아일랜드) 공통 규칙. engine/island.py. 설계 px(480p)
  # 연출은 픽셀을 다루지 않는다 — 차트 아일랜드는 box(boxes 이름)만 고른다. 등장 = 슬라이드 layout_480p.card.slide_px + 페이드 card.fade_sec(카드 규칙 재사용)
  # 겹침(checks island_overlap hard, Q3 A): 같은 순간 보이는 아일랜드 제자리 상자(그림자·슬라이드 경로 제외)끼리 교차 > 0, 자막 구역(reserved_zones.subtitle) 교차.
  # 아일랜드 = island 이벤트(차트) · 사진·영상(media_box) · 프리미티브(primitive_box) · backdrop 무대 위 패널(panel_box, Q4 A). 카드·배지는 기존 예약 영역 규칙.
  radius: 10
  fill_alpha: 0.78         # 바탕 = stage_timeline.bg_rgb(D-0121 §B fill_rgb = 현 bg_rgb)
  edge_alpha: 0.18         # 흰 테두리
  edge_w: 1.0
  shadow: [[6, 0.12], [3, 0.2]]   # [번짐 px, 알파] — 기사 카드 그림자와 같은 값
  max_concurrent: 2        # 같은 순간 아일랜드 수 상한(checks island_overlap)
  boxes:                   # [x, y, 폭, 높이] — 가운데 = 폭 78 %·높이 62 %(D-0121 §B), left·right = 오른쪽·왼쪽 카드 열(card_right x ≥ 594)을 비운다. 높이는 모두 같다(차트 레인 영역 한 벌)
    center: [94, 56, 666, 298]
    left: [24, 56, 540, 298]
    right: [290, 56, 540, 298]
  panel_box: [44, 40, 766, 362]   # backdrop 무대 위 패널 상자(패널 본문 x 80~774·제목 기준선 74 를 담고 자막 구역 410 위) — 패널 덮개(panel.cover_alpha) 대신(Q4 A)
  chart:                   # 차트 아일랜드 안 레인 영역(Q2 A): [pad_top, 상자 높이 − pad_bottom], 세로 척도 = min(stage_timeline.lane_h, 영역 ÷ 레인 수)
    pad_top: 34            # 압축 라벨(wave.label_dy −7) 자리
    pad_bottom: 40         # 날짜 눈금 라벨(grid.label_dy 17) 자리
    # v5.2.0 back_and_forth D-0133 §1 — 차트 아일랜드 안 마커 라벨(글자 상자)이 상자 가장자리 − label_flip_pad 를 넘으면 점 반대쪽(오른쪽 → 왼쪽)에 붙이고,
    # 그래도 넘치면 상자 안으로 클램프. 아일랜드 마커에만(지도·시간축 무대 마커 경로 무변경). 기본 = 점 ↔ 라벨 여백(markers._SIDE dx 12)과 같은 값.
    # 그 뒤에도 상자 밖 = checks island_label_clip hard `[island-label-clip]`, 라벨 ↔ 같은 순간 시리즈 출처 줄 교차 = island_label_overlap warning `[island-label-overlap]`
    label_flip_pad: 12
  # v5.2.0 back_and_forth D-0129 §B(사용자 판정 D113 "차트 없이 블러 배경 + 오른쪽 카드만 나오는 화면이 너무 오래 간다") — 주 아일랜드 상시.
  # checks backdrop_main_missing hard: backdrop 무대에서 main_kinds(chart = island kind chart, 그 밖 = 이벤트 type)가 하나도 보이지 않는 구간 > card_only_max_sec
  # → `[backdrop-main-missing] t0-t1 {n}s`(타이틀·엔딩 카드·기사 구간 제외, provenance backdrop.main_missing[]). 코드는 카드를 기사로 바꾸지 않는다(P8) — 검사 + 문법 + 재연출
  main_required: true
  main_kinds: [chart, primitive, photo, clip, article, panel]   # panel = D-0130 Q3 B(backdrop 패널 766×362 는 화면 대부분을 채우는 아일랜드)
  card_only_max_sec: 3.0   # 전환(앞 아일랜드 퇴장 ~ 다음 등장) 허용 폭

genre_prompt:              # v4.4.0 D-0090 작업 1 — 장르 프롬프트 층(docs/handoff/20 §5.1·§5.2·§6·§7·§9, 15 P3). 워커가 장르 프로필 + 이 절로 프롬프트 끝 문단을 만든다(workers/prompt_loader.py)
  base_genre: geopolitics  # 기본 프롬프트(prompts/*.md)가 이미 전제한 장르 — 이 장르는 추가 문단 0(프롬프트 바이트 동일)
  narration:               # 20 §7 — 장르 프로필 narration 키가 참(또는 값 있음)이면 이 문장이 원고·리서치 프롬프트에 들어간다. {n} = 키 값
    define_terms_once: "전문 용어는 첫 등장 때 한 문장으로 정의한다(예: \"점도표는 FOMC 참가자들이 각자 예상하는 금리를 점으로 찍은 표입니다\"). 두 번째부터는 정의하지 않는다."
    attribute_causality: "인과는 단정하지 않고 귀속한다(\"연준은 ~라고 설명했습니다\", \"~라는 분석이 있습니다\"). 경제 인과는 논쟁 사안인 경우가 많다 — 균형 원칙을 그대로 적용한다."
    numbers_per_sentence_max: "한 문장에 숫자는 {n}개 이하. 나머지 숫자는 화면(시리즈·카드·패널)이 말한다."
    forecast_attribution: "전망은 누구의 전망인지 귀속한다(\"FOMC 참가자들의 전망 중앙값\"). 점도표는 약속이 아니라 참가자별 전망임을 한 번 말한다. 가격·금리 예측을 단정하지 않는다."
  data_sources:            # 20 §5.1 — 리서치·원고 프롬프트의 데이터 원칙
    - 수치는 1차·공개 출처(중앙은행 공식 발표, 통계기관, FRED 같은 공개 데이터 저장소)에서만 가져온다.
    - 시장 사업자의 독점 데이터(선물 가격에서 추정한 금리 확률 등)는 쓰지 않는다. 필요하면 보도 인용(기사)으로 대신하고 누가 보도했는지 귀속한다.
    - 데이터 레코드(series:<id>)가 있는 수치는 레코드 값과 기준 시점 그대로 쓴다(반올림·추정 금지).
  rubric_extra:            # 20 §9 — 시각 검수 루브릭 추가 7항목(17 §4.2 에 덧붙임). 검수 출력 rubric[] 에 항목마다 판정
    - 슬라이드처럼 보이는가(장면마다 새 캔버스, 차트가 한 장씩 넘어감) — 그렇다면 실패
    - 무대가 연속적인가(카메라가 같은 좌표계 위를 움직이는가)
    - 차트가 정직한가(0 기준·압축 물결·로그 표기), 단위·기준 시점·출처가 보이는가
    - 숫자가 화면과 내레이션에서 일치하는가
    - 색 의미가 장르 프로필과 일치하는가(인상/인하, 상승/하락)
    - 전문 용어가 정의 없이 쏟아지는가
    - 투자 권유로 읽히는 표현이 있는가
  stage_grammar:           # 20 §6 — 무대별 카메라·연출 문법. 주 무대 줄이 연출·수정·검수 프롬프트에 들어간다(키 ∈ registries.stages)
    backdrop:              # v5.1.0 D-0123 §1(사용자 확인 D108)
      - "배경: 권리 기록 있는 실사진(미디어 레지스트리 photo)을 블러로 깐다. 장면(주제)이 바뀔 때만 바꾸고 연속 같은 사진은 금지, 영상 전체 서로 다른 사진 3~6장. 전환은 crossfade 만(줌 범프 금지). 사진이 없으면 지어내지 않는다."
      - "카메라: 빈 카메라 {}(이동 없음). 움직임은 배경의 느린 확대와 아일랜드 등장·전환이 만든다."
      - "내용물은 아일랜드로 띄운다 — 차트·개념도·사진·영상·기사·패널·게시물. 같은 순간 아일랜드는 2개 이하, 서로 겹치지 않는다."
    timeline:
      - "이동: 왼쪽 → 오른쪽 시간 순이 기본이다. 되돌아갈 때는 이유가 있을 때만, 그 숏의 reason 에 이유를 적는다."
      - "확대: 축 스케일(w)은 장면 단위로 고정한다 — 확대·축소는 영상당 몇 번뿐(축 스케일 절, 검사 [timeline-rescale]). 사건 핀으로는 중심 이동(pan)으로 가고, 핀의 근거는 카드·기사·사진으로 띄운다(v5.1.0 D-0121 §A — 옛 '핀마다 확대'를 대체)."
      - "암전 컷: 수십 년 점프, 보조 무대로 넘어갈 때만."
      - "공통: 장면당 이동 1회, 숏 6초 이상, 도착 뒤 드리프트, 요소는 하나씩."
      - "무대는 하나의 연속된 좌표계다. 장면마다 새 캔버스를 띄우지 않는다(슬라이드 금지). 차트는 시간축 레인 위 series 로, 무대로 말할 수 없는 정보만 패널·카드로."
      - "휑한 화면 금지: 컷마다 무대 밖 요소가 하나 이상 떠 있다(핀 카드·인물 뱃지·기사·사진·statement_diff·dot_plot). 얇은 선과 빈 레인만 있는 컷을 만들지 않는다."   # v4.4.0 D-0091 ①
      - "핀 = 사건 + 근거: 핀에서 확대할 때 근거(카드·기사·사진·statement_diff)를 함께 띄운다. 같은 핀에 숏 두 개로 머물지 않는다."   # v4.4.0 D-0091 ④
      - "콜드 오픈은 가장 최근 회의 핀 확대 + 인물 뱃지 + 성명 인용으로 연다(20 §10). 전체 조망은 끝에서 한 번."   # v4.4.0 D-0091 ⑤
      - "정책 금리 계단·목표 범위 띠는 color_by: change(인상·인하·동결 색을 코드가 레코드 변화로 정한다). 시장 금리·물가 선은 fixed."   # v4.4.0 D-0091 ②

data:                      # v4.3.0 D-0084 작업 1 — 데이터 레코드(docs/handoff/20 §5.1, schemas/data_models.py:SeriesRecord). 이 목록 밖 값 = 로드 오류(15 P6)
  units: ["%", "%p", "bp", "억 달러", "지수", "명", "원", "달러/갤런"]   # v5.3.1 달러/갤런 = 미국 경유 소매가(EIA GASDESW, valdai-2026). 화면 단위(20 §5.3 "단위를 화면에 표시")
  licenses_allowed: [us_gov_public_domain, cc_by_4]        # 재배포 가능한 공개 라이선스만(20 §5.1 "시리즈마다 이용 조건 확인")
  unit_prefixes: ["$", "₩", "€", "¥"]                    # v4.3.0 D-0087 보정 1 — 값 앞 통화 기호도 단위 표시로 인정(dual_line y_prefix)
  sources_allowed: [fred.stlouisfed.org, www.federalreserve.gov]   # source_url 도메인(tools/fetch_series.py 가 받는 곳). federalreserve.gov = v4.4.0 SEP 점도표(D-0090 작업 2)
  frequencies: [monthly, release]                           # 값 날짜 간격 — monthly = 매월 1일, 한 달씩. release = 발표 한 번(scatter, v4.4.0)
  transforms:                                               # 코드가 하는 변환(명시된 것만). 레코드 transform.formula 는 이 문구와 같아야 한다
