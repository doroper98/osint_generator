    x: 16
    dy: 20                 # 레인 위 끝 → 기준선(v4.4.0 D-0092 B: 17 → 20)
    size: 15               # v4.4.0 D-0092 B: 12 → 15(카드 본문 13 보다 크고 제목보다 작게)
    font: sansb
    halo: 3
  wave:                    # 압축 구간(20 §2.3·§5.3 — 압축 메타가 있으면 화면에 반드시 물결 + 라벨)
    amp_px: 3
    period_px: 8
