  bulge_ratio: 0.18        # 2차 베지어 제어점 = 중점 + 법선 × 화면 거리 × 이 값
  samples: 32              # 꼬리선 베지어 분할 수
  heading_du: 0.01         # 진행 방향(접선) 계산용 매개변수 간격
  trail: {width: 1.6, dash: [6, 5], alpha: 0.85, fade_sec: 1.4}   # 점선 = 개략. 착탄 뒤 fade_sec 에 걸쳐 알파 → 0
  origin: {r_px: 22, alpha: 0.28, pulse_sec: 1.6, out_sec: 0.4, fade_in_sec: 0.5, breath: 0.25}   # 방사형 발광(점·라벨 없음). 출발 전 pulse_sec 동안 숨 쉬고 출발 뒤 out_sec 에 사라짐
  icon:
    size_px: {drone: 11, missile: 13, jet: 14}   # 긴 변(사용자 결정 D234 U6 — "작게 해도 좋을 것 같아")
    halo: 2.0
    halo_alpha: 0.8
    body_line: {width: 0.9, alpha: 0.55}         # 드론 동체 구분선(날개와 동체를 나눠 화살표로 안 보이게)
    shapes:                                      # 머리 = −y, 진행 방향으로 회전. 긴 변(y 폭)을 size_px 로 정규화. 시험본 tools/strike_demo/render_demo.py
      drone: [[0, -7.4], [0.9, -6.4], [0.9, -3.4], [4.6, 3.6], [5.4, 3.4], [5.4, 5.9], [4.2, 5.9], [0.9, 5.3], [0.9, 6.8], [1.7, 7.0], [1.7, 7.5],
              [-1.7, 7.5], [-1.7, 7.0], [-0.9, 6.8], [-0.9, 5.3], [-4.2, 5.9], [-5.4, 5.9], [-5.4, 3.4], [-4.6, 3.6], [-0.9, -3.4], [-0.9, -6.4]]   # 샤헤드-136/게란-2 상면 실루엣
      missile: [[0, -7], [1.2, -5.5], [1.2, -0.5], [3.2, 0.5], [3.2, 1.3], [1.2, 1.0], [1.2, 4.5], [3.4, 6.2], [3.4, 7], [1.2, 6.6], [1.2, 7.2],
                [-1.2, 7.2], [-1.2, 6.6], [-3.4, 7], [-3.4, 6.2], [-1.2, 4.5], [-1.2, 1.0], [-3.2, 1.3], [-3.2, 0.5], [-1.2, -0.5], [-1.2, -5.5]]   # 순항미사일 상면
      jet: [[0, -7], [2, -2], [7, 2], [2, 3], [1.5, 6], [3, 7], [-3, 7], [-1.5, 6], [-2, 3], [-7, 2], [-2, -2]]   # 후퇴익 + 꼬리
    body_lines: {drone: [[[0.9, -3.4], [0.9, 5.3]], [[-0.9, 5.3], [-0.9, -3.4]]]}
  inset:                   # 위성 인셋(flight.inset.mid — 미디어 레지스트리 kind inset, 사용자 결정 D232 U2)
    shape: circle          # UF-103 사용자 원문 "위성사진은 네모낳게 표시하지 말고 동그랗게 표시해" — 원형 마스크만(다른 값 없음, 사각 금지)
    w_px: 190              # 원 지름(위성 타일은 정사각 가운데 자름 → 원으로 클립, 시설이 중심). v7.4.0 D-0300(UF-146 "위성 사진 크기도 좀 키워야") 118 → 190(화면 폭 22 %)
    gap_px: 14             # 표적 점에서 원 테두리까지(D-0300 10 → 14)
    lead_sec: 0.2          # 착탄 이 시간 전부터 나타남
    hold_sec: 3.0          # 착탄 링 뒤 머무는 시간
    fade: [0.35, 0.8]      # in/out(D-0300 out 0.45 → 0.8 — 이벤트 끝 전에 페이드가 끝난다)
    frame: {width: 1.2, alpha: 0.55}   # 가는 흰 원 테두리(D-0300 1.0 → 1.2)
    caption_dy: 11         # 원 아래 출처 줄 기준선 간격(가운데 정렬)
    caption_size: 10       # 출처 줄 글자(layout_480p.min_font_px 이상, D-0300 8.5 → 10)
    caption_halo: 2.4      # 출처 줄 글자 테두리(컷아웃 출처 줄과 같은 값)
    hold_same_place: true  # v7.4.0 D-0229 §2.7(UF-107) — inset.place 이름을 말하는 연속 문장 끝까지 유지(명시 hold_until 우선)
    # v7.4.0 D-0240 §2(감독 육안 "키리시 인셋 원이 위 가장자리에 걸려 잘린다") — 인셋 원+출처 줄은 안전 영역(날짜 배지 아래·자막 띠 위·좌우 여백) 안에 전부.
    # 연출이 고른 side 가 벗어나면 side_order 순서로 첫 맞는 자리(결정적). 어느 자리도 안 맞으면 [inset-clipped] hard
    safe_margin_px: 6
    side_order: [up_right, up_left, down_right, down_left, right, left, up, down]
    # v7.4.0 D-0300(UF-146) — 자리(side)는 등장 첫 프레임에 한 번 정해 유지(sticky). 안전 영역을 벗어나면 다음 적합 자리로 move_sec 보간(한 프레임 점프 금지).
    # 검사 [inset-jump] hard(원 중심 프레임 간 이동 > jump_px_max) · [inset-side-change] warn(자리 바뀐 횟수). 값은 감독 제안(사용자 합격 값 아님)
    sticky_side: true
    move_sec: 0.6
    jump_px_max: 24
    # v7.4.0 D-0305 — 자리는 예측해서 고른다: 인셋 생애(lead~hold_until)의 모든 프레임 구도에서 안전 영역·표적 표지 라벨에 맞는 side 를 side_order 순으로 먼저 찾아
    # 처음부터 고정(미끄러짐 0). 없을 때만 sticky + 보간. 표적 표지(같은 자리 marker) 라벨 상자는 늘 장애물(D-0305 ①)
    predict_keyframes: true
    move_headroom: 0.75          # 보간 시간은 move_sec 이 하한 — 거리가 길면 최고 속도 ≤ jump_px_max × 0.75 가 되게 늘린다(geo 콘티 판 v2.1: 0.6초 보간이 25px/프레임)
island:                    # v5.1.0 back_and_forth D-0123 §1·D-0126(Q1~Q4 A) — backdrop 무대 위 내용물 상자(아일랜드) 공통 규칙. engine/island.py. 설계 px(480p)
  # 연출은 픽셀을 다루지 않는다 — 차트 아일랜드는 box(boxes 이름)만 고른다. 등장 = 슬라이드 layout_480p.card.slide_px + 페이드 card.fade_sec(카드 규칙 재사용)
  # 겹침(checks island_overlap hard, Q3 A): 같은 순간 보이는 아일랜드 제자리 상자(그림자·슬라이드 경로 제외)끼리 교차 > 0, 자막 구역(reserved_zones.subtitle) 교차.
  # 아일랜드 = island 이벤트(차트) · 사진·영상(media_box) · 프리미티브(primitive_box) · backdrop 무대 위 패널(panel_box, Q4 A). 카드·배지는 기존 예약 영역 규칙.
  radius: 10
  fill_alpha: 0.78         # 바탕 = stage_timeline.bg_rgb(D-0121 §B fill_rgb = 현 bg_rgb)
  edge_alpha: 0.18         # 흰 테두리
  edge_w: 1.0
  shadow: [[6, 0.12], [3, 0.2]]   # [번짐 px, 알파] — 기사 카드 그림자와 같은 값
  max_concurrent: 2        # 같은 순간 아일랜드 수 상한(checks island_overlap)
  source_wrap_lines_max: 2   # v7.4.0 back_and_forth D-0265 §3 — 레인 출처 줄이 아일랜드 상자·시간축 틀 폭(축 값 자리 제외)을 넘으면 " · " 경계에서 두 줄로 접는다(정보 손실 없음). 그래도 넘치면 [chart-edge-bleed]
  boxes:                   # [x, y, 폭, 높이] — 가운데 = 폭 78 %·높이 62 %(D-0121 §B), left·right = 오른쪽·왼쪽 카드 열(card_right x ≥ 594)을 비운다. 한 영상의 차트 아일랜드는 같은 높이 상자만(레인 영역 한 벌 — engine.project 검사, v7.4.0 D-0268)
    center: [94, 56, 666, 298]
    left: [24, 56, 540, 298]
    left_tall: [24, 52, 540, 344]   # v7.4.0 back_and_forth D-0268 — 레인 둘이면 금리 값 영역 ≈ 65px(left 는 46px). 위 52 = 날짜 뱃지 밑줄 아래, 아래 396 = 자막 2줄 위. 오른쪽 끝 564 = 카드·사진 열(x ≥ 594) 밖
    right: [290, 56, 540, 298]
  panel_box: [44, 40, 766, 362]   # backdrop 무대 위 패널 상자(패널 본문 x 80~774·제목 기준선 74 를 담고 자막 구역 410 위) — 패널 덮개(panel.cover_alpha) 대신(Q4 A)
  chart:                   # 차트 아일랜드 안 레인 영역(Q2 A): [pad_top, 상자 높이 − pad_bottom], 세로 척도 = min(lane_h_max, 영역 ÷ 레인 수) — v7.4.0 D-0269 전에는 stage_timeline.lane_h
    pad_top: 34            # 압축 라벨(wave.label_dy −7) 자리
    pad_bottom: 40         # 날짜 눈금 라벨(grid.label_dy 17) 자리
    # v5.2.0 back_and_forth D-0133 §1 — 차트 아일랜드 안 마커 라벨(글자 상자)이 상자 가장자리 − label_flip_pad 를 넘으면 점 반대쪽(오른쪽 → 왼쪽)에 붙이고,
    # 그래도 넘치면 상자 안으로 클램프. 아일랜드 마커에만(지도·시간축 무대 마커 경로 무변경). 기본 = 점 ↔ 라벨 여백(markers._SIDE dx 12)과 같은 값.
    # 그 뒤에도 상자 밖 = checks island_label_clip hard `[island-label-clip]`, 라벨 ↔ 같은 순간 시리즈 출처 줄 교차 = island_label_overlap warning `[island-label-overlap]`
    label_flip_pad: 12
    lane_h_max: 135   # v7.4.0 back_and_forth D-0269 — 아일랜드 레인 높이 상한(세로 척도 = min(이 값, 영역 ÷ 레인 수)) — 레인 둘 이상일 때만. 레인 하나면 영역 전체(D-0274 §1①, UF-142 "세로축을 늘리란 말이야")
    # v7.4.0 back_and_forth D-0274 §1①·D-0276 — 플롯(값 레인 띠) 세로 합 ≥ 액자 안쪽 높이 × 이 값. 레인을 쌓아 금리 차트가 눌리면 [plot-height] hard(UF-137·140·142 부류)
    plot_min_ratio: 0.7
  # v5.2.0 back_and_forth D-0129 §B(사용자 판정 D113 "차트 없이 블러 배경 + 오른쪽 카드만 나오는 화면이 너무 오래 간다") — 주 아일랜드 상시.
  # checks backdrop_main_missing hard: backdrop 무대에서 main_kinds(chart = island kind chart, 그 밖 = 이벤트 type)가 하나도 보이지 않는 구간 > card_only_max_sec
  # → `[backdrop-main-missing] t0-t1 {n}s`(타이틀·엔딩 카드·기사 구간 제외, provenance backdrop.main_missing[]). 코드는 카드를 기사로 바꾸지 않는다(P8) — 검사 + 문법 + 재연출
  main_required: true
  main_kinds: [chart, primitive, photo, clip, article, panel]   # panel = D-0130 Q3 B(backdrop 패널 766×362 는 화면 대부분을 채우는 아일랜드)
  card_only_max_sec: 3.0   # 전환(앞 아일랜드 퇴장 ~ 다음 등장) 허용 폭

genre_prompt:              # v4.4.0 D-0090 작업 1 — 장르 프롬프트 층(docs/handoff/20 §5.1·§5.2·§6·§7·§9, 15 P3). 워커가 장르 프로필 + 이 절로 프롬프트 끝 문단을 만든다(workers/prompt_loader.py)
  base_genre: geopolitics  # 기본 프롬프트(prompts/*.md)가 이미 전제한 장르 — 이 장르는 추가 문단 0(프롬프트 바이트 동일)
  narration:               # 20 §7 — 장르 프로필 narration 키가 참(또는 값 있음)이면 이 문장이 원고·리서치 프롬프트에 들어간다. {n} = 키 값
    define_terms_once: "전문 용어는 첫 등장 때 한 문장으로 정의한다(예: \"점도표는 FOMC 참가자들이 각자 예상하는 금리를 점으로 찍은 표입니다\"). 두 번째부터는 정의하지 않는다."
    attribute_causality: "인과는 단정하지 않고 귀속한다(\"연준은 ~라고 설명했습니다\", \"~라는 분석이 있습니다\"). 경제 인과는 논쟁 사안인 경우가 많다 — 균형 원칙을 그대로 적용한다."
    numbers_per_sentence_max: "한 문장에 숫자는 {n}개 이하. 나머지 숫자는 화면(시리즈·카드·패널)이 말한다."
    forecast_attribution: "전망은 누구의 전망인지 귀속한다(\"FOMC 참가자들의 전망 중앙값\"). 점도표는 약속이 아니라 참가자별 전망임을 한 번 말한다. 가격·금리 예측을 단정하지 않는다."
  data_sources:            # 20 §5.1 — 리서치·원고 프롬프트의 데이터 원칙
    - 수치는 1차·공개 출처(중앙은행 공식 발표, 통계기관, FRED 같은 공개 데이터 저장소)에서만 가져온다.
    - 시장 사업자의 독점 데이터(선물 가격에서 추정한 금리 확률 등)는 쓰지 않는다. 필요하면 보도 인용(기사)으로 대신하고 누가 보도했는지 귀속한다.
    - 데이터 레코드(series:<id>)가 있는 수치는 레코드 값과 기준 시점 그대로 쓴다(반올림·추정 금지).
  rubric_extra:            # 20 §9 — 시각 검수 루브릭 추가 7항목(17 §4.2 에 덧붙임). 검수 출력 rubric[] 에 항목마다 판정
    - 슬라이드처럼 보이는가(장면마다 새 캔버스, 차트가 한 장씩 넘어감) — 그렇다면 실패
    - 무대가 연속적인가(카메라가 같은 좌표계 위를 움직이는가)
    - 차트가 정직한가(0 기준·압축 물결·로그 표기), 단위·기준 시점·출처가 보이는가
    - 숫자가 화면과 내레이션에서 일치하는가
    - 색 의미가 장르 프로필과 일치하는가(인상/인하, 상승/하락)
    - 전문 용어가 정의 없이 쏟아지는가
    - 투자 권유로 읽히는 표현이 있는가
  stage_grammar:           # 20 §6 — 무대별 카메라·연출 문법. 주 무대 줄이 연출·수정·검수 프롬프트에 들어간다(키 ∈ registries.stages)
    backdrop:              # v5.1.0 D-0123 §1(사용자 확인 D108)
      - "배경: 권리 기록 있는 실사진(미디어 레지스트리 photo)을 블러로 깐다. 장면(주제)이 바뀔 때만 바꾸고 연속 같은 사진은 금지, 영상 전체 서로 다른 사진 3~6장. 전환은 crossfade 만(줌 범프 금지). 사진이 없으면 지어내지 않는다."
      - "카메라: 빈 카메라 {}(이동 없음). 움직임은 배경의 느린 확대와 아일랜드 등장·전환이 만든다."
      - "내용물은 아일랜드로 띄운다 — 차트·개념도·사진·영상·기사·패널·게시물. 같은 순간 아일랜드는 2개 이하, 서로 겹치지 않는다."
    timeline:
      - "이동: 왼쪽 → 오른쪽 시간 순이 기본이다. 되돌아갈 때는 이유가 있을 때만, 그 숏의 reason 에 이유를 적는다."
      - "확대: 축 스케일(w)은 영상 전체에서 하나로 고정한다 — 확대·축소 없음(축 스케일 절, 검사 [timeline-rescale], v7.4.0 D-0261·UF-138). 사건 핀으로는 중심 이동(pan)으로 가고, 핀의 근거는 카드·기사·사진으로 띄운다(v5.1.0 D-0121 §A — 옛 '핀마다 확대'를 대체)."
      - "암전 컷: 수십 년 점프, 보조 무대로 넘어갈 때만."
      - "공통: 장면당 이동 1회, 숏 6초 이상, 도착 뒤 드리프트, 요소는 하나씩."
      - "무대는 하나의 연속된 좌표계다. 장면마다 새 캔버스를 띄우지 않는다(슬라이드 금지). 차트는 시간축 레인 위 series 로, 무대로 말할 수 없는 정보만 패널·카드로."
      - "휑한 화면 금지: 컷마다 무대 밖 요소가 하나 이상 떠 있다(핀 카드·인물 뱃지·기사·사진·statement_diff·dot_plot). 얇은 선과 빈 레인만 있는 컷을 만들지 않는다."   # v4.4.0 D-0091 ①
      - "핀 = 사건 + 근거: 핀에서 확대할 때 근거(카드·기사·사진·statement_diff)를 함께 띄운다. 같은 핀에 숏 두 개로 머물지 않는다."   # v4.4.0 D-0091 ④
      - "콜드 오픈은 가장 최근 회의 핀 확대 + 인물 뱃지 + 성명 인용으로 연다(20 §10). 전체 조망은 끝에서 한 번."   # v4.4.0 D-0091 ⑤
      - "정책 금리 계단·목표 범위 띠는 color_by: change(인상·인하·동결 색을 코드가 레코드 변화로 정한다). 시장 금리·물가 선은 fixed."   # v4.4.0 D-0091 ②

data:                      # v4.3.0 D-0084 작업 1 — 데이터 레코드(docs/handoff/20 §5.1, schemas/data_models.py:SeriesRecord). 이 목록 밖 값 = 로드 오류(15 P6)
  units: ["%", "%p", "bp", "억 달러", "지수", "명", "원", "달러/갤런", "mb/d", "kb/d", "건", "척", "ton"]   # 건·척 = v7.4.0 D-0229 §4.3(점 패널 "몇 척 중 몇 척", UF-113). mb/d·kb/d = v7.3.0 D232 U4(하루 백만·천 배럴, 정제 처리량·경유 수출). v5.3.1 달러/갤런 = 미국 경유 소매가(EIA GASDESW, valdai-2026). 화면 단위(20 §5.3 "단위를 화면에 표시")
  # v7.4.0 D-0241 §3(UF-122 "십자가 처럼 보이는 t를 쓰지 말고 ton으로") — 화면 무게 단위는 ton. 숫자 뒤 t 가 화면 문자열에 남으면 [unit-ton-glyph] hard
  unit_ton_pattern: '(?<![A-Za-z])(\d|[만천억백])\s?t(?![A-Za-z])'
  licenses_allowed: [us_gov_public_domain, cc_by_4, press_cited]   # 재배포 가능한 공개 라이선스만(20 §5.1 "시리즈마다 이용 조건 확인"). press_cited = v7.3.0 D232 U4 — 보도 인용값(값 자체는 사실 인용, 값마다 cited 필수)
  unit_prefixes: ["$", "₩", "€", "¥"]                    # v4.3.0 D-0087 보정 1 — 값 앞 통화 기호도 단위 표시로 인정(dual_line y_prefix)
  sources_allowed: [fred.stlouisfed.org, www.federalreserve.gov]   # source_url 도메인(tools/fetch_series.py 가 받는 곳). federalreserve.gov = v4.4.0 SEP 점도표(D-0090 작업 2)
  frequencies: [monthly, release]                           # 값 날짜 간격 — monthly = 매월 1일, 한 달씩. release = 발표 한 번(scatter, v4.4.0)
  transforms:                                               # 코드가 하는 변환(명시된 것만). 레코드 transform.formula 는 이 문구와 같아야 한다
    raw: "원자료(변형 없음)"
    yoy_pct: "전년 동월 대비 % = (x_t / x_(t-12) - 1) * 100, 소수 둘째 자리 반올림"
    sep_dots: "SEP 그림 2 표(값별 참가자 수) → 열마다 참가자별 점(값을 인원수만큼 되풀이, 오름차순)"   # v4.4.0 D-0090 작업 2 — scatter(점도표)
    month_last: "일별 → 그 달의 마지막 관측값(값은 원자료 그대로, 날짜는 그 달 1일)"
    press_cited: "보도 인용값(매체·날짜)"   # v7.3.0 D232 U4 — 1차 표를 열지 못한 값. 코드가 받지 않는다(source_kind press_cited, 값마다 cited)   # v4.4.0 D-0090 작업 2 — DFEDTARU·DFEDTARL(목표 범위 상·하한)
  # v7.3.0 사용자 결정 D232 U4 — 출처 종류. fetched = 코드가 source_url 에서 받은 값(sources_allowed 도메인), press_cited = 보도 인용값(IEA·Vortexa·Kpler·LSEG 등을
  # 언론·보고서가 인용한 값 — 레코드 values 마다 cited{outlet, date, url} 필수, transform press_cited, license press_cited). 추정치 없는 달은 missing(보간 금지 — 선을 끊는다)
