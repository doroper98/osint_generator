  stages_planned: [chart_wall, flow, structure, document]   # v4.2.0 D-0081 — 20 §2.1 무대 카탈로그(구현 전). 장르 프로필 proposed 만 참조 가능, 연출에서 쓰면 오류
  primitives: [statement_diff, dot_plot, site_diagram]   # site_diagram = v4.4.0 dmz_mine_2026 사용자 요청(현장 개념도, 벡터).  dot_plot = v4.4.0 D-0090 작업 3(사용자 승인 대기 — provenance elements.approval pending). v4.2.0 D-0081 — 새 시각 요소(engine/primitives/<id>.py, 20 §4.2). 이벤트 type: primitive + id. 없는 id = 오류, 있는데 모듈 없음 = 오류(P10)
  primitives_planned:     # v4.2.0 D-0082 쟁점 1 A — 구현 전 프리미티브. 장르 프로필 proposed 의 new 만 참조 가능, 연출에서 쓰면 오류
    - rate_step_line      # 20 §3 macro_monetary — v4.3.0: series 이벤트(style: step)가 대신한다. 만들지 않는다(사용자 결정 전이라 목록에서 지우지 않음, D-0084 작업 4·D-0090)
    - yield_curve_shift   # 20 §3 macro_monetary — chart_wall 무대가 필요해 G4 밖(D-0090 작업 3 ③). 구현 전
    - target_band         # 20 §3 macro_monetary — v4.4.0: series style band(두 레코드 사이 띠, rules stage_timeline.band)가 대신한다. 만들지 않는다(D-0090 작업 2)

audio:                     # 10
  bed_gain: 0.47
  duck_depth: 0.5
  duck_pre_sec: 0.25
  duck_post_sec: 0.3
  duck_smooth_sec: 0.35
  narration_peak: 0.8
  master_peak: 0.97
  loudnorm: {I: -14, TP: -1.5, LRA: 11}
  # RENDER-AP-004 — loudnorm(dynamic)이 TP −1.5 를 맞춰도 AAC 인코딩이 트루 피크를 올린다(ElevenLabs 내레이션 실측 −1.50 → −1.09,
  # 허용 여유 0.15 초과). loudnorm 뒤 샘플 피크 리미터를 이 값(dBFS)에 둔다. 실측(dmz_mine_2026): 리미터 뒤 AAC −1.7 dBTP, I −14.2 LUFS.
  post_limiter_dbfs: -2.0
  sfx_policy: events_and_scene_starts_only
  # v3.4.0 D-0060 §0 — audio/mix.py 모듈 상수 이관(값 그대로 = 사용자 합격 v3 mix, md5 c1314fb9 로 증명)
  sample_rate: 44100        # 코덱 상수(audio.mix.SR·engine.mux.SR 와 테스트로 일치 확인)
  seed: 3                   # 효과음 잡음 난수 시드(v3 결정성)
  tail_sec: 0.5             # plan.total 뒤 여백(v3 TOT)
  loop_xfade_sec: 4.0       # BGM 반복 교차 페이드
  fade_in_sec: 1.2
  fade_out_sec: 4.0
  fx_duck: 0.25             # 효과음 덕킹 깊이
  qa:                       # v3.4.0 D-0060 작업 6 — 오디오 QA(audio/qa.py, 검사기 하나). 13 Phase 8·10 §7-5
    i_tol_lu: 1.0                          # 최종 통합 음량 = loudnorm.I ± 이 값
    # D-0061 쟁점 1 A — 사용자 합격본 기준(13 권장 −18~−14 대신): v2 −17.8dB 사용자 거절("너무너무 작다", 10 §3.3), v3 −12.7dB 합격.
    # 실측(v3.4.0): hormuz mix −12.67 · 2패스 final 디코드 −12.55. hard.
    # v4.11.0 back_and_forth D-0118 §2(사용자 위임 D103, G6 청감 판정 대신) — v3 값 [-15, -11] 에서 2 dB 위. 원복은 이 한 줄(+ 아래 norm_ref 0.7)
    music_under_narration_db: [-13, -9]    # 내레이션 구간 음악(+효과음) RMS − 내레이션 RMS
    # D-0061 — 2패스 loudnorm 뒤 남는 AAC 인코딩 트루 피크 오차만 여유로 둔다(먼저 mux 를 고쳤다).
    # 실측: hormuz 2패스(dynamic) 전 −1.50 → final −1.47(+0.03), taiwan_f1_music 전 −1.50 → −1.35(+0.15), 무음악 linear −2.27. 최대 0.15
    tp_codec_margin_db: 0.15
    sentence_rms_dev_db: 3.0               # D-0061 쟁점 2 A — 문장 RMS 가 평균에서 이만큼 넘게 벗어나면 warning(정규화는 하지 않음). hormuz 0건(편차 0.65dB)
    sentence_rms_window_sec: 0.02          # 문장 RMS: 이 길이 창의 RMS 중
    sentence_rms_floor_db: -40             # 최대 창보다 이만큼 이상 작은 창(무음)은 뺀다
    # v4.6.0 D-0097 작업 3·D-0102 1-A — 베드 저역 비율(audio/qa.py, 믹서가 out/bed_stats.json 에 기록) = 베드(내레이션·효과음 제외, 피크 정규화 뒤 모노)의
    # bed_bass_band_hz 대역 RMS − bed_mid_band_hz 대역 RMS(dB, FFT 파워 합). 판정 = 상승폭(처리 후 − 처리 전)이 이 범위 안, 밖 = hard.
    # 절대 비율은 기록만(곡마다 다르다 — zabriskie_patriarch 처리 전 +11.8 dB, D-0097 의 절대 범위 [-6, 0] 은 도달 불가로 폐기)
    bed_bass_rise_db: [4, 8]
    bed_bass_band_hz: [30, 120]
    bed_mid_band_hz: [200, 2000]
  crossfade_sec: 4.0        # v3.4.0 D-0060 작업 5 — 곡 교체 교차 페이드(경계 가운데 정렬, 선형 합 1). BGM 반복 교차 페이드(loop_xfade_sec)와 같은 값
  norm_eps: 1.0e-6          # 피크 정규화 분모 여유
  bed_bass:                 # v4.6.0 D-0097(사용자 결정 D86) — 베드 저음 보강(audio/mix.py process_bed). 곡을 따라가는 처리만 — 고정 근음 드론·절차 합성 없음
    # 순서: 디코드 → (곡 교체면 곡마다) 셸프 → 서브 옥타브 층 합산(장면 시작 스웰) → 피크 정규화(기존) → bed_gain·intensity·덕킹(기존, 값 불변)
    shelf: {freq_hz: 110, gain_db: 5.0, q: 0.7}         # 로우 셸프 biquad(RBJ 쿡북 계수, scipy lfilter), 양 채널
    sub:                    # 서브 옥타브: 모노합 → 밴드패스 → 영교차(상승) 2분주 사각파 → 로우패스 → × 원 대역 포락선 × gain → 양 채널에 더함
      band_hz: [55, 220]
      out_lp_hz: 110
      filter_order: 4       # 밴드패스·로우패스 버터워스 차수(sos)
      gain: 0.35
      env_attack_sec: 0.03  # 포락선(원 대역 블록 RMS×√2 의 attack/release 추종)
      env_release_sec: 0.25
      env_block_sec: 0.001  # 포락선 계산 블록 길이(블록 값을 샘플로 선형 보간)
    swell: {sec: 2.5, depth: 0.35}                       # 장면 시작(첫 장면 제외)에서 서브 층 이득 1+depth → sec 동안 선형으로 1
    # D-0102 2-C — 피크 정규화 기준 ref = 처리 전 피크^(1−norm_ref) × 처리 후 피크^norm_ref. 1.0 = 처리 후 피크(저역 절대 그대로·중역만 내려감),
    # 0.0 = 처리 전 피크(중역 그대로·저역 절대 상승, 음악 레벨 범위 밖). 값 = 기존 오디오 QA hard 를 모두 통과하는 최소값(hormuz·fed_policy 둘 다, 0.1 단위 실측
    # reports/phaseG6/norm_ref_sweep.jsonl·tp_sweep.jsonl): music_under_narration [-15,-11] 에 0.3 dB 여유 → 0.7 이상(0.6 = hormuz −10.98),
    # 최종 트루 피크 ≤ TP + tp_codec_margin_db → 0.8 이상(0.7 = hormuz final −1.34 > −1.35, 0.8 = −1.40, fed 0.7 = −1.41).
    # 0.8 에서 베드 저역 절대 +0.8 dB·중역 −4.5 dB(1.0 은 저역 −0.35·중역 −5.7), 음악 레벨 hormuz −12.12·fed −12.89, 리미터 전 mix 피크 0.93·0.88(내레이션 변화 0)
    # v4.7.0 back_and_forth D-0107 — 0.7 복귀. 트루 피크 조건은 post_limiter(RENDER-AP-004, −2.0 dBFS)가 맡으므로 음악 레벨 여유 0.3 dB 최소값(D-0102 원 기준)만 남는다.
    # 저역 절대 +1.4 dB. 리미터 뒤 실측 reports/phaseG6_5/audio_qa_norm_ref07.json(hormuz·fed)
    # v4.11.0 back_and_forth D-0118 §2 — 음악 상한 [-13, -9] 에 0.3 dB 여유(≤ −9.3)로 드는 최소값(0.1 단위, reports/phaseG10/norm_ref_sweep.jsonl):
    # 0.3 = hormuz −9.26(여유 밖), 0.4 = hormuz −9.83·fed −10.57 → 0.4. 음악 +1.7 dB(0.7 대비), 베드 저역 비율 상승폭 5.35 무변경(정규화는 비율을 바꾸지 않는다)
    norm_ref: 0.4
  sfx:                      # 효과음 합성(v3 mix3) — 필터 계수·시상수·이득
    whoosh: {dur_sec: 1.2, shape_pow: 2.2, low_b: 0.08, low_a: -0.92, low_gain: 0.6, high_b: 0.3, high_a: -0.7, high_gain: 0.25,
             release_sec: 0.08, release_tau_sec: 0.05, gain: 0.2}
    boom: {dur_sec: 2.6, f0_hz: 34, sweep_hz: 44, sweep_tau_sec: 0.25, tone_tau_sec: 0.8, tone_gain: 0.55, noise_b: 0.02, noise_a: -0.98,
           noise_tau_sec: 0.3, noise_gain: 0.6}
    tick: {dur_sec: 0.12, freq_hz: 1800, tau_sec: 0.015, gain: 0.18}
    title_card: {offset_sec: 0.2, whoosh_dur_sec: 1.4, whoosh_v: 1.0, boom_v: 0.6}      # sfx_policy: 타이틀 카드 휙+쿵
    scene_start: {lead_sec: 0.05, whoosh_dur_sec: 0.9, whoosh_v: 0.55}                  # sfx_policy: 장면 시작 휙(첫 장면 제외)

stage_timeline:            # v4.3.0 D-0084 작업 3·4·D-0085·D-0086 — 시간축 무대(engine/stage_timeline.py)·시리즈 레이어(engine/layers/series.py). 설계 px(480p)
  lane_h: 96               # 레인 한 칸 높이 = 무대 세로 척도 y_px_per_unit(D-0085 A). 카메라 w 는 시간 폭만
  area_top: 60             # 레인 영역 위 끝(날짜 배지 아래)
