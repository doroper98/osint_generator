sketch:                    # v5.7.0 back_and_forth D-0140(D130) — 스케치 계층(sketch/, 엔진 레지스트리 밖) 화면 수치 SSOT. 값 = 사용자 검토본(4d9dc65 projects/*_sketch 스크립트 리터럴) 그대로(D-0140 §7 — "더 좋아 보이게" 바꾸지 않는다). 설계 px(480p), 장치 px = output_profile k 배. 사실·연출 값(좌표·시각·발표 수치·문구)은 projects/<pid>/sketch.yaml(spec). 묶음은 S0 뼈대 — S1~S3 이식 때 같은 묶음 안에 키를 더한다
