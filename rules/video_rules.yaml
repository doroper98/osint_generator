colors:                    # 09 §7
  ru: "#ff5566"
  us: "#5aa9ff"
  gold: "#e8b860"
  teal: "#5cc8da"
  green: "#8fd08a"
  muted: "#a9b0bd"
  amber: "#ffb347"
  water: "#7fc4ff"            # v3 render3 C["water"] (v2.1.0 추가 — 코드 상수에서 이관)
  badge_bg: "#1b2a3a"         # v3 badge_at 원판 바탕 (v2.1.0 추가)
  panel_cover: [0.025, 0.03, 0.045, 0.8]
  card_bg: [0.05, 0.06, 0.09, 0.86]
  panel_card_bg: [0.07, 0.08, 0.12, 0.92]
  # v5.18.0 사용자 결정 D154(D-0161 §3) — 지도 위에 직접 놓이는 요소(경로·글로우·마커·국가 채움·지도 위 마커 글자)만 테마별 값.
  # 색상(hue)은 공통값 그대로, 밝기만 낮춤. v5.20.1 사용자 결정 D173(D-0178) — A|C 시트 비교 뒤 **A(휘도 0.11)** 확정(D-0172 C 잠정 대체).
  # 도형 토큰 = A 값. 경로 선 대비는 깊은 바다 위 약 2.3 — 3:1 warning 이 provenance 에 남는 것이 정상(사용자가 보고 고른 값).
  # 글자 토큰(white = 마커 이름, gold_text = 마커 부제)만 A 에서 시작해 25컷 전부 4.5:1(가이드 23 §7 hard)을 넘는 가장 밝은 값(색상 유지, 측정 = reports/phaseQ3b).
  # 없는 테마·키 = 공통값(dark = 공통값, 출력 바이트 동일). gold_text 는 공통값이 없어 gold 로(style.TEXT_BASE). 카드·패널·아일랜드·자막·날짜 HUD·엔딩·뱃지 링은 테마 무관(D-0161 §3)
  themes:
    light:
      ru: "#be0013"
      us: "#005abc"
      gold: "#7c5612"
      teal: "#1a6673"
      green: "#2f6a2a"
      muted: "#555e6e"
      amber: "#885000"
      water: "#005eae"
      white: "#1f2125"      # 지도 위 마커 이름(흰 글자 → 짙은 글자)
      gold_text: "#68480f"  # 지도 위 마커 부제 글자

