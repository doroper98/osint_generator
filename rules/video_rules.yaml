  # 새로 뜨는 뱃지는 자기 자신을 세어 처음부터 그 크기로 뜬다. 연출이 R 를 주면 그 값(적응 없음). 이름표 글자는 R 에 따라 group ↔ solo 사이 보간
  badge:
    R_person_solo: 56
    R_person_group: [30, 34]      # 옛 R_person_map
    R_person_panel: 36
    R_flag: [17, 24]
    R_other: 30                   # 국기·휘장 뱃지 연출 R 없을 때(v3 기본 — 옛 badge_at 리터럴)
    # v7.4.0 D-0240 §4(감독 육안 "바다 위에 홀로 뜬 국기 뱃지") — 국기 뱃지는 카드·인용(시간 겹침 ≥ 절반)이나 마커(anchor_marker_deg 안, 같은 시각)에
    # 붙을 때만. 아니면 [badge-orphan] warning. 빈 지도 구간은 country 강조 + 지명 라벨로
