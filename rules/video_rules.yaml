geo:                       # D29(back_and_forth D-0019) — 지오 자산 단계(geo.prep)
  land_miss_allow_px2: 16  # 국가 면적(deg²) × 티어 ppd² 가 이 값 미만이면 land-miss 를 small 로 허용(4×4 px). 이상 = drop
  land_fill_min_ratio: 0.5   # v4.1.0 D-0078 — 국가 원본 피처 합집합 영역 안 육지 화소 비율이 이 값 미만이면 land-miss(대표점 한 점이 아니라 면적, 키 충돌 덮어쓰기 검출)
  # v4.7.0 back_and_forth D-0107 D2(b) — 이 이름(부분 일치, 대소문자 무시)을 단 route 이벤트(label·{path:})·paths 키 = checks [boundary-as-route] hard(M8 재발 방지).
  # 경계선은 지도 경계 레이어가 그린다.
  boundary_names: [군사분계선, MDL, 국경, 휴전선, NLL, 북방한계선, 남방한계선, 경계선, 분계선, 접경선, border, boundary]
  # v4.10.0 back_and_forth D-0116(B-1, D-0107) — 지명 사전. 지도 무대 place 키·그 place 를 쓰는 marker label·인라인 marker label 이
  # 사전 이름과 맞으면 좌표를 대조한다: 맞은 항목 모두의 허용 오차(tol_km) 밖 = checks [geo-mismatch] hard, 사전에 없는 이름 = [geo-unsourced] warning.
  # 사전 = manual(수기 — 해협·섬·만·공항·기지·국가, 항목마다 출처·tol_km) + ne(tools/build_gazetteer.py 가 NE 10m populated places 에서 생성).
  gazetteer:
    path: data/gazetteer.yaml
    ne_min_population: 100000   # NE POP_MAX 이 이상이거나 수도(ADM0CAP·FEATURECLA Admin-0 capital)면 수록
    ne_tol_km: 25               # NE 항목 허용 오차(도심 점 ↔ 연출 좌표. 큰 도시 반경 수준 — 엉뚱한 곳·경위도 뒤바뀜을 잡는 게 목적)
  # v5.13.0 back_and_forth D-0153 Q0-2 — 지도 테마(시안). 지형 래스터는 geo.prep 가 굽는다(terrain) → 테마 = 준비 산출물 분기
  # (dark = assets/, 그 밖 = assets/theme_<이름>/). 지도 선·지명 색(map)은 렌더가 읽는다. 고르기 = direction stage_config.mercator.theme.
  # dark = v3 사용자 합격 값 그대로(geo/prep_tiers 상수·engine/layers 리터럴·colors.sea_label 에서 이관, 출력 바이트 동일).
  # light = 가이드 23 §13·§15 시안 값(Q0 시제품 — 사용자 결정 뒤 Q3 에서 한 테마만 남긴다, D-0153 §2).
  map_layers_default: [roads, rivers]   # v7.4.0 D-0231 — 지도 레이어 기본 켬. 끄려면 direction stage_config.mercator.map_layers + map_layers_reason(골든 hormuz = [])
  # v7.4.0 D-0241 §2 — 막지도 삭제 뒤에도 남는 국가 폴리곤 자료(NE 110m, tools/build_flat_map.py). 국기 뱃지 영토(flag_territory)·바다만 보이는 프레임(sea_only_frame) 육지 마스크
  country_polygons: data/geo_flat/ne_110m_countries.json
  river_major_scalerank_max: 5   # v7.4.0 D-0229 §2.1-2 — NE 강 scalerank ≤ 5 = 큰 강(볼가·아무르·유프라테스·티그리스·네바), 그 밖 = 작은 강
  themes:
    default: dark
    dark:
      terrain:
        land_stops: [[0, "#2b313a"], [400, "#30353c"], [1500, "#3b3a3a"], [4000, "#4b4640"]]   # 고도(m) → 색
        sea_stops: [[0, "#1c4a66"], [60, "#18415c"], [400, "#11304a"], [2000, "#0c2236"], [6000, "#081626"]]   # 수심(m) → 색
        exaggeration: [2.8, 2.0]        # 지형 과장 [설계 ppd < 64, 그 이상]
        sun: [315, 42]                  # 광원 방위·고도(도)
        land_shade: {base: 0.58, gain: 0.95, lo: 0.5, hi: 1.5}   # 육지색 × clip(base + gain·(hs − sin 고도), lo, hi)
        sea_shade: null                 # 해저 hillshade 없음
        sea_tint: null                  # 바다 회색 → RGB 변환 없음(sea_stops 가 이미 색)
        coast_glow: {rgb: "#3a9cb8", strength: 0.2, blur_px: [3, 8]}   # 해안 광채(바다 쪽) — blur [설계 ppd < 64, 그 이상] × k
      map:
        border: {rgb: [0.82, 0.86, 0.92], width: 0.75, alpha: null}            # alpha null = 무대 LOD border_alpha(near/far)
        admin: {rgb: [0.8, 0.84, 0.9], width: 0.55, dash: [2.5, 2.5], alpha: null}   # alpha null = LOD admin_lines_fade.alpha
        sea_label: "#9cc8e6"
        country_label: [0.9, 0.92, 0.96]
        admin_label: [0.78, 0.82, 0.88]
        city_dot: {fill: [0.95, 0.96, 0.98], edge: [0.0, 0.0, 0.0], edge_alpha: 0.6}
        city_label: [0.93, 0.94, 0.97]
        halo: [0.02, 0.03, 0.05]        # 지명 글자 테두리(engine.typography.text 기본값과 같음)
        # v7.4.0 D-0229 §2.1-2(UF-106) — 도로·강(Natural Earth 10m). 단일 stroke, casing·glow 없음(가이드 23 §15). 설계 px(480p). 시안 값 — 콘티에서 보고 조정
        roads:
          motorway: {rgb: [0.62, 0.64, 0.68], width: 0.55, alpha: 0.55}
          trunk: {rgb: [0.56, 0.58, 0.62], width: 0.45, alpha: 0.5}
          primary: {rgb: [0.5, 0.52, 0.56], width: 0.35, alpha: 0.42}
        rivers: {rgb: [0.42, 0.62, 0.74], width_major: 0.5, width_minor: 0.35, alpha_major: 0.6, alpha_minor: 0.4}
        label_contrast_fix: {halo: 4.2, halo_a: 1.0}   # v5.21.2 D-0186 §2-1 — 국소 보정(dark 골든은 대상 글자 0 — 바이트 무변화)
    light:
      terrain:
        land_stops: [[0, "#f3f3f1"], [400, "#ececea"], [1500, "#dfdfdc"], [4000, "#d2d2ce"]]   # 밝은 회색 높이 톤(§13, 시안 실측 육지 225~246)
        sea_stops: [[0, "#d3d3d3"], [60, "#c8c8c8"], [400, "#b9b9b9"], [2000, "#a5a5a5"], [6000, "#939393"]]   # 회색 깊이 g → sea_tint
        exaggeration: [2.7, 1.7]        # §13 데모 2.7→1.7
        sun: [315, 42]                  # §13
        land_shade: {base: 1.0, gain: 0.35, lo: 0.86, hi: 1.05}   # 대비 낮게(§13 "선·라벨을 읽을 수 있게")
        sea_shade: {base: 1.0, gain: 0.3, lo: 0.9, hi: 1.06}      # 해저 별도 hillshade(§13)
        sea_tint: [-21, -5, 8]          # §15 g → (g−21, g−5, g+8), 0~255, 육지 제외
        coast_glow: {rgb: "#3a9cb8", strength: 0.0, blur_px: [3, 8]}   # 밝은 바다에는 광채 없음
      map:
        border: {rgb: [0.212, 0.212, 0.212], width: 0.77, alpha: 0.9}            # §15 1.15px@720 ÷ 1.5, RGB 54, α 230
        admin: {rgb: [0.592, 0.592, 0.592], width: 0.37, dash: [], alpha: 0.42}  # §15 ADM1 .55px@720 ÷ 1.5, gray151, α 108, 실선
        sea_label: "#3d6f8e"
        country_label: [0.2, 0.21, 0.23]
        admin_label: [0.36, 0.37, 0.39]
        city_dot: {fill: [0.16, 0.17, 0.19], edge: [1.0, 1.0, 1.0], edge_alpha: 0.7}
        city_label: [0.054, 0.0585, 0.0675]
        halo: [0.97, 0.97, 0.96]
        # v7.4.0 D-0229 §2.1-2 — 가이드 23 §15(720p px ÷ 1.5): motorway gray73 α.80, trunk gray91 α.73, primary gray119 α.59; 강 RGB 135/183/208
        roads:
          motorway: {rgb: [0.286, 0.286, 0.286], width: 0.53, alpha: 0.8}
          trunk: {rgb: [0.357, 0.357, 0.357], width: 0.43, alpha: 0.73}
          primary: {rgb: [0.467, 0.467, 0.467], width: 0.33, alpha: 0.59}
        rivers: {rgb: [0.529, 0.718, 0.816], width_major: 0.47, width_minor: 0.33, alpha_major: 0.88, alpha_minor: 0.57}
        route_label: {style: ink, halo: 3.4, mark_w: 12, mark_h: 3, mark_gap: 5}   # v5.21.11 D-0191 §1-3 — 밝은 지도: 짙은 글자 + 밝은 halo, 경로 색은 글자 앞 짧은 막대
        label_contrast_fix: {halo: 4.2, halo_a: 1.0}   # v5.21.2 D-0186 §2-1 — 실제 바탕 대비가 qa_checks.map_contrast_text 미만인 지명만 이 halo 로 다시 그린다(국소, 전역 값 무변경)
        # v5.18.0 D-0161 §2(가이드 23 §14 "밝고 얇은 coast/water 스타일") — 국경 = 두 나라 공유 변만, 해안 = 나머지(물빛·가늘게)
        coast: {rgb: [0.42, 0.55, 0.66], width: 0.45, alpha: 0.85}

credits:                   # D-0030(D35) — 권리 레지스트리 종류별 표기 위치. 카드 ∪ 설명문 = 전 자산. 두 목록 밖 종류 = RightsError
  card_kinds: [people, emblems, flags, map, media, music, narration]   # 엔딩 카드(C0 유지, v3 골든 END 컷 무변경)
  description_only_kinds: [fonts]                                      # 07 §7.3 영상 내 표기 의무 없음 → 설명문 자동 크레딧 블록만
  music_card_license: "{author} · {license}"                           # v3.4.0 — 음악 문구는 BGM 레지스트리에서(v3 credits.yaml 수기 문구와 같은 결과)
  music_description: 'Music: "{name}" — {author} ({license})'          # 설명란 footer 의 {music} 자리(v3 description.yaml 문구와 같은 결과)

registries:                # 15 §3 P10 — 여기 없는 타입을 연출이 쓰면 오류, 있는데 렌더러가 없으면 오류
  event_types: [marker, route, tanker_loop, barrier, ships, boom, country, badge, card, panel, dip, photo, clip, cutout, article, post, primitive, series, backdrop, island, cascade, quote, flight]   # flight = v7.3.0 D-0206(비행·꼬리선·착탄 링·위성 인셋, 사용자 결정 D232). island = v5.1.0 D-0126 Q1(차트 아일랜드 — 뷰포트 카메라 = stage: timeline 숏), backdrop = v5.1.0 D-0121 §B·D-0123(backdrop 무대 배경 사진, 미디어 레지스트리 photo), post = v3.2.0 복귀(D26, 18 §5), primitive = v4.2.0 D-0081(id → registries.primitives), series = v4.3.0 D-0084(시간축 무대, 데이터 레코드), cascade = v5.3.0 D-0139(겹침 카드, 사용자 결정 D116·D117), quote = v5.4.0 정규(인물 발언 인용, 사용자 결정 2026-10-02)
  event_types_planned: [occupied, arc, channel, shield, tl, particles, flash, dots, line, arrow]   # v1/v2 이식 후보(미구현 = 사용 불가). movers = v7.3.0 flight 로 대체(D-0206 §1-2)
  panel_kinds: [relation, statement, timeline, precedent, versus, dots, gantt, dual_line, fork, checklist, network]   # relation = v3 refusal 일반화, 뒤 6종 = v2 차트 이식(D-0032)
  panel_kinds_planned: []
  badge_kinds: [person, flag, emblem]
  accents: [gold, us, ru, teal, muted, green, amber]
  stages: [mercator, timeline, backdrop]   # backdrop = v5.1.0 D-0123(사진 배경 무대, engine/stage_backdrop.py). v4.1.0 D-0076 — 무대(engine.stage). 없는 무대 = 오류, 있는데 구현(STAGE_CLASSES)이 없음 = 오류(P10). timeline = v4.3.0 D-0084 작업 3
  stages_planned: [chart_wall, flow, structure, document]   # v4.2.0 D-0081 — 20 §2.1 무대 카탈로그(구현 전). 장르 프로필 proposed 만 참조 가능, 연출에서 쓰면 오류
  primitives: [statement_diff, dot_plot, site_diagram]   # site_diagram = v4.4.0 dmz_mine_2026 사용자 요청(현장 개념도, 벡터).  dot_plot = v4.4.0 D-0090 작업 3(사용자 승인 대기 — provenance elements.approval pending). v4.2.0 D-0081 — 새 시각 요소(engine/primitives/<id>.py, 20 §4.2). 이벤트 type: primitive + id. 없는 id = 오류, 있는데 모듈 없음 = 오류(P10)
  primitives_planned:     # v4.2.0 D-0082 쟁점 1 A — 구현 전 프리미티브. 장르 프로필 proposed 의 new 만 참조 가능, 연출에서 쓰면 오류
    - rate_step_line      # 20 §3 macro_monetary — v4.3.0: series 이벤트(style: step)가 대신한다. 만들지 않는다(사용자 결정 전이라 목록에서 지우지 않음, D-0084 작업 4·D-0090)
    - yield_curve_shift   # 20 §3 macro_monetary — chart_wall 무대가 필요해 G4 밖(D-0090 작업 3 ③). 구현 전
    - target_band         # 20 §3 macro_monetary — v4.4.0: series style band(두 레코드 사이 띠, rules stage_timeline.band)가 대신한다. 만들지 않는다(D-0090 작업 2)

audio:                     # 10
  # v5.17.0 D-0169(DECISIONS D163) — Supertonic M3 ×0.95 기준 재보정. 옛 0.47 = edge InJoon 피크 정규화 기준(사용자 합격 균형).
  # Supertonic 은 같은 피크에서 내레이션 RMS 가 0.84 dB 낮아 음악−내레이션이 −9.83 → −9.00(범위 밖)이 됐다. 0.43(−0.77 dB)로
  # 목표 ≈ −9.8 dB(D103 범위 [−13, −9] 유지) 복원. 측정 = reports/phaseV3/run_log §4. 목소리가 또 바뀌면 RMS 정규화 믹서 트랙(R-0198 B)
  bed_gain: 0.43
  # v7.2.0 UF-100 D-0222 — BGM 등록 실측 하한(잠정 — 사용자 청취 합격 1곡 근거: "1번만 합격. 약간 박진감이 느껴지는 부분에서 점수를 줬어.").
  # 측정 = audio.bgm_measure(librosa, 모노 sr·n_fft 아래 값, 0~window_sec). 레지스트리 available 곡이 못 넘으면 실패(audio.registry.bgm_path·시험).
  # 실측(2026-10-12): Mario Bava 명확도 6.55·온셋 분당 473.5·300~3000 Hz 8.8 % / Patriarch(기준 곡) 7.12·328.7·2.9 % / 불합격 후보 명확도 3.2~4.3·온셋 25~302.
  bgm_floor: {beat_clarity_min: 6.0, onsets_per_min_min: 300.0, voice_band_max: 0.10, voice_band_hz: [300, 3000], window_sec: 360, sr: 22050, n_fft: 4096}
  bgm_default: [music.zabriskie_mario_bava, music.zabriskie_patriarch]   # v7.2.0 D-0222 — 새 영상 sound.bgm 권장 순서(첫째 = 사용자 합격곡 UF-100)
  duck_depth: 0.5
  duck_pre_sec: 0.25
  duck_post_sec: 0.3
  duck_smooth_sec: 0.35
  narration_peak: 0.8
  master_peak: 0.97
  loudnorm: {I: -14, TP: -1.5, LRA: 11}
  # RENDER-AP-004 — loudnorm(dynamic)이 TP −1.5 를 맞춰도 AAC 인코딩이 트루 피크를 올린다(ElevenLabs 내레이션 실측 −1.50 → −1.09,
  # 허용 여유 0.15 초과). loudnorm 뒤 샘플 피크 리미터를 이 값(dBFS)에 둔다. 실측(dmz_mine_2026): 리미터 뒤 AAC −1.7 dBTP, I −14.2 LUFS.
  post_limiter_dbfs: -2.0
  sfx_policy: events_and_scene_starts_only
  # v3.4.0 D-0060 §0 — audio/mix.py 모듈 상수 이관(값 그대로 = 사용자 합격 v3 mix, md5 c1314fb9 로 증명)
  sample_rate: 44100        # 코덱 상수(audio.mix.SR·engine.mux.SR 와 테스트로 일치 확인)
  seed: 3                   # 효과음 잡음 난수 시드(v3 결정성)
  tail_sec: 0.5             # plan.total 뒤 여백(v3 TOT)
  loop_xfade_sec: 4.0       # BGM 반복 교차 페이드
  fade_in_sec: 1.2
  fade_out_sec: 4.0
  # v7.4.0 back_and_forth D-0274 §2③·D-0276(사용자 의견 UF-141 "영상에 대한 목소리도 들리도록 해") — 클립 원음 트랙(audio.mix). 원음은 가공 단계에서
  # 레지스트리 segment 그대로 media/<file>_clip.wav(44.1kHz 스테레오)로 뽑고, 피크를 narration_peak 에 맞춘 뒤 이 이득. main(발언·현장, 액자) 구간은
  # 음악 베드를 bed_duck_db 만큼 낮춘다(bed_gain 0.43 불변). 내레이션이 겹치는 동안 클립은 narration_duck_db 만큼 더 낮춘다(broll 은 내레이션 아래).
  clip: {main_gain_db: 0, broll_gain_db: -18, narration_duck_db: -18, bed_duck_db: -18, duck_fade_sec: 0.3}
  fx_duck: 0.25             # 효과음 덕킹 깊이
  qa:                       # v3.4.0 D-0060 작업 6 — 오디오 QA(audio/qa.py, 검사기 하나). 13 Phase 8·10 §7-5
    i_tol_lu: 1.0                          # 최종 통합 음량 = loudnorm.I ± 이 값
    # D-0061 쟁점 1 A — 사용자 합격본 기준(13 권장 −18~−14 대신): v2 −17.8dB 사용자 거절("너무너무 작다", 10 §3.3), v3 −12.7dB 합격.
    # 실측(v3.4.0): hormuz mix −12.67 · 2패스 final 디코드 −12.55. hard.
    # v4.11.0 back_and_forth D-0118 §2(사용자 위임 D103, G6 청감 판정 대신) — v3 값 [-15, -11] 에서 2 dB 위. 원복은 이 한 줄(+ 아래 norm_ref 0.7)
    music_under_narration_db: [-13, -9]    # 내레이션 구간 음악(+효과음) RMS − 내레이션 RMS
    # D-0061 — 2패스 loudnorm 뒤 남는 AAC 인코딩 트루 피크 오차만 여유로 둔다(먼저 mux 를 고쳤다).
    # 실측: hormuz 2패스(dynamic) 전 −1.50 → final −1.47(+0.03), taiwan_f1_music 전 −1.50 → −1.35(+0.15), 무음악 linear −2.27. 최대 0.15
    tp_codec_margin_db: 0.15
    sentence_rms_dev_db: 3.0               # D-0061 쟁점 2 A — 문장 RMS 가 평균에서 이만큼 넘게 벗어나면 warning(정규화는 하지 않음). hormuz 0건(편차 0.65dB)
    sentence_rms_window_sec: 0.02          # 문장 RMS: 이 길이 창의 RMS 중
    sentence_rms_floor_db: -40             # 최대 창보다 이만큼 이상 작은 창(무음)은 뺀다
    # v4.6.0 D-0097 작업 3·D-0102 1-A — 베드 저역 비율(audio/qa.py, 믹서가 out/bed_stats.json 에 기록) = 베드(내레이션·효과음 제외, 피크 정규화 뒤 모노)의
    # bed_bass_band_hz 대역 RMS − bed_mid_band_hz 대역 RMS(dB, FFT 파워 합). 판정 = 상승폭(처리 후 − 처리 전)이 이 범위 안, 밖 = hard.
    # 절대 비율은 기록만(곡마다 다르다 — zabriskie_patriarch 처리 전 +11.8 dB, D-0097 의 절대 범위 [-6, 0] 은 도달 불가로 폐기)
    bed_bass_rise_db: [4, 8]
    bed_bass_band_hz: [30, 120]
    bed_mid_band_hz: [200, 2000]
  crossfade_sec: 4.0        # v3.4.0 D-0060 작업 5 — 곡 교체 교차 페이드(경계 가운데 정렬, 선형 합 1). BGM 반복 교차 페이드(loop_xfade_sec)와 같은 값
  norm_eps: 1.0e-6          # 피크 정규화 분모 여유
  bed_bass:                 # v4.6.0 D-0097(사용자 결정 D86) — 베드 저음 보강(audio/mix.py process_bed). 곡을 따라가는 처리만 — 고정 근음 드론·절차 합성 없음
    # 순서: 디코드 → (곡 교체면 곡마다) 셸프 → 서브 옥타브 층 합산(장면 시작 스웰) → 피크 정규화(기존) → bed_gain·intensity·덕킹(기존, 값 불변)
    shelf: {freq_hz: 110, gain_db: 5.0, q: 0.7}         # 로우 셸프 biquad(RBJ 쿡북 계수, scipy lfilter), 양 채널
