    median_alpha: 0.95
    label_dy: 14                 # 열 이름 기준선 = 가장 낮은 점 아래 이 값(설계 px). 제안 값
    hold_clip: hard              # v7.4.0 D-0277 §1 — 카메라가 머무는 창(이동 끝·홀드)에서 전망 열은 플롯 안에 완전히 들거나 완전히 나간다(점 반지름 이상 잘림 = hard). 전망 열이 보이는 홀드 창에는 마지막 실측 점도 보인다(선 → 점 연속). 이동 중 통과는 허용. 검사 [chart-edge-bleed]
  axis_scale:
    w_changes_per_video_max: 0     # v7.4.0 D-0261(사용자 의견 UF-138 "차트 액스축 스케일 고정시키라고 했지", UF-39 재발) — 영상 안 w 는 첫 숏의 하나. 옛 3(오프닝·중간·엔딩 조망)은 폐기
    w_change_ratio_min: 1.5        # 이 미만의 w 변화는 '흔들림'
    scene_fixed: true              # 장면 안에서 w 변경 금지 — move 는 중심 이동(pan)만
    grammar: "시간축 무대는 축 스케일(카메라 w, 화면이 덮는 일수)을 영상 전체에서 하나로 고정한다 — 첫 숏의 w 를 끝까지 쓰고, 영상 안 w 변화는 {max}회다. 카메라는 날짜 이동(pan)만 한다. 오프닝 다년 조망·엔딩 조망도 하지 않는다(같은 w 로 옆으로 움직인다). 사건을 '확대'하고 싶으면 w 가 아니라 핀·카드·사진이 커지는 것으로 보여 준다. (참고: 변화가 허용되는 다른 영상에서도 한 번에 {ratio}배 이상만.) 지도의 '문장마다 줌 금지'(G4-16)와 같은 원리다. 검사 [timeline-rescale] hard."

chart_world:               # v7.4.0 back_and_forth D-0251 §6.1·§6.2-4(사용자 의견 UF-135 "같은 축척 혹은 같은 차트 안에서 움직이거나 보여주는게 아니니까") — 연출·수정 프롬프트 {{RULES.chart_world}}
  # {자리}는 같은 규칙 값으로 로더가 채운다(15 P3·C2 .replace). 검사 [chart-world-split]·[chart-only-run](qa_checks.chart_only_run) 과 같은 원칙
  grammar:
    - "경제·데이터 영상의 차트는 하나의 시간축 세계다. 카메라가 그 안에서 이동한다. 축척이 다른 독립 차트를 번갈아 띄우지 않는다."
    - "같은 단위의 시계열은 한 레인(한 축척)에 둔다. 차트 아일랜드가 둘 이상인 영상에서 같은 단위를 다른 레인에 그리면 검사 [chart-world-split] hard."
    - "차트·카드만 보이는 구간은 {max_sec}초 이하 — 그 안에 사건 핀(marker)·인물 뱃지·사진·기사·인용·지도 중 하나를 넣는다(검사 [chart-only-run] hard, 모든 무대)."
    - "전망(연준 점도표처럼 열이 연도인 scatter 레코드)은 패널·프리미티브로 띄우지 않고 같은 레인 위 series style projection 으로 찍는다 — 열은 그 해 연말, 같은 축척. 무대 end 를 장기 열까지 넓히고 카메라는 w 그대로 오른쪽으로 이동한다(v7.4.0 D-0260 §2)."
    - "사건 핀(date 앵커 marker)은 값 레인 위의 점이다 — lane 은 그 날짜 값을 가진 계열 레인. 사건 레인(kind pins)은 없다(쓰면 거부). 값 레인이 액자 세로를 쓰게 레인을 쌓지 않는다(검사 [plot-height] hard). 핀 라벨 자리(선 위·아래 두 단)는 코드가 고른다 — 같은 순간 핀이 몰려 자리가 없으면 핀 수명을 줄여 하나씩 띄운다(검사 [island-pin-collision] hard, v7.4.0 D-0274)."

# v7.4.0 back_and_forth D-0274 §2⑤·D-0276(사용자 의견 UF-141 "영상도 메인 요소야 … 영상에 대한 목소리도 들리도록 해") — 레퍼런스 영상 문법.
# 연출 프롬프트 {{RULES.reference_clip.director}}·원고 프롬프트 {{RULES.reference_clip.script}}. {main}·{broll} = media_beats.clip_show_sec(로더가 채운다)
reference_clip:
  director:
    - "레퍼런스 영상(clip)은 주 요소다. role main(기본)은 코드가 화면 가운데 액자(폭 84 %, 16:9, 블러 배경 위)에 둔다 — place·x·y·w 를 주지 않는다. 길이 {main}초. 그 구간에 카드·차트 아일랜드·사진을 겹치지 않는다(검사 [clip-frame] hard)."
    - "현장 보조 화면(짧은 b-roll)만 role: broll — 구석 슬롯, {broll}초, 원음은 내레이션 아래 낮게."
    - "발언 클립(인물이 말하는 장면)은 원고의 발언 자리에 붙인다 — start {hold: <앞 문장 sid>}, end {hold: <같은 sid>, edge: end}. 그 구간은 내레이션 없이 원음과 번역 자막만 나온다."
    - "전투·현장 영상(말이 없는 장면)을 액자(role main)로 크게 보이되 소리는 현장음이라 낮추려면 audio: broll 을 더한다 — 배치는 액자, 원음만 broll 이득. 내레이션은 그 위로 이어진다(발언 자리 아님)."
  script:
    - "발언 클립을 쓸 때는 그 앞 문장에 hold_after {mid, sec, subtitle, sources} 를 단다 — sec = 레지스트리 구간 길이({main}초 안), subtitle = 발언의 한국어 번역 한두 줄, sources = 인용 원문(영문)·시각·녹취록 쪽을 담은 claims id. 원문에 없는 말을 번역에 넣지 않는다."
    - "발언 자리 앞 문장은 누가 어디서 말하는지 밝히고, 발언 내용을 미리 되풀이하지 않는다."

stage_backdrop:            # v5.1.0 back_and_forth D-0121 §B·D-0123 §1(사용자 결정 D106·D108) — 사진 배경 무대(engine/stage_backdrop.py)·backdrop 이벤트(engine/layers/backdrop.py). 설계 px(480p)
  # 사진 = 미디어 레지스트리 kind photo·rights_clear 만(C9·G4-10 — AI 생성·출처 불명 금지). 배경은 장식이라 캡션 바 없음, 크레딧은 credits.yaml media 참조.
  # 연출(LLM)이 장면마다 {type: backdrop, start: {scene_start}, end: {scene_end}, img: <mid>} 로 고른다(P8). 전환은 crossfade 만(줌 범프 금지)
  kind: photo              # 레지스트리 종류(이벤트 backdrop ↔ kind photo)
  # v5.2.0 D-0129 §A(사용자 판정 D113 "블러가 너무 강해 어떤 사진인지 알 수 없다") — 18·0.55·0.3 → 6·0.38·0.15.
  # 자막·카드·아일랜드 가독은 halo·상자 알파(island.fill_alpha)가 맡는다. 스윕 시트 3변형(4·0.30 / 6·0.38 / 10·0.45)에서 사용자가 확정
  blur_px: 6               # 가우시안 블러 반경(설계 px — 장치 해상도에서는 × k)
  dim: 0.38                # 검정 덮개 알파
  desaturate: 0.15         # 채도 낮춤(0 = 원본, 1 = 흑백)
  crossfade_sec: 1.2       # 등장 페이드 인 = 앞 사진 페이드 아웃(끝 + 이 값까지 남는다)
  ken_burns: 0.04          # 이벤트 길이에 걸친 느린 확대(1 → 1 + 이 값, 연속 변환 — G7 D6, 줌 범프 아님)
  change_on: scene         # 전환 단위 = 장면(주제 전환)
  min_photos: 3            # 영상 안 서로 다른 배경 사진 수(checks backdrop_repeat [backdrop-photos])
  max_photos: 6
  bg_rgb: [0.035, 0.045, 0.068]   # 사진 전·사이 바탕(= stage_timeline.bg_rgb 값)
  # 연출·수정 프롬프트 {{RULES.backdrop_island}} — {자리}는 같은 규칙 값(stage_backdrop·island·article_card)으로 로더가 채운다(15 P3·C2 .replace)
  grammar:
    - "사진 배경 무대: 최상위 `stage: backdrop`. 주 무대 카메라 숏은 `{\"at\": 0, \"mode\": \"cut\", \"dur\": 0, \"camera\": {}}` 하나(이동 없음)."
    - "배경 사진: 장면마다 `{\"type\": \"backdrop\", \"start\": {\"scene_start\": 장면}, \"end\": {\"scene_end\": 장면}, \"img\": 사진 id}`. img 는 사용자 메시지 미디어 목록의 사진(photo) id 만. 연속 같은 사진 금지, 영상 전체 서로 다른 사진 {min_photos}~{max_photos}장. 블러·어둡게·crossfade {crossfade}초는 코드가 한다(검사 [backdrop-repeat]·[backdrop-rights] hard)."
    - "차트 아일랜드: `{\"type\": \"island\", \"kind\": \"chart\", \"box\": {boxes} 중 하나, start, end}` — 시간축 차트가 이 상자 안에 뜬다. 차트 카메라는 `\"stage\": \"timeline\"` 숏(camera {date, lane?, w}) — 시간축 축 스케일 규칙을 그대로 따른다. series·date 마커는 차트 아일랜드가 떠 있는 동안에만 쓴다. 같은 순간 차트 아일랜드는 하나 — 차트가 필요한 구간 전체에 하나를 길게 두는 것이 기본이고, 둘을 이을 때는 앞 것의 end 뒤에 다음 것의 start 를 둔다(시각이 겹치면 오류). 오른쪽 카드와 함께면 box left."
    - "아일랜드(차트·사진·영상·프리미티브·패널)는 같은 순간 {max_concurrent}개 이하, 서로 겹치지 않는다(검사 [island-overlap] hard). 뱃지는 화면 슬롯(map_*)에, 프리미티브(statement_diff·dot_plot 등)·카드는 카드 슬롯에 둔다 — backdrop 무대에서 date·lane 앵커는 series·marker 만(그 밖은 오류)."
    - "주 아일랜드 상시(v5.2.0): backdrop 무대에서는 주 아일랜드({main_kinds})가 항상 하나 보인다. 카드만 있는 구간(블러 배경 + 카드)은 {card_only_max}초 이하 — 넘으면 검사 [backdrop-main-missing] hard(타이틀·엔딩 카드·기사 구간 제외). 차트 아일랜드는 오프닝 첫 문장부터 띄운다. 보도를 인용하는 카드(출처가 매체)는 카드가 아니라 article 이벤트로 — 프레스 규약 v2(가운데·세리프 헤드라인)로 조판한다. 카드는 아일랜드 상자와 겹치지 않는 자리에(겹치면 [card-island] warning)."
    - "차트 아일랜드 안 마커 라벨은 아일랜드 안에서만 보인다 — 오른쪽 끝 마커는 라벨이 점 왼쪽에 붙는다(코드가 정한다). 그래도 상자 밖이면 검사 [island-label-clip] hard, 라벨이 같은 레인 출처 줄과 겹치면 [island-label-overlap] warning — 마커 날짜·레인이나 카메라(date·w)를 바꿔 푼다."
    - "사진·영상을 left 차트 아일랜드와 같은 순간에 띄울 때는 `\"place\": \"backdrop_right_low\"`(backdrop 무대 전용 사진 자리 — 오른쪽 카드 자리 아래·자막 위·left 상자 밖, v5.2.0 D-0132). map_right_low·panel_gap·timeline_photo 는 left 상자와 겹친다([island-overlap] hard)."
    - "기사: `{\"type\": \"article\", \"mid\": 기사 id, \"theme\": dark|light(기본 {theme_default}), \"press\": 공식 사진 id(선택)}` — 화면 전체. 프레스 사진 {press_lead}초 → 덮개 + 세리프 헤드라인(원문 언어)·부제(번역)·출처 줄. press 는 미디어 목록의 권리 기록 사진만, 없으면 쓰지 않는다(코드가 지금 화면을 흐려 깐다)."

cascade:                   # v5.3.0 D-0139 겹침 카드(cascade, engine/cascade.py) — 사용자 제안(2026-10-01) 재구성, 사용자 결정 D116·판정 D117 채택. "띠"(D-0135) 폐기.
  # v5.14.0 back_and_forth D-0153 §4·D-0157 — **V2**(사용자 결정 D148, 가이드 23 §6 "수정 Cascade V2 구현값" 그대로). 옛 값(D117: step 68·front 214×82·back_dy 5 …)은 가이드 §5 표에 기록.
  # 지도(배경) 고정. 사건 k 의 논리 slot s = k − off 에서 좌상단 x = x0 + dx·s, y = y0 + dy·s(dx·dy > 0 — 시간 순서대로 오른쪽 아래, 좌상단 pivot 고정).
  # 개별 Y slide·깊이 Y 없음. 가장 오래된 카드가 밀려 나갈 때(뒤 카드 > max_back) off 가 shift_sec 동안 1 늘어 **모든 카드가 같은 변위**로 왼쪽 위로 간다.
  # 지금 말하는 사건 = 맨 앞·front 크기·accent 윗선·부제. 지나간 사건 = focus_sec 동안 back_scale·높이 (h − back_h_drop) 로 물러난다.
  # 가림: 뒤 카드의 상자(그림자·바탕·테두리)는 앞쪽 모든 카드의 실제 둥근 사각형(+ frame.occluder_pad)으로 차례로 지운다(합집합, EVEN_ODD 단일 마스크 아님).
  # 그래서 뒤 카드는 왼쪽 dx 폭과 다음 카드 위로 드러난 윗띠가 보인다. 글자는 따로 다음 카드 왼쪽 끝까지(경계 back_fade_px 알파 그라데이션).
  # 최악 폭 (max_back+1)×dx + front.w ≤ width_cap(checks cascade). 설계 px(480p).
  status: adopted
  x0: 22
  y0: 60                   # 슬롯 0 카드 윗변(모서리 날짜 상자 y ≤ 50 아래)
  dx: 64                   # 슬롯 간격 — 뒤 카드가 왼쪽에 보이는 폭
  dy: 12                   # 슬롯 간격 — 다음 카드 위로 드러나는 윗띠 높이
  flag_R: 12               # 국기 원(카드 좌상단 모서리, 뒤 카드는 back_scale 배)
  front: {w: 230, h: 108, pad_x: 14, date_dx: 6, date_dy: 19, title_dy: 56, line_dy: 82, date_size: 10.5, title_size: 18, line_size: 11.5, accent_w: 1.8,
          date_font: monom, title_font: sansbb, line_font: sansm}   # 날짜 x = flag_R + date_dx = 18. 제목 Plex Sans KR Bold, 날짜 Plex Mono Medium
  back_scale: 0.86         # 뒤 카드 크기(앞 대비)
  back_h_drop: 20          # 뒤 카드 높이 = (front.h − back_h_drop·back) × scale — 완전히 뒤 = 88 × 0.86
  back_text_alpha: 0.5     # 뒤 카드 글자·국기 알파(바탕·테두리는 그대로)
  back_fade_px: 12         # 덮이는 경계 글자 알파 그라데이션 폭(D-0138)
  back_dim: 0.06           # 앞에 쌓인 카드 수(depth)마다 바탕을 더 어둡게(D-0138, 표면색에 곱함)
  max_back: 4
  focus_sec: 0.5           # 앞 → 뒤 물러남 · 새 앞 카드 등장. 새 앞 카드 글자 = 앵커 + focus_sec 뒤 절반(0.25~0.5초, 밀기 없는 전환 — D-0137 §3·D-0139 §3)
  shift_sec: 0.6           # 가장 오래된 뒤 카드 밀려 나감. 밀기 있는 전환의 새 앞 카드 글자 = 앵커 + max(focus_sec, shift_sec) 뒤 절반(0.3~0.6초)
  width_cap: 560           # 최악 5 × 64 + 230 = 550, 정상 4 × 64 + 230 = 486
  frame: {radius: 3, edge_w: 0.65, occluder_pad: 0.325}   # 상자 모서리·테두리 폭, 가림 여유 = 테두리 폭 절반. 그림자·바탕 알파는 island 값 재사용
  surface:                 # cascade 전용 표면·글자색(RGB 0~1, 가이드 §6 hex). actor accent(날짜·윗선)는 colors 키 그대로
    bg: [0.0667, 0.0824, 0.0784]        # #111514 — 시안 바탕(엔진은 지도 위라 쓰지 않음, tools/cascade_demo.py 시트 바탕)
    front: [0.1059, 0.1294, 0.1137]     # #1B211D 앞 카드 표면
    back: [0.0902, 0.1098, 0.0980]      # #171C19 뒤 카드 표면(물러남 back 으로 보간)
    text: [0.9294, 0.9412, 0.9137]      # #EDF0E9 제목
    text_sub: [0.6353, 0.6667, 0.6471]  # #A2AAA5 부제
    edge: [0.3020, 0.3451, 0.3176]      # #4D5851 테두리
