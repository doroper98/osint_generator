<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- osint 표준 글꼴 렌더 설정(v7.4.0 RENDER-AP-032, back_and_forth D-0624). 경로는 config.yaml engine.fontconfig.file 한 곳.
     시스템 설정을 그대로 읽은 뒤, 엔진 글자 화소를 정하는 렌더 속성 일곱 개를 표준 값으로 덮어쓴다.
     표준 = 골든 25컷을 고정한 설정(R-0310 §3: 시스템 conf.d 에서 12-unhinted-grayscale 를 뺀 것)과 fc-match 결과가 같은 값.
     이 파일에 컨테이너 고유 경로를 넣지 않는다. 값을 바꾸면 골든이 바뀐다 — 사람 승인 없이 바꾸지 않는다. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
