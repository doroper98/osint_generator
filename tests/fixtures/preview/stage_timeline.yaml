# 무대 레지스트리 프리뷰 예제 (v4.3.0, back_and_forth D-0084 작업 3·D-0085) — rules registries.stages 의 무대마다 하나.
# 시간축: 카메라 앵커 {date, lane?, w(일)}, 핀 = marker {date, lane}(레인 id). 무대 설정은 stage_config.timeline(레인 기본값 = 장르 프로필).
# Direction 모델을 그대로 통과해야 한다(P4).
schema_version: 1
key: timeline
anchor_keys: [date, lane]
direction:
  version: 1
  genre: macro_monetary
  stage: timeline
  stage_config:
    timeline:
      start: "2019-01-01"
      end: "2026-10-01"
      compress:
        - {from: "2019-01-01", to: "2021-01-01", factor: 0.4}
  shots:
    - {at: 0, mode: cut, dur: 0, camera: {date: "2022-06-01", w: 2400}}
    - {at: 8.0, mode: move, dur: 3.0, camera: {date: "2022-03-16", lane: events, w: 60}}
  events:
    - {type: marker, start: 0.2, end: 12.0, date: "2022-03-16", lane: events, label: 첫 인상}
