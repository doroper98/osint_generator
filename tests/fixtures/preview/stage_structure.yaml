# 무대 레지스트리 프리뷰 예제 (v7.4.0, back_and_forth D-1003 §3) — rules registries.stages 의 무대마다 하나.
# 구성 무대: 아일랜드 전용 무대(장르 fiscal stage.island_stages) — 주 무대 backdrop 위 island kind structure 뷰포트, 카메라 = stage: structure 숏.
# 카메라 앵커 {row?(행 id), value?(값), w(월드 폭 = 상자 px — 상자 폭이면 전체 보기)}. 층 = rank 이벤트(bars → prior → delta → focus, 문장마다 하나).
# 무대 설정 stage_config.structure = box(rules island.boxes) · record(막대 레코드) · prior(속빈 눈금 레코드) · title(머리 짧은 이름).
# Direction 모델을 그대로 통과해야 한다(P4).
