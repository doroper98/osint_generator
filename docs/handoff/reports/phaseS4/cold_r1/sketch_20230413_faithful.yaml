  file: eez.json
  nations:
    KR: {color: gold, label: "한국 EEZ", label_at: [124.4, 35.4], t: 0.9}
    JP: {color: teal, label: "일본 EEZ", label_at: [146.5, 33.5], t: 1.7}
    KP: {color: ru, label: "북한 EEZ", label_at: [130.6, 40.4], t: 2.5}
    CN: {color: muted, label: "중국 EEZ", label_at: [122.6, 29.0], t: 3.1}
    RU: {color: muted, label: "러시아 EEZ", label_at: [137.2, 44.4], t: 3.5}
  labels_end: 8.6
  regions:
    - {code: KR_JP, kind: overlap, claimants: [KR, JP], t: 4.7, end: 9.0, at: [133.6, 38.6], anchor: l,
