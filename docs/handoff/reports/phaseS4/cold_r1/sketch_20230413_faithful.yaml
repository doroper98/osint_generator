# 미사일 발사 사건 화면 스케치 spec — 2023.04.13 화성-18형(첫 고체연료 ICBM). d1(2022.11.18) spec 에서 사실 값만 바꿈
# 사실·연출 값만 둔다. 화면 수치는 rules/video_rules.yaml sketch:. 실행: python -m sketch.missile projects/missile_20230413_sketch
# 화면 숫자는 {기관.값}·{track.distance_km}·{sensor.range_km}·{profile.ref_km} 자리표시를 포맷터가 채운다(SK-H1).
schema_version: 1
kind: missile
title: "2023.04.13 화성-18형 발사"
date: "2023. 4. 13"
duration_sec: 56.0
sheet_times: [5.0, 8.4, 14.0, 20.5, 27.0, 34.0, 41.0, 48.0, 54.0]

sources:
  - text: "발사·비행: 합동참모본부 2023.04.13 발표(뉴데일리·뉴시스 2023.04.13 보도) · 일본 방위성 2023.04.13 발표·2023.04.21 발표(防衛省 お知らせ)"
  - text: "착탄: 일본 방위성 2023.04.21 발표 '일본 EEZ 밖 낙하 추정' · 착탄 위치·기준점 미발표 — 화면 영역은 개념(개략)"
  - text: "EEZ: Marine Regions(VLIZ) EEZ 경계 · CC BY 4.0 · 한일·한중 미획정 구간은 등거리선 참고"
  - text: "서해 남북: NLL 개략 재구성(공식 좌표 아님) · 북한 해상군사분계선 1999.9.2 발표 좌표(한국일보 1999.9.3)"
  - text: "사드 AN/TPY-2 종말 모드 약 600km · 그린파인 블록-C 최대 약 800km(공개 사양·보도)"   # 사용자 확정 대기(레이더 사양 값)

shots:   # 숏 4개, 이동은 장면 전환에서만
  - {t0: 0.0, t1: 0.0, lon: 132.6, lat: 36.6, w: 37.0}     # 광역 — EEZ
  - {t0: 8.4, t1: 11.0, lon: 126.9, lat: 38.15, w: 9.5}    # 한반도 — 발사 지점·서해 남북 경계·미사일
  - {t0: 16.8, t1: 19.2, lon: 132.0, lat: 38.6, w: 25.0}   # 탐지 자산
  - {t0: 27.8, t1: 30.2, lon: 131.3, lat: 40.7, w: 19.5}   # 궤적·착탄(발사 지점·개념 착탄 영역의 중간)

launch: {label: "평양 인근", sub: "발사 · 오전 7시 23분(합참) · 7시 22분경(일본 방위성)", lon: 125.75, lat: 39.02, t: 10.8, color: ru}   # 합참 "평양 인근" · 일본 방위성 "平壌付近" — 좌표는 평양 대표점

announced:   # 두 기관 나란히 같은 무게 — 이번 사건은 두 기관 모두 비행거리만 발표(정점 고도·속도·비행 시간 미발표)
  jcs:
    who: "합동참모본부"
    color: gold
    values:
      range_km: {v: 1000, unit: km, approx: true}     # 합참 "약 1000km 비행 후 동해상 탄착"(뉴데일리 2023.04.13)
    rows: ["거리 {jcs.range_km}"]
  mod:
    who: "일본 방위성"
    color: teal
    values:
      range_km: {v: 1000, unit: km, approx: true}     # 防衛省 2023.04.21 "約1,000km程度飛翔"
    rows: ["거리 {mod.range_km}"]

track:
  # 착탄 위치·기준점은 두 기관 모두 미발표. 일본 방위성: "東方向に発射 · 左(北)へ方向を変えながら約1,000km程度飛翔 · 日本海の我が国EEZ外に落下と推定"
  ref: {name: "발사 지점", lon: 125.75, lat: 39.02}   # 사용자 확정 대기 — 발표 기준점이 없어 발사 지점을 기준점으로 씀
  bearing_deg: 65             # 사용자 확정 대기 — 방위 미발표. "동쪽 발사 후 북쪽으로 선회" + "일본 EEZ 밖" 에 맞춘 개념 방위
  distance_km: 1000           # 두 기관 발표 비행거리 "약 1,000km" — 기준점 방위 거리가 아니라 비행거리(지상 직선거리는 이보다 짧을 수 있음)
  approx: true
  uncertainty_km: 120         # 사용자 확정 대기 — 위치 미발표를 넓은 영역으로(스케치 값)
  # flight_sec: 미발표(합참·일본 방위성 모두) — 스키마 필수 필드라 비워 두면 SK-SPEC hard. 사용자 확정 대기
  t0: 30.4
  t1: 38.0
  hud:
    label: "비행 경과"
    range_line: "비행거리 합참 {jcs.range_km} · 일본 방위성 {mod.range_km}"
    note: "궤적선은 발사점·착탄점을 잇는 지상 투영(대원) · 실제 비행은 고각"
    hold_sec: 3.5
  impact:
    label: "착탄 개념 영역"
    sub: "착탄 위치 미발표 · 비행거리 {track.distance_km} 기준 개념(개략)"
    tag: "일본 EEZ 밖 낙하 추정(일본 방위성)"
    tag_color: teal

sensors:   # 레이더 거리·방위 폭 = 공개 사양·보도 — 사용자 확정 대기
  - {name: "사드 AN/TPY-2 · 성주", sub: "종말 모드 탐지 {sensor.range_km}", kind: radar, lon: 128.28, lat: 35.99, location_public: true,
     range_km: 600, range_approx: true, az_width_deg: 120, color: us, t: 19.0, side: r, label_at: [129.4, 35.25],
     el_deg: [0, 60], short: "성주", globe_name: "AN/TPY-2 · 성주", globe_label: [-10, 30, r]}   # 3D 방위·고각 = 개념값(공개 정밀 사양 없음)
  - {name: "그린파인 레이더", sub: "블록-C 최대 {sensor.range_km}", kind: radar, lon: 127.5, lat: 36.7, location_public: false,
     range_km: 800, range_approx: true, az_width_deg: 120, color: gold, t: 21.0, tag: "위치 비공개 · 범위는 개념도", side: l, label_at: [125.2, 36.0]}
  - {name: "AN/TPY-2 · 샤리키", sub: "전진배치 모드", kind: radar, lon: 140.32, lat: 40.89, location_public: true,
     range_km: 1000, az_width_deg: 120, color: teal, t: 23.0, tag: "거리 공개 추정치", side: l, label_at: [141.0, 41.9],
     el_deg: [0, 60], short: "샤리키", globe_label: [12, -18, l]}
  - {name: "AN/TPY-2 · 교가미사키", sub: "전진배치 모드", kind: radar, lon: 135.22, lat: 35.76, location_public: true,
     range_km: 1000, az_width_deg: 120, color: teal, t: 24.4, side: l, label_at: [135.6, 35.0],
     el_deg: [0, 60], short: "교가미사키", globe_label: [12, 30, l]}
  - {name: "이지스 구축함", sub: "SPY-1D · 동해 작전", kind: ship, lon: 130.3, lat: 36.5, location_public: false,
     color: gold, t: 25.8, tag: "함정 위치는 예시 · 탐지 거리 비공개"}

