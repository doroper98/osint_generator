# longform-briefing-pipeline 운영 설정
# 이 파일은 SSOT가 아닙니다. 변경 가능한 운영 파라미터만 둡니다.
# 도메인 데이터 SSOT는 projects/{project_id}/ 아래의 JSON 파일들입니다.

schema_version: 1

command_center:
  worker_slot_count: 4
  heartbeat_timeout_sec: 60
  log_panel_max_lines: 500
  log_router_read_chunk: 1024
  tui_refresh_interval_sec: 0.5

logging:
  level: INFO
  file: logs/orchestrator.log
  rotate_daily: true
  retention_days: 30

paths:
  projects_root: projects
  python_bin: python   # Windows의 경우 python, Linux는 python3 권장

engine:
  # v2.0.0 — 새 엔진 해상도·렌더 설정의 단일 출처 (docs/handoff/19 §5.4). 옛 render.profiles(briefing/
  # shorts)는 폐기. 소비자: engine/render.py (Phase 1~2), 1080p 는 Phase 10.
  # v3.6.0 출력 프로파일(D-0066 작업 1). 설계 좌표는 rules layout_480p.base(854×480) 고정 — 프로파일은 장치 크기·인코딩만 바꾼다.
  # 렌더 진입에서 k = height/480 로 한 번 확대(D-0067 A). fps 는 설계 fps 와 같아야 한다(타이밍이 프레임 단위).
  output:
    default: 480p                      # 내부 기본(검사·테스트·트라이얼 프리뷰). 배포 기준 해상도는 final(아래) — v5.5.1
    profiles:
      # mem_per_job_mb = 청크 렌더 프로세스 1개의 피크 메모리 상한(실측 480p 140MB · 1080p 432MB + ffmpeg·여유, v3.6.0 D-0066 작업 6)
      480p: {width: 854, height: 480, fps: 24, crf: 19, preset: faster, mem_per_job_mb: 600}
      # clip = 영상 클립 npy 크기(16:9 정확, 필요 장치 폭 990px 이상 중 최소 — back_and_forth D-0074). 원본 webm 에서 media_fetch --res 1080p
      1080p: {width: 1920, height: 1080, fps: 24, crf: 19, preset: faster, mem_per_job_mb: 1500, clip: [1024, 576]}
      # 720p(v5.2.0, 사용자 결정 2026-09-30 hormuz-talks-2026 완성본) — k = 1.5, 854 × 1.5 = 1281 > 1280 이라 −0.25px 패드(1080p 와 같은 방식).
      # clip null = 영상 클립은 기본 npy(이 프로파일로 media_fetch --res 하지 않음). mem 은 480p·1080p 실측 사이 보간 + 여유
      720p: {width: 1280, height: 720, fps: 24, crf: 19, preset: faster, mem_per_job_mb: 1000, clip: null}
  trial: 480p                          # 별칭 — 트라이얼(프리뷰·검수) 프로파일
  final: 720p                          # 별칭 — 최종(배포) 프로파일. v5.5.1 사용자 결정 2026-10-04 "기준 해상도는 720p야" — 파이프라인 render·assets_final 단계가 --res final. 1080p 는 --res 1080p 로만
  render:
    jobs: null                         # 청크 병렬 수. null = os.cpu_count(). 사용 가능 메모리 ÷ 프로파일 mem_per_job_mb 로 줄인다

tts:
  # v2.0.0 — TTS 설정 단일 출처. 모듈 상수로 override 금지 (docs/handoff/15 P3).
  # voice id·API 키는 .env 로만 (C9). 옛 profiles(briefing/shorts)·미사용 키 3종은 폐기.
  backend_default: supertonic          # v5.11.0 사용자 결정 D146(2026-10-10) — 콘티 판·본편 모두 Supertonic 3 M3 ×0.95(D127 edge 대체). edge 는 V4 에서 삭제, 그 전까지 --tts edge(정렬기 측정용)
  elevenlabs_allowed: false            # v5.6.0 사용자 결정(2026-10-05 "elevenlabs 음성을 쓰지 말도록 해", PIPELINE-AP-020) — script.plan 이 거부
  edge_voice: ko-KR-InJoonNeural       # v3 기준 음성 (Phase 1·4)
  edge_rate: "-3%"
  edge_pitch: "-2Hz"
  eleven_model_env: ELEVENLABS_MODEL_ID
  eleven_model_default: eleven_multilingual_v2
  voice_settings: {stability: 0.65, similarity_boost: 0.8, style: 0.1}   # Phase 4 with-timestamps 경로가 전송
  supertonic:                          # v5.11.0 사용자 결정 D146(2026-10-10) — Supertonic 3 남성 M3 × 속도 0.95, 설계 D147(back_and_forth D-0152)
    repo: Supertone/supertonic-3       # 코드 MIT, 가중치 OpenRAIL-M(상업 사용 가능, Attachment A 사용 제한). 제작사 개발 종료·보관 → 우리가 파일을 보관
    revision: 3cadd1ee6394adea1bd021217a0e650ede09a323
    asset_dir: assets/tts/supertonic   # git 미추적 — python tools/fetch_data.py supertonic
    voice_style: M3
    speed: 0.95
    total_step: 16
    silence_sec: 0.3                   # 긴 문장 조각 사이 무음(자막 앵커에 영향 — provenance·plan 에 기록)
    max_chunk_len: 120                 # 원 helper.py 한국어 기본값
    seed_salt: "v1"
    assets:                            # 상대 경로 → sha1 (D-0152 §1 Fable 실측과 일치)
      onnx/duration_predictor.onnx: 7506c6781997d06c7e0f203e8c16555fe39ad115
      onnx/text_encoder.onnx: bef43a4d0bd4889e08aaa2c2e107ecc5aebd6e00
      onnx/vector_estimator.onnx: 6460a27d6787bead8f0cc6973c28be6281930076
      onnx/vocoder.onnx: 5e94809905565e9bfbc54a130137c37e03bc2048
      onnx/tts.json: 310fe80fdba5a36d03a4c0c85561be5c3e1c2da7
      onnx/unicode_indexer.json: c8133b892e49c85f47880f1ac0226f91579ea5ac
      voice_styles/M3.json: 7764333982bc4d4d27b3872ead13dfe4b0400d81
      LICENSE: e6ab935ad6e8025ce4bf68e7382bd5332f4329ea

llm:
  # v1.2.2 — 구독 LLM 브리지(`claude -p`)가 쓰는 모델의 단일 출처 (SSOT).
  # 이전에는 --model 을 주지 않아 사용자 머신 claude CLI 의 기본 모델이 쓰였다(저장소에 미고정).
  # 값은 CLI 가 받는 전체 이름 또는 별칭. 모듈 상수로 override 금지 (docs/handoff/15 P3).
  model: claude-opus-5-5
  invoke_timeout_sec: 600      # BaseLLMWorker 기본 CLI 타임아웃
  script_timeout_sec: 1200     # ScriptWorker — 긴 원고 1-shot 생성 (실측 526초 성공 / 600초 타임아웃)

commons:
  # v2.5.5 — 위키미디어 공용 요청(tools/commons_fetch·media_fetch·fetch_data 공유, back_and_forth D-0031 NB4).
  # 14 §10.4 운영 교훈. 상한을 다 쓰면 남은 항목과 재실행 명령을 오류로 낸다(조용히 넘기지 않는다, 15 P6).
  gap_sec: 15
  backoff_base_sec: 60
  backoff_max_sec: 600
  tries: 6
  standard_widths: [500, 960, 1280, 1600]

review_gates:
  # v3.0.0 — 사용자 승인 게이트 2개(docs/handoff/16 §5). 승인 없이 게이트 다음 상태로 가지 않는다.
  # 값은 true 만 허용(끌 수 없다). 옛 9개 게이트 키는 상태 머신 교체로 삭제(D-0040 작업 6).
  require_human_approval:
    script_approval: true
    preview_approval: true
